function _timeAgo(dateStr){
  if(!dateStr)return'Nunca'
  const diff=Date.now()-new Date(dateStr).getTime()
  const mins=Math.floor(diff/60000)
  if(mins<1)return'hace un momento'
  if(mins<60)return`hace ${mins} min`
  const hrs=Math.floor(mins/60)
  if(hrs<24)return`hace ${hrs}h`
  return`hace ${Math.floor(hrs/24)}d`
}

window.runMetaSyncAccount=async(accountId,accountName,days)=>{
  const statusEl=document.getElementById('meta-sync-status-'+accountId)
  const _showPct=(pct,msg)=>{if(statusEl)statusEl.innerHTML=pct>=100?'✅':`<span style="font-size:11px">${pct}%</span>`}
  if(statusEl)statusEl.innerHTML='<span style="font-size:11px">0%</span>'
  try{
    let token=await getConfig('meta_access_token')
    if(!token){if(statusEl)statusEl.textContent='⚠️';alert('Token no configurado');return}
    await _syncOneAccount(accountId,token,days,_showPct)
    await sb.from('meta_cuentas').update({synced_at:new Date().toISOString()}).eq('account_id',accountId)
    if(statusEl)statusEl.textContent='✅'
    logAction('meta_sync_account',{account_id:accountId,days}).catch(()=>{})
    const accEl=document.getElementById('meta-acc-'+accountId)
    if(accEl&&accEl.style.display!=='none')toggleMetaCuenta(accountId,true)
  }catch(e){
    if(statusEl)statusEl.textContent='⚠️'
    alert(`Error sync ${accountName}: ${e.message}`)
  }
}

async function _syncOneAccount(accountId,token,days,onProgress){
  const _p=onProgress||(()=>{})
  const actId='act_'+accountId
  const until=new Date().toISOString().slice(0,10)
  const sd=new Date()
  if(days==='all')sd.setFullYear(sd.getFullYear()-3);else sd.setDate(sd.getDate()-days)
  const since=sd.toISOString().slice(0,10)

  _p(10,'Campañas...')
  const camps=await metaGet(`/${actId}/campaigns`,token,{fields:'id,name,status,effective_status,objective,daily_budget,lifetime_budget',limit:'500'})
  for(const c of camps){
    await sb.from('meta_campanas').upsert({meta_id:c.id,account_id:accountId,nivel:'campaign',nombre:c.name||'',estado:c.effective_status||c.status||'',objetivo:c.objective||'',daily_budget:c.daily_budget?c.daily_budget/100:null,lifetime_budget:c.lifetime_budget?c.lifetime_budget/100:null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel'})
  }
  _p(25,'Ad sets...')
  const adsets=await metaGet(`/${actId}/adsets`,token,{fields:'id,name,status,effective_status,campaign_id,daily_budget',limit:'500'})
  for(const s of adsets){
    await sb.from('meta_campanas').upsert({meta_id:s.id,account_id:accountId,nivel:'adset',parent_id:s.campaign_id||'',nombre:s.name||'',estado:s.effective_status||s.status||'',daily_budget:s.daily_budget?s.daily_budget/100:null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel'})
  }
  _p(40,'Anuncios...')
  const ads=await metaGet(`/${actId}/ads`,token,{fields:'id,name,status,effective_status,adset_id',limit:'500'})
  for(const ad of ads){
    await sb.from('meta_campanas').upsert({meta_id:ad.id,account_id:accountId,nivel:'ad',parent_id:ad.adset_id||'',nombre:ad.name||'',estado:ad.effective_status||ad.status||'',synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel'})
  }
  const chunks=metaDateChunks(since,until,90)
  const totalChunks=chunks.length
  for(let ci=0;ci<totalChunks;ci++){
    const ch=chunks[ci]
    const pct=50+Math.round((ci/totalChunks)*50)
    _p(pct,`Métricas ${ci+1}/${totalChunks}...`)
    const cIns=await metaGet(`/${actId}/insights`,token,{fields:'campaign_id,spend,impressions,clicks,ctr,cpm,cpc,reach,frequency,actions,cost_per_action_type',time_range:JSON.stringify(ch),level:'campaign',time_increment:'1',limit:'500'})
    for(const i of cIns){
      await sb.from('meta_insights').upsert({meta_id:i.campaign_id,nivel:'campaign',account_id:accountId,fecha:i.date_start,spend:parseFloat(i.spend)||0,impressions:parseInt(i.impressions)||0,clicks:parseInt(i.clicks)||0,reach:parseInt(i.reach)||0,ctr:parseFloat(i.ctr)||0,cpm:parseFloat(i.cpm)||0,cpc:parseFloat(i.cpc)||0,frequency:parseFloat(i.frequency)||0,conversions:metaConv(i.actions),cost_per_result:metaCPR(i.cost_per_action_type),actions_json:i.actions?JSON.stringify(i.actions):null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel,fecha'})
    }
    const aIns=await metaGet(`/${actId}/insights`,token,{fields:'ad_id,spend,impressions,clicks,ctr,cpm,cpc,reach,frequency,actions,cost_per_action_type',time_range:JSON.stringify(ch),level:'ad',time_increment:'1',limit:'500'})
    for(const i of aIns){
      await sb.from('meta_insights').upsert({meta_id:i.ad_id,nivel:'ad',account_id:accountId,fecha:i.date_start,spend:parseFloat(i.spend)||0,impressions:parseInt(i.impressions)||0,clicks:parseInt(i.clicks)||0,reach:parseInt(i.reach)||0,ctr:parseFloat(i.ctr)||0,cpm:parseFloat(i.cpm)||0,cpc:parseFloat(i.cpc)||0,frequency:parseFloat(i.frequency)||0,conversions:metaConv(i.actions),cost_per_result:metaCPR(i.cost_per_action_type),actions_json:i.actions?JSON.stringify(i.actions):null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel,fecha'})
    }
  }
  _p(100,'✅')
}

async function renderMetaPortafolio(el,isAdmin){
  if(!el)return
  const{data:cuentas}=await sb.from('meta_cuentas').select('*').order('nombre')
  const{data:campanas}=await sb.from('meta_campanas').select('*').eq('nivel','campaign').order('nombre')
  const lastSync=await getConfig('meta_sync_last')
  const lastStr=lastSync?new Date(lastSync).toLocaleString('es-CO'):'Nunca'

  if(!cuentas?.length){
    el.innerHTML=`<div class="alert alert-blue">Sin datos de Meta. ${isAdmin?'Configura el token y sincroniza arriba.':'Pide al admin que sincronice.'}</div>`
    return
  }

  // Count campaigns per account
  const campsByAcc={}
  for(const c of (campanas||[])){
    if(!campsByAcc[c.account_id])campsByAcc[c.account_id]={total:0,activas:0}
    campsByAcc[c.account_id].total++
    if(c.estado==='ACTIVE')campsByAcc[c.account_id].activas++
  }

  // Count insights per account (con count real, sin límite)
  const insCountByAcc={}
  for(const c of cuentas){
    const{count}=await sb.from('meta_insights').select('id',{count:'exact',head:true}).eq('nivel','campaign').eq('account_id',c.account_id)
    insCountByAcc[c.account_id]=count||0
  }

  // Gasto en RANGO seleccionado por cuenta + tiene campañas ACTIVE (para filtro "Activas")
  const _defHasta=new Date().toISOString().slice(0,10)
  const _defDesde=new Date(Date.now()-30*86400000).toISOString().slice(0,10)
  const{data:insRango}=await sb.from('meta_insights').select('account_id,spend').eq('nivel','campaign').gte('fecha',_defDesde).lte('fecha',_defHasta).limit(20000)
  const gastoRangoByAcc={}
  for(const i of (insRango||[])){gastoRangoByAcc[i.account_id]=(gastoRangoByAcc[i.account_id]||0)+(i.spend||0)}
  // Cuenta es ACTIVA si: tiene campañas ACTIVE registradas Y tiene gasto > 0 en el rango
  const tieneGastoRango={}
  for(const c of cuentas){
    const tieneCampActiva=(campsByAcc[c.account_id]?.activas||0)>0
    const tieneGasto=(gastoRangoByAcc[c.account_id]||0)>0
    tieneGastoRango[c.account_id]=tieneCampActiva&&tieneGasto
  }

  // Break-even
  const prod=productos[0]||{}
  const p2=prod.precio_2u||129900,c2=prod.costo_2u||36000
  const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
  const dp=prod.dev_pct||0.19
  const margenBE=p2*(1-dp)-c2-fo-(fd*dp)
  const roasBE=margenBE>0?p2/margenBE:999

  // Default dates: last 30 days
  const defHasta=new Date().toISOString().slice(0,10)
  const defDesde=new Date(Date.now()-30*86400000).toISOString().slice(0,10)

  // Store portfolio context for expand/filter
  window._metaPort={campanas,p2,c2,fo,fd,dp,margenBE,roasBE,isAdmin}

  let html=`<div style="font-size:12px;color:var(--muted);margin-bottom:14px">Última sync: ${lastStr} · Break-even ROAS: <strong>${roasBE.toFixed(2)}x</strong></div>
    <div style="margin-bottom:14px"><button class="btn-sm btn-primary" onclick="analizarConIA('portafolio','all','Portafolio completo')">🤖 Analizar portafolio con IA</button></div>`

  // Controls: search + account-level filters + date range
  html+=`<div style="margin-bottom:16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input type="text" id="meta-search" placeholder="🔍 Buscar cuenta..." style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;flex:1;min-width:180px;outline:none" oninput="filterMetaCuentas()">
      <button class="btn-sm btn-primary" id="mf-all" onclick="setMetaFilter('all')">Todas</button>
      <button class="btn-sm btn-outline" id="mf-ACTIVE" onclick="setMetaFilter('ACTIVE')">Activas</button>
      <button class="btn-sm btn-outline" id="mf-INACTIVE" onclick="setMetaFilter('INACTIVE')">Inactivas</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
      <div class="fld" style="margin:0"><label style="font-size:10px">Desde</label><input type="date" id="meta-desde" value="${defDesde}" style="font-size:12px;padding:6px 8px" onchange="applyMetaDateRange()"></div>
      <div class="fld" style="margin:0"><label style="font-size:10px">Hasta</label><input type="date" id="meta-hasta" value="${defHasta}" style="font-size:12px;padding:6px 8px" onchange="applyMetaDateRange()"></div>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${_quickDateBtns('meta-desde','meta-hasta','applyMetaDateRange()')}</div>
  </div>`

  // Admin: add sync all buttons
  if(isAdmin){
    html+=`<div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-sm btn-primary" onclick="runMetaSyncAllAccounts(7,this)">🔄 Sync 7d todas</button>
      <button class="btn-sm btn-green" onclick="runMetaSyncAllAccounts('all',this)">📥 Sync completo todas</button>
    </div>`
  }

  // Render accounts as accordions
  for(const cuenta of cuentas){
    const cc=campsByAcc[cuenta.account_id]||{total:0,activas:0}
    const nIns=insCountByAcc[cuenta.account_id]||0
    const hasData=nIns>0
    const statusIcon=hasData?'✅':'⚠️'

    html+=`<div class="meta-cuenta-wrap" data-estado="${cuenta.estado}" data-tienegastohoy="${tieneGastoRango[cuenta.account_id]?1:0}" data-nombre="${(cuenta.nombre||cuenta.account_id).toLowerCase()}" data-accid="${cuenta.account_id}" style="margin-bottom:8px">
      <div class="card" style="padding:12px;cursor:pointer;user-select:none" onclick="toggleMetaCuenta('${cuenta.account_id}')">
        <div style="display:flex;align-items:center;gap:10px">
          <span id="meta-sync-status-${cuenta.account_id}" style="font-size:18px;flex-shrink:0">${statusIcon}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-weight:600;font-size:14px">${cuenta.nombre||cuenta.account_id}</span>
              <span class="pill pill-${cuenta.estado==='ACTIVE'?'green':'red'}" style="font-size:10px">${cuenta.estado}</span>
            </div>
            <div style="font-size:11px;color:var(--muted)">${cc.total} campañas · ${cc.activas} activas · ${nIns} métricas</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            ${isAdmin?`<label onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);cursor:pointer" title="Si está marcado, esta cuenta NO suma en el Tracker global">
              <input type="checkbox" ${cuenta.excluir_global?'checked':''} onchange="event.stopPropagation();toggleExcluirGlobal('${cuenta.account_id}',this.checked)"> Excluir global
            </label>`:''}
            <button class="btn-sm btn-outline" onclick="event.stopPropagation();analizarConIA('cuenta','${cuenta.account_id}','${(cuenta.nombre||cuenta.account_id).replace(/'/g,"\\'")}')" title="Analizar con IA" style="padding:6px 10px;font-size:11px">🤖</button>
            <button class="btn-sm btn-outline" onclick="event.stopPropagation();runMetaSyncAccount('${cuenta.account_id}','${(cuenta.nombre||'').replace(/'/g,"\\'")}',7)" title="Sync 7 días" style="padding:6px 10px;font-size:11px">🔄 7d</button>
            ${isAdmin?`<button class="btn-sm btn-outline" onclick="event.stopPropagation();runMetaSyncAccount('${cuenta.account_id}','${(cuenta.nombre||'').replace(/'/g,"\\'")}','all')" title="Sync completo" style="padding:6px 10px;font-size:11px">📥</button>`:''}
            <span style="font-size:16px;color:var(--muted)" id="meta-chevron-${cuenta.account_id}">▸</span>
          </div>
        </div>
      </div>
      <div id="meta-acc-${cuenta.account_id}" style="display:none;padding:4px 0 4px 12px"></div>
    </div>`
  }

  el.innerHTML=html
  window._metaFilterState='all'
}

window.toggleMetaCuenta=async(accountId,forceReload)=>{
  const accEl=document.getElementById('meta-acc-'+accountId)
  const chevron=document.getElementById('meta-chevron-'+accountId)
  if(!accEl)return
  const isOpen=accEl.style.display!=='none'
  if(isOpen&&!forceReload){
    accEl.style.display='none'
    if(chevron)chevron.textContent='▸'
    return
  }
  accEl.style.display='block'
  if(chevron)chevron.textContent='▾'
  accEl.innerHTML='<div class="loading">Cargando campañas desde Meta...</div>'

  const ctx=window._metaPort
  if(!ctx)return

  const desde=document.getElementById('meta-desde')?.value||new Date(Date.now()-30*86400000).toISOString().slice(0,10)
  const hasta=document.getElementById('meta-hasta')?.value||new Date().toISOString().slice(0,10)
  const hoy=new Date().toISOString().slice(0,10)
  const actId='act_'+accountId
  let camps=[],agg={},source='meta'

  try{
    let token=document.getElementById('cfg-token')?.value?.trim()||''
    if(!token)token=await getConfig('meta_access_token')
    if(!token)throw new Error('Sin token')

    const rawCamps=await metaGet(`/${actId}/campaigns`,token,{fields:'id,name,status,effective_status,objective,daily_budget,lifetime_budget',limit:'500'})
    camps=rawCamps.map(c=>({meta_id:c.id,nombre:c.name||'',estado:c.effective_status||c.status||'',objetivo:c.objective||'',daily_budget:c.daily_budget?c.daily_budget/100:null}))

    const timeRange=JSON.stringify({since:desde,until:hasta})
    const rawIns=await metaGet(`/${actId}/insights`,token,{fields:'campaign_id,spend,impressions,clicks,ctr,cpm,cpc,reach,frequency,actions,cost_per_action_type',time_range:timeRange,level:'campaign',time_increment:'1',limit:'500'})
    for(const i of rawIns){
      const cid=i.campaign_id
      if(!agg[cid])agg[cid]={spend:0,imp:0,clicks:0,reach:0,conv:0,ctrs:[],cpms:[],freqs:[]}
      const a=agg[cid]
      a.spend+=(parseFloat(i.spend)||0);a.imp+=(parseInt(i.impressions)||0);a.clicks+=(parseInt(i.clicks)||0);a.conv+=metaConv(i.actions)
      if(i.ctr)a.ctrs.push(parseFloat(i.ctr));if(i.cpm)a.cpms.push(parseFloat(i.cpm));if(i.frequency)a.freqs.push(parseFloat(i.frequency))
    }
  }catch(e){
    console.warn('Meta API error, fallback Supabase:',e.message)
    source='supabase'
    const{data:freshCamps}=await sb.from('meta_campanas').select('*').eq('account_id',accountId).eq('nivel','campaign').order('nombre')
    camps=(freshCamps||[]).map(c=>({meta_id:c.meta_id,nombre:c.nombre||'',estado:c.estado||'',objetivo:c.objetivo||'',daily_budget:c.daily_budget}))

    const{data:ins}=await sb.from('meta_insights').select('meta_id,spend,impressions,clicks,reach,conversions,ctr,cpm,frequency').eq('nivel','campaign').eq('account_id',accountId).gte('fecha',desde).lte('fecha',hasta)
    for(const i of (ins||[])){
      if(!agg[i.meta_id])agg[i.meta_id]={spend:0,imp:0,clicks:0,reach:0,conv:0,ctrs:[],cpms:[],freqs:[]}
      const a=agg[i.meta_id]
      a.spend+=i.spend||0;a.imp+=i.impressions||0;a.clicks+=i.clicks||0;a.conv+=i.conversions||0
      if(i.ctr)a.ctrs.push(parseFloat(i.ctr));if(i.cpm)a.cpms.push(parseFloat(i.cpm));if(i.frequency)a.freqs.push(parseFloat(i.frequency))
    }
  }

  if(!camps.length){accEl.innerHTML='<div class="alert alert-blue">Sin campañas</div>';return}

  // ── Ventas reales: ad hierarchy + mapeos ──
  const{data:allAdsets}=await sb.from('meta_campanas').select('meta_id,parent_id').eq('account_id',accountId).eq('nivel','adset')
  const{data:allAds}=await sb.from('meta_campanas').select('meta_id,parent_id').eq('account_id',accountId).eq('nivel','ad')
  const adsetToCamp={}
  for(const as of (allAdsets||[]))adsetToCamp[as.meta_id]=as.parent_id
  const adToCamp={}
  for(const ad of (allAds||[]))adToCamp[ad.meta_id]=adsetToCamp[ad.parent_id]||''
  const allAdIds=Object.keys(adToCamp)

  // Determinar si el rango es solo HOY o incluye días anteriores
  const esSoloHoy=(desde===hoy&&hasta===hoy)
  const ventasByCamp={}
  if(allAdIds.length){
    let mapeos=[]
    for(let i=0;i<allAdIds.length;i+=100){
      const batch=allAdIds.slice(i,i+100)
      // Usar fecha de COMPRA (m.fecha), no fecha_dropi
      const{data}=await sb.from('mapeos').select('ad_id,estado_final,fecha,fecha_dropi').in('ad_id',batch).gte('fecha',desde).lte('fecha',hasta)
      if(data)mapeos=mapeos.concat(data)
    }
    for(const m of mapeos){
      const campId=adToCamp[m.ad_id]
      if(!campId)continue
      if(!ventasByCamp[campId])ventasByCamp[campId]={ventas:0,canceladas:0,pendientes:0,_src:'mapeos'}
      const v=ventasByCamp[campId]
      v._src='mapeos'
      // Si la fecha de compra es HOY, todavía no está conciliada → aproximación pendiente
      if(m.fecha===hoy){
        v.pendientes++
      }else{
        // Días anteriores: ya conciliado, mostrar solo el estado final
        const cat=DROPI_STATUS[m.estado_final]?.cat||'otro'
        if(cat==='cancelado')v.canceladas++
        else if(cat==='pendiente'||!m.estado_final)v.pendientes++
        else v.ventas++  // confirmadas (entregadas, en proceso, devueltas, etc.)
      }
    }
  }

  // ── También buscar ventas del reporte diario (ad_ids manuales del auxiliar) ──
  const{data:reportes}=await sb.from('reportes_diarios').select('ad_ids,fecha,producto_nombre,updated_at').gte('fecha',desde).lte('fecha',hasta).not('ad_ids','is',null).neq('ad_ids','').order('updated_at',{ascending:false})
  if(reportes?.length){
    const seen=new Set()
    const uniqueReportes=[]
    for(const rep of reportes){
      const key=rep.fecha+'|'+rep.producto_nombre
      if(seen.has(key))continue
      seen.add(key)
      uniqueReportes.push(rep)
    }
    for(const rep of uniqueReportes){
      if(!rep.ad_ids)continue
      const ids=rep.ad_ids.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s.length>5)
      for(const adId of ids){
        const campId=adToCamp[adId]
        if(!campId)continue
        if(!ventasByCamp[campId])ventasByCamp[campId]={ventas:0,canceladas:0,pendientes:0}
        if(ventasByCamp[campId]._src!=='mapeos'){
          // Si la fecha del reporte es hoy, va a pendientes (aproximación)
          if(rep.fecha===hoy)ventasByCamp[campId].pendientes++
          else ventasByCamp[campId].ventas++
        }
      }
    }
  }

  // ── Clasificar: con/sin actividad (gasto > 0 en el rango) ──
  const conActividad=[],sinActividad=[]
  for(const camp of camps){
    const m=agg[camp.meta_id]
    const hasSpend=m&&m.spend>0
    camp._hasData=hasSpend
    if(hasSpend)conActividad.push(camp)
    else sinActividad.push(camp)
  }
  conActividad.sort((a,b)=>(agg[b.meta_id]?.spend||0)-(agg[a.meta_id]?.spend||0))

  const sourceHtml=source==='meta'
    ?`<div style="font-size:11px;color:var(--green);margin-bottom:8px">🟢 Datos en vivo de Meta · ${desde} → ${hasta}</div>`
    :`<div style="font-size:11px;color:var(--amber);margin-bottom:8px">🟡 Datos históricos (Supabase) · ${desde} → ${hasta}</div>`

  const renderCamp=(camp)=>{
    const m=agg[camp.meta_id]||{spend:0,imp:0,clicks:0,conv:0,ctrs:[],cpms:[],freqs:[]}
    const v=ventasByCamp[camp.meta_id]||{ventas:0,canceladas:0,pendientes:0}
    const cpa=m.conv>0?m.spend/m.conv:0
    const ventasReales=esSoloHoy?v.pendientes:v.ventas
    const cpaReal=ventasReales>0?m.spend/ventasReales:0
    // ROAS Real = (Ventas confirmadas reales × Precio) / Gasto — reemplaza ROAS Meta inflado
    const roasReal=m.spend>0&&ventasReales>0?(ventasReales*ctx.p2)/m.spend:0
    const avgCtr=m.ctrs.length?(m.ctrs.reduce((a,b)=>a+b,0)/m.ctrs.length):0
    const avgCpm=m.cpms.length?(m.cpms.reduce((a,b)=>a+b,0)/m.cpms.length):0
    const avgFreq=m.freqs.length?(m.freqs.reduce((a,b)=>a+b,0)/m.freqs.length):0

    // Semáforo basado en CPA Real vs CPA Break-even (ctx.margenBE)
    let semCls='',semTxt='Sin actividad',semBorder='var(--border)'
    if(camp._hasData&&m.spend>0){
      if(cpaReal===0&&ventasReales===0){
        // Hay gasto pero no hay ventas reales aún
        semCls='pill-amber';semTxt='⏳ Sin ventas';semBorder='var(--amber)'
      }else if(cpaReal>ctx.margenBE){

          <button class="btn-sm btn-outline" onclick="event.stopPropagation();analizarConIA('campana','${camp.meta_id}','${(camp.nombre||'').replace(/'/g,"\\'")}','${desde}','${hasta}')" style="padding:4px 8px;font-size:10px" title="Analizar con IA">🤖</button>

      </div>`:''}</div>

  campHtml+=`<div style="margin:8px 0;display:flex;gap:4px;flex-wrap:wrap">

    <button class="btn-sm btn-outline cf-btn" onclick="filterCampsInAccount('${accountId}','inactive',this)">Sin actividad (${sinActividad.length})</button>

window.filterCampsInAccount=(accountId,filter,btn)=>{
  const accEl=document.getElementById('meta-acc-'+accountId)
  if(!accEl)return
  accEl.querySelectorAll('.cf-btn').forEach(b=>{b.className='btn-sm btn-outline cf-btn'})

  accEl.querySelectorAll('.meta-camp-item').forEach(el=>{

  })
}

// ── Desglose campaña → adsets → ads (lazy loading) ──
window.toggleCampDesglose=async(campId,accountId)=>{
  const el=document.getElementById('desglose-'+campId)
  if(!el)return
  if(el.style.display!=='none'){el.style.display='none';return}
  el.style.display='block'
  if(el.dataset.loaded){return}
  el.innerHTML='<div class="loading">Cargando conjuntos...</div>'
  try{
    const desde=document.getElementById('meta-desde')?.value||_daysAgo(30)
    const hasta=document.getElementById('meta-hasta')?.value||today()
    let token=await getConfig('meta_access_token')
    let adsets=[]
    const agg={}
    try{
      if(token){
        const timeRange=JSON.stringify({since:desde,until:hasta})
        const raw=await metaGet(`/${campId}/adsets`,token,{fields:'id,name,status,effective_status',limit:'200'})
        adsets=raw.map(a=>({meta_id:a.id,nombre:a.name||'',estado:a.effective_status||a.status||''}))
        const ins=await metaGet(`/${campId}/insights`,token,{fields:'adset_id,spend,impressions,clicks,actions',time_range:timeRange,level:'adset',time_increment:'all_days',limit:'200'})
        for(const i of ins){
          if(!agg[i.adset_id])agg[i.adset_id]={spend:0,conv:0,imp:0}
          agg[i.adset_id].spend+=parseFloat(i.spend||0)
          agg[i.adset_id].conv+=metaConv(i.actions)
          agg[i.adset_id].imp+=parseInt(i.impressions||0)
        }
      }
    }catch(_){}
    if(!adsets.length){
      const{data:dbAs}=await sb.from('meta_campanas').select('meta_id,nombre,estado').eq('parent_id',campId).eq('nivel','adset').order('nombre')
      adsets=(dbAs||[]).map(a=>({meta_id:a.meta_id,nombre:a.nombre||'',estado:a.estado||''}))
      const{data:ins}=await sb.from('meta_insights').select('meta_id,spend,impressions,conversions').eq('nivel','adset').gte('fecha',desde).lte('fecha',hasta).in('meta_id',adsets.map(a=>a.meta_id))
      for(const i of (ins||[])){
        if(!agg[i.meta_id])agg[i.meta_id]={spend:0,conv:0,imp:0}
        agg[i.meta_id].spend+=i.spend||0;agg[i.meta_id].conv+=i.conversions||0;agg[i.meta_id].imp+=i.impressions||0
      }
    }
    if(!adsets.length){el.innerHTML='<div style="font-size:12px;color:var(--muted);padding:8px">Sin conjuntos de anuncios</div>';el.dataset.loaded='1';return}
    adsets.sort((a,b)=>(agg[b.meta_id]?.spend||0)-(agg[a.meta_id]?.spend||0))
    el.innerHTML=`<div class="section-title" style="font-size:12px;margin-top:8px">📋 Conjuntos de anuncios (${adsets.length})</div>
      ${adsets.map(as=>{
        const d=agg[as.meta_id]||{spend:0,conv:0,imp:0}
        const hasSpend=d.spend>0
        return`<div style="margin-bottom:6px;${hasSpend?'':'opacity:0.4'}">
          <div class="card" style="padding:8px 12px;border-left:2px solid ${hasSpend?'var(--blue)':'var(--border)'}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <div style="flex:1;min-width:0">
                <div style="font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${as.nombre}">${as.nombre}</div>
                <div style="font-size:10px;color:var(--muted)">${as.estado} · $${fmt(d.spend)} · ${d.conv} conv · ${fmt(d.imp)} imp</div>
              </div>
              <div style="display:flex;gap:4px">
                ${hasSpend?`<button class="btn-sm btn-outline" onclick="toggleAdsetDesglose('${as.meta_id}','${accountId}')" style="padding:3px 6px;font-size:9px">📌 Ads</button>`:''}
                <button class="btn-sm btn-outline" onclick="analizarConIA('adset','${as.meta_id}','${(as.nombre||'').replace(/'/g,"\\'")}')" style="padding:3px 6px;font-size:9px">🤖</button>
              </div>
            </div>
          </div>
          <div id="desglose-as-${as.meta_id}" style="display:none;padding:2px 0 2px 20px"></div>
        </div>`
      }).join('')}`
    el.dataset.loaded='1'
  }catch(e){el.innerHTML=`<div class="alert alert-red" style="font-size:11px">${e.message}</div>`}
}

window.applyMetaDateRange=async()=>{

  document.querySelectorAll('.meta-cuenta-wrap').forEach(el=>{
    const accId=el.dataset.accid
    const accEl=document.getElementById('meta-acc-'+accId)
    const chevron=document.getElementById('meta-chevron-'+accId)
    if(accEl){accEl.style.display='none';accEl.innerHTML=''}
    if(chevron)chevron.textContent='▸'
  })
  // Recalcular gasto en rango para filtro Activas (cuenta = activas + gasto > 0)
  const desde=document.getElementById('meta-desde')?.value||today()
  const hasta=document.getElementById('meta-hasta')?.value||today()
  const{data:insRango}=await sb.from('meta_insights').select('account_id,spend').eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta).limit(20000)
  const gastoRangoByAcc={}
  for(const i of (insRango||[])){gastoRangoByAcc[i.account_id]=(gastoRangoByAcc[i.account_id]||0)+(i.spend||0)}
  // Para saber qué cuentas tienen campañas ACTIVE
  const{data:campsActive}=await sb.from('meta_campanas').select('account_id').eq('nivel','campaign').eq('estado','ACTIVE')
  const cuentasConActivas=new Set((campsActive||[]).map(c=>c.account_id))
  document.querySelectorAll('.meta-cuenta-wrap').forEach(el=>{
    const accId=el.dataset.accid
    const hasGasto=(gastoRangoByAcc[accId]||0)>0
    const hasActive=cuentasConActivas.has(accId)
    el.dataset.tienegastohoy=(hasGasto&&hasActive)?'1':'0'
  })
  filterMetaCuentas()
}

// ── META: DETALLE CAMPAÑA ────────────────────────────────
window.viewCampDetail=async(campId,customDesde,customHasta)=>{
  const isAdmin=currentRol()==='admin'
  closeModal()

  const{data:camp}=await sb.from('meta_campanas').select('*').eq('meta_id',campId).eq('nivel','campaign').maybeSingle()
  if(!camp){alert('Campaña no encontrada');return}

  // Fecha: custom > inputs globales > default 30d
  const desde=customDesde||document.getElementById('meta-desde')?.value||new Date(Date.now()-30*86400000).toISOString().slice(0,10)
  const hasta=customHasta||document.getElementById('meta-hasta')?.value||new Date().toISOString().slice(0,10)
  const hoy=new Date().toISOString().slice(0,10)

  // Insights del rango
  const{data:ins}=await sb.from('meta_insights').select('*').eq('meta_id',campId).eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta).order('fecha',{ascending:false})

  let spendR=0,impR=0,clicksR=0,convR=0,reachR=0
  const ctrs=[],cpms=[],freqs=[]
  for(const i of (ins||[])){
    spendR+=i.spend||0;impR+=i.impressions||0;clicksR+=i.clicks||0;convR+=i.conversions||0;reachR+=i.reach||0
    if(i.ctr)ctrs.push(parseFloat(i.ctr));if(i.cpm)cpms.push(parseFloat(i.cpm));if(i.frequency)freqs.push(parseFloat(i.frequency))
  }
  const avgCtr=ctrs.length?(ctrs.reduce((a,b)=>a+b,0)/ctrs.length):0
  const avgCpm=cpms.length?(cpms.reduce((a,b)=>a+b,0)/cpms.length):0
  const avgFreq=freqs.length?(freqs.reduce((a,b)=>a+b,0)/freqs.length):0
  const cpaMeta=convR>0?spendR/convR:0

  // Break-even
  const prod=productos[0]||{}
  const p2=prod.precio_2u||129900,c2=prod.costo_2u||36000
  const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
  const dp=prod.dev_pct||0.19
  const margenBE=p2*(1-dp)-c2-fo-(fd*dp)
  const roasBE=margenBE>0?p2/margenBE:999
  const roasM=spendR>0&&convR>0?(convR*p2)/spendR:0

  // Semáforo
  let semHtml=''
  if(spendR===0){
    semHtml=`<div class="semaforo" style="background:var(--card2);border-color:var(--border)"><div class="sem-dot" style="background:var(--subtle)"></div><div><div class="sem-title" style="color:var(--muted)">Sin gasto en el rango seleccionado</div></div></div>`
  }else{
    let cls,title,msg
    if(roasM<roasBE){cls='sem-rojo';title='🔴 STOP — Debajo del break-even';msg=`ROAS ${roasM.toFixed(2)}x vs mínimo ${roasBE.toFixed(2)}x`}
    else if(roasM<roasBE*1.4){cls='sem-amarillo';title='🟡 Precaución — Poco colchón';msg=`ROAS ${roasM.toFixed(2)}x. Rentable pero ajustado.`}
    else if(roasM<roasBE*2.2){cls='sem-verde';title='🟢 Escalar — Aumentar presupuesto';msg=`ROAS ${roasM.toFixed(2)}x. Aumentar 20-30%.`}
    else{cls='sem-fuego';title='🟣 Fuego — Escalar agresivo';msg=`ROAS ${roasM.toFixed(2)}x. Muy por encima del BE.`}
    semHtml=`<div class="semaforo ${cls}"><div class="sem-dot"></div><div><div class="sem-title">${title}</div><div class="sem-msg">${msg}</div></div></div>`
  }

  // ── Ad hierarchy + ventas reales ──
  const{data:adsets}=await sb.from('meta_campanas').select('meta_id').eq('parent_id',campId).eq('nivel','adset')
  const adsetIds=(adsets||[]).map(a=>a.meta_id)
  let allAds=[]
  for(let i=0;i<adsetIds.length;i+=50){
    const batch=adsetIds.slice(i,i+50)
    const{data:ads}=await sb.from('meta_campanas').select('meta_id,nombre,estado').in('parent_id',batch).eq('nivel','ad')
    if(ads)allAds=allAds.concat(ads)
  }
  const allAdIds=allAds.map(a=>a.meta_id)
  const adNameMap={};for(const a of allAds)adNameMap[a.meta_id]=a.nombre||a.meta_id

  // Insights per ad
  const adAgg={}
  if(allAdIds.length){
    for(let i=0;i<allAdIds.length;i+=50){
      const batch=allAdIds.slice(i,i+50)
      const{data:adIns}=await sb.from('meta_insights').select('meta_id,spend,impressions,conversions').eq('nivel','ad').gte('fecha',desde).lte('fecha',hasta).in('meta_id',batch)
      for(const ai of (adIns||[])){
        if(!adAgg[ai.meta_id])adAgg[ai.meta_id]={spend:0,imp:0,conv:0}
        adAgg[ai.meta_id].spend+=ai.spend||0
        adAgg[ai.meta_id].imp+=ai.impressions||0
        adAgg[ai.meta_id].conv+=ai.conversions||0
      }
    }
  }

  // Mapeos per ad
  const adVentas={}
  if(allAdIds.length){
    let mapeos=[]
    for(let i=0;i<allAdIds.length;i+=50){
      const batch=allAdIds.slice(i,i+50)
      const{data}=await sb.from('mapeos').select('ad_id,estado_final,fecha_dropi').in('ad_id',batch).gte('fecha_dropi',desde).lte('fecha_dropi',hasta)
      if(data)mapeos=mapeos.concat(data)
    }
    for(const m of mapeos){
      if(!adVentas[m.ad_id])adVentas[m.ad_id]={ventas:0,canceladas:0,pendientes:0,_src:'mapeos'}
      const v=adVentas[m.ad_id]
      v._src='mapeos'
      if(m.fecha_dropi===hoy||!m.estado_final)v.ventas++
      else{
        const cat=DROPI_STATUS[m.estado_final]?.cat||'otro'
        if(cat==='cancelado')v.canceladas++
        else if(cat==='pendiente')v.pendientes++
        else v.ventas++
      }
    }
  }

  // Reportes diarios (auxiliar)
  const{data:reportes}=await sb.from('reportes_diarios').select('ad_ids,fecha,producto_nombre,updated_at').gte('fecha',desde).lte('fecha',hasta).not('ad_ids','is',null).neq('ad_ids','').order('updated_at',{ascending:false})
  if(reportes?.length){
    const seen=new Set()
    for(const rep of reportes){
      const key=rep.fecha+'|'+rep.producto_nombre
      if(seen.has(key))continue
      seen.add(key)
      if(!rep.ad_ids)continue
      const ids=rep.ad_ids.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s.length>5)
      for(const adId of ids){
        if(!allAdIds.includes(adId))continue
        if(!adVentas[adId])adVentas[adId]={ventas:0,canceladas:0,pendientes:0}
        if(adVentas[adId]._src!=='mapeos')adVentas[adId].ventas++
      }
    }
  }

  // Totals
  let totVentas=0,totCanc=0,totPend=0
  for(const v of Object.values(adVentas)){totVentas+=v.ventas;totCanc+=v.canceladas;totPend+=v.pendientes}
  const cpaReal=totVentas>0?spendR/totVentas:0

  // Ventas HTML
  const ventasHtml=`<div class="section-title" style="margin-top:16px">🛒 Ventas Reales</div>
    <div class="cards-row c4">
      <div class="card c-green" style="padding:10px"><div class="card-label">Confirmadas</div><div class="card-val">${totVentas}</div></div>
      <div class="card c-red" style="padding:10px"><div class="card-label">Canceladas</div><div class="card-val">${totCanc}</div></div>
      <div class="card c-amber" style="padding:10px"><div class="card-label">Pendientes</div><div class="card-val">${totPend}</div></div>
      <div class="card ${cpaReal>0&&cpaReal<=margenBE?'c-green':'c-red'}" style="padding:10px"><div class="card-label">CPA Real</div><div class="card-val">${cpaReal>0?'$'+fmt(cpaReal):'—'}</div><div class="card-sub">Gasto / Confirmadas</div></div>
    </div>`

  // Breakdown por anuncio
  const adRows=allAds.map(ad=>{
    const m=adAgg[ad.meta_id]||{spend:0,imp:0,conv:0}
    const v=adVentas[ad.meta_id]||{ventas:0,canceladas:0,pendientes:0}
    const cpaAd=v.ventas>0?m.spend/v.ventas:0
    return{id:ad.meta_id,nombre:ad.nombre||ad.meta_id,estado:ad.estado,spend:m.spend,imp:m.imp,conv:m.conv,ventas:v.ventas,canceladas:v.canceladas,pendientes:v.pendientes,cpaAd}
  }).filter(r=>r.spend>0||r.ventas>0).sort((a,b)=>b.spend-a.spend)

  const breakdownHtml=adRows.length?`<div class="section-title" style="margin-top:16px">📊 Breakdown por anuncio</div>
    <div class="table-wrap"><table>
      <tr><th>Anuncio</th><th>Gasto</th><th>Conv.</th><th>Ventas</th><th>Canc.</th><th>Pend.</th><th>CPA Real</th><th>IA</th></tr>
      ${adRows.map(r=>`<tr>
        <td data-label="Anuncio" style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.nombre}">${r.nombre}</td>
        <td data-label="Gasto">$${fmt(r.spend)}</td>
        <td data-label="Conv.">${r.conv}</td>
        <td data-label="Ventas" style="color:var(--green);font-weight:600">${r.ventas}</td>
        <td data-label="Canc."${r.canceladas?` style="color:var(--red)"`:``}>${r.canceladas||0}</td>
        <td data-label="Pend."${r.pendientes?` style="color:var(--amber)"`:``}>${r.pendientes||0}</td>
        <td data-label="CPA Real"${r.cpaAd>0&&r.cpaAd>margenBE?` style="color:var(--red)"`:r.cpaAd>0?` style="color:var(--green)"`:``}>${r.cpaAd>0?'$'+fmt(r.cpaAd):'—'}</td>
        <td data-label="IA"><button class="btn-sm btn-outline" onclick="analizarConIA('anuncio','${r.id}','${(r.nombre||'').replace(/'/g,"\\'")}','${desde}','${hasta}')" style="padding:4px 8px;font-size:11px">🤖</button></td>
      </tr>`).join('')}
    </table></div>`:`<div class="alert alert-blue" style="margin-top:12px">Sin datos de anuncios para este rango</div>`

  // Notas
  const{data:notas}=await sb.from('meta_notas').select('*,usuarios(nombre)').eq('campaign_id',campId).order('created_at',{ascending:false}).limit(20)
  const notasHtml=`<div class="section-title" style="margin-top:16px">📝 Notas</div>
    <div class="form-grid" style="margin-bottom:10px">
      <div class="fld"><textarea id="camp-nota" rows="2" placeholder="Agregar nota sobre esta campaña..."></textarea></div>
    </div>
    <button class="btn-sm btn-primary" onclick="saveCampNota('${campId}')" style="margin-bottom:10px">Guardar nota</button>
    <div id="camp-nota-msg"></div>
    ${(notas||[]).length?notas.map(n=>`<div style="padding:8px;border-bottom:1px solid var(--border);font-size:12px">
      <div style="color:var(--muted)">${n.usuarios?.nombre||'—'} · ${new Date(n.created_at).toLocaleString('es-CO')}</div>
      <div style="margin-top:4px">${n.nota}</div>
    </div>`).join(''):'<div style="font-size:12px;color:var(--muted)">Sin notas</div>'}`

  // Historial diario con ventas
  const histHtml=(ins||[]).length?`<div class="section-title" style="margin-top:16px">📅 Historial diario</div>
    <div class="table-wrap"><table>
      <tr><th>Fecha</th><th>Gasto</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>CPM</th><th>Conv.</th><th>CPA Meta</th></tr>
      ${ins.map(i=>`<tr>
        <td data-label="Fecha" style="font-family:monospace;font-size:11px">${i.fecha}</td>
        <td data-label="Gasto">$${fmt(i.spend)}</td>
        <td data-label="Impr.">${fmt(i.impressions)}</td>
        <td data-label="Clicks">${fmt(i.clicks)}</td>
        <td data-label="CTR">${parseFloat(i.ctr).toFixed(2)}%</td>
        <td data-label="CPM">$${fmt(i.cpm)}</td>
        <td data-label="Conv.">${i.conversions||0}</td>
        <td data-label="CPA Meta">${i.conversions>0?'$'+fmt(i.spend/i.conversions):'—'}</td>
      </tr>`).join('')}
    </table></div>`:''

  // Modal
  const div=document.createElement('div')
  div.id='user-modal';div.className='modal-bg'
  div.innerHTML=`<div class="modal-box" onclick="event.stopPropagation()" style="max-width:800px">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div><div class="modal-title">${camp.nombre||campId}</div>
        <div class="modal-sub">${camp.objetivo||''} · ${camp.estado} · ${camp.account_id}</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn-sm btn-primary" onclick="analizarConIA('campana','${campId}','${(camp.nombre||campId).replace(/'/g,"\\'")}','${desde}','${hasta}')" title="Analizar con IA">🤖 Analizar</button>
        <button class="btn-sm btn-outline" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px">
      <div class="fld" style="margin:0"><label style="font-size:10px">Desde</label><input type="date" id="cd-desde" value="${desde}" style="font-size:12px;padding:6px 8px" onchange="viewCampDetail('${campId}',this.value,document.getElementById('cd-hasta').value)"></div>
      <div class="fld" style="margin:0"><label style="font-size:10px">Hasta</label><input type="date" id="cd-hasta" value="${hasta}" style="font-size:12px;padding:6px 8px" onchange="viewCampDetail('${campId}',document.getElementById('cd-desde').value,this.value)"></div>
    </div>
    ${semHtml}
    <div class="cards-row c4">
      <div class="card" style="padding:10px"><div class="card-label">Gasto</div><div class="card-val">$${fmt(spendR)}</div></div>
      <div class="card ${roasM>=roasBE?'c-green':'c-red'}" style="padding:10px"><div class="card-label">ROAS Meta</div><div class="card-val">${roasM.toFixed(2)}x</div><div class="card-sub">BE: ${roasBE.toFixed(2)}x</div></div>
      <div class="card" style="padding:10px"><div class="card-label">CPA Meta</div><div class="card-val">${cpaMeta>0?'$'+fmt(cpaMeta):'—'}</div>${isAdmin?`<div class="card-sub">Lím: $${fmt(margenBE)}</div>`:''}</div>
      <div class="card" style="padding:10px"><div class="card-label">Conv.</div><div class="card-val">${convR}</div></div>
    </div>
    <div class="cards-row c4" style="margin-top:8px">
      <div class="card" style="padding:10px"><div class="card-label">CTR</div><div class="card-val">${avgCtr.toFixed(2)}%</div></div>
      <div class="card" style="padding:10px"><div class="card-label">CPM</div><div class="card-val">$${fmt(avgCpm)}</div></div>
      <div class="card" style="padding:10px"><div class="card-label">Frecuencia</div><div class="card-val">${avgFreq.toFixed(1)}</div></div>
      <div class="card" style="padding:10px"><div class="card-label">Alcance</div><div class="card-val">${fmt(reachR)}</div></div>
    </div>
    ${ventasHtml}
    ${breakdownHtml}
    ${notasHtml}
    ${histHtml}
  </div>`
  div.onclick=closeModal
  document.body.appendChild(div)
}

// ── ANÁLISIS IA (Claude API via Edge Function) ────────────
async function callClaudeIA(nivel,targetId,targetNombre,datos,desde,hasta){
  try{
    const{data,error}=await sb.functions.invoke('analyze-ia',{body:{nivel,targetId,targetNombre,datos,desde,hasta}})
    if(error){
      let realMsg=error.message
      try{const body=await error.context?.json?.();if(body?.error)realMsg=body.error}catch(_){}
      return{ok:false,error:realMsg}
    }
    if(data?.error)return{ok:false,error:data.error}
    return{ok:true,data}
  }catch(e){return{ok:false,error:e.message||'Error desconocido'}}
}

// Reúne datos completos para el nivel solicitado
async function gatherDataIA(nivel,targetId,desde,hasta){
  const prod=productos[0]||{}
  const p2=prod.precio_2u||129900,c2=prod.costo_2u||36000
  const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
  const dp=prod.dev_pct||0.19
  const margenBE=p2*(1-dp)-c2-fo-(fd*dp)
  const roasBE=margenBE>0?p2/margenBE:0

  const contexto={
    negocio:'COD (Cash on Delivery) + dropshipping en Colombia',
    producto:{
      nombre:prod.nombre||'',
      precio_2u:p2,costo_2u:c2,
      flete_outbound:fo,flete_devolucion:fd,
      dev_pct_teorico:dp,
      cpa_break_even:Math.round(margenBE),
      roas_break_even_bruto:parseFloat(roasBE.toFixed(2))
    },
    rango:{desde,hasta}
  }

  // Helper: agregar insights
  const aggInsights=(rows)=>{
    let spend=0,imp=0,clicks=0,conv=0,reach=0
    const ctrs=[],cpms=[],freqs=[]
    const porFecha={}
    for(const i of (rows||[])){
      spend+=i.spend||0;imp+=i.impressions||0;clicks+=i.clicks||0;conv+=i.conversions||0;reach+=i.reach||0
      if(i.ctr)ctrs.push(parseFloat(i.ctr));if(i.cpm)cpms.push(parseFloat(i.cpm));if(i.frequency)freqs.push(parseFloat(i.frequency))
      if(!porFecha[i.fecha])porFecha[i.fecha]={gasto:0,conv:0}
      porFecha[i.fecha].gasto+=i.spend||0
      porFecha[i.fecha].conv+=i.conversions||0
    }
    const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0
    return{
      gasto:Math.round(spend),impresiones:imp,clicks,conversiones_meta:conv,alcance:reach,
      ctr_promedio:parseFloat(avg(ctrs).toFixed(2)),
      cpm_promedio:Math.round(avg(cpms)),
      frecuencia_promedio:parseFloat(avg(freqs).toFixed(2)),
      cpa_meta:conv>0?Math.round(spend/conv):0,
      tendencia_diaria:Object.entries(porFecha).sort().map(([f,d])=>({fecha:f,gasto:Math.round(d.gasto),conv:d.conv}))
    }
  }

  // Helper: ventas reales desde mapeos por ad_ids
  const aggVentasReales=async(adIds)=>{
    if(!adIds?.length)return{ventas:0,canceladas:0,pendientes:0,entregadas:0,devueltas:0,en_transito:0}
    let mapeos=[]
    for(let i=0;i<adIds.length;i+=100){
      const batch=adIds.slice(i,i+100)
      const{data}=await sb.from('mapeos').select('estado_final,fecha_dropi,ad_id').in('ad_id',batch).gte('fecha_dropi',desde).lte('fecha_dropi',hasta)
      if(data)mapeos=mapeos.concat(data)
    }
    let ventas=0,canc=0,pend=0,ent=0,dev=0,trans=0
    for(const m of mapeos){
      const cat=DROPI_STATUS[m.estado_final]?.cat||'otro'
      if(cat==='entregado'||cat==='novedad_ok'){ent++;ventas++}
      else if(cat==='devuelto'){dev++;ventas++}
      else if(cat==='cancelado'){canc++}
      else if(cat==='pendiente'){pend++}
      else{trans++;ventas++}
    }
    return{ventas,canceladas:canc,pendientes:pend,entregadas:ent,devueltas:dev,en_transito:trans,tasa_dev_real:ventas>0?parseFloat((dev/ventas).toFixed(3)):0}
  }

  if(nivel==='portafolio'){
    const{data:cuentas}=await sb.from('meta_cuentas').select('account_id,nombre,estado')
    const{data:ins}=await sb.from('meta_insights').select('account_id,fecha,spend,impressions,clicks,ctr,cpm,frequency,reach,conversions').eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta)
    const porCuenta={}
    for(const i of (ins||[])){
      if(!porCuenta[i.account_id])porCuenta[i.account_id]=[]
      porCuenta[i.account_id].push(i)
    }
    const cuentasData=(cuentas||[]).map(c=>{
      const agg=aggInsights(porCuenta[c.account_id]||[])
      return{account_id:c.account_id,nombre:c.nombre,estado:c.estado,...agg}
    }).filter(c=>c.gasto>0).sort((a,b)=>b.gasto-a.gasto)
    const tot=cuentasData.reduce((a,c)=>({gasto:a.gasto+c.gasto,conv:a.conv+c.conversiones_meta,imp:a.imp+c.impresiones,clicks:a.clicks+c.clicks}),{gasto:0,conv:0,imp:0,clicks:0})
    return{contexto,nivel:'portafolio',resumen_global:{gasto_total:tot.gasto,conversiones_meta_total:tot.conv,impresiones_total:tot.imp,clicks_total:tot.clicks,cpa_meta_global:tot.conv>0?Math.round(tot.gasto/tot.conv):0,cuentas_con_gasto:cuentasData.length},top_cuentas:cuentasData.slice(0,15)}
  }

  if(nivel==='cuenta'){
    const{data:cuenta}=await sb.from('meta_cuentas').select('*').eq('account_id',targetId).maybeSingle()
    const{data:camps}=await sb.from('meta_campanas').select('meta_id,nombre,estado,objetivo').eq('account_id',targetId).eq('nivel','campaign')
    const{data:ins}=await sb.from('meta_insights').select('meta_id,fecha,spend,impressions,clicks,ctr,cpm,frequency,reach,conversions').eq('account_id',targetId).eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta)
    const porCamp={}
    for(const i of (ins||[])){if(!porCamp[i.meta_id])porCamp[i.meta_id]=[];porCamp[i.meta_id].push(i)}
    const aggCuenta=aggInsights(ins||[])
    // Ventas reales: traer ads de la cuenta y cruzar
    const{data:adsets}=await sb.from('meta_campanas').select('meta_id,parent_id').eq('account_id',targetId).eq('nivel','adset')
    const{data:ads}=await sb.from('meta_campanas').select('meta_id,parent_id').eq('account_id',targetId).eq('nivel','ad')
    const ventasReales=await aggVentasReales((ads||[]).map(a=>a.meta_id))
    const cpaReal=ventasReales.ventas>0?Math.round(aggCuenta.gasto/ventasReales.ventas):0
    const roasReal=aggCuenta.gasto>0&&ventasReales.entregadas>0?parseFloat((ventasReales.entregadas*p2/aggCuenta.gasto).toFixed(2)):0
    const campsData=(camps||[]).map(c=>{const a=aggInsights(porCamp[c.meta_id]||[]);return{...c,...a}}).filter(c=>c.gasto>0).sort((a,b)=>b.gasto-a.gasto)
    return{contexto,nivel:'cuenta',cuenta:{nombre:cuenta?.nombre,account_id:targetId,estado:cuenta?.estado},metricas_meta:aggCuenta,ventas_reales:{...ventasReales,cpa_real:cpaReal,roas_real:roasReal},top_campanas:campsData.slice(0,15)}
  }

  if(nivel==='campana'){
    const{data:camp}=await sb.from('meta_campanas').select('*').eq('meta_id',targetId).eq('nivel','campaign').maybeSingle()
    const{data:ins}=await sb.from('meta_insights').select('*').eq('meta_id',targetId).eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta)
    const aggCamp=aggInsights(ins||[])
    // Ads de esta campaña
    const{data:adsets}=await sb.from('meta_campanas').select('meta_id').eq('parent_id',targetId).eq('nivel','adset')
    const adsetIds=(adsets||[]).map(a=>a.meta_id)
    let allAds=[]
    for(let i=0;i<adsetIds.length;i+=50){const batch=adsetIds.slice(i,i+50);const{data}=await sb.from('meta_campanas').select('meta_id,nombre,estado').in('parent_id',batch).eq('nivel','ad');if(data)allAds=allAds.concat(data)}
    const adIds=allAds.map(a=>a.meta_id)
    const ventasReales=await aggVentasReales(adIds)
    const cpaReal=ventasReales.ventas>0?Math.round(aggCamp.gasto/ventasReales.ventas):0
    const roasReal=aggCamp.gasto>0&&ventasReales.entregadas>0?parseFloat((ventasReales.entregadas*p2/aggCamp.gasto).toFixed(2)):0
    // Insights por ad para breakdown
    const adAgg={}
    for(let i=0;i<adIds.length;i+=50){
      const batch=adIds.slice(i,i+50)
      const{data:adIns}=await sb.from('meta_insights').select('meta_id,spend,impressions,conversions').eq('nivel','ad').gte('fecha',desde).lte('fecha',hasta).in('meta_id',batch)
      for(const ai of (adIns||[])){if(!adAgg[ai.meta_id])adAgg[ai.meta_id]={spend:0,imp:0,conv:0};adAgg[ai.meta_id].spend+=ai.spend||0;adAgg[ai.meta_id].imp+=ai.impressions||0;adAgg[ai.meta_id].conv+=ai.conversions||0}
    }
    const adsBreakdown=allAds.map(a=>{const x=adAgg[a.meta_id]||{spend:0,imp:0,conv:0};return{nombre:a.nombre,estado:a.estado,gasto:Math.round(x.spend),impresiones:x.imp,conversiones:x.conv,cpa_meta:x.conv>0?Math.round(x.spend/x.conv):0}}).filter(a=>a.gasto>0).sort((a,b)=>b.gasto-a.gasto).slice(0,10)
    // Notas previas
    const{data:notas}=await sb.from('meta_notas').select('nota,created_at,usuarios(nombre)').eq('campaign_id',targetId).order('created_at',{ascending:false}).limit(5)
    // Análisis previos
    const{data:prevs}=await sb.from('meta_analisis_ia').select('analisis,created_at').eq('nivel','campana').eq('target_id',targetId).order('created_at',{ascending:false}).limit(3)
    return{contexto,nivel:'campana',campana:{nombre:camp?.nombre,meta_id:targetId,estado:camp?.estado,objetivo:camp?.objetivo},metricas_meta:aggCamp,ventas_reales:{...ventasReales,cpa_real:cpaReal,roas_real:roasReal},top_anuncios:adsBreakdown,notas_previas:(notas||[]).map(n=>({fecha:n.created_at,autor:n.usuarios?.nombre,nota:n.nota})),analisis_previos:(prevs||[]).map(p=>({fecha:p.created_at,resumen:p.analisis?.slice(0,300)}))}
  }

  if(nivel==='anuncio'){
    const{data:ad}=await sb.from('meta_campanas').select('*').eq('meta_id',targetId).eq('nivel','ad').maybeSingle()
    const{data:ins}=await sb.from('meta_insights').select('*').eq('meta_id',targetId).eq('nivel','ad').gte('fecha',desde).lte('fecha',hasta)
    const aggAd=aggInsights(ins||[])
    const ventasReales=await aggVentasReales([targetId])
    const cpaReal=ventasReales.ventas>0?Math.round(aggAd.gasto/ventasReales.ventas):0
    const roasReal=aggAd.gasto>0&&ventasReales.entregadas>0?parseFloat((ventasReales.entregadas*p2/aggAd.gasto).toFixed(2)):0
    const{data:prevs}=await sb.from('meta_analisis_ia').select('analisis,created_at').eq('nivel','anuncio').eq('target_id',targetId).order('created_at',{ascending:false}).limit(3)
    return{contexto,nivel:'anuncio',anuncio:{nombre:ad?.nombre,meta_id:targetId,estado:ad?.estado},metricas_meta:aggAd,ventas_reales:{...ventasReales,cpa_real:cpaReal,roas_real:roasReal},analisis_previos:(prevs||[]).map(p=>({fecha:p.created_at,resumen:p.analisis?.slice(0,300)}))}
  }
  return{error:'Nivel inválido'}
}

// Orquesta el análisis: reúne datos → llama Edge Function → muestra modal
window.analizarConIA=async(nivel,targetId,targetNombre,desde,hasta)=>{
  desde=desde||document.getElementById('meta-desde')?.value||new Date(Date.now()-30*86400000).toISOString().slice(0,10)
  hasta=hasta||document.getElementById('meta-hasta')?.value||today()
  showIALoading(nivel,targetNombre)
  try{
    const datos=await gatherDataIA(nivel,targetId,desde,hasta)
    if(datos.error){showIAError(datos.error);return}
    const res=await callClaudeIA(nivel,targetId,targetNombre,datos,desde,hasta)
    if(!res.ok){showIAError(res.error);return}
    showIAResult(nivel,targetNombre,res.data,datos,desde,hasta)
    logAction('ia_analisis',{nivel,target_id:targetId,tokens_in:res.data?.tokens_in,tokens_out:res.data?.tokens_out}).catch(()=>{})
  }catch(e){showIAError(e.message)}

// ── Helpers de validación y parseo de xlsx ────────────────
async function _parseXlsxMaestro(file){
  const ab=await file.arrayBuffer()
  const wb=XLSX.read(ab,{type:'array'})
  const ws=wb.Sheets[wb.SheetNames[0]]
  return XLSX.utils.sheet_to_json(ws,{defval:''})
}

function _detectarNiveles(rows){
  let max=1
  for(const r of rows){
    if(String(r.d4||'').trim())max=Math.max(max,4)
    else if(String(r.d3||'').trim())max=Math.max(max,3)
    else if(String(r.d2||'').trim())max=Math.max(max,2)
  }
  return max
}

async function _validarRowsMaestro(rows){
  const errores=[],warnings=[]
  if(!rows.length)return{ok:false,errores:['El archivo está vacío']}
  const cols=Object.keys(rows[0]||{}).map(c=>c.toLowerCase())
  if(!cols.includes('ciudad'))errores.push('Falta columna obligatoria: ciudad')
  if(errores.length)return{ok:false,errores}

  const ciudadesDB=await fetchAllRows('ciudades_dropi','id,nombre_dropi,departamento,key_norm')
  const ciudadesNorm={}
  for(const c of ciudadesDB){
    const key=c.key_norm||_normProd(c.nombre_dropi)
    if(!ciudadesNorm[key])ciudadesNorm[key]=[]
    ciudadesNorm[key].push(c)
  }

  const filasLimpias=[]
  const ciudadesVistas=new Set()
  let cobertura=0,canceladas=0,sinCob=0,interOnly=0,i=0
  for(const r of rows){
    i++
    const ciudad=(r.ciudad||r.CIUDAD||'').toString().trim()
    if(!ciudad){warnings.push(`Fila ${i}: ciudad vacía, saltada`);continue}
    const dept=(r.dept_codigo||r.DEPT_CODIGO||r.dept||'').toString().trim()
    const d1=(r.d1||r.D1||'').toString().trim().toUpperCase()
    const d2=(r.d2||r.D2||'').toString().trim().toUpperCase()
    const d3=(r.d3||r.D3||'').toString().trim().toUpperCase()
    const d4=(r.d4||r.D4||'').toString().trim().toUpperCase()
    const fEnv=parseInt(r.flete_envia||r.FLETE_ENVIA||0)||0
    const fCoord=parseInt(r.flete_coord||r.FLETE_COORD||0)||0
    const fInter=parseInt(r.flete_inter||r.FLETE_INTER||0)||0
    for(const[label,v] of [['d1',d1],['d2',d2],['d3',d3],['d4',d4]]){
      if(v&&!['E','C',''].includes(v))errores.push(`Fila ${i} (${ciudad}): ${label}='${v}' inválido. Solo E, C o vacío.`)
    }
    if(fEnv<0||fCoord<0||fInter<0)errores.push(`Fila ${i} (${ciudad}): fletes no pueden ser negativos`)
    const norm=_normProd(ciudad)
    const matches=ciudadesNorm[norm]||[]
    let ciuMatch=null
    if(matches.length===1)ciuMatch=matches[0]
    else if(matches.length>1){
      if(dept)ciuMatch=matches.find(c=>(c.departamento||'').toUpperCase()===dept.toUpperCase())
      if(!ciuMatch){warnings.push(`Fila ${i}: "${ciudad}" tiene ${matches.length} coincidencias. Indica dept_codigo. Saltada.`);continue}
    }else{warnings.push(`Fila ${i}: "${ciudad}" no existe en tabla ciudades_dropi. Saltada.`);continue}
    if(ciudadesVistas.has(ciuMatch.id)){warnings.push(`Fila ${i} (${ciudad}): duplicada, conservando primera.`);continue}
    ciudadesVistas.add(ciuMatch.id)
    const todos=[d1,d2,d3,d4].filter(v=>v)
    if(!todos.length)sinCob++
    else if(todos.every(v=>v==='C'))canceladas++
    else cobertura++
    if(fEnv===0&&fCoord===0&&fInter>0)interOnly++
    filasLimpias.push({ciudad_id:ciuMatch.id,d1:d1||null,d2:d2||null,d3:d3||null,d4:d4||null,flete_envia:fEnv,flete_coord:fCoord,flete_inter:fInter,dept_codigo:dept||ciuMatch.departamento||''})
  }
  return{ok:errores.length===0,errores,warnings,filasLimpias,statsResumen:{total:filasLimpias.length,cobertura,canceladas,sinCob,interOnly},nivelesDetectados:_detectarNiveles(filasLimpias)}
}

          🚚 Solo Interrapidísimo: <strong>${fmt(s.interOnly)}</strong><br>
          🎚️ Niveles detectados: <strong>${v.nivelesDetectados}</strong>
        </div>
        ${v.warnings.length?`<div class="alert alert-amber" style="margin-top:10px;font-size:11px"><strong>${v.warnings.length} avisos:</strong><br>${v.warnings.slice(0,5).join('<br>')}${v.warnings.length>5?'<br>...y '+(v.warnings.length-5)+' más':''}</div>`:''}

window.reemplazarMaestroAplicar=async()=>{
  if(!_guardAdmin())return
  const d=window._mrData
  if(!d){alert('Sesión perdida, reabre el modal');return}
  const msg=document.getElementById('mr-msg')
  msg.innerHTML='<div class="loading">Procesando... no cierres esta ventana</div>'
  try{
    const{data:ciuActuales}=await sb.from('maestro_ciudades').select('ciudad_id,d1,d2,d3,d4,flete_envia,flete_coord,flete_inter,dept_codigo').eq('maestro_id',d.maestroId)
    const{data:mInfo}=await sb.from('maestros').select('niveles,nombre').eq('id',d.maestroId).maybeSingle()
    const{data:vActual}=await sb.from('maestros_versiones').select('id,version,activado_en').eq('maestro_codigo',d.codigo).is('desactivado_en',null).maybeSingle()
    let ordsActuales=0
    if(vActual?.activado_en){
      const prodNombres=productos.filter(p=>(p.maestro_codigo||'GEN')===d.codigo).map(p=>p.nombre)
      if(prodNombres.length){
        const{count}=await sb.from('mapeos').select('id',{count:'exact',head:true}).in('producto',prodNombres).gte('created_at',vActual.activado_en)
        ordsActuales=count||0
      }
    }
    let nextVersion=1
    if(vActual){
      await sb.from('maestros_versiones').update({desactivado_en:new Date().toISOString(),ordenes_procesadas:ordsActuales}).eq('id',vActual.id)
      nextVersion=(vActual.version||0)+1
    }else{
      if(ciuActuales?.length){
        await sb.from('maestros_versiones').insert({
          maestro_codigo:d.codigo,version:1,
          activado_en:new Date(Date.now()-86400000).toISOString(),
          desactivado_en:new Date().toISOString(),
          activado_por:me?.id,
          nota:'Versión inicial (migración automática)',
          ciudades_data:ciuActuales,
          niveles:mInfo?.niveles||3,
          nombre:mInfo?.nombre||d.codigo,
          ordenes_procesadas:ordsActuales
        })
        nextVersion=2
      }
    }
    await sb.from('maestro_ciudades').delete().eq('maestro_id',d.maestroId)
    const inserts=d.filas.map(f=>({...f,maestro_id:d.maestroId}))
    for(let i=0;i<inserts.length;i+=500){
      const chunk=inserts.slice(i,i+500)
      const{error}=await sb.from('maestro_ciudades').insert(chunk)
      if(error)throw new Error('Error insertando ciudades: '+error.message)
    }
    if(d.niveles!==mInfo?.niveles){
      await sb.from('maestros').update({niveles:d.niveles}).eq('id',d.maestroId)
    }
    await sb.from('maestros_versiones').insert({
      maestro_codigo:d.codigo,version:nextVersion,
      activado_en:new Date().toISOString(),
      desactivado_en:null,activado_por:me?.id,
      nota:d.nota||null,ciudades_data:d.filas,
      niveles:d.niveles,nombre:mInfo?.nombre||d.codigo,
      ordenes_procesadas:0
    })
    logAction('maestro_reemplazado',{codigo:d.codigo,version:nextVersion,filas:d.filas.length,nota:d.nota}).catch(()=>{})
    msg.innerHTML='<div class="alert alert-green">✅ Maestro reemplazado correctamente</div>'
    setTimeout(()=>{closeModal();cargarSeccionMaestros()},1200)
  }catch(e){msg.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`}
}

    document.getElementById('stats-content').innerHTML=`<div class="cards-row c2" style="margin-top:10px">

      <div class="card c-blue"><div class="card-label">Solo Interrapidísimo</div><div class="card-val">${fmt(interOnly)}</div></div>
      <div class="card"><div class="card-label">Necesitan coord.</div><div class="card-val">${fmt(coord)}</div></div>

window.compararVersion=async(verId,codigo,version)=>{
  if(!_guardAdmin())return
  try{
    const{data:vHist}=await sb.from('maestros_versiones').select('ciudades_data').eq('id',verId).maybeSingle()
    const{data:vAct}=await sb.from('maestros_versiones').select('ciudades_data,version').eq('maestro_codigo',codigo).is('desactivado_en',null).maybeSingle()
    if(!vAct){alert('No hay versión activa');return}
    const histMap={},actMap={}
    for(const r of (vHist?.ciudades_data||[]))histMap[r.ciudad_id]=r
    for(const r of (vAct?.ciudades_data||[]))actMap[r.ciudad_id]=r
    let agregadas=0,removidas=0,cambiadas=0,iguales=0
    const todasIds=new Set([...Object.keys(histMap),...Object.keys(actMap)])
    for(const id of todasIds){
      const h=histMap[id],a=actMap[id]
      if(!h)agregadas++
      else if(!a)removidas++
      else if(JSON.stringify(h)!==JSON.stringify(a))cambiadas++
      else iguales++
    }
    alert(`Comparación v${version} vs v${vAct.version} (activa):\n\n`+
      `✅ Iguales: ${iguales}\n`+
      `🆕 Agregadas en activa: ${agregadas}\n`+
      `❌ Removidas en activa: ${removidas}\n`+
      `🔄 Modificadas: ${cambiadas}`)
  }catch(e){alert('Error: '+e.message)}
}

window.restablecerVersion=async(verId,codigo,version)=>{
  if(!_guardAdmin())return
  const nota=prompt(`⚠️ ¿Restablecer ${codigo} a la versión v${version}?\n\nEsto:\n- Reemplaza la versión activa actual con las reglas de v${version}\n- La versión activa actual pasa a histórico\n- Se crea una nueva versión activa con las reglas de v${version}\n\nDeja una nota opcional (o cancela):`)
  if(nota===null)return
  try{
    const{data:vHist}=await sb.from('maestros_versiones').select('ciudades_data,niveles,nombre').eq('id',verId).maybeSingle()
    if(!vHist){alert('Versión no encontrada');return}
    const{data:maestro}=await sb.from('maestros').select('id,niveles').eq('codigo',codigo).maybeSingle()
    if(!maestro){alert('Maestro no encontrado');return}
    const{data:vActual}=await sb.from('maestros_versiones').select('id,version,activado_en').eq('maestro_codigo',codigo).is('desactivado_en',null).maybeSingle()
    let nextVersion=1
    if(vActual){
      const prodNombres=productos.filter(p=>(p.maestro_codigo||'GEN')===codigo).map(p=>p.nombre)
      let ordsActuales=0
      if(prodNombres.length){
        const{count}=await sb.from('mapeos').select('id',{count:'exact',head:true}).in('producto',prodNombres).gte('created_at',vActual.activado_en)
        ordsActuales=count||0
      }
      await sb.from('maestros_versiones').update({desactivado_en:new Date().toISOString(),ordenes_procesadas:ordsActuales}).eq('id',vActual.id)
      nextVersion=(vActual.version||0)+1
    }
    await sb.from('maestro_ciudades').delete().eq('maestro_id',maestro.id)
    const filas=Array.isArray(vHist.ciudades_data)?vHist.ciudades_data:[]
    const inserts=filas.map(f=>({...f,maestro_id:maestro.id}))
    for(let i=0;i<inserts.length;i+=500){
      const chunk=inserts.slice(i,i+500)
      const{error}=await sb.from('maestro_ciudades').insert(chunk)
      if(error)throw new Error('Error insertando: '+error.message)
    }
    if(vHist.niveles&&vHist.niveles!==maestro.niveles){
      await sb.from('maestros').update({niveles:vHist.niveles}).eq('id',maestro.id)
    }
    await sb.from('maestros_versiones').insert({
      maestro_codigo:codigo,version:nextVersion,
      activado_en:new Date().toISOString(),desactivado_en:null,
      activado_por:me?.id,nota:(nota?nota:'Restablecida desde v'+version),
      ciudades_data:filas,niveles:vHist.niveles||maestro.niveles,
      nombre:vHist.nombre,ordenes_procesadas:0
    })
    logAction('maestro_restablecido',{codigo,desde_version:version,nueva_version:nextVersion,nota}).catch(()=>{})
    alert(`✅ ${codigo} restablecido a las reglas de v${version}. Nueva versión activa: v${nextVersion}`)
    closeModal()
    cargarSeccionMaestros()
  }catch(e){alert('Error: '+e.message)}
}

        <input type="text" id="pr-dept" placeholder="Ej: VAL" style="text-transform:uppercase"></div>
    </div>
    <div style="margin-top:10px"><button class="btn-sm btn-primary" onclick="probarMaestro()">▶️ Probar</button></div>
    <div id="pr-result" style="margin-top:14px"></div>
    <div class="modal-actions"><button class="btn-sm btn-outline" onclick="closeModal()">Cerrar</button></div>
  </div>`
  div.onclick=closeModal
  document.body.appendChild(div)
}

window.probarMaestro=async()=>{
  const codigo=document.getElementById('pr-maestro')?.value
  const qty=parseInt(document.getElementById('pr-qty')?.value||2)
  const ciudad=(document.getElementById('pr-ciudad')?.value||'').trim().toUpperCase()
  const dept=(document.getElementById('pr-dept')?.value||'').trim().toUpperCase()
  const res=document.getElementById('pr-result')
  if(!ciudad){res.innerHTML='<div class="alert alert-red">Escribe una ciudad</div>';return}
  res.innerHTML='<div class="loading">Buscando...</div>'
  try{
    const ciudades=await fetchAllRows('ciudades_dropi','id,nombre_dropi,departamento,key_norm')
    const norm=_normProd(ciudad)
    let matches=ciudades.filter(c=>(c.key_norm||_normProd(c.nombre_dropi))===norm)
    if(dept)matches=matches.filter(c=>(c.departamento||'').toUpperCase()===dept)
    if(!matches.length){res.innerHTML='<div class="alert alert-amber">Ciudad no encontrada. Verifica el nombre.</div>';return}
    if(matches.length>1){res.innerHTML='<div class="alert alert-amber">Hay '+matches.length+' coincidencias. Indica dept.</div>';return}
    const ciu=matches[0]
    const{data:maestro}=await sb.from('maestros').select('id,niveles').eq('codigo',codigo).maybeSingle()
    if(!maestro){res.innerHTML='<div class="alert alert-red">Maestro no encontrado</div>';return}
    const{data:celda}=await sb.from('maestro_ciudades').select('*').eq('maestro_id',maestro.id).eq('ciudad_id',ciu.id).maybeSingle()
    if(!celda){res.innerHTML=`<div class="alert alert-amber">Ciudad ${ciu.nombre_dropi} no tiene reglas en el maestro ${codigo}</div>`;return}
    const dKey='d'+qty
    const d=celda[dKey]
    let estado,carrier,extra=''
    if(!d){estado='SIN_COBERTURA';carrier='—'}
    else if(d==='C'){estado='CANCELAR';carrier='—'}
    else if(d==='E'){
      if((celda.flete_envia||0)===0&&(celda.flete_inter||0)>0){carrier='Interrapidísimo'}
      else if((celda.flete_coord||0)>0){carrier='Servientrega';extra='Requiere coordinación'}
      else{carrier='Servientrega'}
      estado='DESPACHAR'
    }
    const color=estado==='DESPACHAR'?'var(--green)':estado==='CANCELAR'?'var(--red)':'var(--amber)'
    res.innerHTML=`<div class="card" style="border-left:3px solid ${color}">
      <div style="font-weight:600;margin-bottom:8px">${ciu.nombre_dropi} (${ciu.departamento||'—'}) · ${qty}u</div>
      <div style="font-size:12px;line-height:1.8">
        Estado: <strong style="color:${color}">${estado}</strong><br>
        Carrier: <strong>${carrier}</strong><br>
        ${extra?'Nota: '+extra+'<br>':''}
        Flete envía: $${fmt(celda.flete_envia||0)} · Flete coord: $${fmt(celda.flete_coord||0)} · Flete inter: $${fmt(celda.flete_inter||0)}<br>
        <span style="color:var(--muted)">Reglas: d1=${celda.d1||'—'} · d2=${celda.d2||'—'} · d3=${celda.d3||'—'} · d4=${celda.d4||'—'}</span>
      </div>
    </div>`
  }catch(e){res.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`}
}

function showLogin(){
  document.getElementById('login-wrap').style.display='flex'
  document.getElementById('app').style.display='none'
}
async function initApp(){
  try{
    // Detectar QR: ?u=username&p=password en la URL
    const params=new URLSearchParams(location.search)
    const qrUser=params.get('u'),qrPwd=params.get('p')
    if(qrUser&&qrPwd){
      // Limpiar la URL inmediatamente (no dejar credenciales en historial)
      history.replaceState({},'',location.pathname)
      // Cerrar sesión previa por si había otra
      await sb.auth.signOut().catch(()=>{})
      // Resolver username → email si aplica
      let email=qrUser
      if(!qrUser.includes('@')){
        const{data:em}=await sb.rpc('get_email_by_username',{p_username:qrUser})
        if(!em){showLogin();return}
        email=em
      }
      const{error:loginErr}=await sb.auth.signInWithPassword({email,password:qrPwd})
      if(loginErr){showLogin();return}
      const ok=await loadMe()
      if(!ok){await sb.auth.signOut().catch(()=>{});showLogin();return}
      await loadProductos()
      logAction('login',{metodo:'qr'}).catch(()=>{})
      showApp()
      return
    }
    const{data,error}=await sb.auth.getSession()
    if(error){
      console.warn('getSession error, limpiando token:',error)
      await sb.auth.signOut().catch(()=>{})
      showLogin()
      return
    }
    const session=data?.session
    if(!session){showLogin();return}
    const ok=await loadMe(session.user.id)
    if(!ok){
      console.warn('loadMe falló, forzando logout')
      await sb.auth.signOut().catch(()=>{})
      showLogin()
      return
    }
    await loadProductos()
    showApp()
  }catch(e){
    console.error('initApp exception:',e)
    await sb.auth.signOut().catch(()=>{})
    showLogin()
  }
}
initApp()
</script>
