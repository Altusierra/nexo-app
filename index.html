<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--card:#1A1D27;--card2:#222537;--border:#2A2D3E;
  --text:#E8E9F0;--muted:#8B8FA8;--subtle:#4A4D60;
  --green:#22C55E;--green-bg:#0D2818;
  --red:#EF4444;--red-bg:#2D1010;
  --amber:#F59E0B;--amber-bg:#2D2010;
  --blue:#3B82F6;--blue-bg:#0D1A2D;
  --purple:#A78BFA;--purple-bg:#1A1030;
  --accent:#6366F1;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px}
.login-logo{font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:10px;text-align:center}

/* APP SHELL */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.sb-logo{padding:20px;font-size:18px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border)}
.sb-logo span{font-size:11px;color:var(--muted);font-weight:400;display:block}
.sb-nav{padding:12px 8px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:2px}
.sb-item:hover{background:var(--card2);color:var(--text)}
.sb-item.active{background:var(--blue-bg);color:var(--blue)}
.sb-item .icon{width:18px;text-align:center;font-size:15px}
.sb-section{font-size:10px;color:var(--subtle);font-weight:600;letter-spacing:.1em;padding:12px 12px 4px;text-transform:uppercase}
.sb-user{padding:16px;border-top:1px solid var(--border);font-size:12px}
.sb-user-name{color:var(--text);font-weight:500}
.sb-user-role{color:var(--muted);font-size:11px;text-transform:capitalize}
.sb-logout{font-size:11px;color:var(--subtle);cursor:pointer;margin-top:4px}
.sb-logout:hover{color:var(--red)}

/* CONTENT */
.content{padding:28px;overflow-y:auto}
.page-title{font-size:20px;font-weight:600;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px}

/* CARDS */
.cards-row{display:grid;gap:12px;margin-bottom:20px}
.cards-row.c2{grid-template-columns:1fr 1fr}
.cards-row.c3{grid-template-columns:1fr 1fr 1fr}
.cards-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.card-val{font-size:24px;font-weight:600;font-family:monospace}
.card-sub{font-size:11px;color:var(--muted);margin-top:4px}
.c-green .card-val{color:var(--green)}
.c-red .card-val{color:var(--red)}
.c-amber .card-val{color:var(--amber)}
.c-blue .card-val{color:var(--blue)}
.c-purple .card-val{color:var(--purple)}

/* FORMS */
.form-grid{display:grid;gap:14px}
.form-grid.g2{grid-template-columns:1fr 1fr}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld select option{background:var(--card2)}

/* BUTTONS */
.btn-sm{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-sm:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-full{width:100%;padding:11px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-full:hover{opacity:.85}

/* SECTION */
.section{margin-bottom:24px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

/* PILLS */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-red{background:var(--red-bg);color:var(--red)}
.pill-amber{background:var(--amber-bg);color:var(--amber)}
.pill-blue{background:var(--blue-bg);color:var(--blue)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:var(--card2)}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.check-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.check-item.checked{border-color:var(--green);background:var(--green-bg)}
.check-item.checked .check-label{color:var(--green)}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.check-item.checked .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-label{font-size:13px;color:var(--muted)}

/* SEMAFORO */
.semaforo{border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;border:1px solid transparent}
.sem-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.sem-title{font-size:13px;font-weight:600}
.sem-msg{font-size:12px;margin-top:2px}
.sem-verde{background:var(--green-bg);border-color:#16532a}
.sem-verde .sem-dot{background:var(--green)}
.sem-verde .sem-title{color:var(--green)}
.sem-verde .sem-msg{color:#4ade80}
.sem-rojo{background:var(--red-bg);border-color:#7f1d1d}
.sem-rojo .sem-dot{background:var(--red)}
.sem-rojo .sem-title{color:var(--red)}
.sem-rojo .sem-msg{color:#fca5a5}
.sem-amarillo{background:var(--amber-bg);border-color:#78350f}
.sem-amarillo .sem-dot{background:var(--amber)}
.sem-amarillo .sem-title{color:var(--amber)}
.sem-amarillo .sem-msg{color:#fcd34d}

/* ALERT */
.alert{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:16px}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid #16532a}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid #7f1d1d}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #1e3a5f}
.alert-yellow{background:#2a1f06;color:#fbbf24;border:1px solid #78350f}

/* ASIGNADOR — estados */
.asig-pill{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}
.asig-despachar{background:#0d2818;color:#22c55e;border:1px solid #16532a}
.asig-confirmar{background:#0a1f3a;color:#60a5fa;border:1px solid #1e3a5f}
.asig-subir{background:#2a1f06;color:#fbbf24;border:1px solid #78350f}
.asig-cancelar{background:#2a0a1a;color:#f87171;border:1px solid #7f1d1d}
.asig-flete{background:#2a0a0a;color:#fca5a5;border:1px solid #7f1d1d}
.asig-sincobertura{background:#1f1f1f;color:#a3a3a3;border:1px solid #404040}
.asig-row-error{background:#2a0a0a !important}
.asig-stat{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;display:inline-block;margin:0 6px 6px 0}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 0}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.tag-rol{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;background:var(--card2);color:var(--text);text-transform:uppercase;letter-spacing:.05em}

/* IMPERSONATE BAR */
.imp-bar{position:fixed;bottom:20px;right:20px;background:#7c3aed;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(124,58,237,.45);font-size:13px;display:flex;align-items:center;gap:12px;z-index:50;max-width:90vw}
.imp-bar button{background:#fff;color:#7c3aed;border:none}
.imp-bar button:hover{background:#f0f0f0}

/* TOPBAR MÓVIL */
.mob-topbar{display:none;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;gap:10px}
.mob-topbar .hb{background:var(--card);border:1px solid var(--border);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:18px;padding:0}
.mob-topbar .mob-logo{font-weight:700;color:var(--primary);font-size:16px}
.mob-topbar .mob-role{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mob-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.mob-backdrop.open{display:block}

/* ACTION MENU (botón ⋯ Más) */
.actions-menu-wrap{position:relative;display:inline-block}
.actions-toggle{background:var(--card2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;padding:0;display:none;align-items:center;justify-content:center}
.actions-pop{position:absolute;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:30;display:none}
.actions-pop.open{display:block}
.actions-pop button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.actions-pop button:hover{background:var(--card2)}
.actions-inline{display:flex;gap:6px;flex-wrap:wrap}
/* RESPONSIVE */
@media(max-width:768px){
  .mob-topbar{display:flex}
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:78%;max-width:300px;z-index:50;transform:translateX(-100%);transition:transform .25s ease;display:flex !important;box-shadow:8px 0 30px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:14px}
  .page-title{font-size:18px}
  .page-sub{font-size:12px;margin-bottom:12px}
  .cards-row.c4,.cards-row.c3,.cards-row.c2{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px}
  .form-grid.g4,.form-grid.g3,.form-grid.g2{grid-template-columns:1fr;gap:10px}
  .modal-box{max-width:100%;padding:18px}
  .imp-bar{bottom:14px;right:14px;left:14px;max-width:none;font-size:12px;padding:10px 12px;justify-content:space-between}
  /* TABLAS → CARDS */
  .table-wrap{overflow:visible}
  .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap td,.table-wrap th{display:block;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tr{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .table-wrap td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:none;text-align:right;font-size:13px}
  .table-wrap td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;font-weight:600;flex-shrink:0;align-self:center}
  .table-wrap td:empty,.table-wrap td:not([data-label]){display:none}
  .table-wrap td[data-action]{display:block;text-align:left;padding-top:10px;border-top:1px solid var(--border);margin-top:6px}
  .table-wrap td[data-action]::before{display:none}
  .actions-toggle{display:flex}
  .actions-inline{display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-box">
    <div class="login-logo">Nexo</div>
    <div class="login-sub">COD Operations — Altusierra</div>
    <div class="field">
      <label>Usuario o correo</label>
      <input type="text" id="l-user" placeholder="usuario o tu@correo.com" autocomplete="username" autocapitalize="off" autocorrect="off" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="l-pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" id="l-btn" onclick="login()">Ingresar</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<!-- TOPBAR MÓVIL -->
<div class="mob-topbar">
  <button class="hb" onclick="toggleSidebar()" aria-label="Menú">☰</button>
  <div class="mob-logo">Nexo</div>
  <div class="mob-role" id="mob-role">—</div>
</div>
<div class="mob-backdrop" id="mob-backdrop" onclick="toggleSidebar(false)"></div>
<div class="shell">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sb-logo">Nexo <span>COD Operations</span></div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-user">
      <div class="sb-user-name" id="sb-name">—</div>
      <div class="sb-user-role" id="sb-role">—</div>
      <div class="sb-logout" onclick="logout()">Cerrar sesión</div>
    </div>
  </nav>
  <!-- CONTENT -->
  <main class="content" id="content">
    <div class="loading">Cargando...</div>
  </main>
</div>
</div>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2'

const SURL='https://adpfxwnsnltpcgudbkhc.supabase.co'
const SKEY='sb_publishable_Qq0ZdsQokOiJqAAOoOTSmg_TdLkKDFm'
const sb=createClient(SURL,SKEY)

let me=null,productos=[],impersonating=null
const currentRol=()=>impersonating?.rol||me?.rol
const currentMe=()=>impersonating||me

// ── AUTH ──────────────────────────────────────────────────
window.login=async()=>{
  const input=document.getElementById('l-user').value.trim()
  const pwd=document.getElementById('l-pwd').value
  const btn=document.getElementById('l-btn')
  const err=document.getElementById('l-err')
  err.textContent=''
  if(!input||!pwd){err.textContent='Completa los campos';return}
  btn.disabled=true;btn.textContent='Ingresando...'
  const reset=()=>{btn.disabled=false;btn.textContent='Ingresar'}

  let email=input
  if(!input.includes('@')){
    try{
      const{data,error}=await sb.rpc('get_email_by_username',{p_username:input})
      if(error||!data){err.textContent='Credenciales inválidas';reset();return}
      email=data
    }catch(e){err.textContent='Credenciales inválidas';reset();return}
  }
  const{error}=await sb.auth.signInWithPassword({email,password:pwd})
  if(error){err.textContent='Credenciales inválidas';reset();return}
  // Login exitoso — cargar app directamente sin depender de onAuthStateChange
  const ok=await loadMe()
  if(!ok){err.textContent='Error cargando perfil';await sb.auth.signOut().catch(()=>{});reset();return}
  await loadProductos()
  reset()
  logAction('login',{metodo:input.includes('@')?'email':'username'}).catch(()=>{})
  showApp()
}

window.logout=async()=>{await logAction('logout',{}).catch(()=>{});await sb.auth.signOut()}

async function loadMe(uid){
  try{
    const{data,error}=await sb.rpc('get_my_profile')
    if(error){console.error('loadMe error:',error);return false}
    if(!data){console.warn('loadMe: sin perfil');return false}
    const{data:bData}=await sb.from('usuarios').select('bloqueado,rol,hora_inicio,hora_fin').eq('id',data.id).maybeSingle()
    if(bData?.bloqueado){console.warn('Usuario bloqueado');return false}
    if(!dentroDeHorario(bData?.rol,bData?.hora_inicio,bData?.hora_fin)){console.warn('Fuera de horario');return false}
    me=data
    return true
  }catch(e){console.error('loadMe exception:',e);return false}
}

async function loadProductos(){
  try{
    const{data,error}=await sb.from('productos').select('*').eq('activo',true)
    if(error)console.error('loadProductos error:',error)
    productos=data||[]
  }catch(e){console.error('loadProductos exception:',e);productos=[]}
}

sb.auth.onAuthStateChange((ev,sess)=>{
  if(!sess){
    me=null
    document.getElementById('login-wrap').style.display='flex'
    document.getElementById('app').style.display='none'
  }
})

// ── SHELL ─────────────────────────────────────────────────
function showApp(){
  document.getElementById('login-wrap').style.display='none'
  document.getElementById('app').style.display='block'
  document.getElementById('sb-name').textContent=me?.nombre||'—'
  document.getElementById('sb-role').textContent=currentRol()||'—'
  syncMobRole()
  renderNav()
  const rol=currentRol()
  const defaultPage=rol==='admin'?'admin-home':(rol==='auxiliar'?'aux-asignador':'admin-home')
  navigate(defaultPage)
  renderImpersonateBar()
}

function syncMobRole(){
  const el=document.getElementById('mob-role')
  if(el)el.textContent=currentRol()||'—'
}

window.toggleSidebar=(force)=>{
  const sb=document.getElementById('sidebar')
  const bd=document.getElementById('mob-backdrop')
  if(!sb||!bd)return
  const willOpen=typeof force==='boolean'?force:!sb.classList.contains('open')
  sb.classList.toggle('open',willOpen)
  bd.classList.toggle('open',willOpen)
}

window.toggleActionsMenu=(btn)=>{
  const pop=btn.nextElementSibling
  if(!pop)return
  // Cerrar otros menús abiertos primero
  document.querySelectorAll('.actions-pop.open').forEach(el=>{if(el!==pop)el.classList.remove('open')})
  pop.classList.toggle('open')
}

// Cerrar action menus al hacer click fuera
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.actions-menu-wrap')){
    document.querySelectorAll('.actions-pop.open').forEach(el=>el.classList.remove('open'))
  }
})

const NAV={
  admin:[
    {id:'admin-home',icon:'📊',label:'Dashboard'},
    {id:'admin-reportes',icon:'📋',label:'Reportes'},
    {id:'admin-resumen',icon:'📈',label:'Resumen Semanal'},
    {id:'admin-gasto',icon:'💰',label:'Gasto Ads'},
    {id:'admin-productos',icon:'📦',label:'Productos'},
    {id:'admin-gastos-fijos',icon:'📌',label:'Gastos Fijos'},
    {id:'admin-usuarios',icon:'👥',label:'Equipo'},
    {id:'admin-actividad',icon:'🕒',label:'Actividad'},
  ],
  auxiliar:[
    {id:'aux-asignador',icon:'📍',label:'Asignador'},
    {id:'aux-dropi',icon:'📊',label:'Cruce Dropi'},
    {id:'aux-seguimiento',icon:'🚚',label:'Seguimiento'},
    {id:'aux-reporte',icon:'📝',label:'Reporte del día'},
    {id:'aux-reservado',icon:'🔍',label:'Confirmar reservado'},
    {id:'aux-cierre',icon:'✅',label:'Cerrar jornada'},
  ]
}

function renderNav(){
  const rol=currentRol()
  const items=NAV[rol]||NAV.auxiliar
  document.getElementById('sb-nav').innerHTML=
    items.map(i=>`<div class="sb-item" id="nav-${i.id}" onclick="navigate('${i.id}')">
      <span class="icon">${i.icon}</span>${i.label}</div>`).join('')

function renderImpersonateBar(){
  let bar=document.getElementById('imp-bar')
  if(!impersonating){if(bar)bar.remove();return}
  if(!bar){
    bar=document.createElement('div')
    bar.id='imp-bar'
    bar.className='imp-bar'
    document.body.appendChild(bar)
  }
  bar.innerHTML=`👁️ Viendo como <b>${impersonating.nombre||impersonating.username||'usuario'}</b> (${impersonating.rol}) <button class="btn-sm btn-primary" onclick="stopImpersonate()">Volver a admin</button>`
}

window.startImpersonate=(u)=>{
  if(me?.rol!=='admin')return
  impersonating={id:u.id,nombre:u.nombre,username:u.username,rol:u.rol}
  document.getElementById('sb-role').textContent=impersonating.rol
  syncMobRole()
  renderNav()
  renderImpersonateBar()
  const rol=impersonating.rol
  navigate(rol==='admin'?'admin-home':(rol==='auxiliar'?'aux-asignador':'admin-home'))
}

window.stopImpersonate=()=>{
  impersonating=null
  document.getElementById('sb-role').textContent=me?.rol||'—'
  syncMobRole()
  renderNav()
  renderImpersonateBar()
  navigate('admin-usuarios')
}

let currentPage=''
window.navigate=async function(page){
  if(me?.id){
    const{data:bData}=await sb.from('usuarios').select('bloqueado,rol,hora_inicio,hora_fin').eq('id',me.id).maybeSingle()
    if(bData?.bloqueado){await sb.auth.signOut().catch(()=>{});return}
    if(!dentroDeHorario(bData?.rol,bData?.hora_inicio,bData?.hora_fin)){await sb.auth.signOut().catch(()=>{});return}
  }
  currentPage=page
  toggleSidebar(false)
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'))
  const nav=document.getElementById('nav-'+page)
  if(nav)nav.classList.add('active')
  render(page)
}

function render(page){
  const c=document.getElementById('content')
  const pages={
    'admin-home':pageAdminHome,
    'admin-reportes':pageAdminReportes,
    'admin-resumen':pageAdminResumen,
    'admin-gasto':pageAdminGasto,
    'admin-productos':pageAdminProductos,
    'admin-gastos-fijos':pageAdminGastosFijos,
    'admin-usuarios':pageAdminUsuarios,
    'admin-actividad':pageAdminActividad,
    'aux-asignador':pageAuxAsignador,
    'aux-reporte':pageAuxReporte,
    'aux-reservado':pageAuxReservado,
    'aux-dropi':pageAuxDropi,
    'aux-seguimiento':pageAuxSeguimiento,
    'aux-cierre':pageAuxCierre,
  }
  const fn=pages[page]
  if(fn)fn(c)
  else c.innerHTML=`<div class="loading">Página no encontrada</div>`
}

const fmt=n=>new Intl.NumberFormat('es-CO').format(Math.round(n||0))
const today=()=>new Date().toISOString().split('T')[0]
function dentroDeHorario(rol,hora_inicio,hora_fin){
  if(rol==='admin')return true
  if(!hora_inicio||!hora_fin)return true
  const d=new Date()
  const ahora=d.getHours()*60+d.getMinutes()
  const [hi,mi]=hora_inicio.split(':').map(Number)
  const [hf,mf]=hora_fin.split(':').map(Number)
  const inicio=hi*60+mi,fin=hf*60+mf
  return inicio<=fin
    ?(ahora>=inicio&&ahora<=fin)
    :(ahora>=inicio||ahora<=fin)
}
async function logAction(accion,detalles){
  try{
    await sb.rpc('log_action',{p_accion:accion,p_detalles:detalles||{},p_user_agent:navigator.userAgent.slice(0,200)})
  }catch(e){console.warn('logAction fail:',e)}
}
async function callEdge(action,payload){
  try{
    const{data,error}=await sb.functions.invoke('manage-user',{body:{action,payload}})
    if(error){
      // Intentar extraer el error real del body
      let realMsg=error.message
      try{const body=await error.context?.json?.();if(body?.error)realMsg=body.error}catch(_){}
      return{ok:false,error:realMsg}
    }
    if(data?.error)return{ok:false,error:data.error}
    return{ok:true,data}
  }catch(e){return{ok:false,error:e.message||'Error desconocido'}}
}

async function pageAdminHome(c){
  c.innerHTML=`<div class="page-title">Dashboard</div>
    <div class="page-sub" id="dash-date"></div>
    <div id="dash-content"><div class="loading">Cargando métricas...</div></div>`

  const fecha=today()
  document.getElementById('dash-date').textContent=
    new Date(fecha+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})

  const reportes=await getReporteAdmin(fecha)
  const gasto=await sb.from('gasto_ads').select('*').eq('fecha',fecha)
  const prod=productos[0]||{}

  // Agregar reportes del día
  let tot1=0,tot2=0,tot3=0,tot4=0,conv=0,conf=0,canc=0,pend=0,gastoTotal=0
  reportes.forEach(r=>{
    tot1+=r.ord_1u||0;tot2+=r.ord_2u||0;tot3+=r.ord_3u||0;tot4+=r.ord_4u||0
    conv+=r.conversaciones||0;conf+=r.confirmados||0
    canc+=r.cancelados||0;pend+=r.pendientes||0
  })
  ;(gasto.data||[]).forEach(g=>gastoTotal+=g.monto||0)

  const totalOrds=tot1+tot2+tot3+tot4
  const venta=(tot1*( prod.precio_1u||0))+(tot2*(prod.precio_2u||0))+
               (tot3*(prod.precio_3u||0))+(tot4*(prod.precio_4u||0))
  const roas_bruto=gastoTotal>0?venta/gastoTotal:0

  // Break-even
  const p2=prod.precio_2u||129900,c2=prod.costo_2u||36000
  const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
  const dp=prod.dev_pct||0.19
  const ingrEf=p2*(1-dp),costoTot=c2+fo+(fd*dp)
  const margen=ingrEf-costoTot
  const be_roas=margen>0?p2/margen:0

  // Semáforo
  let semHtml=''
  if(gastoTotal===0){
    semHtml=`<div class="semaforo" style="background:var(--card2);border-color:var(--border)">
      <div class="sem-dot" style="background:var(--subtle)"></div>
      <div><div class="sem-title" style="color:var(--muted)">Sin gasto en ads registrado hoy</div>
      <div class="sem-msg" style="color:var(--subtle)">Ingresa el gasto para ver el semáforo</div></div></div>`
  } else {
    const rb=roas_bruto
    let cls,title,msg
    if(rb<be_roas){cls='sem-rojo';title='STOP — Debajo del break-even';msg=`ROAS ${rb.toFixed(2)}x vs mínimo ${be_roas.toFixed(2)}x. Revisar campañas.`}
    else if(rb<be_roas*1.4){cls='sem-amarillo';title='Precaución — Poco colchón';msg=`ROAS ${rb.toFixed(2)}x. Rentable pero ajustado. No escalar aún.`}
    else if(rb<be_roas*2.2){cls='sem-verde';title='Verde — Escalar con confianza';msg=`ROAS ${rb.toFixed(2)}x. Aumenta presupuesto 20-30%.`}
    else{cls='sem-verde';title='Campaña caliente — Escalar agresivo';msg=`ROAS ${rb.toFixed(2)}x. Muy por encima del break-even.`}
    semHtml=`<div class="semaforo ${cls}">
      <div class="sem-dot"></div>
      <div><div class="sem-title">${title}</div><div class="sem-msg">${msg}</div></div></div>`
  }

  document.getElementById('dash-content').innerHTML=`
    ${semHtml}
    <div class="cards-row c4">
      <div class="card c-blue"><div class="card-label">Órdenes hoy</div><div class="card-val">${totalOrds}</div>
        <div class="card-sub">1u:${tot1} · 2u:${tot2} · 3u:${tot3} · 4u:${tot4}</div></div>
      <div class="card c-green"><div class="card-label">Confirmados</div><div class="card-val">${conf}</div>
        <div class="card-sub">${totalOrds>0?Math.round(conf/totalOrds*100):0}% del total</div></div>
      <div class="card c-red"><div class="card-label">Cancelados</div><div class="card-val">${canc}</div></div>
      <div class="card c-amber"><div class="card-label">Pendientes</div><div class="card-val">${pend}</div></div>
    </div>
    <div class="cards-row c3">
      <div class="card c-purple"><div class="card-label">Conversaciones</div><div class="card-val">${conv}</div>
        <div class="card-sub">Tasa cierre: ${conv>0?(totalOrds/conv*100).toFixed(1):0}%</div></div>
      <div class="card"><div class="card-label">Gasto Ads</div><div class="card-val">$${fmt(gastoTotal)}</div></div>
      <div class="card ${roas_bruto>=be_roas?'c-green':'c-red'}">
        <div class="card-label">ROAS Bruto</div>
        <div class="card-val">${roas_bruto.toFixed(2)}x</div>
        <div class="card-sub">Break-even: ${be_roas.toFixed(2)}x</div></div>
    </div>
    <div class="section-title">Reportes del día</div>
    ${reportes.length===0?'<div class="alert alert-blue">Sin reportes registrados hoy</div>':
    `<div class="table-wrap"><table>
      <tr><th>Auxiliar</th><th>Producto</th><th>Órdenes</th><th>Conv.</th><th>Conf.</th><th>Canc.</th><th>Pend.</th><th>Jornada</th></tr>
      ${reportes.map(r=>`<tr>
        <td data-label="Auxiliar">${r.usuarios?.nombre||'—'}</td>
        <td data-label="Producto">${r.producto_nombre||'—'}</td>
        <td data-label="Órdenes">${(r.ord_1u||0)+(r.ord_2u||0)+(r.ord_3u||0)+(r.ord_4u||0)}</td>
        <td data-label="Conv.">${r.conversaciones||0}</td>
        <td data-label="Conf.">${r.confirmados||0}</td>
        <td data-label="Canc.">${r.cancelados||0}</td>
        <td data-label="Pend.">${r.pendientes||0}</td>
        <td data-label="Jornada">${r.jornada_cerrada?'<span class="pill pill-green">✅ Cerrada</span>':'<span class="pill pill-amber">⏳ Abierta</span>'}</td>
      </tr>`).join('')}
    </table></div>`}
  `
}

async function cargarResumenSemanal(){
  const el=document.getElementById('rs-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  const filtroProd=document.getElementById('rs-prod')?.value||''

  // Traer mapeos con estado_final (ya procesados por Dropi)
  let query=sb.from('mapeos').select('*').not('estado_final','is',null)
  const{data:mapeos}=await query.limit(10000)
  if(!mapeos?.length){el.innerHTML='<div class="alert alert-blue">Sin datos de entregas aún</div>';return}

  // Traer gasto ads
  const{data:gastos}=await sb.from('gasto_ads').select('*').limit(5000)
  const gastoByWeek={}
  if(gastos)for(const g of gastos){
    const w=_getWeek(g.fecha)
    gastoByWeek[w]=(gastoByWeek[w]||0)+(g.monto||0)
  }

  // Agrupar por semana
  const semanas={}
  for(const m of mapeos){
    if(filtroProd&&m.producto!==filtroProd)continue
    const w=_getWeek(m.fecha||m.fecha_dropi)
    if(!semanas[w])semanas[w]={env:0,ent:0,dev:0,canc:0,pend:0,trans:0,total:0}
    semanas[w].total++
    const st=DROPI_STATUS[m.estado_final]?.cat||'otro'
    if(st==='entregado'||st==='novedad_ok')semanas[w].ent++
    else if(st==='devuelto')semanas[w].dev++
    else if(st==='cancelado')semanas[w].canc++
    else if(st==='pendiente')semanas[w].pend++
    else semanas[w].trans++
    semanas[w].env++
  }

  const weeks=Object.entries(semanas).sort((a,b)=>b[0].localeCompare(a[0]))
  if(!weeks.length){el.innerHTML='<div class="alert alert-blue">Sin datos para este producto</div>';return}

  // Guardar para export
  window._resumenData=weeks.map(([w,d])=>({
    semana:w,enviadas:d.env,entregadas:d.ent,devueltas:d.dev,canceladas:d.canc,
    en_transito:d.trans,pct_entrega:d.ent>0?Math.round(d.ent/d.total*100):0,
    pct_devolucion:d.dev>0?Math.round(d.dev/d.total*100):0,
    gasto_ads:gastoByWeek[w]||0
  }))

  el.innerHTML=`
    <div style="margin-bottom:14px">
      <button class="btn-sm btn-blue" onclick="exportarResumen()">📥 Exportar a Excel</button>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Semana</th><th>Enviadas</th><th>Entregadas</th><th>Devueltas</th><th>% Ent.</th><th>% Dev.</th><th>Canceladas</th><th>En tránsito</th><th>Gasto Ads</th></tr>
      ${weeks.map(([w,d])=>{
        const pctEnt=d.total>0?Math.round(d.ent/d.total*100):0
        const pctDev=d.total>0?Math.round(d.dev/d.total*100):0
        const devColor=pctDev>20?'color:var(--red)':pctDev>15?'color:var(--amber)':'color:var(--green)'
        const gasto=gastoByWeek[w]||0
        return`<tr>
          <td data-label="Semana" style="font-family:monospace;font-size:12px">${w}</td>
          <td data-label="Enviadas"><strong>${d.env}</strong></td>
          <td data-label="Entregadas">${d.ent}</td>
          <td data-label="Devueltas">${d.dev}</td>
          <td data-label="% Ent." style="color:var(--green)">${pctEnt}%</td>
          <td data-label="% Dev." style="${devColor}"><strong>${pctDev}%</strong></td>
          <td data-label="Canceladas">${d.canc}</td>
          <td data-label="En tránsito">${d.trans}</td>
          <td data-label="Gasto">${gasto?'$'+fmt(gasto):'—'}</td>
        </tr>`
      }).join('')}
    </table></div>`
}

function _getWeek(fecha){
  if(!fecha)return'sin-fecha'
  const d=new Date(fecha)
  const day=d.getDay()||7
  d.setDate(d.getDate()-day+1)
  const mon=d.toISOString().slice(5,10).replace('-','/')
  const end=new Date(d)
  end.setDate(end.getDate()+6)
  const monEnd=end.toISOString().slice(5,10).replace('-','/')
  return`${mon} - ${monEnd}`
}

window.cargarResumenSemanal=cargarResumenSemanal

window.exportarResumen=()=>{
  const data=window._resumenData
  if(!data?.length)return
  const ws=XLSX.utils.json_to_sheet(data)
  const wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,'Resumen Semanal')
  XLSX.writeFile(wb,`resumen_semanal_${today()}.xlsx`)
}

        <div class="fld"><label>Costo 4u</label><input type="number" id="cp4-${prod.id}" value="${prod.costo_4u||0}"></div>
        <div class="fld"><label>Flete outbound</label><input type="number" id="fo-${prod.id}" value="${prod.flete_outbound||21000}"></div>
        <div class="fld"><label>Flete devolución</label><input type="number" id="fd-${prod.id}" value="${prod.flete_devolucion||18000}"></div>
        <div class="fld"><label>% Devolución</label><input type="number" step="0.01" id="dp-${prod.id}" value="${(prod.dev_pct*100)||19}"></div>
      </div>
      <div class="divider"></div>
      <div class="form-grid g2">
        <div class="fld"><label>Keywords (separadas por coma)</label>
          <input type="text" id="kw-${prod.id}" value="${prod.keywords||''}" placeholder="neocell, colageno"></div>
        <div class="fld"><label>Maestro carrier</label>
          <select id="mc-${prod.id}">
            ${maestrosList.map(m=>`<option value="${m.codigo}" ${m.codigo===(prod.maestro_codigo||'GEN')?'selected':''}>${m.codigo} (${m.nombre||''})</option>`).join('')}
          </select></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-sm btn-primary" onclick="saveProd('${prod.id}')">Guardar cambios</button>
        <button class="btn-sm btn-blue" onclick="showSimulador('${prod.id}')">📊 Simular break-even</button>
      </div>
      <div id="pmsg-${prod.id}" style="margin-top:8px"></div>
      <div id="sim-${prod.id}" style="margin-top:10px"></div>
    </div>`).join('')}
    <div id="prod-modal-area"></div>`

  window.saveProd=async(id)=>{
    const g=s=>parseInt(document.getElementById(s+'-'+id).value)||0
    const gf=s=>parseFloat(document.getElementById(s+'-'+id).value)||0
    const kw=document.getElementById('kw-'+id)?.value||''
    const mc=document.getElementById('mc-'+id)?.value||'GEN'
    const{error}=await sb.from('productos').update({
      precio_1u:g('pp1'),precio_2u:g('pp2'),precio_3u:g('pp3'),precio_4u:g('pp4'),
      costo_1u:g('cp1'),costo_2u:g('cp2'),costo_3u:g('cp3'),costo_4u:g('cp4'),
      flete_outbound:g('fo'),flete_devolucion:g('fd'),dev_pct:gf('dp')/100,
      keywords:kw,maestro_codigo:mc
    }).eq('id',id)
    const msg=document.getElementById('pmsg-'+id)
    if(error)msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{msg.innerHTML='<div class="alert alert-green">✅ Guardado</div>';await loadProductos();logAction('producto_editado',{producto_id:id}).catch(()=>{})}
  }

  window.showSimulador=(id)=>{
    const prod=productos.find(p=>p.id===id)
    if(!prod)return
    const el=document.getElementById('sim-'+id)
    if(el.innerHTML){el.innerHTML='';return}
    // Default: oferta 2u
    const p2=prod.precio_2u||129900,c2=prod.costo_2u||36000
    const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
    const devPct=(prod.dev_pct||0.19)
    el.innerHTML=`<div class="card" style="border:1px solid var(--blue);background:rgba(59,130,246,0.05)">
      <div style="font-weight:600;margin-bottom:10px">📊 Simulador Break-even — ${prod.nombre}</div>
      <div class="form-grid g3">
        <div class="fld"><label>Precio venta (2u)</label><input type="number" id="sim-precio-${id}" value="${p2}" oninput="calcSimBE('${id}')"></div>
        <div class="fld"><label>% Devolución</label><input type="number" step="0.1" id="sim-dev-${id}" value="${(devPct*100).toFixed(1)}" oninput="calcSimBE('${id}')"></div>
        <div class="fld"><label>Tasa de cierre %</label><input type="number" step="0.1" id="sim-tc-${id}" value="50" oninput="calcSimBE('${id}')"></div>
      </div>
      <div id="sim-res-${id}" style="margin-top:12px"></div>
    </div>`
    calcSimBE(id)
  }

  window.calcSimBE=(id)=>{
    const prod=productos.find(p=>p.id===id)
    if(!prod)return
    const precio=parseFloat(document.getElementById('sim-precio-'+id).value)||0
    const devPct=(parseFloat(document.getElementById('sim-dev-'+id).value)||0)/100
    const tc=(parseFloat(document.getElementById('sim-tc-'+id).value)||0)/100
    const costo=prod.costo_2u||36000,fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
    const entrega=1-devPct
    const ingresoEfectivo=precio*entrega
    const costoDevPond=fd*devPct
    const costoTotal=costo+fo+costoDevPond
    const margen=ingresoEfectivo-costoTotal
    const cpaBE=margen
    const roasBE=cpaBE>0?precio/cpaBE:0
    const color=margen>0?'var(--green)':'var(--red)'
    document.getElementById('sim-res-'+id).innerHTML=`
      <div class="form-grid g3">
        <div class="card" style="padding:10px"><div class="card-label">CPA Break-even</div><div class="card-val" style="color:${color}">$${fmt(Math.round(cpaBE))}</div></div>
        <div class="card" style="padding:10px"><div class="card-label">ROAS Break-even</div><div class="card-val" style="color:${color}">${roasBE.toFixed(2)}x</div></div>
        <div class="card" style="padding:10px"><div class="card-label">Margen por orden</div><div class="card-val" style="color:${color}">$${fmt(Math.round(margen))}</div></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Ingreso efectivo: $${fmt(Math.round(ingresoEfectivo))} · Costo total: $${fmt(Math.round(costoTotal))} · Entrega: ${(entrega*100).toFixed(0)}%</div>`
  }

  window.modalAddProducto=()=>{
    const area=document.getElementById('prod-modal-area')
    area.innerHTML=`<div class="card" style="border:2px solid var(--primary);margin-bottom:16px">
      <div style="font-weight:600;margin-bottom:14px;font-size:15px">➕ Nuevo producto</div>
      <div class="form-grid g2">
        <div class="fld"><label>Nombre</label><input type="text" id="np-nombre" placeholder="Colágeno Neocell 4"></div>
        <div class="fld"><label>Keywords</label><input type="text" id="np-kw" placeholder="neocell, colageno"></div>
      </div>
      <div class="form-grid g4">
        <div class="fld"><label>Precio 1u</label><input type="number" id="np-p1" value="0"></div>
        <div class="fld"><label>Precio 2u</label><input type="number" id="np-p2" value="0"></div>
        <div class="fld"><label>Precio 3u</label><input type="number" id="np-p3" value="0"></div>
        <div class="fld"><label>Precio 4u</label><input type="number" id="np-p4" value="0"></div>
        <div class="fld"><label>Costo 1u</label><input type="number" id="np-c1" value="0"></div>
        <div class="fld"><label>Costo 2u</label><input type="number" id="np-c2" value="0"></div>
        <div class="fld"><label>Costo 3u</label><input type="number" id="np-c3" value="0"></div>
        <div class="fld"><label>Costo 4u</label><input type="number" id="np-c4" value="0"></div>
        <div class="fld"><label>Flete outbound</label><input type="number" id="np-fo" value="21000"></div>
        <div class="fld"><label>Flete devolución</label><input type="number" id="np-fd" value="18000"></div>
        <div class="fld"><label>% Devolución</label><input type="number" step="0.01" id="np-dp" value="19"></div>
        <div class="fld"><label>Maestro carrier</label>
          <select id="np-mc">${maestrosList.map(m=>`<option value="${m.codigo}">${m.codigo} (${m.nombre||''})</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn-sm btn-primary" onclick="saveNewProd()">Crear producto</button>
        <button class="btn-sm btn-outline" onclick="document.getElementById('prod-modal-area').innerHTML=''">Cancelar</button>
      </div>
      <div id="np-msg" style="margin-top:8px"></div>
    </div>`
    area.scrollIntoView({behavior:'smooth'})
  }

  window.saveNewProd=async()=>{
    const nombre=document.getElementById('np-nombre').value.trim()
    if(!nombre){document.getElementById('np-msg').innerHTML='<div class="alert alert-red">El nombre es obligatorio</div>';return}
    const g=s=>parseInt(document.getElementById(s).value)||0
    const{error}=await sb.from('productos').insert({
      nombre,activo:true,
      precio_1u:g('np-p1'),precio_2u:g('np-p2'),precio_3u:g('np-p3'),precio_4u:g('np-p4'),
      costo_1u:g('np-c1'),costo_2u:g('np-c2'),costo_3u:g('np-c3'),costo_4u:g('np-c4'),
      flete_outbound:g('np-fo'),flete_devolucion:g('np-fd'),
      dev_pct:(parseFloat(document.getElementById('np-dp').value)||19)/100,
      keywords:document.getElementById('np-kw').value||'',
      maestro_codigo:document.getElementById('np-mc').value||'GEN'
    })
    if(error){document.getElementById('np-msg').innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
    await loadProductos()
    logAction('producto_creado',{nombre}).catch(()=>{})
    pageAdminProductos(document.getElementById('content'))
  }
}

  if(!el)return
  if(error){el.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
  if(!data?.length){el.innerHTML='<div class="alert alert-blue">Sin usuarios</div>';return}
  el.innerHTML=`<div class="table-wrap"><table>
    <tr>

        <td data-label="Contraseña" style="font-family:monospace;font-size:12px;color:var(--muted)">${u.password_nota||'—'}</td>

              <button onclick='startImpersonate(${JSON.stringify({id:u.id,nombre:u.nombre,username:u.username,rol:u.rol}).replace(/'/g,"&#39;")})'>👁️ Ver como</button>
              <button onclick='modalUserQR(${JSON.stringify({nombre:u.nombre,username:u.username,password_nota:u.password_nota,email:u.email}).replace(/'/g,"&#39;")})'>📱 Generar QR</button>

              <button onclick="toggleBlockUser('${u.id}','${(u.nombre||'').replace(/'/g,"\\'")}',${u.bloqueado})" style="color:${u.bloqueado?'var(--green)':'var(--red)'}">${u.bloqueado?'✅ Desbloquear':'🔴 Bloquear'}</button>
            </div>
          </div>
          <div class="actions-inline" style="white-space:nowrap">
            <button class="btn-sm btn-primary" onclick='startImpersonate(${JSON.stringify({id:u.id,nombre:u.nombre,username:u.username,rol:u.rol}).replace(/'/g,"&#39;")})'>👁️ Ver</button>
            <button class="btn-sm btn-outline" onclick='modalUserQR(${JSON.stringify({nombre:u.nombre,username:u.username,password_nota:u.password_nota,email:u.email}).replace(/'/g,"&#39;")})'>📱 QR</button>
            <button class="btn-sm btn-outline" onclick='modalUserEdit(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Editar</button>
            <button class="btn-sm btn-outline" onclick='modalUserPassword(${JSON.stringify({id:u.id,nombre:u.nombre}).replace(/'/g,"&#39;")})'>🔑</button>

        </td>

window.doCreateUser=async()=>{
  const get=id=>document.getElementById(id).value.trim()
  const payload={
    nombre:get('nu-nombre'),
    username:get('nu-username').toLowerCase(),
    rol:get('nu-rol'),

    password:document.getElementById('nu-pwd').value,
    password_nota:get('nu-nota')||undefined,
    hora_inicio:get('nu-hi')||undefined,
    hora_fin:get('nu-hf')||undefined
  }
  const msg=document.getElementById('nu-msg')
  const btn=document.getElementById('nu-save')
  if(!payload.nombre||!payload.username||!payload.password){
    msg.innerHTML='<div class="alert alert-red">Completa los campos obligatorios</div>';return
  }
  btn.disabled=true;btn.textContent='Creando...'

    msg.innerHTML=`<div class="alert alert-red">${res.error}</div>`

  }
  logAction('usuario_creado',{username:payload.username,rol:payload.rol}).catch(()=>{})
  closeModal();loadUsuarios()
}

window.doEditUser=async(user_id)=>{

window.modalUserQR=(u)=>{

  if(!loginId){
    openModal(`<div class="modal-title">QR no disponible</div>
      <div class="modal-sub">Este usuario no tiene username configurado</div>
      <div class="modal-actions"><button class="btn-sm btn-primary" onclick="closeModal()">Cerrar</button></div>`)
    return
  }
  if(!pwd){
    openModal(`<div class="modal-title">QR no disponible</div>
      <div class="modal-sub">Sin "Nota de contraseña" no se puede generar el QR. Edita el usuario y agrégala.</div>
      <div class="modal-actions"><button class="btn-sm btn-primary" onclick="closeModal()">Cerrar</button></div>`)
    return
  }
  const url=`${location.origin}${location.pathname}?u=${encodeURIComponent(loginId)}&p=${encodeURIComponent(pwd)}`
  openModal(`

    <div class="modal-sub">${u.nombre||loginId} — escanea con el celular y entra directo</div>
    <div style="background:#fff;padding:16px;border-radius:12px;display:flex;justify-content:center;margin:8px 0;min-height:200px;align-items:center">
      <img id="qr-img" alt="QR" style="display:block;max-width:100%;height:auto">

      <button class="btn-sm btn-outline" onclick="navigator.clipboard.writeText('${url.replace(/'/g,"\\'")}').then(()=>alert('Link copiado'))">Copiar link</button>
      <button class="btn-sm btn-primary" onclick="closeModal()">Cerrar</button>
    </div>`)
  // Generar QR como data URL y mostrarlo como imagen (más confiable que canvas)
  const tryQR=()=>{
    const img=document.getElementById('qr-img')
    const fail=document.getElementById('qr-fail')
    if(!img)return
    if(!window.QRCode||!QRCode.toDataURL){
      // Fallback: API externa (NO ideal para credenciales pero como último recurso)
      img.src=`https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=2&data=${encodeURIComponent(url)}`
      img.onerror=()=>{if(fail){fail.style.display='block';fail.textContent='No se pudo cargar la librería QR. Usa el link de abajo.';img.style.display='none'}}
      return
    }
    QRCode.toDataURL(url,{width:240,margin:1,color:{dark:'#000',light:'#fff'}},(err,dataUrl)=>{
      if(err||!dataUrl){
        if(fail){fail.style.display='block';fail.textContent='Error generando QR. Usa el link de abajo.';img.style.display='none'}
        return
      }
      img.src=dataUrl
    })
  }
  if(window.QRCode)tryQR()
  else setTimeout(tryQR,200)
}

let _asignCache=null
// Paginador: trae TODAS las filas sin importar el max_rows del servidor
async function fetchAllRows(table,columns){
  const PAGE=1000
  let all=[],from=0
  while(true){
    const{data,error}=await sb.from(table).select(columns).range(from,from+PAGE-1)
    if(error)throw new Error(`${table}: ${error.message}`)
    if(!data||data.length===0)break
    all=all.concat(data)
    if(data.length<PAGE)break
    from+=PAGE
  }
  return all
}

async function cargarAsignDataSiNecesario(){
  if(_asignCache)return _asignCache
  const[ciudadesData,maestrosData,celdasData,keywordsData]=await Promise.all([
    fetchAllRows('ciudades_dropi','id,key_norm,nombre_dropi,departamento'),
    fetchAllRows('maestros','id,codigo,nombre,niveles,es_default'),
    fetchAllRows('maestro_ciudades','maestro_id,ciudad_id,d1,d2,d3,d4,flete_envia,flete_coord,flete_inter'),
    fetchAllRows('maestro_keywords','keyword,maestro_id')
  ])
  // Index ciudades por key_norm
  const D={},cityById={}
  for(const c of ciudadesData){D[c.key_norm]={id:c.id,nombre:c.nombre_dropi,dept:c.departamento};cityById[c.id]=c}
  // Index maestros por id y por código
  const masterById={},masterByCode={}
  for(const m of maestrosData){masterById[m.id]=m;masterByCode[m.codigo]=m}
  // Index celdas por (maestro_id, ciudad_id)
  const M={}
  for(const m of maestrosData)M[m.codigo]={}
  for(const x of celdasData){
    const code=masterById[x.maestro_id]?.codigo
    const city=cityById[x.ciudad_id]
    if(!code||!city)continue
    M[code][city.key_norm]={d1:x.d1,d2:x.d2,d3:x.d3,d4:x.d4,fe:x.flete_envia,fc:x.flete_coord,fi:x.flete_inter}
  }
  // Keywords (lowercase) → código maestro
  const kw={}
  for(const k of keywordsData){
    const code=masterById[k.maestro_id]?.codigo
    if(code)kw[k.keyword.toLowerCase()]=code
  }
  _asignCache={D,M,kw,masterByCode}
  return _asignCache
}

function _norm(s){
  if(!s)return ''
  return s.toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()
}
function _lev(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0))
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1])
  return dp[m][n]
}
function _normDept(d){
  if(!d)return null
  const n=_norm(d)
  const map={'VALLE DEL CAUCA':'VALLE','NARINO':'NARINO','NARIÑO':'NARINO','SAN ANDRES':'SAN ANDRES','ARCHIPIELAGO DE SAN ANDRES':'SAN ANDRES','BOGOTA DC':'CUNDINAMARCA','BOGOTA D C':'CUNDINAMARCA','DISTRITO CAPITAL':'CUNDINAMARCA','LA GUAJIRA':'LA GUAJIRA','NORTE DE SANTANDER':'NORTE DE SANTANDER'}
  return map[n]||n
}
function _fuzzy(D,q,dept){
  const dn=dept?_normDept(dept):null
  if(dn){
    const cands={}
    for(const k of Object.keys(D))if(_norm(D[k].dept)===dn)cands[k]=D[k]
    if(!Object.keys(cands).length)return{key:null,match:null,reason:'DEPT_NO_ENCONTRADO'}
    if(cands[q])return{key:q,match:'Exacto',reason:'OK'}
    if(q.length>=4){
      let pfx=null,pd=999
      for(const k of Object.keys(cands))if(k.startsWith(q)){const d=_lev(q,k);if(d<pd){pd=d;pfx=k}}
      if(pfx)return{key:pfx,match:'Fuzzy',reason:'OK'}
    }
    let best=null,bd=999
    for(const k of Object.keys(cands)){const d=_lev(q,k);if(d<bd&&(k.startsWith(q)||q.startsWith(k)||d<=1)){bd=d;best=k}}
    return best?{key:best,match:'Fuzzy',reason:'OK'}:{key:null,match:null,reason:'CIUDAD_NO_ENCONTRADA'}
  }
  if(D[q])return{key:q,match:'Exacto',reason:'OK'}
  let pfx=null,pd=999
  for(const k of Object.keys(D))if(k.startsWith(q)){const d=_lev(q,k);if(d<pd){pd=d;pfx=k}}
  if(pfx)return{key:pfx,match:'Fuzzy',reason:'OK'}
  let best=null,bd=999
  for(const k of Object.keys(D)){const d=_lev(q,k),mx=Math.max(q.length,k.length);if(d<bd&&d<=Math.max(1,Math.floor(mx*0.35))){bd=d;best=k}}
  return best?{key:best,match:'Fuzzy',reason:'OK'}:{key:null,match:null,reason:'SIN_COBERTURA'}
}
function _getDec(m,q,niveles){
  if(!m)return 'S'
  if(niveles===4){if(q<=1)return m.d1;if(q===2)return m.d2;if(q===3)return m.d3;return m.d4}
  if(q<=1)return m.d1;if(q===2)return m.d2;return m.d3
}
function _bestC(m){
  if(m.fe!==null&&m.fc!==null)return m.fe<=m.fc?'Envia':'Coordinadora'
  if(m.fe!==null)return 'Envia'
  if(m.fc!==null)return 'Coordinadora'
  return null
}
function _getState(m,qty,isI,niveles){
  if(!m)return{state:'SIN_COBERTURA',carrier:'—',alt:''}
  const car=_bestC(m)
  if(isI){
    if(m.fi===null)return{state:'SIN_COBERTURA',carrier:'—',alt:''}
    const d=_getDec(m,qty,niveles)
    if(d==='C')return{state:'CANCELAR',carrier:'—',alt:''}
    if(d==='E')return{state:'DESPACHAR',carrier:'Interrapidisimo',alt:''}
    if(d==='N'&&qty<=1){
      const d2=_getDec(m,2,niveles),d3=_getDec(m,3,niveles)
      if(d2==='E'&&d3==='E')return{state:'LLAMAR_SUBIR',carrier:'Interrapidisimo',alt:'2u o 3u'}
      if(d2==='E')return{state:'LLAMAR_SUBIR',carrier:'Interrapidisimo',alt:'2u'}
      if(d3==='E')return{state:'LLAMAR_SUBIR',carrier:'Interrapidisimo',alt:'3u'}
    }
    return{state:'LLAMAR_CONFIRMAR',carrier:'Interrapidisimo',alt:''}
  }
  if(m.fe===null&&m.fc===null)return m.fi!==null?{state:'SIN_COBERTURA',carrier:'Solo Interrapidisimo',alt:''}:{state:'SIN_COBERTURA',carrier:'—',alt:''}
  const d=_getDec(m,qty,niveles)
  if(d==='E')return{state:'DESPACHAR',carrier:car,alt:''}
  if(d==='C')return{state:'CANCELAR',carrier:'—',alt:''}
  if(d==='N'||d==='S'){
    if(qty<=1){
      const d2=_getDec(m,2,niveles),d3=_getDec(m,3,niveles)
      if(d2==='E'&&d3==='E')return{state:'LLAMAR_SUBIR',carrier:car,alt:'2u o 3u'}
      if(d2==='E')return{state:'LLAMAR_SUBIR',carrier:car,alt:'2u'}
      if(d3==='E')return{state:'LLAMAR_SUBIR',carrier:car,alt:'3u'}
    }
    return{state:'LLAMAR_CONFIRMAR',carrier:car,alt:''}
  }
  return{state:'LLAMAR_CONFIRMAR',carrier:car,alt:''}
}
function _stateText(s,alt){return{'DESPACHAR':'DESPACHAR','LLAMAR_CONFIRMAR':'LLAMAR CONFIRMAR DATOS','LLAMAR_SUBIR':'LLAMAR SUBIR A '+alt,'CANCELAR':'CANCELAR','SIN_COBERTURA':'SIN COBERTURA'}[s]||s}
function _stateEmoji(s,fuzzy){const base={'DESPACHAR':'📦✅','LLAMAR_CONFIRMAR':'📋','LLAMAR_SUBIR':'📞','CANCELAR':'🚫','SIN_COBERTURA':'🚫📍'}[s]||'—';return(s==='DESPACHAR'&&fuzzy==='Fuzzy'?'📍':'')+base}
function _stateBadge(s,alt,match){
  const pin=(s==='DESPACHAR'&&match==='Fuzzy')?'📍':''
  const mp={'DESPACHAR':['pill-green','📦✅ DESPACHAR'],'LLAMAR_CONFIRMAR':['pill-blue','📋 LLAMAR CONFIRMAR'],'LLAMAR_SUBIR':['pill-amber','📞 LLAMAR SUBIR '+alt],'CANCELAR':['pill-red','🚫 CANCELAR'],'SIN_COBERTURA':['pill-red','🚫📍 SIN COBERTURA']}
  const[cls,label]=mp[s]||['pill-red','—']
  return`<span class="pill ${cls}">${pin}${label}</span>`
}

function _parseFecha(s){
  // Acepta M/D/YYYY o M-D-YYYY (con o sin cero). Rechaza YYYY-M-D.
  if(!s)return null
  const t=s.trim()
  // Rechazar YYYY-... explícitamente
  if(/^\d{4}[-/]/.test(t))return null
  const m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/)
  if(!m)return null
  const mm=parseInt(m[1]),dd=parseInt(m[2]),yy=parseInt(m[3])
  if(mm<1||mm>12||dd<1||dd>31)return null
  return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`
}

function _parseLineaAsignador(linea){
  // Formato obligatorio: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]
  const partes=linea.split(/[,;\t]/).map(p=>p.trim())
  // Quitar partes vacías al final: para formato nuevo (7+) no bajar de 7, para viejo no bajar de 3
  while(partes.length>7&&partes[partes.length-1]==='')partes.pop()
  if(partes.length<=6)while(partes.length>3&&partes[partes.length-1]==='')partes.pop()
  const n=partes.length
  if(n===0)return{tipo:'vacio'}
  if(n>=3&&n<=6){
    // Formato viejo o incompleto: faltan campos obligatorios
    return{tipo:'invalido',campos:n,raw:linea,msg:'Faltan campos. Formato: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]'}
  }
  if(n>=7&&n<=8){
    // Formato nuevo: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]
    const ciudad=partes[0],qty=parseInt(partes[1])||1,dept=partes[2]
    const tel=partes[3].replace(/\D/g,''),fechaRaw=partes[4],producto=partes[5]
    const adId=partes[6]||''
    const carrier=(n===8&&partes[7])?partes[7]:''
    const isI=carrier.toUpperCase().includes('INTERRAP')
    const errores=[]
    if(!ciudad)errores.push('CIUDAD')
    if(!qty||qty<1)errores.push('UNIDADES')
    if(!dept)errores.push('DPTO')
    if(!tel||tel.length<7)errores.push('TELEFONO')
    if(!producto)errores.push('PRODUCTO')
    const fechaIso=_parseFecha(fechaRaw)
    if(!fechaIso)errores.push('FECHA (use M/D/YYYY)')
    return{tipo:'nuevo',ciudad,qty,dept,tel,fecha:fechaIso,fechaRaw,producto,adId,isI,carrier,errores,raw:linea}
  }
  return{tipo:'invalido',campos:n,raw:linea}
}

let _ultimosResultados=[]

window.procesarAsignador=async()=>{
  const txt=document.getElementById('asign-input').value
  const lineas=txt.split('\n').map(l=>l.trim()).filter(Boolean)
  const msg=document.getElementById('asign-msg')
  const resEl=document.getElementById('asign-resultado')
  if(!lineas.length){msg.innerHTML='<div class="alert alert-red">No hay líneas para procesar</div>';return}

  // PASO 1: parsear todas las líneas y separar válidas / errores
  const parsed=lineas.map(_parseLineaAsignador)
  const conErrores=[]
  parsed.forEach((p,i)=>{
    if(p.tipo==='nuevo'&&p.errores.length>0)conErrores.push({linea:i+1,raw:p.raw,faltan:p.errores})
    else if(p.tipo==='invalido')conErrores.push({linea:i+1,raw:p.raw,faltan:[p.msg||`Número de campos inválido (${p.campos}). Formato: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]`]})
  })

  if(conErrores.length>0){
    msg.innerHTML=`<div class="alert alert-red"><strong>❌ ${conErrores.length} línea(s) con errores. Corrige antes de procesar:</strong><ul style="margin-top:6px;margin-left:14px;font-size:12px">
      ${conErrores.map(e=>`<li><strong>Línea ${e.linea}:</strong> falta ${e.faltan.join(', ')}<br><code style="font-size:10px;color:var(--muted)">${e.raw}</code></li>`).join('')}
    </ul></div>`
    return
  }

  // PASO 2: procesar todas las líneas con el asignador
  msg.innerHTML='<div class="alert alert-blue">Procesando…</div>'
  const{D,M,kw,masterByCode}=await cargarAsignDataSiNecesario()
  const filas=[]
  const mapeosAGuardar=[]
  for(const p of parsed){
    if(p.tipo==='vacio')continue
    const q=_norm(p.ciudad)
    const df=_fuzzy(D,q,p.dept)
    let estado,carrier,alt='',match='—',ciudadDropi='—',deptoDropi='—'
    let codeMaestro='GEN'
    if(p.tipo==='nuevo'){
      const palabra=p.producto.toLowerCase().trim()
      // Buscar keyword contenida en el producto
      for(const k of Object.keys(kw)){
        if(palabra.includes(k)){codeMaestro=kw[k];break}
      }
    }
    const maestro=masterByCode[codeMaestro]||masterByCode['GEN']
    const niveles=maestro?.niveles||3
    if(!df||!df.key){
      estado='SIN_COBERTURA';carrier='—';match='❌'
    }else{
      const mv=M[codeMaestro]?.[df.key]||M['GEN']?.[df.key]
      const r=_getState(mv,p.qty,p.isI,niveles)
      estado=r.state;carrier=r.carrier;alt=r.alt;match=df.match
      ciudadDropi=D[df.key].nombre;deptoDropi=D[df.key].dept
    }
    filas.push({raw:p,ciudadDropi,deptoDropi,estado,carrier,alt,match,maestro:codeMaestro})

    // Solo encolar para guardar si es formato nuevo válido
    if(p.tipo==='nuevo'&&p.tel&&p.fecha&&p.producto){
      mapeosAGuardar.push({
        fecha:p.fecha,
        telefono:p.tel,
        ad_id:p.adId||null,
        producto:p.producto,
        ciudad:ciudadDropi!=='—'?ciudadDropi:p.ciudad,
        cantidad:p.qty||1,
        estado_inicial:estado
      })
    }
  }
  _ultimosResultados=filas

  // PASO 3: guardar en sistema (con detección de duplicados)
  let guardadas=0,duplicadas=0
  if(mapeosAGuardar.length>0){
    // Buscar duplicados existentes en BD
    const telefonos=[...new Set(mapeosAGuardar.map(m=>m.telefono))]
    const{data:existentes}=await sb.from('mapeos').select('telefono,fecha,producto,ad_id').in('telefono',telefonos)
    const keySet=new Set((existentes||[]).map(e=>`${e.telefono}|${e.fecha}|${(e.producto||'').toLowerCase().trim()}|${e.ad_id||''}`))
    const nuevos=[]
    const vistosEnEsteBatch=new Set()
    for(const m of mapeosAGuardar){
      const k=`${m.telefono}|${m.fecha}|${(m.producto||'').toLowerCase().trim()}|${m.ad_id||''}`
      if(keySet.has(k)||vistosEnEsteBatch.has(k)){duplicadas++;continue}
      vistosEnEsteBatch.add(k)
      nuevos.push(m)
    }
    if(nuevos.length>0){
      const{error}=await sb.from('mapeos').insert(nuevos)
      if(error){msg.innerHTML=`<div class="alert alert-red">Error guardando: ${error.message}</div>`;return}
      guardadas=nuevos.length
      logAction('asignador_procesado',{guardadas,duplicadas,total:lineas.length}).catch(()=>{})
    }
  }

  // PASO 4: render resultado
  msg.innerHTML=`<div class="alert alert-green">
    ✅ ${filas.length} línea(s) procesada(s) — CSV listo para copiar a Dropi<br>
    💾 ${guardadas} venta(s) guardada(s) en sistema${duplicadas>0?` &nbsp;·&nbsp; ⚠️ ${duplicadas} ya estaban registradas`:''}
  </div>`

  // Resumen por estado
  const counts={}
  for(const f of filas)counts[f.estado]=(counts[f.estado]||0)+1
  const resumenItems=[['DESPACHAR','pill-green','📦 Despachar'],['LLAMAR_CONFIRMAR','pill-blue','📋 Llamar'],['LLAMAR_SUBIR','pill-amber','📞 Subir'],['CANCELAR','pill-red','🚫 Cancelar'],['SIN_COBERTURA','pill-red','🚫 Sin cobertura']]
  const resumenHtml=resumenItems.filter(([k])=>counts[k]).map(([k,cls,l])=>`<span class="pill ${cls}" style="margin-right:6px">${l}: ${counts[k]}</span>`).join('')

  resEl.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div>${resumenHtml}</div>
      <button class="btn-sm btn-primary" onclick="copiarCSVAsignador()">📋 Copiar CSV</button>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Ciudad ingresada</th><th>Dpto. ingresado</th><th>Uds.</th><th>DEPARTAMENTO</th><th>CIUDAD</th><th>Emoji</th><th>¿Enviar?</th><th>TRANSPORTADORA (OPCIONAL)</th><th>Match</th></tr>
      ${filas.map(f=>`<tr>
        <td data-label="Ciudad ingresada">${f.raw.ciudad}${f.raw.tipo==='nuevo'&&f.raw.tel?`<br><span style="font-size:10px;color:var(--muted)">📞 ${f.raw.tel}${f.raw.adId?' · ad':' · ORG'}</span>`:''}</td>
        <td data-label="Dpto. ingresado">${f.raw.dept||'—'}</td>
        <td data-label="Uds.">${f.raw.qty}u</td>
        <td data-label="DEPARTAMENTO">${f.deptoDropi}</td>
        <td data-label="CIUDAD"><strong>${f.ciudadDropi}</strong></td>
        <td data-label="Emoji">${_stateEmoji(f.estado,f.match)}</td>
        <td data-label="¿Enviar?">${_stateBadge(f.estado,f.alt,f.match)}</td>
        <td data-label="TRANSPORTADORA">${f.carrier}</td>
        <td data-label="Match" style="font-size:10px;color:var(--muted)">${f.match}</td>
      </tr>`).join('')}
    </table></div>
  `
}

window.copiarCSVAsignador=()=>{
  if(!_ultimosResultados.length)return
  const h='Ciudad ingresada\tDpto. ingresado\tUds.\tDEPARTAMENTO\tCIUDAD\tEmoji\t¿Enviar?\tTRANSPORTADORA (OPCIONAL)\tMatch'
  const rows=_ultimosResultados.map(f=>[
    f.raw.ciudad,f.raw.dept||'',f.raw.qty+'u',f.deptoDropi,f.ciudadDropi,_stateEmoji(f.estado,f.match),_stateText(f.estado,f.alt),f.carrier==='—'?'':f.carrier,f.match
  ].join('\t'))
  const txt=[h,...rows].join('\n')
  navigator.clipboard.writeText(txt).then(()=>{
    const msg=document.getElementById('asign-msg')
    msg.innerHTML='<div class="alert alert-green">✅ Copiado al portapapeles — Pega en Dropi</div>'
  }).catch(()=>{
    const ta=document.createElement('textarea')
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0'
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)
    alert('Copiado al portapapeles')
  })
}

const _autoStyle='background:rgba(0,180,80,0.08);border:1px solid rgba(0,180,80,0.2);color:var(--text);cursor:not-allowed'

async function cargarReporteData(){
  const el=document.getElementById('rep-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  try{
  const tipo=document.getElementById('rep-tipo-fecha')?.value||'compra'
  const fecha=document.getElementById('rep-fecha')?.value||''
  if(!fecha){el.innerHTML='<div class="alert alert-blue">Selecciona una fecha</div>';return}
  const esHoy=fecha===today()&&tipo==='compra'
  const usandoDropi=tipo==='dropi'
  const campo=usandoDropi?'fecha_dropi':'fecha'

  // 1. Auto: mapeos agrupados por producto
  const{data:mapeos}=await sb.from('mapeos').select('*').eq(campo,fecha)
  const porProd={}
  let totConf=0,totCanc=0,totPend=0,totOrd=0
  if(mapeos)for(const m of mapeos){
    const prod=m.producto||'Sin producto'
    if(!porProd[prod])porProd[prod]={ord:0,conf:0,canc:0,pend:0,byQty:{}}
    porProd[prod].ord++;totOrd++
    const q=m.cantidad||1
    porProd[prod].byQty[q]=(porProd[prod].byQty[q]||0)+1
    if(m.estado_final==='CANCELADO'){porProd[prod].canc++;totCanc++}
    else if(m.estado_final==='PENDIENTE CONFIRMACION'){porProd[prod].pend++;totPend++}
    else if(m.estado_final){porProd[prod].conf++;totConf++}
  }

  // 2. Manual: reportes_diarios existentes
  const{data:reportes}=await sb.from('reportes_diarios').select('*').eq('fecha',fecha).eq('usuario_id',me?.id)
  const repByProd={}
  if(reportes)for(const r of reportes)repByProd[r.producto_nombre||'']=r

  const prods=Object.keys(porProd)

  // Auto section HTML
  let autoHtml=''
  if(prods.length===0){
    autoHtml='<div class="alert alert-blue">Sin datos para esta(s) fecha(s)</div>'
  }else{
    autoHtml=prods.map(p=>{
      const d=porProd[p],rep=repByProd[p]
      const pid=p.replace(/\s+/g,'_')
      // Desglose por unidades
      const qtyKeys=Object.keys(d.byQty).map(Number).sort()
      const qtyHtml=qtyKeys.map(q=>`<div class="fld"><label>Órd ${q}u</label><input type="number" value="${d.byQty[q]}" disabled style="${_autoStyle}"></div>`).join('')
      return`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--green)">
        <div style="font-weight:600;margin-bottom:8px">${p}</div>
        <div class="form-grid g${Math.min(qtyKeys.length+3,6)}">
          ${qtyHtml}
          <div class="fld"><label>✅ Confirm.</label><input type="number" value="${d.conf}" disabled style="${_autoStyle}"></div>
          <div class="fld"><label>❌ Cancel.</label><input type="number" value="${d.canc}" disabled style="${_autoStyle}"></div>
          <div class="fld"><label>⏳ Pend.</label><input type="number" value="${d.pend}" disabled style="${_autoStyle}"></div>
        </div>
        ${!usandoDropi?`<div class="form-grid g2" style="margin-top:8px">
          <div class="fld"><label>Conversaciones (manual)</label>
            <input type="number" id="rc-${pid}" value="${rep?.conversaciones||0}" min="0" class="rep-conv" data-prod="${p}" ${!esHoy?'disabled style="'+_autoStyle+'"':''}></div>
        </div>`:''}
      </div>`
    }).join('')
    autoHtml+=`<div class="cards-row c4" style="margin-top:14px">
      <div class="card c-blue"><div class="card-label">Total órdenes</div><div class="card-val">${totOrd}</div></div>
      <div class="card c-green"><div class="card-label">Confirmados</div><div class="card-val">${totConf}</div></div>
      <div class="card c-red"><div class="card-label">Cancelados</div><div class="card-val">${totCanc}</div></div>
      <div class="card c-amber"><div class="card-label">Pendientes</div><div class="card-val">${totPend}</div></div>
    </div>`
  }

  // Motivo for historical edit
  let motivoHtml=''
  if(!esHoy&&prods.length>0&&!usandoDropi){
    motivoHtml=`<div class="alert alert-blue" style="margin-bottom:14px">📅 Fecha anterior — solo lectura. Para modificar conversaciones, activa edición.</div>
    <div style="margin-bottom:14px">
      <button class="btn-sm btn-amber" onclick="habilitarEdicionHist()">🔓 Habilitar edición</button>
      <div id="rep-motivo-wrap" style="display:none;margin-top:8px">
        <div class="fld"><label>Motivo de edición (obligatorio)</label>
        <input type="text" id="rep-motivo" placeholder="Ej: Corrección de conversaciones reales"></div>
      </div>
    </div>`
  }

  // Ventas de hoy (solo si es hoy)
  let ventasHtml=''
  if(esHoy){
    ventasHtml=`<div class="divider"></div>
    <div class="section-title">📝 Ventas de hoy (manual)</div>
    <div class="page-sub" style="margin-bottom:14px">Selecciona producto, pega IDs de anuncio y conversaciones aproximadas</div>
    <div id="ventas-rows"></div>
    <button class="btn-sm btn-blue" onclick="addVentaRow()" style="margin-bottom:14px">+ Agregar producto</button>
    <div class="fld" style="margin-bottom:14px"><label>Nota (opcional)</label>
      <textarea id="rep-nota" rows="2" style="resize:vertical">${reportes?.[0]?.nota||''}</textarea></div>`
  }

  const labelFecha=usandoDropi?'Dropi '+fecha:esHoy?'de ayer':fecha
  el.innerHTML=`
    <div class="section-title" style="color:var(--green)">📊 Datos ${labelFecha} (auto desde Dropi)</div>
    ${motivoHtml}${autoHtml}${ventasHtml}
    <div style="margin-top:16px">
      <button class="btn-full btn-primary" onclick="saveReporteV2('${fecha}')">💾 Guardar reporte</button>
    </div>
    <div id="rep-msg" style="margin-top:10px"></div>`

  // Cargar ventas existentes o crear primera fila
  if(esHoy){
    const ventasExist=reportes?.filter(r=>r.ad_ids)||[]
    if(ventasExist.length>0)for(const v of ventasExist)addVentaRow(v.producto_nombre||'',v.ad_ids||'',v.conversaciones_aprox||0)
    else addVentaRow()
  }
  }catch(e){el.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`}
}
window.cargarReporteData=cargarReporteData

window.saveReporteV2=async(fecha)=>{
  const esHoy=fecha===today()
  const msg=document.getElementById('rep-msg')

  if(!esHoy){
    const motivo=document.getElementById('rep-motivo')?.value?.trim()
    if(!motivo){msg.innerHTML='<div class="alert alert-red">Ingresa un motivo para editar el histórico</div>';return}
    // Save conversaciones per product
    const convEls=document.querySelectorAll('.rep-conv')
    let saved=0,errMsg=''
    for(const cel of convEls){
      const prodName=cel.dataset.prod
      const conv=parseInt(cel.value)||0
      const prodObj=productos.find(p=>p.nombre===prodName)
      const{error}=await sb.from('reportes_diarios').upsert({
        fecha,producto_id:prodObj?.id||prodName,producto_nombre:prodName,
        conversaciones:conv,nota:`[EDITADO] ${motivo}`,
        usuario_id:me.id,updated_at:new Date().toISOString()
      },{onConflict:'fecha,producto_id,usuario_id'})
      if(error)errMsg+=error.message+' '
      else saved++
    }
    if(errMsg)msg.innerHTML=`<div class="alert alert-red">Error: ${errMsg}</div><div class="alert alert-blue" style="margin-top:4px">Debug: ${convEls.length} campos .rep-conv encontrados</div>`
    else msg.innerHTML=`<div class="alert alert-green">✅ Actualizado (${saved} productos) — Motivo: "${motivo}"</div>`
    logAction('reporte_editado_historico',{fecha,motivo,productos:saved}).catch(()=>{})
    return
  }

  // Save ventas de hoy
  const rows=document.getElementById('ventas-rows')?.children||[]
  let saved=0
  for(const row of rows){
    const idx=row.id.replace('vrow-','')
    const prodNom=document.getElementById(`vp-${idx}`)?.value
    if(!prodNom)continue
    const adIds=document.getElementById(`vi-${idx}`)?.value?.trim()||''
    const convAp=parseInt(document.getElementById(`vc-${idx}`)?.value)||0
    const prodObj=productos.find(p=>p.nombre===prodNom)
    // Also get conversaciones from auto section if exists
    const pid=prodNom.replace(/\s+/g,'_')
    const convReal=parseInt(document.getElementById(`rc-${pid}`)?.value)||0
    const{error}=await sb.from('reportes_diarios').upsert({
      fecha,producto_id:prodObj?.id||prodNom,producto_nombre:prodNom,
      conversaciones:convReal,conversaciones_aprox:convAp,ad_ids:adIds,
      nota:document.getElementById('rep-nota')?.value||'',
      usuario_id:me.id,updated_at:new Date().toISOString()
    },{onConflict:'fecha,producto_id,usuario_id'})
    if(error){msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
    saved++
  }
  // Also save conv for products in auto section that aren't in ventas rows
  const convEls=document.querySelectorAll('.rep-conv')
  for(const cel of convEls){
    const prodName=cel.dataset.prod
    const alreadySaved=[...rows].some(r=>{const i=r.id.replace('vrow-','');return document.getElementById(`vp-${i}`)?.value===prodName})
    if(alreadySaved)continue
    const conv=parseInt(cel.value)||0
    const prodObj=productos.find(p=>p.nombre===prodName)
    await sb.from('reportes_diarios').upsert({
      fecha,producto_id:prodObj?.id||prodName,producto_nombre:prodName,
      conversaciones:conv,usuario_id:me.id,updated_at:new Date().toISOString()
    },{onConflict:'fecha,producto_id,usuario_id'}).catch(()=>{})
  }
  msg.innerHTML=`<div class="alert alert-green">✅ ${saved} producto(s) guardado(s)</div>`
  logAction('reporte_guardado',{fecha,productos:saved}).catch(()=>{})
}

async function pageAuxReservado(c){

    <div class="page-sub">Busca por número de teléfono y confirma</div>
    <div class="card" style="max-width:500px">
      <div class="fld" style="margin-bottom:12px">
        <label>Número de teléfono</label>
        <input type="tel" id="res-tel" placeholder="3018022314" maxlength="10"
          onkeydown="if(event.key==='Enter')buscarReservado()">
      </div>
      <button class="btn-full btn-primary" onclick="buscarReservado()">Buscar</button>
      <div id="res-result" style="margin-top:16px"></div>
    </div>`

  window.buscarReservado=async()=>{
    const tel=document.getElementById('res-tel').value.trim()
    if(!tel){return}
    const{data}=await sb.from('mapeos').select('*')
      .eq('telefono',tel).eq('estado_inicial','PENDIENTE CONFIRMACION').maybeSingle()
    const el=document.getElementById('res-result')
    if(!data){
      el.innerHTML='<div class="alert alert-red">No se encontró reservado con ese número</div>';return
    }
    el.innerHTML=`
      <div class="card" style="border:1px solid var(--amber);background:var(--amber-bg)">
        <div style="margin-bottom:12px">
          <div style="font-size:13px;color:var(--muted);margin-bottom:2px">Reservado encontrado</div>
          <div style="font-size:15px;font-weight:600;color:var(--amber)">${tel}</div>
        </div>
        <div style="font-size:13px;color:var(--text);margin-bottom:12px">
          <strong>${data.producto||'—'}</strong>
        </div>
        <button class="btn-full btn-green" onclick="confirmarReservado('${data.id}')">
          ✅ Confirmar este reservado
        </button>
      </div>`
  }

  window.confirmarReservado=async(id)=>{
    const{error}=await sb.from('mapeos').update({estado_final:'CONFIRMADO'}).eq('id',id)
    const el=document.getElementById('res-result')
    if(error)el.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{
      el.innerHTML='<div class="alert alert-green">✅ Reservado confirmado</div>'
      document.getElementById('res-tel').value=''
      logAction('reservado_confirmado',{mapeo_id:id}).catch(()=>{})
    }
  }
}

async function pageAuxCierre(c){
  c.innerHTML=`<div class="page-title">Cerrar jornada</div>
    <div class="page-sub">Confirma que completaste todas las tareas</div>
    <div class="card" style="max-width:500px" id="cierre-card">
      <div class="loading">Cargando...</div>
    </div>`
  const rep=await getReporteHoy()
  const card=document.getElementById('cierre-card')
  if(!rep){
    card.innerHTML='<div class="alert alert-blue">Primero crea el reporte del día antes de cerrar jornada.</div>';return
  }
  if(rep.jornada_cerrada){
    card.innerHTML=`<div class="semaforo sem-verde">
      <div class="sem-dot"></div>
      <div><div class="sem-title">Jornada cerrada ✅</div>
      <div class="sem-msg">Cerraste tu jornada hoy. ¡Buen trabajo!</div></div></div>`;return
  }

  let checks={novedades:rep.ch_novedades||false,guias:rep.ch_guias_reclame||false,
               pendientes:rep.ch_pendientes||false,etiquetas:rep.ch_etiquetas_meta||false}

  const renderCierre=()=>{
    const all=Object.values(checks).every(Boolean)
    card.innerHTML=`
      <div class="section-title" style="margin-bottom:12px">Checklist de cierre</div>
      <div class="checklist">
        ${[
          ['novedades','¿Resolviste todas las novedades del carrier?'],
          ['guias','¿Enviaste guías de reclame en oficina?'],
          ['pendientes','¿Revisaste pendientes por confirmar para envío?'],
          ['etiquetas','¿Cambiaste conversaciones a etiqueta Meta Ads en SellerChat?']
        ].map(([k,label])=>`
          <div class="check-item ${checks[k]?'checked':''}" onclick="toggleCheck('${k}')">
            <div class="check-box">${checks[k]?'✓':''}</div>
            <div class="check-label">${label}</div>
          </div>`).join('')}
      </div>
      ${!all?'<div class="alert alert-amber" style="background:var(--amber-bg);color:var(--amber);border:1px solid #78350f">Completa todos los items para cerrar</div>':
      `<button class="btn-full btn-green" onclick="cerrarJornada()">✅ Cerrar jornada</button>`}
      <div id="cierre-msg" style="margin-top:10px"></div>`
  }

  window.toggleCheck=async(key)=>{
    checks[key]=!checks[key]
    const fieldMap={novedades:'ch_novedades',guias:'ch_guias_reclame',
                    pendientes:'ch_pendientes',etiquetas:'ch_etiquetas_meta'}
    await sb.from('reportes_diarios').update({[fieldMap[key]]:checks[key]}).eq('id',rep.id)
    renderCierre()
  }

  window.cerrarJornada=async()=>{
    const{error}=await sb.from('reportes_diarios').update({
      jornada_cerrada:true,hora_cierre:new Date().toISOString(),
      ch_novedades:true,ch_guias_reclame:true,ch_pendientes:true,ch_etiquetas_meta:true
    }).eq('id',rep.id)
    const msg=document.getElementById('cierre-msg')
    if(error)msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{
      card.innerHTML=`<div class="semaforo sem-verde">
        <div class="sem-dot"></div>
        <div><div class="sem-title">¡Jornada cerrada! ✅</div>
        <div class="sem-msg">${new Date().toLocaleTimeString('es-CO')} — Buen trabajo hoy.</div></div></div>`
      logAction('jornada_cerrada',{reporte_id:rep.id}).catch(()=>{})
    }
  }

  renderCierre()
}
