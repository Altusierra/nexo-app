<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--card:#1A1D27;--card2:#222537;--border:#2A2D3E;
  --text:#E8E9F0;--muted:#8B8FA8;--subtle:#4A4D60;
  --green:#22C55E;--green-bg:#0D2818;
  --red:#EF4444;--red-bg:#2D1010;
  --amber:#F59E0B;--amber-bg:#2D2010;
  --blue:#3B82F6;--blue-bg:#0D1A2D;
  --purple:#A78BFA;--purple-bg:#1A1030;
  --accent:#6366F1;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px}
.login-logo{font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:10px;text-align:center}

/* APP SHELL */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.sb-logo{padding:20px;font-size:18px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border)}
.sb-logo span{font-size:11px;color:var(--muted);font-weight:400;display:block}
.sb-nav{padding:12px 8px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:2px}
.sb-item:hover{background:var(--card2);color:var(--text)}
.sb-item.active{background:var(--blue-bg);color:var(--blue)}
.sb-item .icon{width:18px;text-align:center;font-size:15px}
.sb-section{font-size:10px;color:var(--subtle);font-weight:600;letter-spacing:.1em;padding:12px 12px 4px;text-transform:uppercase}
.sb-user{padding:16px;border-top:1px solid var(--border);font-size:12px}
.sb-user-name{color:var(--text);font-weight:500}
.sb-user-role{color:var(--muted);font-size:11px;text-transform:capitalize}
.sb-logout{font-size:11px;color:var(--subtle);cursor:pointer;margin-top:4px}
.sb-logout:hover{color:var(--red)}

/* CONTENT */
.content{padding:28px;overflow-y:auto}
.page-title{font-size:20px;font-weight:600;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px}

/* CARDS */
.cards-row{display:grid;gap:12px;margin-bottom:20px}
.cards-row.c2{grid-template-columns:1fr 1fr}
.cards-row.c3{grid-template-columns:1fr 1fr 1fr}
.cards-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.cards-row.c6{grid-template-columns:repeat(6,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.card-val{font-size:24px;font-weight:600;font-family:monospace}
.card-sub{font-size:11px;color:var(--muted);margin-top:4px}
.c-green .card-val{color:var(--green)}
.c-red .card-val{color:var(--red)}
.c-amber .card-val{color:var(--amber)}
.c-blue .card-val{color:var(--blue)}
.c-purple .card-val{color:var(--purple)}

/* FORMS */
.form-grid{display:grid;gap:14px}
.form-grid.g2{grid-template-columns:1fr 1fr}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld select option{background:var(--card2)}

/* BUTTONS */
.btn-sm{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-sm:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-full{width:100%;padding:11px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-full:hover{opacity:.85}

/* SECTION */
.section{margin-bottom:24px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

/* PILLS */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-red{background:var(--red-bg);color:var(--red)}
.pill-amber{background:var(--amber-bg);color:var(--amber)}
.pill-blue{background:var(--blue-bg);color:var(--blue)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:var(--card2)}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.check-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.check-item.checked{border-color:var(--green);background:var(--green-bg)}
.check-item.checked .check-label{color:var(--green)}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.check-item.checked .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-label{font-size:13px;color:var(--muted)}

/* SEMAFORO */
.semaforo{border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;border:1px solid transparent}
.sem-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.sem-title{font-size:13px;font-weight:600}
.sem-msg{font-size:12px;margin-top:2px}
.sem-verde{background:var(--green-bg);border-color:#16532a}
.sem-verde .sem-dot{background:var(--green)}
.sem-verde .sem-title{color:var(--green)}
.sem-verde .sem-msg{color:#4ade80}
.sem-rojo{background:var(--red-bg);border-color:#7f1d1d}
.sem-rojo .sem-dot{background:var(--red)}
.sem-rojo .sem-title{color:var(--red)}
.sem-rojo .sem-msg{color:#fca5a5}
.sem-amarillo{background:var(--amber-bg);border-color:#78350f}
.sem-amarillo .sem-dot{background:var(--amber)}
.sem-amarillo .sem-title{color:var(--amber)}
.sem-amarillo .sem-msg{color:#fcd34d}
.sem-fuego{background:var(--purple-bg);border-color:#5b21b6}
.sem-fuego .sem-dot{background:var(--purple)}
.sem-fuego .sem-title{color:var(--purple)}
.sem-fuego .sem-msg{color:#c4b5fd}

/* ALERT */
.alert{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:16px}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid #16532a}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid #7f1d1d}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #1e3a5f}
.alert-yellow{background:#2a1f06;color:#fbbf24;border:1px solid #78350f}

/* ASIGNADOR — estados */
.asig-pill{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}
.asig-despachar{background:#0d2818;color:#22c55e;border:1px solid #16532a}
.asig-confirmar{background:#0a1f3a;color:#60a5fa;border:1px solid #1e3a5f}
.asig-subir{background:#2a1f06;color:#fbbf24;border:1px solid #78350f}
.asig-cancelar{background:#2a0a1a;color:#f87171;border:1px solid #7f1d1d}
.asig-flete{background:#2a0a0a;color:#fca5a5;border:1px solid #7f1d1d}
.asig-sincobertura{background:#1f1f1f;color:#a3a3a3;border:1px solid #404040}
.asig-row-error{background:#2a0a0a !important}
.asig-stat{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;display:inline-block;margin:0 6px 6px 0}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 0}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.tag-rol{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;background:var(--card2);color:var(--text);text-transform:uppercase;letter-spacing:.05em}

/* IMPERSONATE BAR */
.imp-bar{position:fixed;bottom:20px;right:20px;background:#7c3aed;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(124,58,237,.45);font-size:13px;display:flex;align-items:center;gap:12px;z-index:50;max-width:90vw}
.imp-bar button{background:#fff;color:#7c3aed;border:none}
.imp-bar button:hover{background:#f0f0f0}

/* TOPBAR MÓVIL */
.mob-topbar{display:none;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;gap:10px}
.mob-topbar .hb{background:var(--card);border:1px solid var(--border);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:18px;padding:0}
.mob-topbar .mob-logo{font-weight:700;color:var(--primary);font-size:16px}
.mob-topbar .mob-role{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mob-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.mob-backdrop.open{display:block}

/* ACTION MENU (botón ⋯ Más) */
.actions-menu-wrap{position:relative;display:inline-block}
.actions-toggle{background:var(--card2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;padding:0;display:none;align-items:center;justify-content:center}
.actions-pop{position:absolute;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:30;display:none}
.actions-pop.open{display:block}
.actions-pop button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.actions-pop button:hover{background:var(--card2)}
.actions-inline{display:flex;gap:6px;flex-wrap:wrap}
/* RESPONSIVE */
@media(max-width:768px){
  .mob-topbar{display:flex}
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:78%;max-width:300px;z-index:50;transform:translateX(-100%);transition:transform .25s ease;display:flex !important;box-shadow:8px 0 30px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:14px}
  .page-title{font-size:18px}
  .page-sub{font-size:12px;margin-bottom:12px}
  .cards-row.c6,.cards-row.c4,.cards-row.c3,.cards-row.c2{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px}
  .form-grid.g4,.form-grid.g3,.form-grid.g2{grid-template-columns:1fr;gap:10px}
  .modal-box{max-width:100%;padding:18px}
  .imp-bar{bottom:14px;right:14px;left:14px;max-width:none;font-size:12px;padding:10px 12px;justify-content:space-between}
  /* TABLAS → CARDS */
  .table-wrap{overflow:visible}
  .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap tr,.table-wrap td,.table-wrap th{display:block;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tr{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .table-wrap td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:none;text-align:right;font-size:13px}
  .table-wrap td::before{content:attr(data-label);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;font-weight:600;flex-shrink:0;align-self:center}
  .table-wrap td:empty,.table-wrap td:not([data-label]){display:none}
  .table-wrap td[data-action]{display:block;text-align:left;padding-top:10px;border-top:1px solid var(--border);margin-top:6px}
  .table-wrap td[data-action]::before{display:none}
  .actions-toggle{display:flex}
  .actions-inline{display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-box">
    <div class="login-logo">Nexo</div>
    <div class="login-sub">COD Operations — Altusierra</div>
    <div class="field">
      <label>Usuario o correo</label>
      <input type="text" id="l-user" placeholder="usuario o tu@correo.com" autocomplete="username" autocapitalize="off" autocorrect="off" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="l-pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" id="l-btn" onclick="login()">Ingresar</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<!-- TOPBAR MÓVIL -->
<div class="mob-topbar">
  <button class="hb" onclick="toggleSidebar()" aria-label="Menú">☰</button>
  <div class="mob-logo">Nexo</div>
  <div class="mob-role" id="mob-role">—</div>
</div>
<div class="mob-backdrop" id="mob-backdrop" onclick="toggleSidebar(false)"></div>
<div class="shell">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sb-logo">Nexo <span>COD Operations</span></div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-user">
      <div class="sb-user-name" id="sb-name">—</div>
      <div class="sb-user-role" id="sb-role">—</div>
      <div class="sb-logout" onclick="logout()">Cerrar sesión</div>
    </div>
  </nav>
  <!-- CONTENT -->
  <main class="content" id="content">
    <div class="loading">Cargando...</div>
  </main>
</div>
</div>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2'

const SURL='https://adpfxwnsnltpcgudbkhc.supabase.co'
const SKEY='sb_publishable_Qq0ZdsQokOiJqAAOoOTSmg_TdLkKDFm'
const sb=createClient(SURL,SKEY)

let me=null,productos=[],impersonating=null
const currentRol=()=>impersonating?.rol||me?.rol
const currentMe=()=>impersonating||me

// ── AUTH ──────────────────────────────────────────────────
window.login=async()=>{
  const input=document.getElementById('l-user').value.trim()
  const pwd=document.getElementById('l-pwd').value
  const btn=document.getElementById('l-btn')
  const err=document.getElementById('l-err')
  err.textContent=''
  if(!input||!pwd){err.textContent='Completa los campos';return}
  btn.disabled=true;btn.textContent='Ingresando...'
  const reset=()=>{btn.disabled=false;btn.textContent='Ingresar'}

  let email=input
  if(!input.includes('@')){
    try{
      const{data,error}=await sb.rpc('get_email_by_username',{p_username:input})
      if(error||!data){err.textContent='Credenciales inválidas';reset();return}
      email=data
    }catch(e){err.textContent='Credenciales inválidas';reset();return}
  }
  const{error}=await sb.auth.signInWithPassword({email,password:pwd})
  if(error){err.textContent='Credenciales inválidas';reset();return}
  // Login exitoso — cargar app directamente sin depender de onAuthStateChange
  const ok=await loadMe()
  if(!ok){err.textContent='Error cargando perfil';await sb.auth.signOut().catch(()=>{});reset();return}
  await loadProductos()
  reset()
  logAction('login',{metodo:input.includes('@')?'email':'username'}).catch(()=>{})
  showApp()
}

window.logout=async()=>{await logAction('logout',{}).catch(()=>{});await sb.auth.signOut()}

async function loadMe(uid){
  try{
    const{data,error}=await sb.rpc('get_my_profile')
    if(error){console.error('loadMe error:',error);return false}
    if(!data){console.warn('loadMe: sin perfil');return false}
    const{data:bData}=await sb.from('usuarios').select('bloqueado,rol,hora_inicio,hora_fin,modo_historico').eq('id',data.id).maybeSingle()
    if(bData?.bloqueado){console.warn('Usuario bloqueado');return false}
    if(!dentroDeHorario(bData?.rol,bData?.hora_inicio,bData?.hora_fin)){console.warn('Fuera de horario');return false}
    me=data
    me.modo_historico=bData?.modo_historico||false
    return true
  }catch(e){console.error('loadMe exception:',e);return false}
}

async function loadProductos(){
  try{
    const{data,error}=await sb.from('productos').select('*').eq('activo',true)
    if(error)console.error('loadProductos error:',error)
    productos=data||[]
  }catch(e){console.error('loadProductos exception:',e);productos=[]}
}

sb.auth.onAuthStateChange((ev,sess)=>{
  if(!sess){
    me=null
    document.getElementById('login-wrap').style.display='flex'
    document.getElementById('app').style.display='none'
  }
})

// ── SHELL ─────────────────────────────────────────────────
function showApp(){
  document.getElementById('login-wrap').style.display='none'
  document.getElementById('app').style.display='block'
  document.getElementById('sb-name').textContent=me?.nombre||'—'
  document.getElementById('sb-role').textContent=currentRol()||'—'
  syncMobRole()
  renderNav()
  const rol=currentRol()
  const defaultPage=rol==='admin'?'admin-home':(rol==='auxiliar'?'aux-asignador':(rol==='trafficker'?'traff-portafolio':'admin-home'))
  navigate(defaultPage)
  renderImpersonateBar()
}

function syncMobRole(){
  const el=document.getElementById('mob-role')
  if(el)el.textContent=currentRol()||'—'
}

window.toggleSidebar=(force)=>{
  const sb=document.getElementById('sidebar')
  const bd=document.getElementById('mob-backdrop')
  if(!sb||!bd)return
  const willOpen=typeof force==='boolean'?force:!sb.classList.contains('open')
  sb.classList.toggle('open',willOpen)
  bd.classList.toggle('open',willOpen)
}

window.toggleActionsMenu=(btn)=>{
  const pop=btn.nextElementSibling
  if(!pop)return
  // Cerrar otros menús abiertos primero
  document.querySelectorAll('.actions-pop.open').forEach(el=>{if(el!==pop)el.classList.remove('open')})
  pop.classList.toggle('open')
}

// Cerrar action menus al hacer click fuera
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.actions-menu-wrap')){
    document.querySelectorAll('.actions-pop.open').forEach(el=>el.classList.remove('open'))
  }
})

const NAV={
  admin:[
    {id:'admin-home',icon:'📊',label:'Dashboard'},
    {id:'admin-reportes',icon:'📋',label:'Reportes'},
    {id:'admin-resumen',icon:'📈',label:'Resumen Semanal'},
    {id:'admin-gasto',icon:'💰',label:'Tracker'},
    {id:'admin-meta',icon:'📡',label:'Meta Ads'},
    {id:'admin-ia',icon:'🤖',label:'Historial IA'},
    {id:'admin-productos',icon:'📦',label:'Productos'},
    {id:'admin-gastos-fijos',icon:'📌',label:'Gastos Fijos'},
    {id:'admin-usuarios',icon:'👥',label:'Equipo'},

const fmt=n=>new Intl.NumberFormat('es-CO').format(Math.round(n||0))
const today=()=>new Date().toISOString().split('T')[0]
const _normProd=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()
// Resuelve un texto crudo (de Dropi/SellerChat) al producto canónico mediante aliases + nombre
// Devuelve {id, nombre} si encuentra, o {id:null, nombre:raw_original} si no encuentra
function resolveProdName(raw){
  const norm=_normProd(raw)
  if(!norm)return{id:null,nombre:raw||'Sin producto'}
  if(!Array.isArray(productos))return{id:null,nombre:raw}
  for(const p of productos){
    // Match por nombre canónico
    if(_normProd(p.nombre)===norm)return{id:p.id,nombre:p.nombre}
    // Match por alias
    if(Array.isArray(p.aliases)){
      for(const a of p.aliases){
        if(_normProd(a)===norm)return{id:p.id,nombre:p.nombre}
      }
    }
    // Match por keywords legacy
    if(p.keywords){
      const kws=p.keywords.split(',').map(k=>_normProd(k))
      if(kws.includes(norm))return{id:p.id,nombre:p.nombre}
    }
  }
  return{id:null,nombre:raw}
}
window.resolveProdName=resolveProdName
const _isoDate=(d)=>d.toISOString().split('T')[0]
const _daysAgo=(n)=>{const d=new Date();d.setDate(d.getDate()-n);return _isoDate(d)}
function _quickDateBtns(desdeId,hastaId,onchangeFn){
  const sets=[
    ['Hoy',0,0],['Ayer',1,1],['Hoy+Ayer',1,0],['7d',6,0],['14d',13,0],['30d',29,0],
    ['Este mes','cm',0],['Mes pasado','lm','lm']
  ]
  return sets.map(([label,desde,hasta])=>{
    let d,h
    if(desde==='cm'){const n=new Date();d=_isoDate(new Date(n.getFullYear(),n.getMonth(),1));h=today()}
    else if(desde==='lm'){const n=new Date();d=_isoDate(new Date(n.getFullYear(),n.getMonth()-1,1));h=_isoDate(new Date(n.getFullYear(),n.getMonth(),0))}
    else{d=_daysAgo(desde);h=_daysAgo(hasta)}
    return`<button class="btn-sm btn-outline" onclick="document.getElementById('${desdeId}').value='${d}';document.getElementById('${hastaId}').value='${h}';${onchangeFn}">${label}</button>`
  }).join('')
}
function dentroDeHorario(rol,hora_inicio,hora_fin){
  if(rol==='admin')return true
  if(!hora_inicio||!hora_fin)return true
  const d=new Date()
  const ahora=d.getHours()*60+d.getMinutes()
  const [hi,mi]=hora_inicio.split(':').map(Number)
  const [hf,mf]=hora_fin.split(':').map(Number)
  const inicio=hi*60+mi,fin=hf*60+mf
  return inicio<=fin
    ?(ahora>=inicio&&ahora<=fin)
    :(ahora>=inicio||ahora<=fin)
}

async function callEdge(action,payload){
  try{
    const{data,error}=await sb.functions.invoke('manage-user',{body:{action,payload}})
    if(error){

      let realMsg=error.message
      try{const body=await error.context?.json?.();if(body?.error)realMsg=body.error}catch(_){}
      return{ok:false,error:realMsg}
    }
    if(data?.error)return{ok:false,error:data.error}
    return{ok:true,data}
  }catch(e){return{ok:false,error:e.message||'Error desconocido'}}
}

async function loadDash(){
  const el=document.getElementById('dash-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando métricas...</div>'
  const desde=document.getElementById('dash-desde')?.value||_daysAgo(7)
  const hasta=document.getElementById('dash-hasta')?.value||today()
  const hoy=today()

  // 1. Gasto real desde Meta Insights
  const{data:insData}=await sb.from('meta_insights').select('fecha,spend').eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta)
  const gastoByFecha={}
  let gastoTotal=0
  for(const i of (insData||[])){gastoByFecha[i.fecha]=(gastoByFecha[i.fecha]||0)+(i.spend||0);gastoTotal+=i.spend||0}

  // 2. Órdenes desde mapeos (asignador + Dropi)
  const{data:mapeos}=await sb.from('mapeos').select('cantidad,producto,estado_final,fecha,ad_id').gte('fecha',desde).lte('fecha',hasta).limit(10000)
  let tot1=0,tot2=0,tot3=0,tot4=0,conf=0,canc=0,pend=0,conAd=0
  let cConf1=0,cConf2=0,cConf3=0,cConf4=0
  const prodStats={}
  const prodStatsConf={}
  for(const m of (mapeos||[])){
    const q=m.cantidad||2
    if(q===1)tot1++;else if(q===2)tot2++;else if(q===3)tot3++;else tot4++
    if(m.ad_id)conAd++
    let esConf=false
    if(m.estado_final==='CANCELADO')canc++
    else if(m.estado_final==='PENDIENTE CONFIRMACION'||!m.estado_final)pend++
    else{conf++;esConf=true}
    const pn=resolveProdName(m.producto).nombre||'Sin producto'
    if(!prodStats[pn])prodStats[pn]={o1:0,o2:0,o3:0,o4:0}
    if(q===1)prodStats[pn].o1++;else if(q===2)prodStats[pn].o2++;else if(q===3)prodStats[pn].o3++;else prodStats[pn].o4++
    if(esConf){
      if(!prodStatsConf[pn])prodStatsConf[pn]={o1:0,o2:0,o3:0,o4:0}
      if(q===1){prodStatsConf[pn].o1++;cConf1++}else if(q===2){prodStatsConf[pn].o2++;cConf2++}else if(q===3){prodStatsConf[pn].o3++;cConf3++}else{prodStatsConf[pn].o4++;cConf4++}
    }
  }
  const totalOrds=tot1+tot2+tot3+tot4
  const totalOrdsConf=cConf1+cConf2+cConf3+cConf4

  // 3. Venta por oferta cruzada con precios de producto (solo confirmados)
  let ventaTotal=0,costoProvTotal=0
  for(const[pn,st]of Object.entries(prodStatsConf)){
    const prod=productos.find(p=>p.nombre===pn)||productos[0]||{}
    ventaTotal+=(st.o1*(prod.precio_1u||0))+(st.o2*(prod.precio_2u||0))+(st.o3*(prod.precio_3u||0))+(st.o4*(prod.precio_4u||0))
    costoProvTotal+=(st.o1*(prod.costo_1u||0))+(st.o2*(prod.costo_2u||0))+(st.o3*(prod.costo_3u||0))+(st.o4*(prod.costo_4u||0))
  }

  // 4. Conversaciones desde reportes_diarios
  const{data:reps}=await sb.from('reportes_diarios').select('conversaciones,fecha,producto_nombre,updated_at').gte('fecha',desde).lte('fecha',hasta).order('updated_at',{ascending:false})
  let conv=0
  const _convSeen={}
  for(const r of (reps||[])){
    const resolved=resolveProdName(r.producto_nombre).nombre||(r.producto_nombre||'')
    const k=(r.fecha||'')+'|'+_normProd(resolved)
    if(_convSeen[k])continue
    _convSeen[k]=true
    conv+=r.conversaciones||0
  }

  // 5. Gastos fijos
  const{data:gfData}=await sb.from('gastos_fijos').select('monto')
  const gastoFijoMensual=(gfData||[]).reduce((s,g)=>s+(g.monto||0),0)
  const dias=Math.max(1,Math.round((new Date(hasta)-new Date(desde))/86400000)+1)
  const gastoFijoPeriodo=Math.round(gastoFijoMensual/30*dias)

  // 6. Cálculos estilo tracker
  const prod0=productos[0]||{}
  const devPct=prod0.dev_pct||0.19
  const costoFlete=totalOrdsConf*(prod0.flete_outbound||21000)
  const costoDevolucion=Math.round(totalOrdsConf*devPct*(prod0.flete_devolucion||18000))
  const costoConv=conv*(prod0.costo_conversacion||100)
  const ventaEfectiva=Math.round(ventaTotal*(1-devPct))
  const ganNeta=ventaEfectiva-costoProvTotal-costoFlete-costoDevolucion-gastoTotal-costoConv-gastoFijoPeriodo
  const roas_bruto=gastoTotal>0?ventaTotal/gastoTotal:0
  const roas_neto=gastoTotal>0?(ganNeta+gastoTotal)/gastoTotal:0
  const cpa=totalOrdsConf>0?gastoTotal/totalOrdsConf:0
  const cpr=totalOrdsConf>0?gastoTotal/totalOrdsConf:0
  const tasaCierre=conv>0?totalOrdsConf/conv:0

  // Break-even
  const p2=prod0.precio_2u||129900,c2=prod0.costo_2u||36000
  const fo=prod0.flete_outbound||21000,fd=prod0.flete_devolucion||18000
  const dp=prod0.dev_pct||0.19
  const margenBE=p2*(1-dp)-c2-fo-(fd*dp)
  const be_roas=margenBE>0?p2/margenBE:0

  // Semáforo — basado en CPA si solo hay hoy, ROAS si hay data completa
  const tieneOferta=totalOrds>0&&ventaTotal>0
  let semHtml=''
  if(gastoTotal===0){
    semHtml=`<div class="semaforo" style="background:var(--card2);border-color:var(--border)"><div class="sem-dot" style="background:var(--subtle)"></div><div><div class="sem-title" style="color:var(--muted)">Sin gasto en ads en este rango</div><div class="sem-msg" style="color:var(--subtle)">Sincroniza Meta Ads para ver el semáforo</div></div></div>`
  } else if(tieneOferta){
    let cls,title,msg
    if(roas_bruto<be_roas){cls='sem-rojo';title='STOP — Debajo del break-even';msg=`ROAS ${roas_bruto.toFixed(2)}x vs mínimo ${be_roas.toFixed(2)}x`}
    else if(roas_bruto<be_roas*1.4){cls='sem-amarillo';title='Precaución — Poco colchón';msg=`ROAS ${roas_bruto.toFixed(2)}x. Rentable pero ajustado.`}
    else if(roas_bruto<be_roas*2.2){cls='sem-verde';title='Verde — Escalar con confianza';msg=`ROAS ${roas_bruto.toFixed(2)}x. Aumentar 20-30%.`}
    else{cls='sem-fuego';title='🟣 Fuego — Escalar agresivo';msg=`ROAS ${roas_bruto.toFixed(2)}x. Muy por encima del BE.`}
    semHtml=`<div class="semaforo ${cls}"><div class="sem-dot"></div><div><div class="sem-title">${title}</div><div class="sem-msg">${msg}</div></div></div>`
  } else if(totalOrds>0){
    const cpaSem=cpa<=margenBE?'sem-verde':cpa<=margenBE*1.3?'sem-amarillo':'sem-rojo'
    const cpaTit=cpa<=margenBE?'CPA dentro del límite':'CPA por encima del break-even'
    semHtml=`<div class="semaforo ${cpaSem}"><div class="sem-dot"></div><div><div class="sem-title">${cpaTit}</div><div class="sem-msg">CPA: $${fmt(cpa)} vs límite: $${fmt(margenBE)} · ROAS pendiente (sin oferta aún)</div></div></div>`
  }

  el.innerHTML=`
    ${semHtml}
    <div class="cards-row c4">
      <div class="card c-blue"><div class="card-label">Órdenes</div><div class="card-val">${totalOrds}</div>
        <div class="card-sub">1u:${tot1} · 2u:${tot2} · 3u:${tot3} · 4u:${tot4}</div></div>
      <div class="card c-green"><div class="card-label">Confirmados</div><div class="card-val">${conf}</div>
        <div class="card-sub">${totalOrds>0?Math.round(conf/totalOrds*100):0}% del total</div></div>
      <div class="card c-red"><div class="card-label">Cancelados</div><div class="card-val">${canc}</div></div>
      <div class="card c-amber"><div class="card-label">Pendientes</div><div class="card-val">${pend}</div></div>
    </div>
    <div class="cards-row c4">
      <div class="card c-purple"><div class="card-label">Conversaciones</div><div class="card-val">${conv}</div>
        <div class="card-sub">Tasa cierre: ${(tasaCierre*100).toFixed(1)}%</div></div>
      <div class="card"><div class="card-label">Gasto Ads (Meta)</div><div class="card-val">$${fmt(gastoTotal)}</div></div>
      <div class="card"><div class="card-label">CPA</div><div class="card-val ${cpa>0&&cpa<=margenBE?'c-green':'c-red'}">$${fmt(cpa)}</div>
        <div class="card-sub">Límite: $${fmt(margenBE)}</div></div>
      <div class="card ${roas_bruto>=be_roas?'c-green':'c-red'}"><div class="card-label">ROAS Bruto</div>
        <div class="card-val">${tieneOferta?roas_bruto.toFixed(2)+'x':'—'}</div>
        <div class="card-sub">BE: ${be_roas.toFixed(2)}x${!tieneOferta?' · Pendiente oferta':''}</div></div>
    </div>
    <div class="cards-row c4">
      <div class="card"><div class="card-label">Venta</div><div class="card-val">${tieneOferta?'$'+fmt(ventaTotal):'—'}</div></div>
      <div class="card ${roas_neto>=1?'c-green':'c-red'}"><div class="card-label">ROAS Neto</div>
        <div class="card-val">${tieneOferta?roas_neto.toFixed(2)+'x':'—'}</div>
        <div class="card-sub">BE neto: 1.00x</div></div>
      <div class="card ${ganNeta>=0?'c-green':'c-red'}"><div class="card-label">Ganancia Neta</div>
        <div class="card-val">${tieneOferta?'$'+fmt(ganNeta):'—'}</div>
        <div class="card-sub">${tieneOferta?`Margen: ${(ganNeta/ventaTotal*100).toFixed(1)}%`:''}</div></div>
      <div class="card"><div class="card-label">Gastos Fijos</div>
        <div class="card-val">$${fmt(gastoFijoPeriodo)}</div>
        <div class="card-sub">${dias}d · Mensual: $${fmt(gastoFijoMensual)}</div></div>
    </div>
    ${tieneOferta?`<div class="cards-row c3">
      <div class="card"><div class="card-label">Costo Producto</div><div class="card-val">$${fmt(costoProvTotal)}</div></div>
      <div class="card"><div class="card-label">Flete + Dev</div><div class="card-val">$${fmt(costoFlete+costoDevolucion)}</div></div>
      <div class="card"><div class="card-label">Costo Conv.</div><div class="card-val">$${fmt(costoConv)}</div>
        <div class="card-sub">${conv} conv × $${fmt(prod0.costo_conversacion||100)}</div></div>
    </div>`:''}`
}

      else if(m.estado_final==='PENDIENTE CONFIRMACION'||!m.estado_final)byFecha[f].pend++
      else byFecha[f].conf++
      if(m.ad_id)byFecha[f].conAd++
    }
    for(const i of (insData||[])){if(!byFecha[i.fecha])byFecha[i.fecha]={o1:0,o2:0,o3:0,o4:0,conf:0,canc:0,pend:0,conv:0,gasto:0,conAd:0};byFecha[i.fecha].gasto+=(i.spend||0)}
    for(const r of (reps||[])){if(byFecha[r.fecha])byFecha[r.fecha].conv+=(r.conversaciones||0)}

    const fechas=Object.keys(byFecha).sort().reverse()
    if(!fechas.length){el.innerHTML='<div class="alert alert-blue">Sin datos para este rango</div>';return}

    const prod0=productos[0]||{}
    const margenBE=(prod0.precio_2u||129900)*(1-(prod0.dev_pct||0.19))-(prod0.costo_2u||36000)-(prod0.flete_outbound||21000)-((prod0.flete_devolucion||18000)*(prod0.dev_pct||0.19))

    el.innerHTML=`<div class="table-wrap"><table>
      <tr><th>Fecha</th><th>1u</th><th>2u</th><th>3u</th><th>4u</th><th>Total</th><th>Conf.</th><th>Canc.</th><th>Pend.</th><th>Conv.</th><th>Gasto</th><th>CPA</th><th>ROAS</th></tr>
      ${fechas.map(f=>{
        const d=byFecha[f],tot=d.o1+d.o2+d.o3+d.o4
        const venta=(d.o1*(prod0.precio_1u||0))+(d.o2*(prod0.precio_2u||0))+(d.o3*(prod0.precio_3u||0))+(d.o4*(prod0.precio_4u||0))
        const cpa=tot>0?d.gasto/tot:0
        const roas=d.gasto>0?venta/d.gasto:0
        const tieneOferta=venta>0
        const cpaCls=cpa>0&&cpa<=margenBE?'color:var(--green)':cpa>0?'color:var(--red)':''
        return`<tr>
          <td data-label="Fecha" style="font-family:monospace;font-size:12px">${f}</td>
          <td data-label="1u">${d.o1}</td><td data-label="2u">${d.o2}</td><td data-label="3u">${d.o3}</td><td data-label="4u">${d.o4}</td>
          <td data-label="Total"><strong>${tot}</strong></td>
          <td data-label="Conf." style="color:var(--green)">${d.conf}</td>
          <td data-label="Canc."${d.canc?` style="color:var(--red)"`:``}>${d.canc}</td>
          <td data-label="Pend."${d.pend?` style="color:var(--amber)"`:``}>${d.pend}</td>
          <td data-label="Conv.">${d.conv||'—'}</td>
          <td data-label="Gasto">${d.gasto?'$'+fmt(d.gasto):'—'}</td>
          <td data-label="CPA" style="${cpaCls}">${cpa>0?'$'+fmt(cpa):'—'}</td>
          <td data-label="ROAS" style="${tieneOferta&&roas>0?(roas>=(prod0.precio_2u||129900)/margenBE?'color:var(--green)':'color:var(--red)'):''}">${tieneOferta&&roas>0?roas.toFixed(2)+'x':'—'}</td>
        </tr>`
      }).join('')}
    </table></div>`
  }
  loadReportesAdmin()
}

function _getMonday(d){const dt=new Date(d);const day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);dt.setHours(0,0,0,0);return dt}
function _weekKey(mon){const sun=new Date(mon);sun.setDate(sun.getDate()+6);return`${String(mon.getDate()).padStart(2,'0')}/${String(mon.getMonth()+1).padStart(2,'0')}/${mon.getFullYear()} – ${String(sun.getDate()).padStart(2,'0')}/${String(sun.getMonth()+1).padStart(2,'0')}/${sun.getFullYear()}`}
function _weekMonday(dateStr){return _getMonday(new Date(dateStr+'T12:00:00'))}
function _generateAllWeeks(desde,hasta){
  const weeks=[]
  let mon=_getMonday(new Date(desde+'T12:00:00'))
  const end=new Date(hasta+'T12:00:00')
  while(mon<=end){weeks.push({key:_weekKey(mon),mon:new Date(mon)});mon.setDate(mon.getDate()+7)}
  return weeks
}

async function cargarResumenSemanal(){
  const el=document.getElementById('rs-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  const filtroProd=document.getElementById('rs-prod')?.value||''
  const desde=document.getElementById('rs-desde')?.value||'2024-01-01'
  const hasta=document.getElementById('rs-hasta')?.value||today()

  // Traer mapeos con estado_final
  let query=sb.from('mapeos').select('*').not('estado_final','is',null).gte('fecha',desde).lte('fecha',hasta)
  if(filtroProd)query=query.eq('producto',filtroProd)
  const{data:mapeos}=await query.limit(10000)

  // Gasto desde meta_insights (por semana)
  const{data:insData}=await sb.from('meta_insights').select('fecha,spend').eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta)
  const gastoByWeek={}
  for(const i of (insData||[])){const wk=_weekKey(_weekMonday(i.fecha));gastoByWeek[wk]=(gastoByWeek[wk]||0)+(i.spend||0)}

  // Conversaciones desde reportes_diarios (por semana, dedupe por fecha+producto, último gana)
  const{data:reportesConv}=await sb.from('reportes_diarios').select('fecha,conversaciones,producto_nombre,updated_at').gte('fecha',desde).lte('fecha',hasta).order('updated_at',{ascending:false})
  const convByWeek={}
  const _convSemSeen={}
  for(const r of (reportesConv||[])){
    const resolved=resolveProdName(r.producto_nombre).nombre||(r.producto_nombre||'')
    const k=(r.fecha||'')+'|'+_normProd(resolved)
    if(_convSemSeen[k])continue
    _convSemSeen[k]=true
    const wk=_weekKey(_weekMonday(r.fecha))
    convByWeek[wk]=(convByWeek[wk]||0)+(r.conversaciones||0)
  }

  // Gastos fijos (mensual total → prorrateo /30 × 7 por semana)
  const{data:gfData}=await sb.from('gastos_fijos').select('monto')
  const gastoFijoMensual=(gfData||[]).reduce((s,g)=>s+(g.monto||0),0)
  const fijosSemana=Math.round(gastoFijoMensual/30*7)

  // Lookup de producto por nombre normalizado + aliases
  const prodByKey={}
  for(const p of productos){
    prodByKey[_normProd(p.nombre)]=p
    if(Array.isArray(p.aliases))for(const a of p.aliases)prodByKey[_normProd(a)]=p
  }
  const ccDefault=(productos[0]?.costo_conversacion)||100

  // Agrupar mapeos por semana + acumular ventas/costos por estado
  const semanas={}
  for(const m of (mapeos||[])){
    const w=_weekKey(_weekMonday(m.fecha||m.fecha_dropi))
    if(!semanas[w])semanas[w]={env:0,ent:0,dev:0,canc:0,pend:0,trans:0,total:0,ventaTot:0,costoTot:0,ventaEnt:0,costoEnt:0,fleteOutTot:0,fleteDevTeorico:0,fleteDevReal:0,ventaEfTeorica:0,costoEfTeorico:0}
    semanas[w].total++;semanas[w].env++
    const st=DROPI_STATUS[m.estado_final]?.cat||'otro'
    if(st==='entregado'||st==='novedad_ok')semanas[w].ent++
    else if(st==='devuelto')semanas[w].dev++
    else if(st==='cancelado')semanas[w].canc++
    else if(st==='pendiente')semanas[w].pend++
    else semanas[w].trans++

    // Cálculos económicos por mapeo
    const pk=_normProd(m.producto)
    const prod=prodByKey[pk]||productos[0]||{}
    const q=m.cantidad||2
    const precio=[0,prod.precio_1u||0,prod.precio_2u||0,prod.precio_3u||0,prod.precio_4u||0][q]||(prod.precio_2u||0)
    const costo=[0,prod.costo_1u||0,prod.costo_2u||0,prod.costo_3u||0,prod.costo_4u||0][q]||(prod.costo_2u||0)
    const fo=prod.flete_outbound||21000
    const fd=prod.flete_devolucion||18000
    const dp=prod.dev_pct||0.19

    // Estimada (teórica): aplica % devolución del producto
    semanas[w].ventaTot+=precio
    semanas[w].costoTot+=costo
    semanas[w].ventaEfTeorica+=precio*(1-dp)
    semanas[w].costoEfTeorico+=costo*(1-dp)
    semanas[w].fleteDevTeorico+=fd*dp
    // Flete outbound: solo si físicamente se envió (no canceladas)
    if(st!=='cancelado'){
      semanas[w].fleteOutTot+=fo
    }
    // Real: solo cuenta venta/costo de las entregadas
    if(st==='entregado'||st==='novedad_ok'){
      semanas[w].ventaEnt+=precio
      semanas[w].costoEnt+=costo
    }
    // Flete devolución real: solo de las devueltas
    if(st==='devuelto'){
      semanas[w].fleteDevReal+=fd
    }
  }

  // Generar todas las semanas en el rango
  const allWeeks=_generateAllWeeks(desde,hasta).reverse()
  if(!allWeeks.length){el.innerHTML='<div class="alert alert-blue">Sin semanas en este rango</div>';return}

  // Calcular ganancias por semana
  const ganByWeek={}
  for(const w of allWeeks){
    const d=semanas[w.key]||{}
    const gasto=gastoByWeek[w.key]||0
    const conv=convByWeek[w.key]||0
    const costoConv=conv*ccDefault
    // Estimada
    const ganEst=Math.round((d.ventaEfTeorica||0)-(d.costoEfTeorico||0)-(d.fleteOutTot||0)-(d.fleteDevTeorico||0)-gasto-costoConv-fijosSemana)
    // Real
    const ganReal=Math.round((d.ventaEnt||0)-(d.costoEnt||0)-(d.fleteOutTot||0)-(d.fleteDevReal||0)-gasto-costoConv-fijosSemana)
    ganByWeek[w.key]={ganEst,ganReal}
  }

  // Export data
  window._resumenData=allWeeks.map(w=>{
    const d=semanas[w.key]||{}
    const g=ganByWeek[w.key]||{ganEst:0,ganReal:0}
    return{
      semana:w.key,
      enviadas:d.env||0,
      entregadas:d.ent||0,
      devueltas:d.dev||0,
      canceladas:d.canc||0,
      en_transito:d.trans||0,
      pct_entrega:d.total>0?Math.round((d.ent||0)/d.total*100):0,
      pct_devolucion:d.total>0?Math.round((d.dev||0)/d.total*100):0,
      gasto_ads:gastoByWeek[w.key]||0,
      conversaciones:convByWeek[w.key]||0,
      ganancia_estimada:g.ganEst,
      ganancia_real:g.ganReal
    }
  })

  el.innerHTML=`
    <div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn-sm btn-blue" onclick="exportarResumen()">📥 Exportar a Excel</button>
      <span style="font-size:11px;color:var(--muted)">Gastos fijos prorrateados: $${fmt(fijosSemana)}/semana ($${fmt(gastoFijoMensual)}/mes ÷ 30 × 7)</span>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Semana (Lun-Dom)</th><th>Enviadas</th><th>Entregadas</th><th>Devueltas</th><th>% Ent.</th><th>% Dev.</th><th>Canceladas</th><th>En tránsito</th><th>Gasto Ads</th><th>Gan. Estimada</th><th>Gan. Real</th></tr>
      ${allWeeks.map(w=>{
        const d=semanas[w.key]||{env:0,ent:0,dev:0,canc:0,trans:0,total:0}
        const gasto=gastoByWeek[w.key]||0
        const g=ganByWeek[w.key]||{ganEst:0,ganReal:0}
        const pctEnt=d.total>0?Math.round(d.ent/d.total*100):0
        const pctDev=d.total>0?Math.round(d.dev/d.total*100):0
        const devColor=pctDev>20?'color:var(--red)':pctDev>15?'color:var(--amber)':d.total>0?'color:var(--green)':'color:var(--muted)'
        const isEmpty=d.total===0
        const rowStyle=isEmpty?'opacity:0.4':''
        const ganEstColor=g.ganEst>0?'color:var(--green)':g.ganEst<0?'color:var(--red)':'color:var(--muted)'
        const ganRealColor=g.ganReal>0?'color:var(--green)':g.ganReal<0?'color:var(--red)':'color:var(--muted)'
        return`<tr style="${rowStyle}">
          <td data-label="Semana" style="font-family:monospace;font-size:12px;white-space:nowrap">${w.key}</td>
          <td data-label="Enviadas"><strong>${d.env||0}</strong></td>
          <td data-label="Entregadas">${d.ent||0}</td>
          <td data-label="Devueltas">${d.dev||0}</td>
          <td data-label="% Ent." style="color:var(--green)">${d.total>0?pctEnt+'%':'—'}</td>
          <td data-label="% Dev." style="${devColor}"><strong>${d.total>0?pctDev+'%':'—'}</strong></td>
          <td data-label="Canceladas">${d.canc||0}</td>
          <td data-label="En tránsito">${d.trans||0}</td>
          <td data-label="Gasto">${gasto?'$'+fmt(gasto):'—'}</td>
          <td data-label="Gan. Estimada" style="${ganEstColor};font-weight:600">${isEmpty?'—':'$'+fmt(g.ganEst)}</td>
          <td data-label="Gan. Real" style="${ganRealColor};font-weight:600">${isEmpty?'—':'$'+fmt(g.ganReal)}</td>
        </tr>`
      }).join('')}
    </table></div>`
}
window.cargarResumenSemanal=cargarResumenSemanal

  const data=window._resumenData

  const ws=XLSX.utils.json_to_sheet(data)
  const wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,'Resumen Semanal')

}

async function loadTracker(){
  const el=document.getElementById('trk-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  const desde=document.getElementById('trk-desde')?.value||_daysAgo(14)
  const hasta=document.getElementById('trk-hasta')?.value||today()
  const hoy=today()

  try{
    // 1. Cuentas (saber cuáles excluir del global)
    const{data:cuentas}=await sb.from('meta_cuentas').select('account_id,nombre,excluir_global')
    const cuentasExcluidas=new Set((cuentas||[]).filter(c=>c.excluir_global).map(c=>c.account_id))

    // 2. Mapa producto → campaign_ids
    const cidsToProd={}
    const prodCids={}
    for(const p of productos){
      const cids=Array.isArray(p.campaign_ids)?p.campaign_ids:[]
      prodCids[p.id]=cids
      for(const cid of cids)cidsToProd[cid]=p.id
    }

    // 3. Insights del rango (todas cuentas, todas campañas)
    let allIns=[],from=0
    while(true){
      const{data:chunk}=await sb.from('meta_insights').select('account_id,meta_id,fecha,spend').eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta).range(from,from+999)
      if(!chunk||!chunk.length)break
      allIns=allIns.concat(chunk)
      if(chunk.length<1000)break
      from+=1000
    }

    // 4. Mapeos del rango (cruzar con campañas vía ad_id → campaign)
    const{data:mapeos}=await sb.from('mapeos').select('fecha,cantidad,producto,estado_final,ad_id').gte('fecha',desde).lte('fecha',hasta).limit(20000)

    // 5. Conversaciones (reportes_diarios) — último gana por fecha+producto
    const{data:reps}=await sb.from('reportes_diarios').select('fecha,producto_id,conversaciones,updated_at').gte('fecha',desde).lte('fecha',hasta).order('updated_at',{ascending:false})

    // 6. Sin atribuir: campañas con gasto pero sin matchear ningún producto
    const gastoCampSinAtrib={}
    const nombreCamp={}
    const cuentaCamp={}
    let totalGastoGlobal=0,gastoSinAtrib=0
    for(const i of allIns){
      const spend=i.spend||0
      if(cuentasExcluidas.has(i.account_id))continue
      totalGastoGlobal+=spend
      if(!cidsToProd[i.meta_id]){
        gastoCampSinAtrib[i.meta_id]=(gastoCampSinAtrib[i.meta_id]||0)+spend
        gastoSinAtrib+=spend
      }
    }
    // Traer nombres de campañas sin atribuir
    const sinAtribIds=Object.keys(gastoCampSinAtrib).filter(k=>gastoCampSinAtrib[k]>0)
    if(sinAtribIds.length){
      for(let i=0;i<sinAtribIds.length;i+=80){
        const chunk=sinAtribIds.slice(i,i+80)
        const{data:cs}=await sb.from('meta_campanas').select('meta_id,nombre,account_id,estado').in('meta_id',chunk).eq('nivel','campaign')
        for(const c of (cs||[])){nombreCamp[c.meta_id]={n:c.nombre,e:c.estado};cuentaCamp[c.meta_id]=c.account_id}
      }
    }

    // 7. Gasto por producto (todas las campañas atribuidas)
    const gastoPorProd={}
    for(const i of allIns){
      if(cuentasExcluidas.has(i.account_id))continue
      const pid=cidsToProd[i.meta_id]
      if(!pid)continue
      if(!gastoPorProd[pid])gastoPorProd[pid]={}
      const f=i.fecha
      if(!gastoPorProd[pid][f])gastoPorProd[pid][f]={gasto:0}
      gastoPorProd[pid][f].gasto+=(i.spend||0)
    }

    // 8. Mapeos por producto + fecha + estado (matching por nombre normalizado + aliases)
    const prodByNorm={}
    for(const p of productos){
      prodByNorm[_normProd(p.nombre)]=p.id
      if(Array.isArray(p.aliases))for(const a of p.aliases)prodByNorm[_normProd(a)]=p.id
    }
    const dataPorProd={}
    for(const m of (mapeos||[])){
      const norm=_normProd(m.producto||'')
      const pid=prodByNorm[norm]||null
      if(!pid)continue
      if(!dataPorProd[pid])dataPorProd[pid]={}
      const f=m.fecha||'?'
      if(!dataPorProd[pid][f])dataPorProd[pid][f]={o1:0,o2:0,o3:0,o4:0,conf:0,canc:0,pend:0,ent:0,dev:0,conv:0}
      const d=dataPorProd[pid][f]
      const q=m.cantidad||2
      const cat=DROPI_STATUS[m.estado_final]?.cat||'otro'
      if(cat==='cancelado'){d.canc++;continue}
      if(cat==='pendiente'||!m.estado_final){d.pend++;continue}
      d.conf++
      if(q===1)d.o1++;else if(q===2)d.o2++;else if(q===3)d.o3++;else d.o4++
      if(cat==='entregado'||cat==='novedad_ok')d.ent++
      else if(cat==='devuelto')d.dev++
    }
    // Conversaciones por producto + fecha (último gana, dedupe por fecha+producto_id)
    const _convTrkSeen={}
    for(const r of (reps||[])){
      if(!r.producto_id)continue
      const k=(r.fecha||'')+'|'+r.producto_id
      if(_convTrkSeen[k])continue
      _convTrkSeen[k]=true
      if(!dataPorProd[r.producto_id])dataPorProd[r.producto_id]={}
      if(!dataPorProd[r.producto_id][r.fecha])dataPorProd[r.producto_id][r.fecha]={o1:0,o2:0,o3:0,o4:0,conf:0,canc:0,pend:0,ent:0,dev:0,conv:0}
      dataPorProd[r.producto_id][r.fecha].conv+=(r.conversaciones||0)
    }

    // 9. Acumulados por producto
    const accProd={} // pid → totales
    const fechasSet=new Set()
    for(const pid of Object.keys({...gastoPorProd,...dataPorProd})){
      const prod=productos.find(p=>p.id===pid)
      if(!prod)continue
      const dp=prod.dev_pct||0.19
      const cc=prod.costo_conversacion||100
      const fo=prod.flete_outbound||21000
      const fdN=prod.flete_devolucion||18000
      let aGasto=0,aConf=0,aCanc=0,aPend=0,aEnt=0,aDev=0,aConv=0,aVenta=0,aCosto=0,a1=0,a2=0,a3=0,a4=0
      // unión de fechas
      const fechas=new Set([...Object.keys(gastoPorProd[pid]||{}),...Object.keys(dataPorProd[pid]||{})])
      for(const f of fechas){
        if(f==='?')continue
        fechasSet.add(f)
        const dMap=(dataPorProd[pid]||{})[f]||{o1:0,o2:0,o3:0,o4:0,conf:0,canc:0,pend:0,ent:0,dev:0,conv:0}
        const dGas=(gastoPorProd[pid]||{})[f]||{gasto:0}
        aGasto+=dGas.gasto
        aConf+=dMap.conf;aCanc+=dMap.canc;aPend+=dMap.pend
        aEnt+=dMap.ent;aDev+=dMap.dev;aConv+=dMap.conv
        a1+=dMap.o1;a2+=dMap.o2;a3+=dMap.o3;a4+=dMap.o4
        aVenta+=(dMap.o1*(prod.precio_1u||0))+(dMap.o2*(prod.precio_2u||0))+(dMap.o3*(prod.precio_3u||0))+(dMap.o4*(prod.precio_4u||0))
        aCosto+=(dMap.o1*(prod.costo_1u||0))+(dMap.o2*(prod.costo_2u||0))+(dMap.o3*(prod.costo_3u||0))+(dMap.o4*(prod.costo_4u||0))
      }
      // Ganancia proyectada (% dev teórico aplicado a confirmados)
      const ventaProy=aVenta*(1-dp)
      const fleteOutProy=aConf*fo
      const fleteDevProy=aConf*dp*fdN
      const ganProy=Math.round(ventaProy-aCosto-fleteOutProy-fleteDevProy-aGasto-aConv*cc)
      // Ganancia real (solo entregadas + restar fletes reales)
      const ventaReal=(aEnt/Math.max(aConf,1))*aVenta // proporción de entregadas
      // mejor: calcular directo por unidad — pero requiere desglose. Aproximación con promedio:
      const promedioPrecio=aConf>0?aVenta/aConf:0
      const promedioCosto=aConf>0?aCosto/aConf:0
      const ventaRealAprox=aEnt*promedioPrecio
      const costoEntAprox=aEnt*promedioCosto
      const fleteOutReal=aConf*fo // todas las despachadas pagan flete
      const fleteDevReal=aDev*fdN
      const ganReal=Math.round(ventaRealAprox-costoEntAprox-fleteOutReal-fleteDevReal-aGasto-aConv*cc)
      // CPA y ROAS sobre confirmados
      const cpa=aConf>0?aGasto/aConf:0
      const roasBruto=aGasto>0&&aVenta>0?aVenta/aGasto:0
      const roasReal=aGasto>0&&aEnt>0?ventaRealAprox/aGasto:0
      accProd[pid]={aGasto,aConf,aCanc,aPend,aEnt,aDev,aConv,aVenta,a1,a2,a3,a4,ganProy,ganReal,cpa,roasBruto,roasReal,promedioPrecio,promedioCosto,fechas,dp,fo,fdN,cc,nombre:prod.nombre}
    }

    if(!Object.keys(accProd).length&&!gastoSinAtrib){
      el.innerHTML='<div class="alert alert-blue">Sin datos en este rango. Sincroniza Meta y revisa que tengas campañas atribuidas a productos.</div>'
      return
    }

    // 10. Totales globales
    let gGasto=0,gConf=0,gCanc=0,gPend=0,gEnt=0,gDev=0,gVenta=0,gGanProy=0,gGanReal=0
    for(const pid of Object.keys(accProd)){
      const a=accProd[pid]
      gGasto+=a.aGasto;gConf+=a.aConf;gCanc+=a.aCanc;gPend+=a.aPend
      gEnt+=a.aEnt;gDev+=a.aDev;gVenta+=a.aVenta
      gGanProy+=a.ganProy;gGanReal+=a.ganReal
    }
    const gRoasBruto=gGasto>0&&gVenta>0?gVenta/gGasto:0
    const gRoasReal=gGasto>0&&gEnt>0&&gConf>0?((gEnt/gConf)*gVenta)/gGasto:0

    // Sin atribuir suma al gasto global pero no a ningún producto
    const totalGastoConSinAtrib=gGasto+gastoSinAtrib

    // 11. HTML
    let html=`<div class="cards-row c4" style="margin-bottom:14px">
      <div class="card"><div class="card-label">Gasto Total</div><div class="card-val">$${fmt(totalGastoConSinAtrib)}</div>
        ${gastoSinAtrib>0?`<div class="card-sub" style="color:var(--amber)">$${fmt(gastoSinAtrib)} sin atribuir</div>`:''}</div>
      <div class="card"><div class="card-label">Ventas Conf.</div><div class="card-val">${fmt(gConf)}</div>
        <div class="card-sub">${fmt(gEnt)} entregadas · ${fmt(gDev)} dev.</div></div>
      <div class="card"><div class="card-label">Canc / Pend</div><div class="card-val" style="font-size:18px">${fmt(gCanc)} <span style="color:var(--muted)">/</span> ${fmt(gPend)}</div>
        <div class="card-sub">${fmt(gCanc)} cancelados · ${fmt(gPend)} pendientes</div></div>
      <div class="card ${gRoasBruto>=2.9?'c-green':'c-red'}"><div class="card-label">ROAS Bruto Proy.</div><div class="card-val">${gRoasBruto>0?gRoasBruto.toFixed(2)+'x':'—'}</div>
        <div class="card-sub">Venta proy: $${fmt(gVenta)}</div></div>
    </div>
    <div class="cards-row c2" style="margin-bottom:14px">
      <div class="card ${gGanProy>=0?'c-green':'c-red'}"><div class="card-label">Ganancia Proyectada</div><div class="card-val">$${fmt(gGanProy)}</div>
        <div class="card-sub">Con % dev teórico</div></div>
      <div class="card ${gGanReal>=0?'c-green':'c-red'}"><div class="card-label">Ganancia Real</div><div class="card-val">$${fmt(gGanReal)}</div>
        <div class="card-sub">ROAS real: ${gRoasReal>0?gRoasReal.toFixed(2)+'x':'—'} · Con entregas Dropi</div></div>
    </div>`

    // 12. Sección "Sin atribuir"
    if(gastoSinAtrib>0&&sinAtribIds.length){
      const sorted=sinAtribIds.sort((a,b)=>gastoCampSinAtrib[b]-gastoCampSinAtrib[a])
      html+=`<div class="card" style="border-left:3px solid var(--amber);margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
          <div><strong>⚠️ Campañas sin atribuir</strong> <span style="color:var(--muted);font-size:12px">— ${sorted.length} campañas · $${fmt(gastoSinAtrib)} gasto</span></div>
          <div style="display:flex;gap:6px">
            <button class="btn-sm btn-outline" onclick="atribuirSinAtribMasivo()">🔗 Atribuir seleccionadas</button>
          </div>
        </div>
        <div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:6px">
          ${sorted.map(cid=>{
            const c=nombreCamp[cid]||{n:'(sin nombre — '+cid+')',e:''}
            return`<div style="padding:6px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px">
              <input type="checkbox" class="sinatr-chk" data-cid="${cid}">
              <div style="flex:1;min-width:0">
                <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500" title="${c.n}">${c.n}</div>
                <div style="font-size:10px;color:var(--muted)">ID: ${cid} ${c.e?'· '+c.e:''}</div>
              </div>
              <div style="font-weight:600;color:var(--amber)">$${fmt(gastoCampSinAtrib[cid])}</div>
              <button class="btn-sm btn-outline" onclick="atribuirUna('${cid}')" style="padding:3px 8px;font-size:10px">🔗</button>
            </div>`
          }).join('')}
        </div>
      </div>`
    }

    // 13. Tabla por producto
    html+=`<div class="section-title">Por producto</div>
      <div class="table-wrap"><table style="font-size:12px">
        <tr><th>Producto</th><th>Gasto</th><th>Conf</th><th>Canc</th><th>Pend</th><th>Ent</th><th>Dev</th><th>Venta</th><th>CPA</th><th>ROAS Bruto</th><th>Gan Proy</th><th>Gan Real</th><th>ROAS Real</th></tr>`
    const prodIds=Object.keys(accProd).sort((a,b)=>accProd[b].aGasto-accProd[a].aGasto)
    for(const pid of prodIds){
      const a=accProd[pid]
      const margenBE=a.promedioPrecio*(1-a.dp)-a.promedioCosto-a.fo-(a.fdN*a.dp)
      const roasBE=margenBE>0?a.promedioPrecio/margenBE:0
      const cpaCol=a.cpa>0&&a.cpa<=margenBE?'color:var(--green)':a.cpa>0?'color:var(--red)':''
      const roasCol=a.roasBruto>=roasBE?'color:var(--green)':a.roasBruto>0?'color:var(--red)':''
      const ganProyCol=a.ganProy>=0?'color:var(--green)':'color:var(--red)'
      const ganRealCol=a.ganReal>=0?'color:var(--green)':'color:var(--red)'
      const roasRealCol=a.roasReal>=1?'color:var(--green)':a.roasReal>0?'color:var(--red)':''
      html+=`<tr>
        <td data-label="Producto" style="font-weight:600">${a.nombre}</td>
        <td data-label="Gasto">$${fmt(a.aGasto)}</td>
        <td data-label="Conf" style="color:var(--green);font-weight:600">${a.aConf}</td>
        <td data-label="Canc" style="color:var(--red)">${a.aCanc||0}</td>
        <td data-label="Pend" style="color:var(--amber)">${a.aPend||0}</td>
        <td data-label="Ent">${a.aEnt||0}</td>
        <td data-label="Dev">${a.aDev||0}</td>
        <td data-label="Venta">$${fmt(a.aVenta)}</td>
        <td data-label="CPA" style="${cpaCol}">${a.cpa>0?'$'+fmt(Math.round(a.cpa)):'—'}</td>
        <td data-label="ROAS Bruto" style="${roasCol}">${a.roasBruto>0?a.roasBruto.toFixed(2)+'x':'—'}</td>
        <td data-label="Gan Proy" style="${ganProyCol}">$${fmt(a.ganProy)}</td>
        <td data-label="Gan Real" style="${ganRealCol}">$${fmt(a.ganReal)}</td>
        <td data-label="ROAS Real" style="${roasRealCol}">${a.roasReal>0?a.roasReal.toFixed(2)+'x':'—'}</td>
      </tr>`
    }
    html+='</table></div>'

    el.innerHTML=html
  }catch(e){
    el.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`
    console.error(e)
  }
}

// Atribuir una campaña sin atribuir desde el Tracker
window.atribuirUna=async(cid)=>{
  if(!productos.length){alert('No hay productos configurados');return}
  const opciones=productos.map(p=>`${p.id}|${p.nombre}`).join('\n')
  const sel=prompt(`Atribuir campaña ${cid} a qué producto?\n\nProductos disponibles:\n${productos.map((p,i)=>`${i+1}. ${p.nombre}`).join('\n')}\n\nEscribe el número:`)
  if(!sel)return
  const idx=parseInt(sel)-1
  if(isNaN(idx)||idx<0||idx>=productos.length){alert('Número inválido');return}
  const prod=productos[idx]
  const existing=Array.isArray(prod.campaign_ids)?prod.campaign_ids:[]
  if(existing.includes(cid)){alert('Esta campaña ya está atribuida a '+prod.nombre);return}
  const{error}=await sb.from('productos').update({campaign_ids:[...existing,cid]}).eq('id',prod.id)
  if(error){alert(error.message);return}
  await loadProductos()
  logAction('campana_atribuida_tracker',{producto_id:prod.id,campaign_id:cid}).catch(()=>{})
  alert(`✅ Atribuida a ${prod.nombre}`)
  loadTracker()
}

window.atribuirSinAtribMasivo=async()=>{
  const seleccionadas=[...document.querySelectorAll('.sinatr-chk:checked')].map(c=>c.dataset.cid)
  if(!seleccionadas.length){alert('Selecciona al menos una campaña');return}
  if(!productos.length){alert('No hay productos');return}
  const sel=prompt(`Atribuir ${seleccionadas.length} campaña(s) a qué producto?\n\nProductos:\n${productos.map((p,i)=>`${i+1}. ${p.nombre}`).join('\n')}\n\nEscribe el número:`)
  if(!sel)return
  const idx=parseInt(sel)-1
  if(isNaN(idx)||idx<0||idx>=productos.length){alert('Número inválido');return}
  const prod=productos[idx]
  const existing=Array.isArray(prod.campaign_ids)?prod.campaign_ids:[]
  const merged=[...new Set([...existing,...seleccionadas])]
  const{error}=await sb.from('productos').update({campaign_ids:merged}).eq('id',prod.id)
  if(error){alert(error.message);return}
  await loadProductos()
  logAction('campanas_atribuidas_masivo',{producto_id:prod.id,n:seleccionadas.length}).catch(()=>{})
  alert(`✅ ${seleccionadas.length} atribuida(s) a ${prod.nombre}`)
  loadTracker()
}

function runSim(){
  const el=document.getElementById('sim-result')
  if(!el)return
  const prod0=productos[0]||{}
  const gasto=parseFloat(document.getElementById('sim-gasto')?.value)||0
  const devPct=(parseFloat(document.getElementById('sim-dev')?.value)||19)/100
  const cancPct=(parseFloat(document.getElementById('sim-canc')?.value)||10)/100
  const oferta=parseInt(document.getElementById('sim-oferta')?.value)||2
  const precio=[0,prod0.precio_1u||0,prod0.precio_2u||0,prod0.precio_3u||0,prod0.precio_4u||0][oferta]
  const costo=[0,prod0.costo_1u||0,prod0.costo_2u||0,prod0.costo_3u||0,prod0.costo_4u||0][oferta]
  const fo=prod0.flete_outbound||21000,fd=prod0.flete_devolucion||18000
  const entrega=1-devPct
  const ingEf=precio*entrega
  const costoOrd=costo+fo+(fd*devPct)
  const margenOrd=ingEf-costoOrd
  const minOrds=margenOrd>0?Math.ceil(gasto/margenOrd):999
  const roas=margenOrd>0?precio/margenOrd:0
  const ganSi20=margenOrd>0?(20*margenOrd)-gasto:0
  const color=margenOrd>0?'var(--green)':'var(--red)'
  el.innerHTML=`<div class="cards-row c4">
    <div class="card" style="padding:10px"><div class="card-label">Mín. órdenes BE</div><div class="card-val" style="color:${color}">${minOrds}</div></div>
    <div class="card" style="padding:10px"><div class="card-label">CPA máximo</div><div class="card-val" style="color:${color}">$${fmt(Math.round(margenOrd))}</div></div>
    <div class="card" style="padding:10px"><div class="card-label">ROAS BE</div><div class="card-val" style="color:${color}">${roas.toFixed(2)}x</div></div>
    <div class="card" style="padding:10px"><div class="card-label">Si vendes 20</div><div class="card-val" style="color:${ganSi20>=0?'var(--green)':'var(--red)'}">$${fmt(ganSi20)}</div></div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:6px">Ingreso ef/ord: $${fmt(Math.round(ingEf))} · Costo/ord: $${fmt(Math.round(costoOrd))} · Margen/ord: $${fmt(Math.round(margenOrd))}</div>`
}

  window.saveProd=async(id)=>{
    const g=s=>parseInt(document.getElementById(s+'-'+id).value)||0

    const cids=(document.getElementById('cids-'+id)?.value||'').split(/[\s,;\n]+/).map(s=>s.trim()).filter(Boolean)

    }

    const fullPayload={...updateData,aliases,aliases_visibles,tipo_producto,almacenamiento}
    const tryUpdate=async(payload)=>sb.from('productos').update(payload).eq('id',id)
    let{error:err}=await tryUpdate(fullPayload)
    // Fallbacks progresivos por columnas faltantes
    const removeMissing=(p,col)=>{const c={...p};delete c[col];return c}
    let payload=fullPayload
    const missingCols=[]
    while(err&&(err.code==='42703'||/column/i.test(err.message||''))){
      // Detectar columna faltante por mensaje
      const m=(err.message||'').match(/'([a-z_]+)' column|column "([a-z_]+)"/i)
      const col=m?(m[1]||m[2]):null
      if(!col||!(col in payload))break
      missingCols.push(col)
      payload=removeMissing(payload,col)
      ;({error:err}=await tryUpdate(payload))
    }
    if(err){document.getElementById('pmsg-'+id).innerHTML=`<div class="alert alert-red">${err.message}</div>`;return}
    // DIAGNÓSTICO: verificar que el nombre se haya persistido (detecta RLS silencioso)
    if(nombre){
      const{data:chk,error:chkErr}=await sb.from('productos').select('id,nombre').eq('id',id).maybeSingle()
      console.log('[saveProd diag] nombre enviado:',nombre,'· nombre en BD:',chk?.nombre,'· error:',chkErr)
      if(!chkErr&&chk&&chk.nombre!==nombre){
        document.getElementById('pmsg-'+id).innerHTML=`<div class="alert alert-red">⚠️ El nombre NO se guardó en BD. Enviado: "${nombre}" · En BD: "${chk.nombre||'(vacío)'}". Probable causa: RLS de Supabase bloquea el campo <code>nombre</code>. Abre DevTools → Console para más detalles.</div>`
        return
      }
    }
    if(missingCols.length){
      document.getElementById('pmsg-'+id).innerHTML=`<div class="alert alert-amber">⚠️ Guardado parcial. Faltan columnas en DB: ${missingCols.join(', ')}. Ejecuta el SQL al final.</div>`
    }

    // Guardar ofertas: leer todas las cards y actualizar precios/costos
    const precioInputs=document.querySelectorAll('.of-precio-'+id)
    const costoInputs=document.querySelectorAll('.of-costo-'+id)
    const ofertasMap={}
    precioInputs.forEach(inp=>{
      const cant=parseInt(inp.dataset.cantidad)
      const ofId=inp.dataset.id
      ofertasMap[cant]={ofId,precio:parseInt(inp.value)||0,costo:0}
    })
    costoInputs.forEach(inp=>{
      const cant=parseInt(inp.dataset.cantidad)
      if(ofertasMap[cant])ofertasMap[cant].costo=parseInt(inp.value)||0
    })
    for(const cant of Object.keys(ofertasMap)){
      const o=ofertasMap[cant]
      if(o.ofId.startsWith('legacy_')){
        // legacy → actualizar columnas viejas
        if(cant>=1&&cant<=4){
          const upd={}
          upd['precio_'+cant+'u']=o.precio
          upd['costo_'+cant+'u']=o.costo
          try{await sb.from('productos').update(upd).eq('id',id)}catch(_){}
        }
      }else{
        // Tabla nueva
        try{await sb.from('producto_ofertas').update({precio:o.precio,costo:o.costo}).eq('id',o.ofId)}catch(_){}
      }
    }

    const msg=document.getElementById('pmsg-'+id)
    msg.innerHTML='<div class="alert alert-green">✅ Guardado</div>'
    await loadProductos()
    logAction('producto_editado',{producto_id:id}).catch(()=>{})
    await refreshProdResumen(id)
    await renderCampanasEnlazadas(id)
    // Re-renderizar el body del card para refrescar inputs con los datos persistidos
    try{if(typeof renderProdBody==='function'&&document.getElementById('prod-body-'+id))await renderProdBody(id,maestrosList)}catch(_){}
  }

  window.modalAddProducto=()=>{
    const area=document.getElementById('prod-modal-area')
    area.innerHTML=`<div class="card" style="border:2px solid var(--primary);margin-bottom:16px">
      <div style="font-weight:600;margin-bottom:14px;font-size:15px">➕ Nuevo producto</div>
      <div class="form-grid g2">
        <div class="fld"><label>📝 Nombre actual</label>
          <input type="text" id="np-nombre" placeholder="Colágeno Neocell 4">
          <div style="font-size:11px;color:var(--muted);margin-top:4px">Se usa en todo: reportes, mensajes a clientes, dashboard.</div></div>
        <div class="fld"><label>🏷️ Aliases (separados por coma)</label>
          <input type="text" id="np-aliases" placeholder="neocell, colageno, NeoCell">
          <div style="font-size:11px;color:var(--muted);margin-top:4px">Para que el asignador reconozca nombres variantes desde Dropi/SellerChat.</div></div>
      </div>
      <div class="divider"></div>
      <div class="section-title">🏷️ Ofertas iniciales (deja en 0 las que no aplican)</div>
      <div class="form-grid g4">
        <div class="fld"><label>Precio 1u</label><input type="number" id="np-p1" value="0"></div>
        <div class="fld"><label>Precio 2u</label><input type="number" id="np-p2" value="0"></div>
        <div class="fld"><label>Precio 3u</label><input type="number" id="np-p3" value="0"></div>
        <div class="fld"><label>Precio 4u</label><input type="number" id="np-p4" value="0"></div>
        <div class="fld"><label>Costo 1u</label><input type="number" id="np-c1" value="0"></div>
        <div class="fld"><label>Costo 2u</label><input type="number" id="np-c2" value="0"></div>
        <div class="fld"><label>Costo 3u</label><input type="number" id="np-c3" value="0"></div>
        <div class="fld"><label>Costo 4u</label><input type="number" id="np-c4" value="0"></div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">💡 Después de crear el producto, puedes agregar más ofertas (5u, 6u...) desde el botón "➕ Agregar oferta"</div>
      <div class="divider"></div>
      <div class="form-grid g4">
        <div class="fld"><label>Flete outbound</label><input type="number" id="np-fo" value="21000"></div>
        <div class="fld"><label>Flete devolución</label><input type="number" id="np-fd" value="18000"></div>
        <div class="fld"><label>% Devolución</label><input type="number" step="0.01" id="np-dp" value="19"></div>
        <div class="fld"><label>Costo/conversación</label><input type="number" id="np-cc" value="100"></div>
      </div>
      <div class="form-grid g2" style="margin-top:10px">
        <div class="fld"><label>IDs de campañas Meta (separadas por coma)</label><input type="text" id="np-cids" placeholder="120244302541010122, 120243626234290122"></div>
        <div class="fld"><label>Maestro carrier</label>
          <select id="np-mc">${maestrosList.map(m=>`<option value="${m.codigo}">${m.codigo} (${m.nombre||''})</option>`).join('')}</select></div>

    </div>`
    area.scrollIntoView({behavior:'smooth'})
  }

  window.saveNewProd=async()=>{
    const nombre=document.getElementById('np-nombre').value.trim()
    if(!nombre){document.getElementById('np-msg').innerHTML='<div class="alert alert-red">El nombre es obligatorio</div>';return}
    const g=s=>parseInt(document.getElementById(s).value)||0
    const cids=(document.getElementById('np-cids').value||'').split(/[\s,;\n]+/).map(s=>s.trim()).filter(Boolean)
    const aliases=(document.getElementById('np-aliases').value||'').split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean)
    const payload={
      nombre,activo:true,
      precio_1u:g('np-p1'),precio_2u:g('np-p2'),precio_3u:g('np-p3'),precio_4u:g('np-p4'),
      costo_1u:g('np-c1'),costo_2u:g('np-c2'),costo_3u:g('np-c3'),costo_4u:g('np-c4'),
      flete_outbound:g('np-fo'),flete_devolucion:g('np-fd'),
      dev_pct:(parseFloat(document.getElementById('np-dp').value)||19)/100,
      costo_conversacion:parseInt(document.getElementById('np-cc').value)||100,
      campaign_ids:cids,
      maestro_codigo:document.getElementById('np-mc').value||'GEN',
      aliases,aliases_visibles:[],tipo_producto:'dropshipping',almacenamiento:0
    }
    // Fallback progresivo si alguna columna no existe en DB
    const tryInsert=async(p)=>sb.from('productos').insert(p).select().single()
    let{data,error:err}=await tryInsert(payload)
    const removeMissing=(p,col)=>{const c={...p};delete c[col];return c}
    let curPayload=payload
    const missingCols=[]
    while(err&&(err.code==='42703'||/column/i.test(err.message||''))){
      const m=(err.message||'').match(/'([a-z_]+)' column|column "([a-z_]+)"/i)
      const col=m?(m[1]||m[2]):null
      if(!col||!(col in curPayload))break
      missingCols.push(col)
      curPayload=removeMissing(curPayload,col)
      ;({data,error:err}=await tryInsert(curPayload))
    }
    if(err){document.getElementById('np-msg').innerHTML=`<div class="alert alert-red">${err.message}</div>`;return}
    if(missingCols.length){
      document.getElementById('np-msg').innerHTML=`<div class="alert alert-amber">⚠️ Creado, pero faltan columnas en DB: ${missingCols.join(', ')}. Ejecuta el SQL al final.</div>`
    }
    await loadProductos()
    logAction('producto_creado',{nombre}).catch(()=>{})
    pageAdminProductos(document.getElementById('content'))
  }
}

// Cambia el tipo de producto (dropshipping / marca_propia) y muestra/oculta almacenamiento
window.setTipoProd=(id,tipo)=>{
  const hidden=document.getElementById('tp-'+id);if(hidden)hidden.value=tipo
  const btnDrop=document.getElementById('tp-drop-'+id)
  const btnMarca=document.getElementById('tp-marca-'+id)
  if(btnDrop&&btnMarca){
    btnDrop.className='btn-sm '+(tipo==='dropshipping'?'btn-primary':'btn-outline')
    btnMarca.className='btn-sm '+(tipo==='marca_propia'?'btn-primary':'btn-outline')
  }
  const almWrap=document.getElementById('alm-wrap-'+id)
  if(almWrap)almWrap.style.display=tipo==='marca_propia'?'block':'none'
  recalcProdAuto(id)
}

// Recalcula el panel de cálculos automáticos en vivo (CPA BE, ROAS BE, ingreso efectivo, etc.)
window.recalcProdAuto=(id)=>{
  const cont=document.getElementById('autocalc-'+id);if(!cont)return
  const ofertaSel=parseInt(localStorage.getItem('prod_oferta_'+id))||2
  // Leer precio/costo de la oferta seleccionada desde los inputs del DOM (si están)
  let precio=0,costo=0
  const precioInput=document.querySelector('.of-precio-'+id+'[data-cantidad="'+ofertaSel+'"]')
  const costoInput=document.querySelector('.of-costo-'+id+'[data-cantidad="'+ofertaSel+'"]')
  if(precioInput)precio=parseInt(precioInput.value)||0
  if(costoInput)costo=parseInt(costoInput.value)||0
  // Fallback al producto cargado en memoria si no hay input visible
  if(!precio){const prod=productos.find(p=>p.id===id);precio=prod?.['precio_'+ofertaSel+'u']||0}
  if(!costo){const prod=productos.find(p=>p.id===id);costo=prod?.['costo_'+ofertaSel+'u']||0}
  const fo=parseInt(document.getElementById('fo-'+id)?.value)||0
  const fd=parseInt(document.getElementById('fd-'+id)?.value)||0
  const dpPct=parseFloat(document.getElementById('dp-'+id)?.value)||0
  const dp=dpPct/100
  const cc=parseInt(document.getElementById('cc-'+id)?.value)||0
  const tipo=document.getElementById('tp-'+id)?.value||'dropshipping'
  const alm=tipo==='marca_propia'?(parseInt(document.getElementById('alm-'+id)?.value)||0):0
  // Cálculos
  const ingresoEf=precio*(1-dp)
  const costoSinAds=costo+fo+(fd*dp)+alm
  const margenBE=ingresoEf-costoSinAds
  const cpaBE=margenBE
  const roasBE=margenBE>0?precio/margenBE:0
  const card=(label,val,sub,color)=>`<div class="card" style="padding:10px;${color?'border-left:3px solid '+color:''}">
    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${label}</div>
    <div style="font-size:18px;font-weight:700;margin-top:2px${color?';color:'+color:''}">${val}</div>
    ${sub?`<div style="font-size:10px;color:var(--muted);margin-top:2px">${sub}</div>`:''}
  </div>`
  cont.innerHTML=
    card('💵 Ingreso efectivo','$'+fmt(ingresoEf),`Precio × ${((1-dp)*100).toFixed(0)}% entrega`)+
    card('💸 Costo total sin ads','$'+fmt(costoSinAds),`Producto + flete + dev${alm?' + alm.':''}`)+
    card('🎯 Margen disponible','$'+fmt(margenBE),'Para pagar ads',margenBE>0?'var(--green)':'var(--red)')+
    card('📊 CPA Break-even','$'+fmt(cpaBE),'CPA máximo viable',margenBE>0?'var(--green)':'var(--red)')+
    card('📈 ROAS Break-even',roasBE.toFixed(2)+'x','ROAS bruto mínimo')
}

window.guardarOferta=async(prodId)=>{
  const cantidad=parseInt(document.getElementById('of-new-cantidad')?.value)||0
  const precio=parseInt(document.getElementById('of-new-precio')?.value)||0
  const costo=parseInt(document.getElementById('of-new-costo')?.value)||0
  const msg=document.getElementById('of-msg')
  if(cantidad<1){msg.innerHTML='<div class="alert alert-red">La cantidad debe ser mayor a 0</div>';return}
  msg.innerHTML='<div class="loading">Guardando...</div>'
  try{
    // Intentar insertar en tabla producto_ofertas
    const{error}=await sb.from('producto_ofertas').insert({producto_id:prodId,cantidad,precio,costo,activo:true})
    if(error){
      // Si la tabla no existe → fallback en columnas viejas (solo 1-4)
      if(error.message.includes('producto_ofertas')||error.code==='42P01'){
        if(cantidad>=1&&cantidad<=4){
          const update={}
          update['precio_'+cantidad+'u']=precio
          update['costo_'+cantidad+'u']=costo
          const{error:err2}=await sb.from('productos').update(update).eq('id',prodId)
          if(err2){msg.innerHTML=`<div class="alert alert-red">${err2.message}</div>`;return}
          await loadProductos()
          msg.innerHTML='<div class="alert alert-amber">⚠️ Tabla producto_ofertas no existe. Guardado en columnas legacy (1-4u). Ejecuta SQL de migración para soportar más cantidades.</div>'
          setTimeout(()=>{closeModal();refreshProdBody(prodId)},2000)
          return
        }
        msg.innerHTML='<div class="alert alert-red">Necesita tabla producto_ofertas. Cantidades 5+ requieren ejecutar migración SQL.</div>'
        return
      }
      msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`
      return
    }
    logAction('oferta_creada',{producto_id:prodId,cantidad,precio,costo}).catch(()=>{})
    msg.innerHTML='<div class="alert alert-green">✅ Oferta agregada</div>'
    setTimeout(()=>{closeModal();refreshProdBody(prodId)},800)
  }catch(e){msg.innerHTML=`<div class="alert alert-red">${e.message}</div>`}
}

window.quitarOferta=async(prodId,ofId,cantidad)=>{
  if(!confirm(`¿Quitar la oferta de ${cantidad}u?`))return
  try{
    if(ofId.startsWith('legacy_')){
      // Es legacy → poner a 0 las columnas viejas
      const update={}
      update['precio_'+cantidad+'u']=0
      update['costo_'+cantidad+'u']=0
      const{error}=await sb.from('productos').update(update).eq('id',prodId)
      if(error){alert(error.message);return}
    }else{
      const{error}=await sb.from('producto_ofertas').delete().eq('id',ofId)
      if(error){alert(error.message);return}
    }
    await loadProductos()
    logAction('oferta_eliminada',{producto_id:prodId,cantidad}).catch(()=>{})
    refreshProdBody(prodId)
  }catch(e){alert(e.message)}
}

async function refreshProdBody(prodId){

  await renderProdBody(prodId,maestros||[])
  body.dataset.loaded='1'
}

async function renderCampanasEnlazadas(id){
  const el=document.getElementById('camps-enlazadas-'+id)
  if(!el)return
  const prod=productos.find(p=>p.id===id);if(!prod)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  try{
    const cids=Array.isArray(prod.campaign_ids)?prod.campaign_ids:[]
    if(!cids.length){el.innerHTML='<div class="alert alert-blue">Sin campañas atribuidas. Usa "🔗 Atribuir campañas..." o agrega IDs arriba.</div>';return}
    const{data:camps}=await sb.from('meta_campanas').select('meta_id,nombre,estado,account_id').in('meta_id',cids).eq('nivel','campaign')
    const{data:cuentas}=await sb.from('meta_cuentas').select('account_id,nombre')
    const cuById={};for(const c of (cuentas||[]))cuById[c.account_id]=c.nombre
    const existById={};for(const c of (camps||[]))existById[c.meta_id]=c
    const renderRow=(cid,visible)=>{
      const c=existById[cid]
      const cls=`ce-row-${id} ${visible?'':'ce-extra'}`
      const styleHide=visible?'':' style="display:none"'
      if(c){
        return`<tr class="${cls}"${styleHide}><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${c.nombre}">${c.nombre}</td>
          <td>${cuById[c.account_id]||c.account_id}</td>
          <td><span class="pill pill-${c.estado==='ACTIVE'?'green':'red'}">${c.estado}</span></td>
          <td style="font-family:monospace;font-size:10px">${cid}</td>
          <td><button class="btn-sm btn-outline" onclick="quitarCampanaProd('${id}','${cid}')" style="padding:3px 8px;font-size:10px">🗑️</button></td>
        </tr>`
      }else{
        return`<tr class="${cls}" style="${visible?'':'display:none;'}opacity:0.5"><td colspan="3" style="font-style:italic;color:var(--muted)">ID no sincronizado en Meta (puede que la cuenta no esté en el sistema)</td>
          <td style="font-family:monospace;font-size:10px">${cid}</td>
          <td><button class="btn-sm btn-outline" onclick="quitarCampanaProd('${id}','${cid}')" style="padding:3px 8px;font-size:10px">🗑️</button></td>
        </tr>`
      }
    }
    const MAX_VISIBLE=3
    let html='<div class="table-wrap"><table style="font-size:12px"><tr><th>Campaña</th><th>Cuenta</th><th>Estado</th><th>ID</th><th></th></tr>'
    cids.forEach((cid,idx)=>{html+=renderRow(cid,idx<MAX_VISIBLE)})
    html+='</table></div>'
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)">
      <span>📊 ${cids.length} campaña(s) atribuida(s)</span>
      ${cids.length>MAX_VISIBLE?`<button class="btn-sm btn-outline" id="ce-toggle-${id}" data-expanded="0" onclick="toggleCampsEnlazadas('${id}')" style="padding:4px 10px;font-size:11px">▼ Ver ${cids.length-MAX_VISIBLE} más</button>`:''}
    </div>`
    el.innerHTML=html
  }catch(e){el.innerHTML=`<div class="alert alert-red">${e.message}</div>`}
}

window.toggleCampsEnlazadas=(id)=>{
  const btn=document.getElementById('ce-toggle-'+id)
  if(!btn)return
  const expanded=btn.dataset.expanded==='1'
  document.querySelectorAll('.ce-row-'+id+'.ce-extra').forEach(row=>{
    row.style.display=expanded?'none':''
  })
  if(expanded){
    btn.dataset.expanded='0'
    const extras=document.querySelectorAll('.ce-row-'+id+'.ce-extra').length
    btn.innerHTML=`▼ Ver ${extras} más`

    btn.innerHTML='▲ Ver menos'
  }
}
