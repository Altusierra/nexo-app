function _novKey(it){return (it.telefono||it.tel||'')+'|'+(it.orden_id||it.ordenId||'')}

// ── Cargar novedades guardadas en BD para una fecha ──
async function cargarNovedadesPorFecha(){
  const el=document.getElementById('nov-content')
  if(!el)return
  const fecha=document.getElementById('nov-fecha')?.value||today()
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Cargando novedades de '+fecha+'...</div>'
  try{
    const{data:rep}=await sb.from('novedades_reportes').select('*').eq('fecha_lote',fecha).maybeSingle()
    if(!rep){
      el.innerHTML=`<div class="alert alert-blue">Sin novedades guardadas para ${fecha}. Sube un archivo arriba.</div>`
      window._novCache={fechaActiva:fecha,items:[],reporteId:null}
      return
    }
    const{data:items}=await sb.from('novedades_items').select('*').eq('reporte_id',rep.id).limit(5000)
    const{data:resols}=await sb.from('novedades_resoluciones').select('*').order('created_at',{ascending:false}).limit(10000)
    const resolByKey={}, contactByKey={}
    for(const r of (resols||[])){
      const k=(r.telefono||'')+'|'+(r.orden_id||'')
      if(r.accion==='contactada'){
        if(!contactByKey[k])contactByKey[k]=r
      }else{
        if(!resolByKey[k])resolByKey[k]=r
      }
    }
    const enriched=(items||[]).map(it=>{
      const k=_novKey(it)
      const r=resolByKey[k]
      const ct=contactByKey[k]
      const cat=NOV_RULES[(it.cat_idx||1)-1]||{pri:'NORMAL',tipo:it.tipo||'Otra novedad',color:'var(--muted)',bg:'var(--card2)',border:'var(--border)',idx:99}
      let dias=it.dias_desde_novedad
      if(it.fecha_novedad){
        const p=it.fecha_novedad.split('-')
        if(p.length===3){
          const fNov=new Date(`${p[2]}-${p[1]}-${p[0]}T12:00:00`)
          if(!isNaN(fNov))dias=Math.floor((new Date()-fNov)/(1000*60*60*24))
        }
      }
      return{
        tel:it.telefono,orden_id:it.orden_id,guia:it.guia,nombre:it.cliente_nombre,
        carrier:it.carrier,ciudad:it.ciudad,depto:it.depto,direccion:it.direccion,
        producto:it.producto,causal:it.causal,aclaracion:it.aclaracion,
        fechaNov:it.fecha_novedad,horaNov:it.hora_novedad,
        cat:{...cat,idx:it.cat_idx||cat.idx,tipo:it.tipo||cat.tipo,pri:it.prioridad||cat.pri},
        dias,ad_id:it.ad_id,
        resol:r?{accion:r.accion,usuario:r.usuario_nombre,cuando:r.created_at,motivo:r.motivo}:null,
        contact:ct?{cuando:ct.created_at,usuario:ct.usuario_nombre}:null
      }
    })
    enriched.sort((a,b)=>a.cat.idx-b.cat.idx||(b.dias||0)-(a.dias||0))
    window._novCache={fechaActiva:fecha,items:enriched,reporteId:rep.id}
    renderNovedadesContent(rep,enriched)
  }catch(e){
    el.innerHTML=`<div class="alert alert-red">Error cargando: ${e.message}</div>`
  }
}
window.cargarNovedadesPorFecha=cargarNovedadesPorFecha

function renderNovedadesContent(rep,items){
  const el=document.getElementById('nov-content')
  if(!el)return
  const isResuelta=(m)=>m.resol?.accion==='resuelta'
  const isContactada=(m)=>!!m.contact&&!isResuelta(m)
  // SIN CONTACTAR (por prioridad)
  const urgentes=items.filter(i=>i.cat.pri==='URGENTE'&&!isResuelta(i)&&!isContactada(i))
  const medias=items.filter(i=>i.cat.pri==='MEDIA'&&!isResuelta(i)&&!isContactada(i))
  const normales=items.filter(i=>i.cat.pri==='NORMAL'&&!isResuelta(i)&&!isContactada(i))
  // CONTACTADAS (en limbo: esperan resolución)
  const contactadas=items.filter(isContactada)
  // RESUELTAS
  const resueltas=items.filter(isResuelta)

  const esc=(s)=>(s||'').toString().replace(/'/g,"\\'").replace(/\n/g,' ')
  const fmtDelta=(ms)=>{
    if(!ms||ms<0)return'—'
    const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60)
    if(h>=24){const d=Math.floor(h/24),hr=h%24;return`${d}d ${hr}h`}
    if(h>0)return`${h}h ${m}m`
    return`${m}m`
  }
  const renderCard=(m)=>{
    const diasTxt=(m.dias!==null&&m.dias!==undefined)?`${m.dias}d`:'—'
    const diasColor=m.dias>5?'var(--red)':m.dias>3?'var(--amber)':'var(--green)'
    const proto=NOV_PROTO[m.cat.idx]
    const protoBtn=proto?`<button class="btn-sm btn-outline" onclick="mostrarProtocolo(${m.cat.idx},'${esc(m.nombre)}','${m.tel}','${esc(m.producto)}','${esc(m.carrier)}','${esc(m.direccion)}')">📋 Protocolo</button>`:''
    const marcada=isResuelta(m)
    const accionBtn=marcada
      ?`<button class="btn-sm btn-outline" onclick="desmarcarResuelta('${m.tel}','${esc(m.orden_id)}')">↩️ Desmarcar</button>`
      :`<button class="btn-sm btn-primary" onclick="marcarResuelta('${m.tel}','${esc(m.orden_id)}')">✅ Marcar resuelta</button>`
    const badge=marcada?`<div style="margin-top:6px;padding:6px 8px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);border-radius:6px;font-size:11px;color:var(--green)">✅ Marcada por ${m.resol.usuario||'—'} · ${(m.resol.cuando||'').slice(11,16)}</div>`:''
    // Badge de contacto (solo si fue contactada y NO está aún resuelta)
    let contactBadge=''
    if(m.contact&&!marcada){
      const deltaMs=new Date()-new Date(m.contact.cuando)
      contactBadge=`<div style="margin-top:6px;padding:6px 8px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.4);border-radius:6px;font-size:11px;color:var(--blue)">📨 Contactada hace ${fmtDelta(deltaMs)} · por ${m.contact.usuario||'—'} · ${(m.contact.cuando||'').slice(11,16)}</div>`
    }
    // Badge de tiempo de resolución (delta contacto → resuelta)
    let resTimeBadge=''
    if(m.contact&&marcada&&m.resol?.cuando){
      const deltaMs=new Date(m.resol.cuando)-new Date(m.contact.cuando)
      if(deltaMs>0){
        resTimeBadge=`<div style="margin-top:4px;padding:5px 8px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.35);border-radius:6px;font-size:11px;color:#a78bfa">⏱️ Resuelta en <strong>${fmtDelta(deltaMs)}</strong> desde contacto</div>`
      }
    }
    const bgCard=marcada?'background:rgba(34,197,94,.05)':''
    return`<div class="card" style="margin-bottom:8px;border-left:3px solid ${m.cat.color};${bgCard}">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="font-size:14px;font-weight:600;font-family:monospace">${m.tel||'—'}</div>
          <div style="font-size:13px;margin-top:2px">${m.nombre||'—'} · <strong>${m.producto||'—'}</strong></div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${m.ciudad||'—'}, ${m.depto||'—'} · ${m.carrier||'—'} · Guía: ${m.guia||'—'}</div>
          <div style="font-size:12px;margin-top:4px"><span class="pill" style="background:${m.cat.bg};color:${m.cat.color};border:1px solid ${m.cat.border}">${m.cat.tipo}</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">"${m.causal||''}"</div>
          ${m.aclaracion?`<div style="font-size:10px;color:var(--subtle);margin-top:2px">↳ ${m.aclaracion}</div>`:''}
          ${contactBadge}
          ${badge}
          ${resTimeBadge}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:700;color:${diasColor}">${diasTxt}</div>
          <div style="font-size:10px;color:var(--muted)">días</div>
          <div style="font-size:10px;color:var(--muted)">${m.fechaNov||''} ${m.horaNov||''}</div>
          <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
            ${protoBtn}
            ${accionBtn}
          </div>
        </div>
      </div>
    </div>`
  }
  const renderSection=(titulo,pri,arr,color)=>{
    if(!arr.length)return''
    return`<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span>
        <span style="font-size:13px;font-weight:600;color:${color};text-transform:uppercase;letter-spacing:.06em">${pri} — ${titulo} (${arr.length})</span>
      </div>
      ${arr.map(renderCard).join('')}
    </div>`
  }
  const total=items.length, sinContactarTotal=urgentes.length+medias.length+normales.length, marcadas=resueltas.length, contactadasTot=contactadas.length
  const pctMarcadas=total>0?Math.round(marcadas*100/total):0
  // Pendientes con protocolo asignado (cat.idx entre 1 y 8) y no resueltas
  const colaPendientes=[...urgentes,...medias,...normales].filter(m=>NOV_PROTO[m.cat.idx])
  const colaSinContactar=colaPendientes.length

window.procesarNovedadesXlsx=async()=>{
  const fileInput=document.getElementById('nov-file')
  const msg=document.getElementById('nov-msg')
  if(!fileInput.files.length){msg.innerHTML='<div class="alert alert-red">Selecciona un archivo</div>';return}
  msg.innerHTML='<div class="alert alert-blue">Procesando novedades...</div>'

  try{
    const file=fileInput.files[0]
    const filename=file.name
    const buf=await file.arrayBuffer()
    const wbook=XLSX.read(buf,{type:'array'})
    const rows=XLSX.utils.sheet_to_json(wbook.Sheets[wbook.SheetNames[0]],{defval:''})
    if(!rows.length){msg.innerHTML='<div class="alert alert-red">Archivo vacío</div>';return}

    const items=rows.map(r=>{
      const tel=String(r['TELÉFONO']||r['TELEFONO']||'').replace(/\D/g,'')
      const causal=String(r['CAUSAL DE NOVEDAD']||'').trim()
      const aclaracion=String(r['ACLARACION DE LA TRANSPORTADORA']||'').trim()
      const comentario=String(r['COMENTARIO DE LA TRANSPORTADORA']||'').trim()
      const fechaNov=String(r['FECHA DE NOVEDAD']||'')
      const horaMatch=aclaracion.match(/^(\d{1,2}:\d{2})\s*:/)
      const horaNov=horaMatch?horaMatch[1]:String(r['HORA DE NOVEDAD']||'')
      const nombre=`${r['NOMBRE']||''} ${r['APELLIDO']||''}`.trim()
      const carrier=String(r['TRANSPORTADORA']||'')
      const ciudad=String(r['CIUDAD']||'')
      const depto=String(r['DEPARTAMENTO']||'')
      const direccion=String(r['DIRECCION']||'')
      const guia=String(r['GUIA']||'')
      const ordenId=String(r['ORDEN ID']||'')
      const textoClasif=causal+(aclaracion?' '+aclaracion:'')
      const cat=clasificarNovedad(textoClasif)
      let dias=null
      if(fechaNov){
        const p=fechaNov.split('-')
        if(p.length===3){
          const fNov=new Date(`${p[2]}-${p[1]}-${p[0]}T12:00:00`)
          if(!isNaN(fNov))dias=Math.floor((new Date()-fNov)/(1000*60*60*24))
        }
      }
      return{tel,causal,aclaracion,comentario,fechaNov,horaNov,nombre,carrier,ciudad,depto,direccion,guia,ordenId,cat,dias}
    }).filter(i=>i.tel.length>=7)

    // Cruzar con mapeos por teléfono para obtener producto
    const telefonos=[...new Set(items.map(i=>i.tel))]
    let mapeos=[]
    for(let i=0;i<telefonos.length;i+=100){
      const batch=telefonos.slice(i,i+100)
      const{data}=await sb.from('mapeos').select('id,telefono,producto,ad_id,fecha').in('telefono',batch)
      if(data)mapeos=mapeos.concat(data)
    }
    const mByTel={}
    for(const m of mapeos){if(!mByTel[m.telefono])mByTel[m.telefono]=m}

    const novUpdates=[]
    for(const item of items){
      const m=mByTel[item.tel]
      item.producto=m?.producto||'—'
      item.ad_id=m?.ad_id||null
      if(m?.id&&item.fechaNov){
        const p=item.fechaNov.split('-')
        if(p.length===3)novUpdates.push({id:m.id,fiso:`${p[2]}-${p[1]}-${p[0]}`})
      }
    }
    let novUpdated=0
    for(const u of novUpdates){
      const{error}=await sb.from('mapeos').update({fecha_novedad:u.fiso}).eq('id',u.id)
      if(!error)novUpdated++
    }

    const fechaLote=today()

    // 1. Buscar si ya existe reporte para esta fecha (UNIQUE → reemplazar)
    const{data:existing}=await sb.from('novedades_reportes').select('id').eq('fecha_lote',fechaLote).maybeSingle()
    if(existing){
      const{error:delErr}=await sb.from('novedades_reportes').delete().eq('id',existing.id)
      if(delErr){msg.innerHTML=`<div class="alert alert-red">Error reemplazando: ${delErr.message}</div>`;return}
    }

    // 2. Insertar nuevo reporte
    const{data:newRep,error:repErr}=await sb.from('novedades_reportes').insert({
      fecha_lote:fechaLote,uploaded_by:me?.id||null,uploaded_by_name:me?.nombre||null,
      filename,total_items:items.length
    }).select().single()
    if(repErr){msg.innerHTML=`<div class="alert alert-red">Error guardando reporte: ${repErr.message}</div>`;return}

    // 3. Insertar items en chunks
    const itemsInsert=items.map(it=>({
      reporte_id:newRep.id,fecha_lote:fechaLote,
      telefono:it.tel,orden_id:it.ordenId||null,guia:it.guia||null,
      cliente_nombre:it.nombre||null,carrier:it.carrier||null,
      ciudad:it.ciudad||null,depto:it.depto||null,direccion:it.direccion||null,
      producto:it.producto||null,causal:it.causal||null,
      aclaracion:it.aclaracion||null,fecha_novedad:it.fechaNov||null,
      hora_novedad:it.horaNov||null,prioridad:it.cat.pri,tipo:it.cat.tipo,
      cat_idx:it.cat.idx,ad_id:it.ad_id||null,dias_desde_novedad:it.dias
    }))
    for(let i=0;i<itemsInsert.length;i+=500){
      const chunk=itemsInsert.slice(i,i+500)
      const{error:insErr}=await sb.from('novedades_items').insert(chunk)
      if(insErr){msg.innerHTML=`<div class="alert alert-red">Error guardando items: ${insErr.message}</div>`;return}
    }

    msg.innerHTML=`<div class="alert alert-green">✅ ${items.length} novedades guardadas en BD${novUpdated>0?` · 📅 ${novUpdated} fechas actualizadas en mapeos`:''}${existing?' · ♻️ Reemplazó el lote anterior de hoy':''}</div>`

    document.getElementById('nov-fecha').value=fechaLote
    cargarNovedadesPorFecha()
    cargarHistorialNovedades()

    logAction('novedades_procesadas',{total:items.length,fecha_lote:fechaLote,reemplazo:!!existing}).catch(()=>{})
  }catch(e){
    msg.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`
  }
}

// ── HISTORIAL DE LOTES + DETECCIÓN DE FANTASMAS ──
async function cargarHistorialNovedades(){
  const el=document.getElementById('nov-hist')
  if(!el)return
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Cargando historial...</div>'
  try{
    const{data:reportes}=await sb.from('novedades_reportes').select('*').order('fecha_lote',{ascending:false}).limit(60)
    if(!reportes?.length){el.innerHTML='<div class="alert alert-blue">Sin lotes históricos aún</div>';return}

    const{data:resols}=await sb.from('novedades_resoluciones').select('*').order('created_at',{ascending:false}).limit(20000)
    const resolByKey={}
    for(const r of (resols||[])){
      const k=(r.telefono||'')+'|'+(r.orden_id||'')
      if(!resolByKey[k])resolByKey[k]=r
    }

    const repIds=reportes.map(r=>r.id)
    let allItems=[]
    for(let i=0;i<repIds.length;i+=20){
      const batch=repIds.slice(i,i+20)
      const{data:its}=await sb.from('novedades_items').select('reporte_id,telefono,orden_id').in('reporte_id',batch).limit(20000)
      if(its)allItems=allItems.concat(its)
    }
    const itemsByRep={}
    for(const it of allItems){
      if(!itemsByRep[it.reporte_id])itemsByRep[it.reporte_id]=[]
      itemsByRep[it.reporte_id].push(it)
    }

    // Lote más reciente: keys que SÍ están hoy
    const latestRep=reportes[0]
    const latestKeys=new Set((itemsByRep[latestRep.id]||[]).map(it=>(it.telefono||'')+'|'+(it.orden_id||'')))

    const rows=reportes.map(rep=>{
      const its=itemsByRep[rep.id]||[]
      const total=its.length
      let marcadas=0, fantasmas=0
      for(const it of its){
        const k=(it.telefono||'')+'|'+(it.orden_id||'')
        const r=resolByKey[k]
        const resuelta=r?.accion==='resuelta'
        if(resuelta)marcadas++
        // Fantasma: en un lote NO último, NO marcada y NO presente en el lote más reciente
        if(rep.id!==latestRep.id&&!resuelta&&!latestKeys.has(k))fantasmas++
      }
      const pct=total>0?Math.round(marcadas*100/total):0
      const pendientes=total-marcadas
      return{rep,total,marcadas,pendientes,fantasmas,pct}
    })

    el.innerHTML=rows.map(r=>{
      const isToday=r.rep.fecha_lote===today()
      return`<div class="card" style="margin-bottom:8px;border-left:3px solid ${isToday?'var(--green)':'var(--border)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="font-size:14px;font-weight:600">📅 ${r.rep.fecha_lote} ${isToday?'<span class="pill" style="background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.3)">HOY</span>':''}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${r.rep.filename||'—'} ${r.rep.uploaded_by_name?` · 👤 ${r.rep.uploaded_by_name}`:''}</div>
          </div>
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            <div style="text-align:center"><div style="font-size:16px;font-weight:700">${r.total}</div><div style="font-size:10px;color:var(--muted)">total</div></div>
            <div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--green)">${r.marcadas}</div><div style="font-size:10px;color:var(--muted)">marcadas (${r.pct}%)</div></div>
            <div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--amber)">${r.pendientes}</div><div style="font-size:10px;color:var(--muted)">pendientes</div></div>
            ${r.fantasmas>0?`<div style="text-align:center"><div style="font-size:16px;font-weight:700;color:var(--red)">⚠️ ${r.fantasmas}</div><div style="font-size:10px;color:var(--red)">fantasmas</div></div>`:''}
            <button class="btn-sm btn-outline" onclick="verLote('${r.rep.fecha_lote}')">👁️ Ver</button>
          </div>
        </div>
      </div>`
    }).join('')
  }catch(e){
    el.innerHTML=`<div class="alert alert-red">Error historial: ${e.message}</div>`
  }
}

// ── COLA DE PROTOCOLOS (modo cola secuencial) ──────────────
window._colaState={items:[],idx:0,inicio:null,fin:null,timerId:null,contactadasEnSesion:0,saltadas:0}

function _colaEscHtml(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function _colaArmarMensaje(m){
  const proto=NOV_PROTO[m.cat.idx]
  if(!proto)return{titulo:'—',msg:'',resp:''}
  const carrierNom=m.carrier||'ENVÍA / INTERRAPIDÍSIMO'
  // Resolver nombre canónico del producto (si cambia el "Nombre actual" en Productos, se actualiza solo)
  const prodNom=(typeof resolveProdName==='function'?(resolveProdName(m.producto)||{}).nombre:null)||m.producto||'[PRODUCTO]'
  const msgFinal=proto.msg.replace(/\[NOMBRE\]/g,m.nombre||'[NOMBRE]').replace(/\[PRODUCTO\]/g,prodNom).replace(/\[CARRIER\]/g,carrierNom)
  const respFinal=proto.resp.replace(/\[TELÉFONO\]|\[TELEFONO\]/g,m.tel||'[TELÉFONO]').replace(/\[DIRECCIÓN COMPLETA\]|\[DIRECCION COMPLETA\]/g,m.direccion||'[DIRECCIÓN COMPLETA]')
  return{titulo:proto.titulo,msg:msgFinal,resp:respFinal}
}
function _colaFmtTime(ms){
  if(!ms||ms<0)return'0s'
  const s=Math.floor(ms/1000), m=Math.floor(s/60), sr=s%60
  if(m>=60){const h=Math.floor(m/60), mr=m%60;return`${h}h ${mr}m`}
  if(m>0)return`${m}m ${sr}s`
  return`${sr}s`
}

window.abrirColaProtocolos=()=>{
  const cache=window._novCache||{}
  // Solo SIN CONTACTAR (las ya contactadas no entran a la cola)
  const items=(cache.items||[]).filter(m=>NOV_PROTO[m.cat.idx]&&!(m.resol?.accion==='resuelta')&&!m.contact)
  if(!items.length){alert('No hay novedades pendientes por contactar.');return}
  const cola=items
  window._colaState={items:cola,idx:0,inicio:Date.now(),fin:null,timerId:null,contactadasEnSesion:0,saltadas:0}
  closeModal()
  const div=document.createElement('div')
  div.id='user-modal'
  div.className='modal-bg'
  div.innerHTML=`<div class="modal-box" onclick="event.stopPropagation()" style="max-width:680px;padding:0;overflow:hidden">
    <div id="cola-body"></div>
  </div>`
  div.onclick=(e)=>{if(e.target===div){_colaConfirmarCerrar()}}
  document.body.appendChild(div)
  _colaRender()
  window._colaState.timerId=setInterval(()=>{
    const t=document.getElementById('cola-timer')
    if(t&&window._colaState.inicio&&!window._colaState.fin){
      t.textContent=_colaFmtTime(Date.now()-window._colaState.inicio)
    }
  },1000)
}

function _colaCerrar(){
  if(window._colaState.timerId){clearInterval(window._colaState.timerId);window._colaState.timerId=null}
  closeModal()
  cargarNovedadesPorFecha()
}

function _colaRender(){
  const st=window._colaState
  const body=document.getElementById('cola-body')
  if(!body)return
  const total=st.items.length
  if(st.idx>=total){
    if(!st.fin)st.fin=Date.now()
    const dur=st.fin-st.inicio
    const prom=st.contactadasEnSesion>0?Math.round(dur/st.contactadasEnSesion/1000):0
    body.innerHTML=`<div style="padding:32px;text-align:center">
      <div style="font-size:42px;margin-bottom:8px">🎉</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:6px">¡Cola terminada!</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Buen trabajo. Te quedó este resumen:</div>
      <div class="cards-row c3" style="margin-bottom:16px">
        <div class="card" style="border-left:3px solid var(--green)"><div class="card-label">✅ Contactadas</div><div class="card-val" style="color:var(--green)">${st.contactadasEnSesion} / ${total}</div></div>
        <div class="card" style="border-left:3px solid var(--blue)"><div class="card-label">⏱ Tiempo total</div><div class="card-val" style="color:var(--blue);font-size:20px">${_colaFmtTime(dur)}</div></div>
        <div class="card" style="border-left:3px solid #a78bfa"><div class="card-label">⚡ Promedio</div><div class="card-val" style="color:#a78bfa;font-size:20px">${st.contactadasEnSesion>0?prom+'s/nov':'—'}</div></div>
      </div>
      ${st.saltadas>0?`<div class="alert alert-yellow" style="margin-bottom:14px">⏩ Saltaste ${st.saltadas} novedad${st.saltadas>1?'es':''}. Las puedes contactar más tarde.</div>`:''}
      <button class="btn-primary" style="padding:10px 18px" onclick="_colaCerrarBtn()">Cerrar</button>
    </div>`
    if(st.timerId){clearInterval(st.timerId);st.timerId=null}
    return
  }
  const m=st.items[st.idx]
  const armado=_colaArmarMensaje(m)
  const pct=Math.round(((st.idx)/total)*100)
  const yaContactada=!!m.contact
  const diasTxt=(m.dias!==null&&m.dias!==undefined)?`${m.dias}d`:'—'
  const diasColor=m.dias>5?'var(--red)':m.dias>3?'var(--amber)':'var(--green)'
  body.innerHTML=`
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);background:var(--card2)">

window._colaAbrirWa=async()=>{
  const st=window._colaState
  const m=st.items[st.idx]
  if(!m)return
  const armado=_colaArmarMensaje(m)
  const telLimpio=String(m.tel||'').replace(/\D/g,'')
  const telConPrefijo=telLimpio.startsWith('57')?telLimpio:('57'+telLimpio)
  const url=`https://wa.me/${telConPrefijo}?text=${encodeURIComponent(armado.msg)}`
  window.open(url,'_blank','noopener')
  if(!m.contact){
    try{
      await sb.from('novedades_resoluciones').insert({
        telefono:m.tel,orden_id:m.orden_id||null,accion:'contactada',motivo:null,
        usuario_id:me?.id||null,usuario_nombre:me?.nombre||null
      })
      m.contact={cuando:new Date().toISOString(),usuario:me?.nombre||''}
      logAction('novedad_contactada_cola',{tel:m.tel,orden_id:m.orden_id}).catch(()=>{})
    }catch(e){console.warn('No se pudo registrar contacto:',e)}
  }
  st.contactadasEnSesion++
  const body=document.getElementById('cola-body')
  if(body){
    const overlay=document.createElement('div')
    overlay.style.cssText='position:absolute;inset:0;background:rgba(34,197,94,.18);display:flex;align-items:center;justify-content:center;font-size:54px;pointer-events:none;border-radius:inherit;z-index:5'
    overlay.textContent='✅'
    body.style.position='relative'
    body.appendChild(overlay)
    setTimeout(()=>{st.idx++;_colaRender()},2000)
  }else{
    st.idx++;_colaRender()
  }
}

window._colaSiguiente=()=>{window._colaState.idx++;_colaRender()}
window._colaSaltar=()=>{window._colaState.saltadas++;window._colaState.idx++;_colaRender()}
window._colaAnterior=()=>{

window._colaCopiarPaso=(paso,btn)=>{
  const id=paso===1?'cola-msg-paso1':'cola-msg-paso2'
  const el=document.getElementById(id)
  if(!el)return
  const txt=el.textContent
  const orig=btn?.textContent||'📋 Copiar'
  navigator.clipboard.writeText(txt).then(()=>{
    if(btn){btn.textContent='✅ Copiado';setTimeout(()=>{btn.textContent=orig},1500)}
  }).catch(()=>{})
}
window._colaMarcarResuelta=async()=>{

// ── RECLAME EN OFICINA: Mensajes por nivel de envío ────────
const RECLAME_MSGS=[
  // Nivel 1 (primer envío)
  `Hola [NOMBRE] 👋, te informamos que tu pedido de [PRODUCTO] ([CANTIDAD]) ya está disponible en la oficina de [TRANSPORTADORA] en [CIUDAD] para su recogida 📦.

Tu número de guía es:
*[GUIA]*

⚠️ La oficina solo guarda los paquetes por 5 días hábiles. Después de eso, el pedido se devuelve automáticamente.

¡Te esperamos! 😊`,
  // Nivel 2 (segundo envío)
  `Hola [NOMBRE], este es un segundo aviso sobre tu pedido de [PRODUCTO] ([CANTIDAD]) 📦.

Sigue esperándote en la oficina de [TRANSPORTADORA] en [CIUDAD].

Guía: *[GUIA]*

⏳ El tiempo para reclamarlo se está acabando. Si no lo recoges pronto, será devuelto y no podremos garantizar un nuevo envío.

Por favor acércate lo antes posible 🙏`,
  // Nivel 3+ (tercer envío en adelante)
  `[NOMBRE], ÚLTIMO AVISO sobre tu pedido de [PRODUCTO] ([CANTIDAD]) ⚠️

Tu paquete sigue en la oficina de [TRANSPORTADORA] en [CIUDAD] pero está a punto de ser devuelto.

Guía: *[GUIA]*

❌ Si se devuelve, perderás tu pedido y no podemos asegurar un reenvío.

Reclámalo HOY. Es urgente.`
]

function getNivelMensajeReclame(envios){
  if(envios===0)return 1
  if(envios===1)return 2
  return 3
}

function armarMensajeReclame(m,nivel){
  const idx=Math.min(Math.max(nivel,1),3)-1
  const tpl=RECLAME_MSGS[idx]
  const prodNom=(typeof resolveProdName==='function'?(resolveProdName(m.producto)||{}).nombre:null)||m.producto||'[PRODUCTO]'
  const cantTxt=m.cantidad?`${m.cantidad} unidad${m.cantidad>1?'es':''}`:'[CANTIDAD]'
  return tpl
    .replace(/\[NOMBRE\]/g,m.nombre||'[NOMBRE]')
    .replace(/\[PRODUCTO\]/g,prodNom)
    .replace(/\[CANTIDAD\]/g,cantTxt)
    .replace(/\[TRANSPORTADORA\]/g,m.carrier||'la transportadora')
    .replace(/\[CIUDAD\]/g,m.ciudad||'[CIUDAD]')
    .replace(/\[GUIA\]/g,m.guia||'[GUÍA]')
}

async function cargarReclamePorFecha(){
  const el=document.getElementById('rec-content')
  if(!el)return
  const fecha=document.getElementById('rec-fecha')?.value||today()
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Cargando lote de '+fecha+'...</div>'
  try{
    const{data:rep}=await sb.from('reclame_reportes').select('*').eq('fecha_lote',fecha).maybeSingle()
    if(!rep){
      el.innerHTML=`<div class="alert alert-blue">Sin lote guardado para ${fecha}. Sube un archivo arriba.</div>`
      window._reclameCache={fechaActiva:fecha,items:[],reporteId:null}
      return
    }
    const{data:items}=await sb.from('reclame_items').select('*').eq('reporte_id',rep.id).limit(5000)
    const tels=[...new Set((items||[]).map(i=>i.telefono))]
    let envios=[]
    let mapeosProd=[]
    if(tels.length){
      for(let i=0;i<tels.length;i+=100){
        const batch=tels.slice(i,i+100)
        const{data:ed}=await sb.from('reclame_envios').select('telefono,guia,created_at,usuario_nombre,nivel_mensaje').in('telefono',batch).order('created_at',{ascending:false}).limit(20000)
        if(ed)envios=envios.concat(ed)
        // Cargar producto del mapeo (asignador) para resolver al nombre canónico
        const{data:md}=await sb.from('mapeos').select('telefono,producto').in('telefono',batch)
        if(md)mapeosProd=mapeosProd.concat(md)
      }
    }
    const enviosMap={}
    const resueltasMap={}
    for(const e of envios){
      const k=(e.telefono||'')+'|'+(e.guia||'')
      // nivel_mensaje=99 → marca de "resuelta" (no cuenta como envío real)
      if(e.nivel_mensaje===99){
        if(!resueltasMap[k])resueltasMap[k]={fecha:e.created_at,usuario:e.usuario_nombre}
        continue
      }
      if(!enviosMap[k])enviosMap[k]={count:0,ultimo:null,usuario:null}
      enviosMap[k].count++
      if(!enviosMap[k].ultimo)enviosMap[k].ultimo=e.created_at
      if(!enviosMap[k].usuario)enviosMap[k].usuario=e.usuario_nombre
    }
    const prodByTel={}
    for(const mp of mapeosProd){if(!prodByTel[mp.telefono]&&mp.producto)prodByTel[mp.telefono]=mp.producto}
    const enriched=(items||[]).map(it=>{
      const k=(it.telefono||'')+'|'+(it.guia||'')
      const env=enviosMap[k]||{count:0,ultimo:null,usuario:null}
      const res=resueltasMap[k]||null
      return{
        tel:it.telefono,guia:it.guia,nombre:it.cliente_nombre,
        carrier:it.carrier,ciudad:it.ciudad,depto:it.depto,direccion:it.direccion,
        producto:prodByTel[it.telefono]||it.producto,cantidad:it.cantidad,orden_id:it.orden_id,
        envios:env.count,ultimoEnvio:env.ultimo,ultimoUsuario:env.usuario,
        resuelta:!!res,resueltaFecha:res?.fecha||null,resueltaUsuario:res?.usuario||null
      }
    })
    enriched.sort((a,b)=>a.envios-b.envios||(a.nombre||'').localeCompare(b.nombre||''))
    window._reclameCache={fechaActiva:fecha,items:enriched,reporteId:rep.id}
    renderReclameContent(rep,enriched)
  }catch(e){
    el.innerHTML=`<div class="alert alert-red">Error cargando: ${e.message}</div>`
  }
}

function renderReclameContent(rep,items){

  if(!el)return
  // Separar resueltas del flujo normal
  const itemsActivos=items.filter(i=>!i.resuelta)

    if(!ms||ms<0)return'—'
    const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60)
    if(h>=24){const d=Math.floor(h/24),hr=h%24;return`${d}d ${hr}h`}

    const btnEnviar=`<button class="btn-sm btn-primary" onclick="enviarReclameUno('${m.tel}','${esc(m.guia)}')">📨 Enviar aviso ${nivel}</button>`
    const btnResuelta=`<button class="btn-sm" style="background:var(--green);color:#fff;border:none" onclick="marcarReclameResuelta('${m.tel}','${esc(m.guia)}')">✅ Resuelta</button>`

window.procesarReclameXlsx=async()=>{
  const fileInput=document.getElementById('rec-file')
  const msg=document.getElementById('rec-msg')
  if(!fileInput.files.length){msg.innerHTML='<div class="alert alert-red">Selecciona un archivo</div>';return}
  msg.innerHTML='<div class="alert alert-blue">Procesando...</div>'
  try{
    const file=fileInput.files[0]
    const filename=file.name
    const buf=await file.arrayBuffer()
    const wbook=XLSX.read(buf,{type:'array'})
    const rows=XLSX.utils.sheet_to_json(wbook.Sheets[wbook.SheetNames[0]],{defval:''})
    if(!rows.length){msg.innerHTML='<div class="alert alert-red">Archivo vacío</div>';return}
    const filtered=rows.filter(r=>{
      const status=String(r['ESTATUS']||'').toUpperCase().trim()
      return status==='RECLAME EN OFICINA'
    })
    if(!filtered.length){msg.innerHTML='<div class="alert alert-yellow">No hay pedidos en RECLAME EN OFICINA en este archivo</div>';return}
    const items=filtered.map(r=>{
      const tel=String(r['TELÉFONO']||r['TELEFONO']||'').replace(/\D/g,'')
      const nombre=String(r['NOMBRE CLIENTE']||'').trim()
      const guia=String(r['NÚMERO GUIA']||r['NUMERO GUIA']||r['NUMERO DE GUIA']||'').trim()
      const carrier=String(r['TRANSPORTADORA']||'').trim()
      const ciudad=String(r['CIUDAD DESTINO']||r['CIUDAD']||'').trim()
      const depto=String(r['DEPARTAMENTO DESTINO']||r['DEPARTAMENTO']||'').trim()
      const direccion=String(r['DIRECCION']||r['DIRECCIÓN']||'').trim()
      const producto=String(r['PRODUCTO']||'').trim()
      const cantidad=parseInt(r['CANTIDAD']||'0')||null
      const ordenId=String(r['ID']||'').trim()
      const fechaOrden=String(r['FECHA']||'').trim()
      return{tel,nombre,guia,carrier,ciudad,depto,direccion,producto,cantidad,ordenId,fechaOrden}
    }).filter(i=>i.tel.length>=7)
    const telefonos=[...new Set(items.map(i=>i.tel))]
    let mapeos=[]
    for(let i=0;i<telefonos.length;i+=100){
      const batch=telefonos.slice(i,i+100)
      const{data}=await sb.from('mapeos').select('telefono,ad_id,producto').in('telefono',batch)
      if(data)mapeos=mapeos.concat(data)
    }
    const mByTel={}
    for(const m of mapeos){if(!mByTel[m.telefono])mByTel[m.telefono]=m}
    for(const item of items){
      const m=mByTel[item.tel]
      item.ad_id=m?.ad_id||null
      // Preferir el producto del mapeo (asignador) sobre el del XLSX
      // para que resolveProdName pueda mapearlo al nombre canónico
      if(m?.producto)item.producto=m.producto
    }
    const fechaLote=today()
    const{data:existing}=await sb.from('reclame_reportes').select('id').eq('fecha_lote',fechaLote).maybeSingle()
    if(existing){
      const{error:delErr}=await sb.from('reclame_reportes').delete().eq('id',existing.id)
      if(delErr){msg.innerHTML=`<div class="alert alert-red">Error reemplazando: ${delErr.message}</div>`;return}
    }
    const{data:newRep,error:repErr}=await sb.from('reclame_reportes').insert({
      fecha_lote:fechaLote,uploaded_by:me?.id||null,uploaded_by_name:me?.nombre||null,
      filename,total_items:items.length
    }).select().single()
    if(repErr){msg.innerHTML=`<div class="alert alert-red">Error guardando: ${repErr.message}</div>`;return}
    const itemsInsert=items.map(it=>({
      reporte_id:newRep.id,fecha_lote:fechaLote,
      telefono:it.tel,orden_id:it.ordenId||null,guia:it.guia||null,
      cliente_nombre:it.nombre||null,carrier:it.carrier||null,
      ciudad:it.ciudad||null,depto:it.depto||null,direccion:it.direccion||null,
      producto:it.producto||null,cantidad:it.cantidad||null,
      fecha_orden:it.fechaOrden||null,ad_id:it.ad_id||null
    }))
    for(let i=0;i<itemsInsert.length;i+=500){
      const chunk=itemsInsert.slice(i,i+500)
      const{error:insErr}=await sb.from('reclame_items').insert(chunk)
      if(insErr){msg.innerHTML=`<div class="alert alert-red">Error guardando items: ${insErr.message}</div>`;return}
    }
    msg.innerHTML=`<div class="alert alert-green">✅ ${items.length} pedidos en reclame guardados${existing?' · ♻️ Reemplazó lote anterior':''}</div>`
    document.getElementById('rec-fecha').value=fechaLote
    cargarReclamePorFecha()
    logAction('reclame_procesado',{total:items.length,fecha_lote:fechaLote,reemplazo:!!existing}).catch(()=>{})
  }catch(e){
    msg.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`
  }
}

window.marcarReclameResuelta=async(tel,guia)=>{
  const cache=window._reclameCache||{}
  const m=(cache.items||[]).find(i=>i.tel===tel&&(i.guia||'')===(guia||''))

  try{

window.desmarcarReclameResuelta=async(tel,guia)=>{
  const cache=window._reclameCache||{}
  const m=(cache.items||[]).find(i=>i.tel===tel&&(i.guia||'')===(guia||''))
  if(!m){alert('No se encontró el pedido');return}
  const motivo=prompt('¿Por qué desmarcas esta resuelta? (obligatorio)')
  if(motivo===null)return
  const motivoTrim=(motivo||'').trim()
  if(!motivoTrim){alert('Debes escribir un motivo');return}
  try{
    // Eliminar la marca (nivel_mensaje=99) más reciente para este telefono+guia
    let q=sb.from('reclame_envios').delete().eq('telefono',m.tel).eq('nivel_mensaje',99)
    if(m.guia)q=q.eq('guia',m.guia)
    else q=q.is('guia',null)
    const{error}=await q
    if(error)throw error
    logAction('reclame_resuelta_desmarcada',{tel:m.tel,guia:m.guia,motivo:motivoTrim}).catch(()=>{})
    const toast=document.createElement('div')
    toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--amber);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3)'
    toast.textContent='↩️ Resuelta desmarcada'
    document.body.appendChild(toast)
    setTimeout(()=>toast.remove(),2200)
  }catch(e){alert('Error: '+e.message);return}
  setTimeout(()=>cargarReclamePorFecha(),400)
}


window._recColaState={items:[],idx:0,inicio:null,fin:null,timerId:null,enviadosEnSesion:0,saltadas:0}

function _recColaEscHtml(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function _recColaFmtTime(ms){
  if(!ms||ms<0)return'0s'
  const s=Math.floor(ms/1000),m=Math.floor(s/60),sr=s%60
  if(m>=60){const h=Math.floor(m/60),mr=m%60;return`${h}h ${mr}m`}
  if(m>0)return`${m}m ${sr}s`
  return`${sr}s`
}

window.abrirColaReclame=()=>{
  const cache=window._reclameCache||{}
  const items=(cache.items||[]).slice().filter(m=>!m.resuelta)
  if(!items.length){alert('No hay pedidos para enviar.');return}
  const sinEnvios=items.filter(m=>m.envios===0)
  const conEnvios=items.filter(m=>m.envios>0)
  const cola=[...sinEnvios,...conEnvios]
  window._recColaState={items:cola,idx:0,inicio:Date.now(),fin:null,timerId:null,enviadosEnSesion:0,saltadas:0}
  closeModal()
  const div=document.createElement('div')
  div.id='user-modal'
  div.className='modal-bg'
  div.innerHTML=`<div class="modal-box" onclick="event.stopPropagation()" style="max-width:680px;padding:0;overflow:hidden">
    <div id="rec-cola-body"></div>
  </div>`
  div.onclick=(e)=>{if(e.target===div){_recColaConfirmarCerrar()}}
  document.body.appendChild(div)
  _recColaRender()
  window._recColaState.timerId=setInterval(()=>{
    const t=document.getElementById('rec-cola-timer')
    if(t&&window._recColaState.inicio&&!window._recColaState.fin){
      t.textContent=_recColaFmtTime(Date.now()-window._recColaState.inicio)
    }
  },1000)
}

function _recColaCerrar(){
  if(window._recColaState.timerId){clearInterval(window._recColaState.timerId);window._recColaState.timerId=null}
  closeModal()
  cargarReclamePorFecha()
}

window._recColaAbrirWa=async()=>{

  const mensaje=armarMensajeReclame(m,nivel)
  const telLimpio=String(m.tel||'').replace(/\D/g,'')
  const telConPrefijo=telLimpio.startsWith('57')?telLimpio:('57'+telLimpio)
  const url=`https://wa.me/${telConPrefijo}?text=${encodeURIComponent(mensaje)}`
  window.open(url,'_blank','noopener')
  try{
    await sb.from('reclame_envios').insert({
      telefono:m.tel,guia:m.guia||null,nivel_mensaje:nivel,
      usuario_id:me?.id||null,usuario_nombre:me?.nombre||null
    })
    m.envios=(m.envios||0)+1
    logAction('reclame_enviado_cola',{tel:m.tel,guia:m.guia,nivel}).catch(()=>{})
  }catch(e){console.warn('No se pudo registrar envío:',e)}
  st.enviadosEnSesion++
  const body=document.getElementById('rec-cola-body')
  if(body){
    const overlay=document.createElement('div')
    overlay.style.cssText='position:absolute;inset:0;background:rgba(34,197,94,.18);display:flex;align-items:center;justify-content:center;font-size:54px;pointer-events:none;border-radius:inherit;z-index:5'

    body.style.position='relative'
    body.appendChild(overlay)
    setTimeout(()=>{st.idx++;_recColaRender()},2000)
  }else{
    st.idx++;_recColaRender()
  }
}

window._recColaSiguiente=()=>{window._recColaState.idx++;_recColaRender()}

    const all=Object.values(checks).every(Boolean)
    card.innerHTML=`
      <div class="section-title" style="margin-bottom:12px">Checklist de cierre</div>
      <div class="checklist">
        ${[
          ['novedades','¿Resolviste todas las novedades del carrier?'],

          ['etiquetas','¿Cambiaste conversaciones a etiqueta Meta Ads en SellerChat?']

          <div class="check-item ${checks[k]?'checked':''}" onclick="toggleCheck('${k}')">
            <div class="check-box">${checks[k]?'✓':''}</div>
            <div class="check-label">${label}</div>

      </div>
      ${!all?'<div class="alert alert-amber" style="background:var(--amber-bg);color:var(--amber);border:1px solid #78350f">Completa todos los items para cerrar</div>':

  }

  window.toggleCheck=async(key)=>{

    const fieldMap={novedades:'ch_novedades',guias:'ch_guias_reclame',
                    pendientes:'ch_pendientes',etiquetas:'ch_etiquetas_meta'}
    await sb.from('reportes_diarios').update({[fieldMap[key]]:checks[key]}).eq('id',rep.id)
    renderCierre()
  }

  window.cerrarJornada=async()=>{
    const{error}=await sb.from('reportes_diarios').update({
      jornada_cerrada:true,hora_cierre:new Date().toISOString(),
      ch_novedades:true,ch_guias_reclame:true,ch_pendientes:true,ch_etiquetas_meta:true
    }).eq('id',rep.id)
    const msg=document.getElementById('cierre-msg')
    if(error)msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{
      card.innerHTML=`<div class="semaforo sem-verde">
        <div class="sem-dot"></div>
        <div><div class="sem-title">¡Jornada cerrada! ✅</div>
        <div class="sem-msg">${new Date().toLocaleTimeString('es-CO')} — Buen trabajo hoy.</div></div></div>`
      logAction('jornada_cerrada',{reporte_id:rep.id}).catch(()=>{})
    }
  }

  renderCierre()
}

async function cargarRegistrosDia(){
  const el=document.getElementById('reg-dia-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  const tipo=document.getElementById('reg-tipo-fecha')?.value||'compra'
  const fecha=document.getElementById('reg-fecha')?.value||''
  if(!fecha){el.innerHTML='<div class="alert alert-blue">Selecciona una fecha</div>';return}
  const campo=tipo==='dropi'?'fecha_dropi':'fecha'
  const{data,error}=await sb.from('mapeos').select('*')
    .eq(campo,fecha).not('estado_final','is',null).order('estado_final')
  if(error){el.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
  if(!data||!data.length){
    el.innerHTML='<div class="alert alert-blue">Sin registros para esta fecha</div>';return
  }
  const pend=data.filter(m=>m.estado_final==='PENDIENTE CONFIRMACION')
  const canc=data.filter(m=>m.estado_final==='CANCELADO')
  const conf=data.filter(m=>m.estado_final!=='PENDIENTE CONFIRMACION'&&m.estado_final!=='CANCELADO')
  const esHoy=fecha===today()&&tipo==='compra'
  const _card=(m)=>`<div class="card" style="margin-bottom:8px;padding:12px">
    <div style="font-size:14px;font-weight:600;font-family:monospace">${m.telefono}</div>
    <div style="font-size:13px;color:var(--text);margin-top:2px">${m.nombre_cliente||'—'}</div>
    <div style="font-size:11px;color:var(--muted)">${m.producto||'—'} · ${m.ciudad||'—'}</div>
  </div>`
  el.innerHTML=`
    <div class="cards-row c3" style="margin-bottom:14px">
      <div class="card c-green"><div class="card-label">Confirmados</div><div class="card-val">${conf.length}</div></div>
      <div class="card c-amber"><div class="card-label">Pendientes</div><div class="card-val">${pend.length}</div></div>
      <div class="card c-red"><div class="card-label">Cancelados</div><div class="card-val">${canc.length}</div></div>
    </div>
    ${!esHoy?'<div class="alert alert-blue" style="margin-bottom:14px">📅 Fecha anterior — solo lectura. Para confirmar un reservado, ve a la sección "Confirmar reservado" e ingresa el número.</div>':''}
    <div style="margin-bottom:18px">
      <div class="section-title">✅ Confirmados (${conf.length})</div>
      ${conf.length===0?'<div class="alert alert-green">Sin confirmados</div>':
      `<div class="form-grid g3">${conf.map(_card).join('')}</div>`}
    </div>
    <div class="form-grid g2">
      <div>
        <div class="section-title">⏳ Pendientes por confirmar (${pend.length})</div>
        ${pend.length===0?'<div class="alert alert-green">Sin pendientes</div>':
        pend.map(_card).join('')}
      </div>
      <div>
        <div class="section-title">❌ Cancelados (${canc.length})</div>
        ${canc.length===0?'<div class="alert alert-green">Sin cancelados</div>':
        canc.map(_card).join('')}
      </div>
    </div>`
}

window.procesarDropi=async()=>{
  const fileInput=document.getElementById('dropi-file')
  const msg=document.getElementById('dropi-msg')
  const resEl=document.getElementById('dropi-resultado')
  if(!fileInput.files.length){msg.innerHTML='<div class="alert alert-red">Selecciona un archivo</div>';return}
  msg.innerHTML='<div class="alert alert-blue">Procesando archivo...</div>'

  try{
    // 1. Parsear xlsx
    const buf=await fileInput.files[0].arrayBuffer()
    const wbook=XLSX.read(buf,{type:'array'})
    const rows=XLSX.utils.sheet_to_json(wbook.Sheets[wbook.SheetNames[0]],{defval:''})
    if(!rows.length){msg.innerHTML='<div class="alert alert-red">El archivo está vacío</div>';return}

    // 2. Extraer datos relevantes
    const ordenes=rows.map(r=>({
      telefono:String(r['TELÉFONO']||r['TELEFONO']||'').replace(/\D/g,''),
      estatus:String(r['ESTATUS']||'').trim().toUpperCase(),
      fecha_dropi:String(r['FECHA']||''),
      producto:String(r['PRODUCTO']||''),
      cantidad:parseInt(r['CANTIDAD'])||1,
      transportadora:String(r['TRANSPORTADORA']||''),
      total:parseFloat(r['TOTAL DE LA ORDEN'])||0,
      novedad:String(r['NOVEDAD']||''),
      ciudad:String(r['CIUDAD DESTINO']||''),
      nombre:String(r['NOMBRE CLIENTE']||''),
      id_dropi:String(r['ID']||''),
    })).filter(o=>o.telefono.length>=7)

    // 3. Buscar en mapeos por teléfono (paginado)
    const telefonos=[...new Set(ordenes.map(o=>o.telefono))]
    let mapeos=[]
    for(let i=0;i<telefonos.length;i+=100){
      const batch=telefonos.slice(i,i+100)
      const{data}=await sb.from('mapeos').select('*').in('telefono',batch)
      if(data)mapeos=mapeos.concat(data)
    }

    // Index mapeos por teléfono
    const mByTel={}
    for(const m of mapeos){if(!mByTel[m.telefono])mByTel[m.telefono]=[];mByTel[m.telefono].push(m)}

    // 4. Cruzar
    const resultados=ordenes.map(o=>{
      const mapeo=mByTel[o.telefono]?.[0]||null
      const si=DROPI_STATUS[o.estatus]||{cat:'otro',emoji:'❓',pill:'pill-blue',label:o.estatus}
      return{...o,mapeo,cruzado:!!mapeo,ad_id:mapeo?.ad_id||null,fecha_venta:mapeo?.fecha||null,si,
        producto:mapeo?.producto||o.producto}
    })

    // 5. Conteos
    const total=resultados.length
    const cruzados=resultados.filter(r=>r.cruzado).length
    const sinCruce=total-cruzados
    const porCat={}
    for(const r of resultados)porCat[r.si.cat]=(porCat[r.si.cat]||0)+1
    const conAd=resultados.filter(r=>r.cruzado&&r.ad_id).length
    const organicos=cruzados-conAd

    // 6. Render
    msg.innerHTML=`<div class="alert alert-green">
      ✅ ${total} órdenes procesadas del reporte Dropi<br>
      🔗 ${cruzados} cruzadas con asignador · ${sinCruce} sin cruce
    </div>`

    const catItems=[['entregado','pill-green','✅ Entregados'],['cancelado','pill-red','❌ Cancelados'],
      ['devuelto','pill-red','↩️ Devueltos'],['pendiente','pill-amber','⏳ Pendientes'],
      ['en_proceso','pill-blue','📦 En proceso'],['en_transito','pill-blue','🚚 En tránsito'],
      ['en_bodega','pill-amber','📍 En bodega'],['novedad','pill-amber','⚠️ Novedad']]
    const catHtml=catItems.filter(([k])=>porCat[k]).map(([k,cls,l])=>`<span class="pill ${cls}" style="margin-right:6px">${l}: ${porCat[k]}</span>`).join('')

    resEl.innerHTML=`
      <div class="cards-row c4">
        <div class="card c-blue"><div class="card-label">Total órdenes</div><div class="card-val">${total}</div></div>
        <div class="card c-green"><div class="card-label">Cruzadas</div><div class="card-val">${cruzados}</div>
          <div class="card-sub">Ad: ${conAd} · Org: ${organicos}</div></div>
        <div class="card c-amber"><div class="card-label">Sin cruce</div><div class="card-val">${sinCruce}</div></div>
        <div class="card c-green"><div class="card-label">Entregados</div><div class="card-val">${porCat.entregado||0}</div>
          <div class="card-sub">${total>0?Math.round((porCat.entregado||0)/total*100):0}%</div></div>
      </div>
      <div style="margin-bottom:14px">${catHtml}</div>
      ${cruzados>0?`<div style="margin-bottom:14px">
        <button class="btn-sm btn-green" onclick="actualizarEstadosDropi()">💾 Actualizar estados en sistema (${cruzados} órdenes)</button>
        <span id="dropi-upd-msg" style="margin-left:10px"></span>
      </div>`:''}
      <div class="table-wrap"><table>
        <tr><th>Teléfono</th><th>Nombre</th><th>Ciudad</th><th>Producto</th><th>Cant.</th><th>Estado Dropi</th><th>Transportadora</th><th>Total</th><th>Cruce</th><th>Fecha venta</th></tr>
        ${resultados.map(r=>`<tr>
          <td data-label="Teléfono" style="font-family:monospace">${r.telefono}</td>
          <td data-label="Nombre">${r.nombre}</td>
          <td data-label="Ciudad">${r.ciudad}</td>
          <td data-label="Producto">${r.producto}</td>
          <td data-label="Cant.">${r.cantidad}u</td>
          <td data-label="Estado"><span class="pill ${r.si.pill}">${r.si.emoji} ${r.si.label}</span></td>
          <td data-label="Carrier">${r.transportadora}</td>
          <td data-label="Total">$${fmt(r.total)}</td>
          <td data-label="Cruce">${r.cruzado?`<span class="pill pill-green">${r.ad_id?'Ad':'ORG'}</span>`:'<span class="pill pill-red">—</span>'}</td>
          <td data-label="F. venta" style="font-family:monospace;font-size:11px">${r.fecha_venta||'—'}</td>
        </tr>`).join('')}
      </table></div>`

    window._dropiResultados=resultados
    logAction('dropi_procesado',{total,cruzados,sinCruce,entregados:porCat.entregado||0,cancelados:porCat.cancelado||0}).catch(()=>{})
  }catch(e){
    msg.innerHTML=`<div class="alert alert-red">Error procesando: ${e.message}</div>`
  }
}

window.actualizarEstadosDropi=async()=>{
  const res=window._dropiResultados
  if(!res)return
  const cruzados=res.filter(r=>r.cruzado&&r.mapeo)
  const msgEl=document.getElementById('dropi-upd-msg')
  if(!cruzados.length){msgEl.innerHTML='<span style="color:var(--amber)">Sin órdenes para actualizar</span>';return}
  msgEl.innerHTML='<span style="color:var(--blue)">Actualizando...</span>'
  let ok=0,fail=0
  for(const r of cruzados){
    // Convertir DD-MM-YYYY → YYYY-MM-DD para Supabase
    let fd=null
    if(r.fecha_dropi){const p=r.fecha_dropi.split('-');if(p.length===3)fd=`${p[2]}-${p[1]}-${p[0]}`}
    const{error}=await sb.from('mapeos').update({
      estado_final:r.estatus,
      fecha_dropi:fd,
      nombre_cliente:r.nombre||null,
      cantidad:r.cantidad||1,
      novedad_texto:r.novedad||null,
      transportadora:r.transportadora||null
    }).eq('id',r.mapeo.id)
    if(error)fail++;else ok++
  }
  msgEl.innerHTML=`<span style="color:var(--green)">✅ ${ok} actualizadas${fail?` · ${fail} errores`:''}</span>`
  logAction('dropi_estados_actualizados',{actualizadas:ok,errores:fail}).catch(()=>{})
  // Recargar registros del día
  cargarRegistrosDia()
}

window.saveNewGasto=async()=>{

  document.getElementById('gf-modal-area').innerHTML=''

async function cargarSeguimientoHist(){
  const el=document.getElementById('seg-hist-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  const filtro=document.getElementById('seg-hist-filtro')?.value||''
  const esAdmin=currentRol()==='admin'

  // Traer mapeos con estado_final de entrega (no día 1)
  let query=sb.from('mapeos').select('*').not('fecha_dropi','is',null).not('estado_final','is',null)
  if(filtro)query=query.eq('producto',filtro)
  const{data}=await query.order('fecha_dropi',{ascending:false}).limit(5000)
  if(!data?.length){el.innerHTML='<div class="alert alert-blue">Sin datos de seguimiento aún</div>';return}

  // Agrupar por lote (fecha_dropi)
  const lotes={},fechasCompra=new Set()
  for(const m of data){
    const lote=m.fecha_dropi||'Sin lote'
    if(!lotes[lote])lotes[lote]={entregado:0,devuelto:0,en_transito:0,novedad:0,cancelado:0,pendiente:0,total:0,prods:new Set(),ventaEnt:0,fechas:new Set(),novConFecha:0,novResueltas:0,novDiasTotal:0,telTransito:[],telNovedad:[],telPendiente:[]}
    lotes[lote].total++
    lotes[lote].prods.add(m.producto)
    if(m.fecha){lotes[lote].fechas.add(m.fecha);fechasCompra.add(m.fecha)}
    const st=DROPI_STATUS[m.estado_final]?.cat||'otro'
    if(st==='entregado'||st==='novedad_ok'){
      lotes[lote].entregado++
      const prod=productos.find(p=>p.nombre===m.producto)
      const qty=m.cantidad||1
      const precio=prod?([0,prod.precio_1u,prod.precio_2u,prod.precio_3u,prod.precio_4u][qty]||prod.precio_2u||0):0
      lotes[lote].ventaEnt+=precio
    }
    else if(st==='devuelto')lotes[lote].devuelto++
    else if(st==='en_transito'||st==='en_proceso'||st==='en_bodega'){lotes[lote].en_transito++;if(m.telefono)lotes[lote].telTransito.push(m.telefono)}
    else if(st==='novedad'){lotes[lote].novedad++;if(m.telefono)lotes[lote].telNovedad.push(m.telefono)}
    else if(st==='cancelado')lotes[lote].cancelado++
    else if(st==='pendiente'){lotes[lote].pendiente++;if(m.telefono)lotes[lote].telPendiente.push(m.telefono)}
    if(m.fecha_novedad){
      lotes[lote].novConFecha++
      if(st==='entregado'||st==='novedad_ok'||st==='devuelto'){
        lotes[lote].novResueltas++
        const fNov=new Date(m.fecha_novedad+'T12:00:00')
        const fDrp=new Date(lote+'T12:00:00')
        const dias=Math.round((fDrp-fNov)/(86400000))
        if(dias>=0)lotes[lote].novDiasTotal+=dias
      }
    }
  }

  // Fetch gasto_ads para fechas de compra (admin only, para ROAS por lote)
  let gastoByFecha={}
  if(esAdmin&&fechasCompra.size>0){
    const fechaArr=[...fechasCompra]
    for(let i=0;i<fechaArr.length;i+=100){
      const batch=fechaArr.slice(i,i+100)
      const{data:gastos}=await sb.from('gasto_ads').select('fecha,monto').in('fecha',batch)
      if(gastos)for(const g of gastos)gastoByFecha[g.fecha]=(gastoByFecha[g.fecha]||0)+(g.monto||0)
    }
  }

  const weeks=Object.entries(lotes).sort((a,b)=>b[0].localeCompare(a[0]))
  el.innerHTML=weeks.map(([fecha,d])=>{
    const pctEnt=d.total>0?Math.round(d.entregado/d.total*100):0
    const pctDev=d.total>0?Math.round(d.devuelto/d.total*100):0
    const devColor=pctDev>20?'var(--red)':pctDev>15?'var(--amber)':'var(--green)'
    let devEstHtml=''
    if(esAdmin){
      const prodPrincipal=[...d.prods][0]
      const prodObj=productos.find(p=>p.nombre===prodPrincipal)
      const estPct=prodObj?Math.round((prodObj.dev_pct||0)*100):null
      if(estPct!==null){
        const diffColor=pctDev>estPct?'var(--red)':'var(--green)'
        devEstHtml=` · Estimada: ${estPct}% → Real: <strong style="color:${diffColor}">${pctDev}%</strong> ${pctDev>estPct?'⚠️':'✅'}`
        const diffPct=(pctDev-estPct)/100
        if(diffPct>0){
          const extraDevs=Math.round(diffPct*d.total)
          const fp=prodObj.precio_2u||129900,fc=prodObj.costo_2u||36000
          const ffo=prodObj.flete_outbound||21000,ffd=prodObj.flete_devolucion||18000
          const impMargen=Math.round(extraDevs*(fp-fc-ffo+ffd))
          devEstHtml+=`<br>💸 <strong style="color:var(--red)">${extraDevs} devol. extra</strong> → Impacto: <strong style="color:var(--red)">-$${fmt(impMargen)}</strong>`
        }
      }
    }
    // Edad del lote (días desde fecha_dropi hasta hoy)
    let edadDias=null
    if(fecha&&fecha!=='Sin lote'){
      const fDrp=new Date(fecha+'T12:00:00')
      if(!isNaN(fDrp))edadDias=Math.floor((new Date()-fDrp)/86400000)
    }
    // Badge de estado del lote (interpretación B: pendientes cuentan como "no cerrado")
    const enMovimientoCarrier=d.en_transito+d.novedad
    const requierenAccion=enMovimientoCarrier+d.pendiente
    let badgeHtml=''
    if(requierenAccion===0){
      badgeHtml=`<span class="pill" style="background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3);font-size:11px">✅ Cerrado</span>`
    }else if(edadDias!==null&&edadDias>=10&&enMovimientoCarrier>0){
      badgeHtml=`<span class="pill" style="background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.4);font-size:11px">⚠️ Atascado</span>`
    }else{
      badgeHtml=`<span class="pill" style="background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.3);font-size:11px">🔥 Activo</span>`
    }
    const edadHtml=edadDias!==null?`<span style="color:var(--muted);font-size:12px;font-weight:400">📅 hace ${edadDias} ${edadDias===1?'día':'días'}</span>`:''
    // Porcentajes para todas las cards
    const pctTran=d.total>0?Math.round(d.en_transito/d.total*100):0
    const pctNov=d.total>0?Math.round(d.novedad/d.total*100):0
    const pctCanc=d.total>0?Math.round(d.cancelado/d.total*100):0
    const pctPend=d.total>0?Math.round(d.pendiente/d.total*100):0
    // Validación de suma
    const suma=d.entregado+d.devuelto+d.en_transito+d.novedad+d.cancelado+d.pendiente
    const pctSuma=d.total>0?Math.round(suma/d.total*100):0
    const falta=d.total-suma
    // Teléfonos a contactar (En Tránsito + Pendientes + Novedad — únicos)
    const telsContacto=[...new Set([...d.telTransito,...d.telPendiente,...d.telNovedad])].filter(Boolean)
    return`<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <div style="flex:1;min-width:240px">
          <div style="font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap">📦 Lote ${fecha} ${edadHtml} ${badgeHtml}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px">${d.total} órdenes · ${[...d.prods].filter(Boolean).join(', ')}</div>
        </div>
        <button class="btn-sm btn-outline" onclick="cargarSeguimientoHist()" title="Refrescar este lote desde BD">🔄 Refrescar</button>
      </div>
      <div class="cards-row c6" style="margin-bottom:8px">
        <div class="card c-green" style="padding:10px"><div class="card-label">Entregados</div><div class="card-val">${pctEnt}%</div></div>
        <div class="card c-red" style="padding:10px"><div class="card-label">Devueltos</div><div class="card-val">${d.devuelto} <span style="font-size:12px">(${pctDev}%)</span></div></div>
        <div class="card c-blue" style="padding:10px"><div class="card-label">En tránsito</div><div class="card-val">${d.en_transito} <span style="font-size:12px">(${pctTran}%)</span></div></div>
        <div class="card c-amber" style="padding:10px"><div class="card-label">Novedad</div><div class="card-val">${d.novedad} <span style="font-size:12px">(${pctNov}%)</span></div></div>
        <div class="card c-red" style="padding:10px"><div class="card-label">Cancelados</div><div class="card-val">${d.cancelado} <span style="font-size:12px">(${pctCanc}%)</span></div></div>
        <div class="card c-amber" style="padding:10px"><div class="card-label">Pendientes</div><div class="card-val">${d.pendiente} <span style="font-size:12px">(${pctPend}%)</span></div></div>
      </div>
      ${falta!==0?`<div style="font-size:12px;color:var(--amber);margin-bottom:8px;padding:6px 10px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:6px">⚠️ Suma: ${pctSuma}% — ${suma}/${d.total} órdenes clasificadas${falta>0?` (faltan ${falta} sin clasificar)`:` (excede en ${-falta})`}</div>`:`<div style="font-size:11px;color:var(--green);margin-bottom:8px">✓ Suma 100% (${suma}/${d.total})</div>`}
      ${telsContacto.length>0?`<div style="font-size:12px;margin-bottom:8px;padding:8px 10px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.25);border-radius:6px">
        <div style="margin-bottom:6px">📞 <strong>${telsContacto.length} órdenes requieren seguimiento</strong> (En Tránsito: ${d.en_transito} · Pendientes: ${d.pendiente}${d.novedad>0?` · Novedad: ${d.novedad}`:''}) — revisar en Dropi y contactar:</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${telsContacto.map(t=>`<span onclick="navigator.clipboard.writeText('${t}').then(()=>{this.style.background='rgba(34,197,94,.3)';this.textContent='✓ ${t}';setTimeout(()=>{this.style.background='';this.textContent='${t}'},1200)})" style="cursor:pointer;padding:3px 8px;background:var(--card2);border:1px solid var(--border);border-radius:6px;font-family:monospace;font-size:11px;user-select:none" title="Clic para copiar">${t}</span>`).join('')}
        </div>
      </div>`:''}
      <div style="font-size:13px">Devol. real: <strong style="color:${devColor}">${pctDev}%</strong>${devEstHtml}</div>
      ${d.novConFecha>0?(()=>{
        const promDias=d.novResueltas>0?Math.round(d.novDiasTotal/d.novResueltas):null
        const promColor=promDias===null?'var(--muted)':promDias>7?'var(--red)':promDias>4?'var(--amber)':'var(--green)'
        const pendientes=d.novConFecha-d.novResueltas
        return`<div style="font-size:13px;margin-top:4px">⏱️ Novedades: <strong>${d.novResueltas}</strong> resueltas de <strong>${d.novConFecha}</strong>${pendientes>0?` · <span style="color:var(--amber)">${pendientes} pendientes</span>`:''}${promDias!==null?` · Promedio: <strong style="color:${promColor}">${promDias} días</strong>`:''}</div>`
      })():''}
      ${esAdmin?(()=>{
        const gastoLote=[...d.fechas].reduce((s,f)=>s+(gastoByFecha[f]||0),0)
        if(!gastoLote||!d.ventaEnt)return''
        const roasLote=d.ventaEnt/gastoLote
        const roasColor=roasLote<1?'var(--red)':roasLote<2?'var(--amber)':'var(--green)'
        return`<div style="font-size:13px;margin-top:4px">ROAS lote: <strong style="color:${roasColor}">${roasLote.toFixed(2)}x</strong> · Venta entregada: $${fmt(d.ventaEnt)} · Gasto: $${fmt(gastoLote)}</div>`
      })():''}
    </div>`
  }).join('')
}
window.cargarSeguimientoHist=cargarSeguimientoHist

async function cargarDevPorCampana(){
  const el=document.getElementById('seg-camp-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  // Traer mapeos con resultado final y ad_id
  const{data}=await sb.from('mapeos').select('ad_id,estado_final,producto')
    .not('estado_final','is',null).not('ad_id','is',null).neq('ad_id','')
    .in('estado_final',['ENTREGADO','DEVOLUCION','NOVEDAD SOLUCIONADA']).limit(10000)
  if(!data?.length){el.innerHTML='<div class="alert alert-blue">Sin datos de entregas con ID de anuncio aún</div>';return}

  // Agrupar por ad_id
  const byAd={}
  for(const m of data){
    const id=m.ad_id
    if(!byAd[id])byAd[id]={entregado:0,devuelto:0,total:0,producto:m.producto||'—'}
    byAd[id].total++
    const st=DROPI_STATUS[m.estado_final]?.cat||'otro'
    if(st==='entregado'||st==='novedad_ok')byAd[id].entregado++
    else if(st==='devuelto')byAd[id].devuelto++
  }

  // Ordenar por peor tasa de devolución
  const rows=Object.entries(byAd)
    .map(([id,d])=>({id,pctDev:d.total>0?Math.round(d.devuelto/d.total*100):0,...d}))
    .filter(r=>r.total>=3)
    .sort((a,b)=>b.pctDev-a.pctDev)

  if(!rows.length){el.innerHTML='<div class="alert alert-blue">Necesita al menos 3 órdenes por anuncio para mostrar datos</div>';return}

  el.innerHTML=`<div class="table-wrap"><table>
    <tr><th>ID Anuncio</th><th>Producto</th><th>Órdenes</th><th>Entregadas</th><th>Devueltas</th><th>% Dev.</th></tr>
    ${rows.map(r=>{
      const devColor=r.pctDev>20?'color:var(--red)':r.pctDev>15?'color:var(--amber)':'color:var(--green)'
      return`<tr>
        <td data-label="ID Anuncio" style="font-family:monospace;font-size:11px">${r.id}</td>
        <td data-label="Producto">${r.producto}</td>
        <td data-label="Órdenes">${r.total}</td>
        <td data-label="Entregadas">${r.entregado}</td>
        <td data-label="Devueltas">${r.devuelto}</td>
        <td data-label="% Dev." style="${devColor};font-weight:600">${r.pctDev}%</td>
      </tr>`
    }).join('')}
  </table></div>`
}
window.cargarDevPorCampana=cargarDevPorCampana

window.procesarSeguimiento=async()=>{
  const fileInput=document.getElementById('seg-file')
  const msg=document.getElementById('seg-msg')
  const resEl=document.getElementById('seg-resultado')
  if(!fileInput.files.length){msg.innerHTML='<div class="alert alert-red">Selecciona un archivo</div>';return}
  msg.innerHTML='<div class="alert alert-blue">Procesando seguimiento...</div>'

  try{
    const buf=await fileInput.files[0].arrayBuffer()
    const wbook=XLSX.read(buf,{type:'array'})
    const rows=XLSX.utils.sheet_to_json(wbook.Sheets[wbook.SheetNames[0]],{defval:''})
    if(!rows.length){msg.innerHTML='<div class="alert alert-red">Archivo vacío</div>';return}

    // Extraer datos
    const ordenes=rows.map(r=>({
      telefono:String(r['TELÉFONO']||r['TELEFONO']||'').replace(/\D/g,''),
      estatus:String(r['ESTATUS']||'').trim().toUpperCase(),
      fecha_dropi:String(r['FECHA']||''),
      producto_dropi:String(r['PRODUCTO']||''),
      transportadora:String(r['TRANSPORTADORA']||''),
      novedad:String(r['NOVEDAD']||''),
      ciudad:String(r['CIUDAD DESTINO']||''),
    })).filter(o=>o.telefono.length>=7)

    // Cruzar con mapeos
    const telefonos=[...new Set(ordenes.map(o=>o.telefono))]
    let mapeos=[]
    for(let i=0;i<telefonos.length;i+=100){
      const batch=telefonos.slice(i,i+100)
      const{data}=await sb.from('mapeos').select('*').in('telefono',batch)
      if(data)mapeos=mapeos.concat(data)
    }
    const mByTel={}
    for(const m of mapeos){if(!mByTel[m.telefono])mByTel[m.telefono]=[];mByTel[m.telefono].push(m)}

    // Cruzar y clasificar
    const resultados=ordenes.map(o=>{
      const mapeo=mByTel[o.telefono]?.[0]||null
      const producto=mapeo?.producto||o.producto_dropi
      const si=DROPI_STATUS[o.estatus]||{cat:'otro',emoji:'❓',pill:'pill-blue',label:o.estatus}
      return{...o,mapeo,producto,si,fecha_lote:mapeo?.fecha_dropi||null}
    }).filter(r=>r.mapeo)

    if(!resultados.length){
      msg.innerHTML='<div class="alert alert-amber">No se encontraron órdenes cruzadas con el asignador</div>';return
    }

    // Agrupar por lote (fecha_dropi del mapeo)
    const lotes={}
    const productosSet=new Set()
    for(const r of resultados){
      const lote=r.fecha_lote||'Sin lote'
      if(!lotes[lote])lotes[lote]={entregado:0,devuelto:0,en_transito:0,novedad:0,cancelado:0,otro:0,total:0,items:[]}
      lotes[lote].total++
      lotes[lote].items.push(r)
      productosSet.add(r.producto)
      const cat=r.si.cat
      if(cat==='entregado'||cat==='novedad_ok')lotes[lote].entregado++
      else if(cat==='devuelto')lotes[lote].devuelto++
      else if(cat==='en_transito'||cat==='en_proceso'||cat==='en_bodega')lotes[lote].en_transito++
      else if(cat==='novedad')lotes[lote].novedad++
      else if(cat==='cancelado')lotes[lote].cancelado++
      else lotes[lote].otro++
    }

    const prodList=[...productosSet].sort()
    msg.innerHTML=`<div class="alert alert-green">✅ ${resultados.length} órdenes cruzadas en ${Object.keys(lotes).length} lotes</div>`

    // Filtro por producto
    const filtroHtml=`<div class="fld" style="max-width:250px;margin-bottom:14px">
      <label>Filtrar por producto</label>
      <select id="seg-filtro" onchange="filtrarSeguimiento()">
        <option value="">Todos</option>
        ${prodList.map(p=>`<option value="${p}">${p}</option>`).join('')}
      </select></div>`

    // Render lotes
    const lotesOrdenados=Object.entries(lotes).sort((a,b)=>b[0].localeCompare(a[0]))
    const esAdmin=currentRol()==='admin'

    const lotesHtml=lotesOrdenados.map(([fecha,d])=>{
      const pctEnt=d.total>0?Math.round(d.entregado/d.total*100):0
      const pctDev=d.total>0?Math.round(d.devuelto/d.total*100):0
      const pctTran=d.total>0?Math.round(d.en_transito/d.total*100):0
      const devColor=pctDev>20?'var(--red)':pctDev>15?'var(--amber)':'var(--green)'
      // Para admin: buscar estimado del producto principal del lote
      let devEstHtml=''
      if(esAdmin){
        const prodPrincipal=d.items[0]?.producto
        const prodObj=productos.find(p=>p.nombre===prodPrincipal)
        const estPct=prodObj?Math.round((prodObj.dev_pct||0)*100):null
        if(estPct!==null){
          const diffColor=pctDev>estPct?'var(--red)':'var(--green)'
          devEstHtml=` · Estimada: ${estPct}% → Real: <strong style="color:${diffColor}">${pctDev}%</strong> ${pctDev>estPct?'⚠️':'✅'}`
        }
      }
      return`<div class="card seg-lote" data-productos="${d.items.map(i=>i.producto).join(',')}" style="margin-bottom:12px">
        <div style="font-weight:600;margin-bottom:10px">📦 Lote ${fecha} <span style="color:var(--muted);font-weight:400">(${d.total} órdenes)</span></div>
        <div class="cards-row c4" style="margin-bottom:8px">
          <div class="card c-green" style="padding:10px"><div class="card-label">Entregados</div><div class="card-val">${d.entregado} <span style="font-size:12px">(${pctEnt}%)</span></div></div>
          <div class="card c-red" style="padding:10px"><div class="card-label">Devueltos</div><div class="card-val">${d.devuelto} <span style="font-size:12px">(${pctDev}%)</span></div></div>
          <div class="card c-blue" style="padding:10px"><div class="card-label">En tránsito</div><div class="card-val">${d.en_transito} <span style="font-size:12px">(${pctTran}%)</span></div></div>
          <div class="card c-amber" style="padding:10px"><div class="card-label">Novedad</div><div class="card-val">${d.novedad}</div></div>
        </div>
        <div style="font-size:13px">Devol. real: <strong style="color:${devColor}">${pctDev}%</strong>${devEstHtml}</div>
      </div>`
    }).join('')

    resEl.innerHTML=filtroHtml+lotesHtml

    // Update mapeos with latest status
    let updated=0
    for(const r of resultados){
      if(r.mapeo){
        let fd=null
        if(r.fecha_dropi){const p=r.fecha_dropi.split('-');if(p.length===3)fd=`${p[2]}-${p[1]}-${p[0]}`}
        const{error}=await sb.from('mapeos').update({estado_final:r.estatus,fecha_dropi:fd||r.mapeo.fecha_dropi,nombre_cliente:r.ciudad||r.mapeo.nombre_cliente,novedad_texto:r.novedad||r.mapeo.novedad_texto||null,transportadora:r.transportadora||r.mapeo.transportadora||null}).eq('id',r.mapeo.id)
        if(!error)updated++
      }
    }
    msg.innerHTML+=`<div class="alert alert-blue" style="margin-top:8px">💾 ${updated} estados actualizados automáticamente</div>`

    // Rolling 90 días: auto-actualizar dev_pct si es admin y hay 50+ órdenes
    if(esAdmin){
      const hoy=new Date()
      const hace90=new Date(hoy);hace90.setDate(hace90.getDate()-90)
      const fecha90=hace90.toISOString().slice(0,10)
      for(const prod of productos){
        // Contar órdenes con resultado final (entregado o devuelto) en los últimos 90 días
        let entregados=0,devueltos=0
        // Primero intentar 90 días, si no hay 50, usar todo
        const{data:recientes}=await sb.from('mapeos').select('estado_final')
          .eq('producto',prod.nombre).gte('fecha_dropi',fecha90)
          .in('estado_final',['ENTREGADO','DEVOLUCION']).limit(5000)
        let pool=recientes||[]
        if(pool.length<50){
          const{data:todas}=await sb.from('mapeos').select('estado_final')
            .eq('producto',prod.nombre)
            .in('estado_final',['ENTREGADO','DEVOLUCION']).limit(5000)
          pool=todas||[]
        }
        if(pool.length>=50){
          entregados=pool.filter(m=>m.estado_final==='ENTREGADO').length
          devueltos=pool.filter(m=>m.estado_final==='DEVOLUCION').length
          const newPct=devueltos/(entregados+devueltos)
          const oldPct=prod.dev_pct||0
          if(Math.abs(newPct-oldPct)>0.005){
            await sb.from('productos').update({dev_pct:Math.round(newPct*1000)/1000}).eq('id',prod.id)
            msg.innerHTML+=`<div class="alert alert-green" style="margin-top:4px">📊 ${prod.nombre}: dev% actualizado ${Math.round(oldPct*100)}% → ${Math.round(newPct*100)}% (${pool.length} órdenes)</div>`
          }
        }
      }
      await loadProductos()
    }

    window._segResultados=resultados
    window._segLotes=lotes
    logAction('seguimiento_procesado',{ordenes:resultados.length,lotes:Object.keys(lotes).length}).catch(()=>{})
  }catch(e){
    msg.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`
  }
}

// ── META GRAPH API ENGINE ─────────────────────────────────
const META_BASE='https://graph.facebook.com/v21.0'

async function getConfig(key){
  const{data}=await sb.from('config').select('valor').eq('clave',key).maybeSingle()
  return data?.valor||''
}

function metaDateChunks(since,until,chunkDays=90){
  const chunks=[]
  let s=new Date(since+'T12:00:00')
  const end=new Date(until+'T12:00:00')
  while(s<end){
    const e=new Date(s);e.setDate(e.getDate()+chunkDays-1)
    if(e>end)e.setTime(end.getTime())
    chunks.push({since:s.toISOString().slice(0,10),until:e.toISOString().slice(0,10)})
    s=new Date(e);s.setDate(s.getDate()+1)
  }
  return chunks
}

const _metaWait=ms=>new Promise(r=>setTimeout(r,ms))
let _metaLastCall=0

async function metaGet(path,token,params={}){
  let all=[],url=`${META_BASE}${path}?access_token=${token}`
  for(const[k,v]of Object.entries(params))url+=`&${k}=${encodeURIComponent(v)}`
  while(url){
    // Pausa mínima entre llamadas (400ms)
    const elapsed=Date.now()-_metaLastCall
    if(elapsed<400)await _metaWait(400-elapsed)
    _metaLastCall=Date.now()

    let retries=0
    while(retries<3){
      const r=await fetch(url)
      if(r.ok){
        const j=await r.json()
        if(j.data)all=all.concat(j.data)
        url=j.paging?.next||null
        break
      }
      const e=await r.json().catch(()=>({}))
      const isRateLimit=r.status===429||r.status>=500||(e.error?.code===4)||(e.error?.code===17)||(e.error?.code===2)||(e.error?.message||'').toLowerCase().match(/limit|unknown|timeout|temporarily/)
      if(isRateLimit&&retries<2){
        retries++
        const waitSec=30*retries
        const prog=document.getElementById('sync-progress')
        if(prog)prog.innerHTML+=`<div style="font-size:12px;color:var(--amber)">⏳ Rate limit — esperando ${waitSec}s (intento ${retries}/3)...</div>`
        await _metaWait(waitSec*1000)
        continue
      }
      throw new Error(e.error?.message||`Error ${r.status}`)
    }
  }
  return all
}

function metaConv(actions){
  if(!actions?.length)return 0
  const pri=['purchase','lead','onsite_conversion.messaging_conversation_started_7d','offsite_conversion.fb_pixel_lead','complete_registration']
  for(const p of pri){const f=actions.find(a=>a.action_type===p);if(f)return parseInt(f.value)||0}
  return 0
}

function metaCPR(costActions){
  if(!costActions?.length)return 0
  const pri=['purchase','lead','onsite_conversion.messaging_conversation_started_7d','offsite_conversion.fb_pixel_lead','complete_registration']
  for(const p of pri){const f=costActions.find(a=>a.action_type===p);if(f)return parseFloat(f.value)||0}
  return 0
}

window.runMetaSync=async(days)=>{
  const prog=document.getElementById('sync-progress')
  if(!prog)return
  const log=m=>{prog.innerHTML+=`<div style="font-size:12px;color:var(--muted);padding:2px 0">${m}</div>`;prog.scrollTop=prog.scrollHeight}
  prog.innerHTML=''
  try{
    let token=document.getElementById('cfg-token')?.value?.trim()||''
    if(!token)token=await getConfig('meta_access_token')
    if(!token){prog.innerHTML='<div class="alert alert-red">Token no configurado</div>';return}

    log('🔄 Obteniendo cuentas publicitarias...')
    const accounts=await metaGet('/me/adaccounts',token,{fields:'account_id,name,currency,timezone_name,account_status'})
    log(`✅ ${accounts.length} cuentas`)

    for(const a of accounts){
      const accId=a.account_id||a.id.replace('act_','')
      await sb.from('meta_cuentas').upsert({account_id:accId,nombre:a.name||'',moneda:a.currency||'COP',timezone:a.timezone_name||'',estado:a.account_status===1?'ACTIVE':'INACTIVE',synced_at:new Date().toISOString()},{onConflict:'account_id'})
    }

    const until=new Date().toISOString().slice(0,10)
    const sd=new Date()
    if(days==='all')sd.setFullYear(sd.getFullYear()-3);else sd.setDate(sd.getDate()-days)
    const since=sd.toISOString().slice(0,10)
    let tCamp=0,tIns=0

    for(const a of accounts){
      const accId=a.account_id||a.id.replace('act_',''),actId=a.id
      try{

      log(`📊 ${a.name}: campañas...`)
      const camps=await metaGet(`/${actId}/campaigns`,token,{fields:'id,name,status,effective_status,objective,daily_budget,lifetime_budget',limit:'500'})
      for(const c of camps){
        await sb.from('meta_campanas').upsert({meta_id:c.id,account_id:accId,nivel:'campaign',nombre:c.name||'',estado:c.effective_status||c.status||'',objetivo:c.objective||'',daily_budget:c.daily_budget?c.daily_budget/100:null,lifetime_budget:c.lifetime_budget?c.lifetime_budget/100:null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel'})
        tCamp++
      }

      log(`📊 ${a.name}: conjuntos...`)
      const adsets=await metaGet(`/${actId}/adsets`,token,{fields:'id,name,status,effective_status,campaign_id,daily_budget',limit:'500'})
      for(const s of adsets){
        await sb.from('meta_campanas').upsert({meta_id:s.id,account_id:accId,nivel:'adset',parent_id:s.campaign_id||'',nombre:s.name||'',estado:s.effective_status||s.status||'',daily_budget:s.daily_budget?s.daily_budget/100:null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel'})
      }

      log(`📊 ${a.name}: anuncios...`)
      const ads=await metaGet(`/${actId}/ads`,token,{fields:'id,name,status,effective_status,adset_id',limit:'500'})
      for(const ad of ads){
        await sb.from('meta_campanas').upsert({meta_id:ad.id,account_id:accId,nivel:'ad',parent_id:ad.adset_id||'',nombre:ad.name||'',estado:ad.effective_status||ad.status||'',synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel'})
      }

      const chunks=metaDateChunks(since,until,90)
      for(const ch of chunks){
        log(`📈 ${a.name}: métricas campañas (${ch.since} → ${ch.until})...`)
        const cIns=await metaGet(`/${actId}/insights`,token,{fields:'campaign_id,spend,impressions,clicks,ctr,cpm,cpc,reach,frequency,actions,cost_per_action_type',time_range:JSON.stringify(ch),level:'campaign',time_increment:'1',limit:'500'})
        for(const i of cIns){
          await sb.from('meta_insights').upsert({meta_id:i.campaign_id,nivel:'campaign',account_id:accId,fecha:i.date_start,spend:parseFloat(i.spend)||0,impressions:parseInt(i.impressions)||0,clicks:parseInt(i.clicks)||0,reach:parseInt(i.reach)||0,ctr:parseFloat(i.ctr)||0,cpm:parseFloat(i.cpm)||0,cpc:parseFloat(i.cpc)||0,frequency:parseFloat(i.frequency)||0,conversions:metaConv(i.actions),cost_per_result:metaCPR(i.cost_per_action_type),actions_json:i.actions?JSON.stringify(i.actions):null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel,fecha'})
          tIns++
        }

        log(`📈 ${a.name}: métricas anuncios (${ch.since} → ${ch.until})...`)
        const aIns=await metaGet(`/${actId}/insights`,token,{fields:'ad_id,spend,impressions,clicks,ctr,cpm,cpc,reach,frequency,actions,cost_per_action_type',time_range:JSON.stringify(ch),level:'ad',time_increment:'1',limit:'500'})
        for(const i of aIns){
          await sb.from('meta_insights').upsert({meta_id:i.ad_id,nivel:'ad',account_id:accId,fecha:i.date_start,spend:parseFloat(i.spend)||0,impressions:parseInt(i.impressions)||0,clicks:parseInt(i.clicks)||0,reach:parseInt(i.reach)||0,ctr:parseFloat(i.ctr)||0,cpm:parseFloat(i.cpm)||0,cpc:parseFloat(i.cpc)||0,frequency:parseFloat(i.frequency)||0,conversions:metaConv(i.actions),cost_per_result:metaCPR(i.cost_per_action_type),actions_json:i.actions?JSON.stringify(i.actions):null,synced_at:new Date().toISOString()},{onConflict:'meta_id,nivel,fecha'})
          tIns++
        }
      }

      log(`✅ ${a.name}: listo`)
      }catch(accErr){
        log(`<span style="color:var(--amber)">⚠️ ${a.name}: error — ${accErr.message}. Continuando...</span>`)
      }
    }

    await sb.from('config').upsert({clave:'meta_sync_last',valor:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'clave'})
    log(`<br><strong style="color:var(--green)">✅ Sync completo: ${accounts.length} cuentas · ${tCamp} campañas · ${tIns} métricas</strong>`)
    logAction('meta_sync',{days,cuentas:accounts.length,campanas:tCamp,insights:tIns}).catch(()=>{})
  }catch(e){
    log(`<strong style="color:var(--red)">❌ Error: ${e.message}</strong>`)
  }
}
