// Refresca el resumen de un producto (BE, ROAS BE, CPA real, ROAS real)
async function refreshProdResumen(id){
  const el=document.getElementById('prod-resumen-'+id)
  if(!el)return
  const prod=productos.find(p=>p.id===id);if(!prod)return
  const oferta=parseInt(localStorage.getItem('prod_oferta_'+id))||2
  const periodo=localStorage.getItem('prod_periodo_'+id)||'7d'
  const vista=localStorage.getItem('prod_vista_'+id)||'proyectado'
  const desdeCustom=localStorage.getItem('prod_desde_'+id)||''
  const hastaCustom=localStorage.getItem('prod_hasta_'+id)||''
  const{desde,hasta}=await _periodoToRangeProd(periodo,id,desdeCustom,hastaCustom)
  const precio=prod['precio_'+oferta+'u']||0
  const costo=prod['costo_'+oferta+'u']||0
  const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
  const dp=prod.dev_pct||0.19
  const cc=prod.costo_conversacion||100
  const tipoProd=prod.tipo_producto||'dropshipping'
  const alm=tipoProd==='marca_propia'?(prod.almacenamiento||0):0
  // Margen disponible (=CPA BE)
  const margenBE=precio*(1-dp)-costo-fo-(fd*dp)-alm
  const roasBE=margenBE>0?precio/margenBE:0
  const lblPeriodo=periodo==='todo'?'Todo':(periodo==='custom'?(desde+' → '+hasta):periodo)

  // Datos reales: gasto + conteos de mapeos
  let cpaRealHtml='<span style="color:var(--muted)">—</span>'
  let roasRealHtml='<span style="color:var(--muted)">—</span>'
  let ganHtml='<span style="color:var(--muted)">—</span>'
  let extraInfo=''
  try{
    const cids=Array.isArray(prod.campaign_ids)?prod.campaign_ids:[]
    // Gasto: SUMA de TODAS las campañas vinculadas, incluso las sin ventas
    let gasto=0
    if(cids.length){
      for(let i=0;i<cids.length;i+=80){
        const chunk=cids.slice(i,i+80)
        const{data:ins}=await sb.from('meta_insights').select('spend').eq('nivel','campaign').gte('fecha',desde).lte('fecha',hasta).in('meta_id',chunk)
        for(const x of (ins||[]))gasto+=(x.spend||0)
      }
    }
    // Conteos de mapeos: resolver producto (incluye aliases) y filtrar por rango
    // Buscamos por nombre canónico + cualquier alias
    // Deduplicamos por id porque una misma orden puede coincidir con varios aliases
    // (ej: "Neocell" en nombre y "neocell" en aliases ambos hacen ilike a la misma fila)
    const nombresBuscar=[prod.nombre,...(Array.isArray(prod.aliases)?prod.aliases:[])].filter(Boolean)
    const mapsById=new Map()
    for(const nm of nombresBuscar){
      const{data:rows}=await sb.from('mapeos').select('id,estado_final,cantidad').ilike('producto',nm).gte('fecha',desde).lte('fecha',hasta).limit(10000)
      if(rows)for(const r of rows)mapsById.set(r.id,r)
    }
    const maps=[...mapsById.values()]
    // Clasificar
    let conf=0,ent=0,dev=0,canc=0,pend=0
    for(const m of maps){
      const cat=DROPI_STATUS[m.estado_final]?.cat||'otro'
      if(cat==='cancelado'){canc++;continue}
      if(cat==='pendiente'||!m.estado_final){pend++;continue}
      conf++
      if(cat==='entregado'||cat==='novedad_ok')ent++
      else if(cat==='devuelto')dev++ // incluye DEVOLUCION + RECHAZADO
    }

    // CPA Real (siempre = Gasto / Confirmados, igual que Meta)
    if(gasto>0&&conf>0){
      const cpaReal=gasto/conf
      const cpaCol=cpaReal<=margenBE?'var(--green)':'var(--red)'
      cpaRealHtml=`<strong style="color:${cpaCol}">$${fmt(Math.round(cpaReal))}</strong>`
    }

    if(vista==='proyectado'){
      // PROYECTADO: confirmados + % devolución simulado
      // ROAS proyectado = (Confirmados × Precio × (1 - %dev)) / Gasto
      if(gasto>0&&conf>0){
        const ingresoProy=conf*precio*(1-dp)
        const roasP=ingresoProy/gasto
        const col=roasP>=1?'var(--green)':'var(--red)'
        roasRealHtml=`<strong style="color:${col}">${roasP.toFixed(2)}x</strong>`
        // Ganancia proyectada = (conf × margenBE) - (conf × cc) - gasto
        const ganProy=(conf*margenBE)-(conf*cc)-gasto
        const ganCol=ganProy>=0?'var(--green)':'var(--red)'
        ganHtml=`<strong style="color:${ganCol}">$${fmt(Math.round(ganProy))}</strong>`
      }
      extraInfo=` · Conf: <strong>${conf}</strong>`
    }else{
      // REAL: entregados, devueltos+rechazados (cobran flete), cancelados no cuentan
      if(ent+dev===0&&conf>0){
        // Hay confirmados pero todavía no hay data de tracking
        roasRealHtml='<span style="color:var(--amber)">Sin tracking</span>'
        ganHtml='<span style="color:var(--amber)">Sin tracking</span>'
        extraInfo=` · Conf: <strong>${conf}</strong> · Sin entregas reales aún`
      }else if(gasto>0&&ent+dev>0){
        // ROAS Real = (Entregados × Precio) / Gasto
        const roasR=(ent*precio)/gasto
        const col=roasR>=1?'var(--green)':'var(--red)'
        roasRealHtml=`<strong style="color:${col}">${roasR.toFixed(2)}x</strong>`
        // Ganancia Real = (ent × precio) - (conf × costo) - ((ent+dev) × fo) - (dev × fd) - (conf × alm) - (conf × cc) - gasto
        // Nota: el costo del producto solo se asume cuando se despachó (conf). Cancelados no salieron.
        const enviados=ent+dev
        const ingresoReal=ent*precio
        const costoProd=conf*costo
        const fleteOut=enviados*fo
        const fleteDev=dev*fd
        const almTotal=conf*alm
        const ccTotal=conf*cc
        const ganReal=ingresoReal-costoProd-fleteOut-fleteDev-almTotal-ccTotal-gasto
        const ganCol=ganReal>=0?'var(--green)':'var(--red)'
        ganHtml=`<strong style="color:${ganCol}">$${fmt(Math.round(ganReal))}</strong>`
        extraInfo=` · Ent: <strong>${ent}</strong> · Dev: <strong style="color:var(--red)">${dev}</strong> · Pend: ${pend}`
      }else{
        extraInfo=` · Conf: <strong>${conf}</strong>`
      }
    }
  }catch(e){console.error('refreshProdResumen:',e)}

  const vistaLabel=vista==='proyectado'?'🔮 Proyectado':'📊 Real'
  el.innerHTML=`💰 Precio ${oferta}u: <strong>$${fmt(precio)}</strong> · BE: <strong>$${fmt(Math.round(margenBE))}</strong> · ROAS BE: <strong>${roasBE.toFixed(2)}x</strong> · % Dev: <strong>${(dp*100).toFixed(0)}%</strong>${tipoProd==='marca_propia'?' · 🏭 Marca propia':''}<br>
    ${vistaLabel} (${lblPeriodo}): CPA <strong>${cpaRealHtml}</strong> · ROAS <strong>${roasRealHtml}</strong> · Ganancia <strong>${ganHtml}</strong>${extraInfo}`
}

// Convierte período a rango {desde, hasta} con soporte para custom y todo
// Versión async: 'todo' requiere consultar la primera fecha del producto
async function _periodoToRangeProd(periodo,prodId,desdeCustom,hastaCustom){
  const hoy=today()
  if(periodo==='custom'){
    return{desde:desdeCustom||'2024-01-01',hasta:hastaCustom||hoy}
  }
  if(periodo==='todo'){
    // Buscar la fecha más temprana entre los mapeos del producto y los insights de sus campañas
    let desde='2024-01-01'
    try{
      const prod=productos.find(p=>p.id===prodId)
      const nombres=[prod?.nombre,...(Array.isArray(prod?.aliases)?prod.aliases:[])].filter(Boolean)
      let minFecha=null
      for(const nm of nombres){
        const{data}=await sb.from('mapeos').select('fecha').ilike('producto',nm).order('fecha',{ascending:true}).limit(1)
        if(data&&data[0]?.fecha&&(!minFecha||data[0].fecha<minFecha))minFecha=data[0].fecha
      }
      const cids=Array.isArray(prod?.campaign_ids)?prod.campaign_ids:[]
      if(cids.length){
        for(let i=0;i<cids.length;i+=80){
          const chunk=cids.slice(i,i+80)
          const{data:ins}=await sb.from('meta_insights').select('fecha').eq('nivel','campaign').in('meta_id',chunk).order('fecha',{ascending:true}).limit(1)
          if(ins&&ins[0]?.fecha&&(!minFecha||ins[0].fecha<minFecha))minFecha=ins[0].fecha
        }
      }
      if(minFecha)desde=minFecha
    }catch(_){}
    return{desde,hasta:hoy}
  }
  return _periodoToRange(periodo)
}

// Convierte período a rango {desde, hasta}
function _periodoToRange(periodo){
  const hoy=today()
  const ayer=new Date(Date.now()-86400000).toISOString().slice(0,10)
  const d=new Date()
  if(periodo==='hoy')return{desde:hoy,hasta:hoy}
  if(periodo==='ayer')return{desde:ayer,hasta:ayer}
  if(periodo==='7d')return{desde:_daysAgo(6),hasta:hoy}
  if(periodo==='14d')return{desde:_daysAgo(13),hasta:hoy}
  if(periodo==='30d')return{desde:_daysAgo(29),hasta:hoy}
  if(periodo==='este_mes'){
    const ini=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10)
    return{desde:ini,hasta:hoy}
  }
  if(periodo==='mes_pasado'){
    const ini=new Date(d.getFullYear(),d.getMonth()-1,1).toISOString().slice(0,10)
    const fin=new Date(d.getFullYear(),d.getMonth(),0).toISOString().slice(0,10)
    return{desde:ini,hasta:fin}
  }
  return{desde:_daysAgo(6),hasta:hoy}
}

window.modalUserQR=(u)=>{
  const loginId=u.username||u.email||''
  const pwd=u.password_nota||''
  if(!loginId){
    openModal(`<div class="modal-title">QR no disponible</div>
      <div class="modal-sub">Este usuario no tiene username configurado</div>
      <div class="modal-actions"><button class="btn-sm btn-primary" onclick="closeModal()">Cerrar</button></div>`)
    return
  }
  if(!pwd){
    openModal(`<div class="modal-title">QR no disponible</div>
      <div class="modal-sub">Sin "Nota de contraseña" no se puede generar el QR. Edita el usuario y agrégala.</div>
      <div class="modal-actions"><button class="btn-sm btn-primary" onclick="closeModal()">Cerrar</button></div>`)
    return
  }
  const url=`${location.origin}${location.pathname}?u=${encodeURIComponent(loginId)}&p=${encodeURIComponent(pwd)}`
  openModal(`
    <div class="modal-title">QR de acceso rápido</div>
    <div class="modal-sub">${u.nombre||loginId} — escanea con el celular y entra directo</div>
    <div style="background:#fff;padding:16px;border-radius:12px;display:flex;justify-content:center;margin:8px 0;min-height:200px;align-items:center">
      <img id="qr-img" alt="QR" style="display:block;max-width:100%;height:auto">
      <div id="qr-fail" style="display:none;color:#000;font-size:13px;text-align:center">Generando QR...</div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;word-break:break-all;font-family:monospace">${url}</div>
    <div class="alert alert-yellow" style="margin-top:10px;font-size:11px">⚠️ Quien escanee este QR entra automáticamente como este usuario. Trátalo como una llave.</div>
    <div class="modal-actions">
      <button class="btn-sm btn-outline" onclick="navigator.clipboard.writeText('${url.replace(/'/g,"\\'")}').then(()=>alert('Link copiado'))">Copiar link</button>
      <button class="btn-sm btn-primary" onclick="closeModal()">Cerrar</button>
    </div>`)
  // Generar QR como data URL y mostrarlo como imagen (más confiable que canvas)
  const tryQR=()=>{
    const img=document.getElementById('qr-img')
    const fail=document.getElementById('qr-fail')
    if(!img)return
    if(!window.QRCode||!QRCode.toDataURL){
      // Fallback: API externa (NO ideal para credenciales pero como último recurso)
      img.src=`https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=2&data=${encodeURIComponent(url)}`
      img.onerror=()=>{if(fail){fail.style.display='block';fail.textContent='No se pudo cargar la librería QR. Usa el link de abajo.';img.style.display='none'}}
      return
    }
    QRCode.toDataURL(url,{width:240,margin:1,color:{dark:'#000',light:'#fff'}},(err,dataUrl)=>{
      if(err||!dataUrl){
        if(fail){fail.style.display='block';fail.textContent='Error generando QR. Usa el link de abajo.';img.style.display='none'}
        return
      }
      img.src=dataUrl
    })
  }
  if(window.QRCode)tryQR()
  else setTimeout(tryQR,200)
}

let _asignCache=null
// Paginador: trae TODAS las filas sin importar el max_rows del servidor
async function fetchAllRows(table,columns){
  const PAGE=1000
  let all=[],from=0
  while(true){
    const{data,error}=await sb.from(table).select(columns).range(from,from+PAGE-1)
    if(error)throw new Error(`${table}: ${error.message}`)
    if(!data||data.length===0)break
    all=all.concat(data)
    if(data.length<PAGE)break
    from+=PAGE
  }
  return all
}

async function cargarAsignDataSiNecesario(){
  if(_asignCache)return _asignCache
  const[ciudadesData,maestrosData,celdasData,keywordsData]=await Promise.all([
    fetchAllRows('ciudades_dropi','id,key_norm,nombre_dropi,departamento'),
    fetchAllRows('maestros','id,codigo,nombre,niveles,es_default'),
    fetchAllRows('maestro_ciudades','maestro_id,ciudad_id,d1,d2,d3,d4,flete_envia,flete_coord,flete_inter'),
    fetchAllRows('maestro_keywords','keyword,maestro_id')
  ])
  // Index ciudades por key_norm
  const D={},cityById={}
  for(const c of ciudadesData){D[c.key_norm]={id:c.id,nombre:c.nombre_dropi,dept:c.departamento};cityById[c.id]=c}
  // Index maestros por id y por código
  const masterById={},masterByCode={}
  for(const m of maestrosData){masterById[m.id]=m;masterByCode[m.codigo]=m}
  // Index celdas por (maestro_id, ciudad_id)
  const M={}
  for(const m of maestrosData)M[m.codigo]={}
  for(const x of celdasData){
    const code=masterById[x.maestro_id]?.codigo
    const city=cityById[x.ciudad_id]
    if(!code||!city)continue
    M[code][city.key_norm]={d1:x.d1,d2:x.d2,d3:x.d3,d4:x.d4,fe:x.flete_envia,fc:x.flete_coord,fi:x.flete_inter}
  }
  // Keywords (lowercase) → código maestro
  const kw={}
  for(const k of keywordsData){
    const code=masterById[k.maestro_id]?.codigo
    if(code)kw[k.keyword.toLowerCase()]=code
  }
  _asignCache={D,M,kw,masterByCode}
  return _asignCache
}

function _norm(s){
  if(!s)return ''
  return s.toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()
}
function _lev(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0))
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1])
  return dp[m][n]
}
function _normDept(d){
  if(!d)return null
  const n=_norm(d)
  const map={'VALLE DEL CAUCA':'VALLE','NARINO':'NARINO','NARIÑO':'NARINO','SAN ANDRES':'SAN ANDRES','ARCHIPIELAGO DE SAN ANDRES':'SAN ANDRES','BOGOTA DC':'CUNDINAMARCA','BOGOTA D C':'CUNDINAMARCA','DISTRITO CAPITAL':'CUNDINAMARCA','LA GUAJIRA':'LA GUAJIRA','NORTE DE SANTANDER':'NORTE DE SANTANDER'}
  return map[n]||n
}
function _fuzzy(D,q,dept){
  const dn=dept?_normDept(dept):null
  if(dn){
    const cands={}
    for(const k of Object.keys(D))if(_norm(D[k].dept)===dn)cands[k]=D[k]
    if(!Object.keys(cands).length)return{key:null,match:null,reason:'DEPT_NO_ENCONTRADO'}
    if(cands[q])return{key:q,match:'Exacto',reason:'OK'}
    if(q.length>=4){
      let pfx=null,pd=999
      for(const k of Object.keys(cands))if(k.startsWith(q)){const d=_lev(q,k);if(d<pd){pd=d;pfx=k}}
      if(pfx)return{key:pfx,match:'Fuzzy',reason:'OK'}
    }
    let best=null,bd=999
    for(const k of Object.keys(cands)){const d=_lev(q,k);if(d<bd&&(k.startsWith(q)||q.startsWith(k)||d<=1)){bd=d;best=k}}
    return best?{key:best,match:'Fuzzy',reason:'OK'}:{key:null,match:null,reason:'CIUDAD_NO_ENCONTRADA'}
  }
  if(D[q])return{key:q,match:'Exacto',reason:'OK'}
  let pfx=null,pd=999
  for(const k of Object.keys(D))if(k.startsWith(q)){const d=_lev(q,k);if(d<pd){pd=d;pfx=k}}
  if(pfx)return{key:pfx,match:'Fuzzy',reason:'OK'}
  let best=null,bd=999
  for(const k of Object.keys(D)){const d=_lev(q,k),mx=Math.max(q.length,k.length);if(d<bd&&d<=Math.max(1,Math.floor(mx*0.35))){bd=d;best=k}}
  return best?{key:best,match:'Fuzzy',reason:'OK'}:{key:null,match:null,reason:'SIN_COBERTURA'}
}
function _getDec(m,q,niveles){
  if(!m)return 'S'
  if(niveles===4){if(q<=1)return m.d1;if(q===2)return m.d2;if(q===3)return m.d3;return m.d4}
  if(q<=1)return m.d1;if(q===2)return m.d2;return m.d3
}
function _bestC(m){
  if(m.fe!==null&&m.fc!==null)return m.fe<=m.fc?'Envia':'Coordinadora'
  if(m.fe!==null)return 'Envia'
  if(m.fc!==null)return 'Coordinadora'
  return null
}
function _getState(m,qty,isI,niveles){
  if(!m)return{state:'SIN_COBERTURA',carrier:'—',alt:''}
  const car=_bestC(m)
  if(isI){
    if(m.fi===null)return{state:'SIN_COBERTURA',carrier:'—',alt:''}
    const d=_getDec(m,qty,niveles)
    if(d==='C')return{state:'CANCELAR',carrier:'—',alt:''}
    if(d==='E')return{state:'DESPACHAR',carrier:'Interrapidisimo',alt:''}
    if(d==='N'&&qty<=1){
      const d2=_getDec(m,2,niveles),d3=_getDec(m,3,niveles)
      if(d2==='E'&&d3==='E')return{state:'LLAMAR_SUBIR',carrier:'Interrapidisimo',alt:'2u o 3u'}
      if(d2==='E')return{state:'LLAMAR_SUBIR',carrier:'Interrapidisimo',alt:'2u'}
      if(d3==='E')return{state:'LLAMAR_SUBIR',carrier:'Interrapidisimo',alt:'3u'}
    }
    return{state:'LLAMAR_CONFIRMAR',carrier:'Interrapidisimo',alt:''}
  }
  if(m.fe===null&&m.fc===null)return m.fi!==null?{state:'SIN_COBERTURA',carrier:'Solo Interrapidisimo',alt:''}:{state:'SIN_COBERTURA',carrier:'—',alt:''}
  const d=_getDec(m,qty,niveles)
  if(d==='E')return{state:'DESPACHAR',carrier:car,alt:''}
  if(d==='C')return{state:'CANCELAR',carrier:'—',alt:''}
  if(d==='N'||d==='S'){
    if(qty<=1){
      const d2=_getDec(m,2,niveles),d3=_getDec(m,3,niveles)
      if(d2==='E'&&d3==='E')return{state:'LLAMAR_SUBIR',carrier:car,alt:'2u o 3u'}
      if(d2==='E')return{state:'LLAMAR_SUBIR',carrier:car,alt:'2u'}
      if(d3==='E')return{state:'LLAMAR_SUBIR',carrier:car,alt:'3u'}
    }
    return{state:'LLAMAR_CONFIRMAR',carrier:car,alt:''}
  }
  return{state:'LLAMAR_CONFIRMAR',carrier:car,alt:''}
}
function _stateText(s,alt){return{'DESPACHAR':'DESPACHAR','LLAMAR_CONFIRMAR':'LLAMAR CONFIRMAR DATOS','LLAMAR_SUBIR':'LLAMAR SUBIR A '+alt,'CANCELAR':'CANCELAR','SIN_COBERTURA':'SIN COBERTURA'}[s]||s}
function _stateEmoji(s,fuzzy){const base={'DESPACHAR':'📦✅','LLAMAR_CONFIRMAR':'📋','LLAMAR_SUBIR':'📞','CANCELAR':'🚫','SIN_COBERTURA':'🚫📍'}[s]||'—';return(s==='DESPACHAR'&&fuzzy==='Fuzzy'?'📍':'')+base}
function _stateBadge(s,alt,match){
  const pin=(s==='DESPACHAR'&&match==='Fuzzy')?'📍':''
  const mp={'DESPACHAR':['pill-green','📦✅ DESPACHAR'],'LLAMAR_CONFIRMAR':['pill-blue','📋 LLAMAR CONFIRMAR'],'LLAMAR_SUBIR':['pill-amber','📞 LLAMAR SUBIR '+alt],'CANCELAR':['pill-red','🚫 CANCELAR'],'SIN_COBERTURA':['pill-red','🚫📍 SIN COBERTURA']}
  const[cls,label]=mp[s]||['pill-red','—']
  return`<span class="pill ${cls}">${pin}${label}</span>`
}

function _parseFecha(s){
  // Acepta M/D/YYYY o M-D-YYYY (con o sin cero). Rechaza YYYY-M-D.
  if(!s)return null
  const t=s.trim()
  // Rechazar YYYY-... explícitamente
  if(/^\d{4}[-/]/.test(t))return null
  const m=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/)
  if(!m)return null
  const mm=parseInt(m[1]),dd=parseInt(m[2]),yy=parseInt(m[3])
  if(mm<1||mm>12||dd<1||dd>31)return null
  return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`
}

function _parseLineaAsignador(linea){
  // Formato obligatorio: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]
  const partes=linea.split(/[,;\t]/).map(p=>p.trim())
  // Quitar partes vacías al final: para formato nuevo (7+) no bajar de 7, para viejo no bajar de 3
  while(partes.length>7&&partes[partes.length-1]==='')partes.pop()
  if(partes.length<=6)while(partes.length>3&&partes[partes.length-1]==='')partes.pop()
  const n=partes.length
  if(n===0)return{tipo:'vacio'}
  if(n>=3&&n<=6){
    // Formato viejo o incompleto: faltan campos obligatorios
    return{tipo:'invalido',campos:n,raw:linea,msg:'Faltan campos. Formato: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]'}
  }
  if(n>=7&&n<=8){
    // Formato nuevo: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]
    const ciudad=partes[0],qty=parseInt(partes[1])||1,dept=partes[2]
    const tel=partes[3].replace(/\D/g,''),fechaRaw=partes[4],producto=partes[5]
    const adId=partes[6]||''
    const carrier=(n===8&&partes[7])?partes[7]:''
    const isI=carrier.toUpperCase().includes('INTERRAP')
    const errores=[]
    if(!ciudad)errores.push('CIUDAD')
    if(!qty||qty<1)errores.push('UNIDADES')
    if(!dept)errores.push('DPTO')
    if(!tel||tel.length<7)errores.push('TELEFONO')
    if(!producto)errores.push('PRODUCTO')
    const fechaIso=_parseFecha(fechaRaw)
    if(!fechaIso)errores.push('FECHA (use M/D/YYYY)')
    return{tipo:'nuevo',ciudad,qty,dept,tel,fecha:fechaIso,fechaRaw,producto,adId,isI,carrier,errores,raw:linea}
  }
  return{tipo:'invalido',campos:n,raw:linea}
}

let _ultimosResultados=[]

window.procesarAsignador=async()=>{
  const txt=document.getElementById('asign-input').value
  const lineas=txt.split('\n').map(l=>l.trim()).filter(Boolean)
  const msg=document.getElementById('asign-msg')
  const resEl=document.getElementById('asign-resultado')
  if(!lineas.length){msg.innerHTML='<div class="alert alert-red">No hay líneas para procesar</div>';return}

  // PASO 1: parsear todas las líneas y separar válidas / errores
  const parsed=lineas.map(_parseLineaAsignador)
  const conErrores=[]
  parsed.forEach((p,i)=>{
    if(p.tipo==='nuevo'&&p.errores.length>0)conErrores.push({linea:i+1,raw:p.raw,faltan:p.errores})
    else if(p.tipo==='invalido')conErrores.push({linea:i+1,raw:p.raw,faltan:[p.msg||`Número de campos inválido (${p.campos}). Formato: CIUDAD, UNIDADES, DPTO, TELEFONO, FECHA, PRODUCTO, ID_ANUNCIO, [carrier]`]})
  })

  // PASO 1.5: validar producto reconocido y fecha en rango
  const kwList=window._asignKw||[]
  const modoHistorico=window._asignModoHist===true
  const hoyStr=today()
  const limiteAtras=new Date(Date.now()-4*86400000).toISOString().slice(0,10)
  parsed.forEach((p,i)=>{
    if(p.tipo!=='nuevo'||p.errores.length>0)return
    // Validar producto contra keywords (toda la lista, incluyendo aliases no visibles)
    if(kwList.length){
      const palabra=(p.producto||'').toLowerCase().trim()
      const matchKw=kwList.some(k=>palabra.includes(k))
      if(!matchKw){
        const visibles=window._asignKwVisibles||kwList
        conErrores.push({linea:i+1,raw:p.raw,faltan:[`producto "${p.producto}" no reconocido (debe contener una de las palabras visibles: ${visibles.join(', ')})`]})
        return
      }
    }
    // Validar fecha (a menos que esté en modo histórico)
    if(!modoHistorico&&p.fecha){
      if(p.fecha>hoyStr){
        conErrores.push({linea:i+1,raw:p.raw,faltan:[`fecha ${p.fecha} es futura (máximo: ${hoyStr})`]})
      }else if(p.fecha<limiteAtras){
        conErrores.push({linea:i+1,raw:p.raw,faltan:[`fecha ${p.fecha} es anterior al límite (mínimo: ${limiteAtras}, máximo 4 días atrás)`]})
      }
    }
  })

  if(conErrores.length>0){
    msg.innerHTML=`<div class="alert alert-red"><strong>❌ ${conErrores.length} línea(s) con errores. Corrige antes de procesar:</strong><ul style="margin-top:6px;margin-left:14px;font-size:12px">
      ${conErrores.map(e=>`<li><strong>Línea ${e.linea}:</strong> ${e.faltan.join(', ')}<br><code style="font-size:10px;color:var(--muted)">${e.raw}</code></li>`).join('')}
    </ul></div>`
    return
  }

  // PASO 2: procesar todas las líneas con el asignador
  msg.innerHTML='<div class="alert alert-blue">Procesando…</div>'
  const{D,M,kw,masterByCode}=await cargarAsignDataSiNecesario()
  const filas=[]
  const mapeosAGuardar=[]
  for(const p of parsed){
    if(p.tipo==='vacio')continue
    const q=_norm(p.ciudad)
    const df=_fuzzy(D,q,p.dept)
    let estado,carrier,alt='',match='—',ciudadDropi='—',deptoDropi='—'
    let codeMaestro='GEN'
    if(p.tipo==='nuevo'){
      const palabra=p.producto.toLowerCase().trim()
      // Buscar keyword contenida en el producto
      for(const k of Object.keys(kw)){
        if(palabra.includes(k)){codeMaestro=kw[k];break}
      }
    }
    const maestro=masterByCode[codeMaestro]||masterByCode['GEN']
    const niveles=maestro?.niveles||3
    if(!df||!df.key){
      estado='SIN_COBERTURA';carrier='—';match='❌'
    }else{
      const mv=M[codeMaestro]?.[df.key]||M['GEN']?.[df.key]
      const r=_getState(mv,p.qty,p.isI,niveles)
      estado=r.state;carrier=r.carrier;alt=r.alt;match=df.match
      ciudadDropi=D[df.key].nombre;deptoDropi=D[df.key].dept
    }
    filas.push({raw:p,ciudadDropi,deptoDropi,estado,carrier,alt,match,maestro:codeMaestro})

    // Solo encolar para guardar si es formato nuevo válido
    if(p.tipo==='nuevo'&&p.tel&&p.fecha&&p.producto){
      mapeosAGuardar.push({
        fecha:p.fecha,
        telefono:p.tel,
        ad_id:p.adId||null,
        producto:p.producto,
        ciudad:ciudadDropi!=='—'?ciudadDropi:p.ciudad,
        cantidad:p.qty||1,
        estado_inicial:estado
      })
    }
  }
  _ultimosResultados=filas

  // PASO 3: guardar en sistema (con detección de duplicados)
  let guardadas=0,duplicadas=0
  if(mapeosAGuardar.length>0){
    // Buscar duplicados existentes en BD
    const telefonos=[...new Set(mapeosAGuardar.map(m=>m.telefono))]
    const{data:existentes}=await sb.from('mapeos').select('telefono,fecha,producto,ad_id').in('telefono',telefonos)
    const keySet=new Set((existentes||[]).map(e=>`${e.telefono}|${e.fecha}|${(e.producto||'').toLowerCase().trim()}|${e.ad_id||''}`))
    const nuevos=[]
    const vistosEnEsteBatch=new Set()
    for(const m of mapeosAGuardar){
      const k=`${m.telefono}|${m.fecha}|${(m.producto||'').toLowerCase().trim()}|${m.ad_id||''}`
      if(keySet.has(k)||vistosEnEsteBatch.has(k)){duplicadas++;continue}
      vistosEnEsteBatch.add(k)
      nuevos.push(m)
    }
    if(nuevos.length>0){
      const{error}=await sb.from('mapeos').insert(nuevos)
      if(error){msg.innerHTML=`<div class="alert alert-red">Error guardando: ${error.message}</div>`;return}
      guardadas=nuevos.length
      logAction('asignador_procesado',{guardadas,duplicadas,total:lineas.length}).catch(()=>{})
    }
  }

  // PASO 4: render resultado
  msg.innerHTML=`<div class="alert alert-green">
    ✅ ${filas.length} línea(s) procesada(s) — CSV listo para copiar a Dropi<br>
    💾 ${guardadas} venta(s) guardada(s) en sistema${duplicadas>0?` &nbsp;·&nbsp; ⚠️ ${duplicadas} ya estaban registradas`:''}
  </div>`

  // Resumen por estado
  const counts={}
  for(const f of filas)counts[f.estado]=(counts[f.estado]||0)+1
  const resumenItems=[['DESPACHAR','pill-green','📦 Despachar'],['LLAMAR_CONFIRMAR','pill-blue','📋 Llamar'],['LLAMAR_SUBIR','pill-amber','📞 Subir'],['CANCELAR','pill-red','🚫 Cancelar'],['SIN_COBERTURA','pill-red','🚫 Sin cobertura']]
  const resumenHtml=resumenItems.filter(([k])=>counts[k]).map(([k,cls,l])=>`<span class="pill ${cls}" style="margin-right:6px">${l}: ${counts[k]}</span>`).join('')

  resEl.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div>${resumenHtml}</div>
      <button class="btn-sm btn-primary" onclick="copiarCSVAsignador()">📋 Copiar CSV</button>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Ciudad ingresada</th><th>Dpto. ingresado</th><th>Uds.</th><th>DEPARTAMENTO</th><th>CIUDAD</th><th>Emoji</th><th>¿Enviar?</th><th>TRANSPORTADORA (OPCIONAL)</th><th>Match</th></tr>
      ${filas.map(f=>`<tr>
        <td data-label="Ciudad ingresada">${f.raw.ciudad}${f.raw.tipo==='nuevo'&&f.raw.tel?`<br><span style="font-size:10px;color:var(--muted)">📞 ${f.raw.tel}${f.raw.adId?' · ad':' · ORG'}</span>`:''}</td>
        <td data-label="Dpto. ingresado">${f.raw.dept||'—'}</td>
        <td data-label="Uds.">${f.raw.qty}u</td>
        <td data-label="DEPARTAMENTO">${f.deptoDropi}</td>
        <td data-label="CIUDAD"><strong>${f.ciudadDropi}</strong></td>
        <td data-label="Emoji">${_stateEmoji(f.estado,f.match)}</td>
        <td data-label="¿Enviar?">${_stateBadge(f.estado,f.alt,f.match)}</td>
        <td data-label="TRANSPORTADORA">${f.carrier}</td>
        <td data-label="Match" style="font-size:10px;color:var(--muted)">${f.match}</td>
      </tr>`).join('')}
    </table></div>
  `
}

window.copiarCSVAsignador=()=>{
  if(!_ultimosResultados.length)return
  const h='Ciudad ingresada\tDpto. ingresado\tUds.\tDEPARTAMENTO\tCIUDAD\tEmoji\t¿Enviar?\tTRANSPORTADORA (OPCIONAL)\tMatch'
  const rows=_ultimosResultados.map(f=>[
    f.raw.ciudad,f.raw.dept||'',f.raw.qty+'u',f.deptoDropi,f.ciudadDropi,_stateEmoji(f.estado,f.match),_stateText(f.estado,f.alt),f.carrier==='—'?'':f.carrier,f.match
  ].join('\t'))
  const txt=[h,...rows].join('\n')
  navigator.clipboard.writeText(txt).then(()=>{
    const msg=document.getElementById('asign-msg')
    msg.innerHTML='<div class="alert alert-green">✅ Copiado al portapapeles — Pega en Dropi</div>'
  }).catch(()=>{
    const ta=document.createElement('textarea')
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0'
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)
    alert('Copiado al portapapeles')
  })
}

const _autoStyle='background:rgba(0,180,80,0.08);border:1px solid rgba(0,180,80,0.2);color:var(--text);cursor:not-allowed'

async function cargarReporteData(){
  const el=document.getElementById('rep-content')
  if(!el)return
  el.innerHTML='<div class="loading">Cargando...</div>'
  try{
  const tipo=document.getElementById('rep-tipo-fecha')?.value||'compra'
  const fecha=document.getElementById('rep-fecha')?.value||''
  if(!fecha){el.innerHTML='<div class="alert alert-blue">Selecciona una fecha</div>';return}
  const esHoy=fecha===today()&&tipo==='compra'
  const usandoDropi=tipo==='dropi'
  const campo=usandoDropi?'fecha_dropi':'fecha'

  // 1. Auto: mapeos agrupados por producto (resolviendo alias → nombre canónico)
  const{data:mapeos}=await sb.from('mapeos').select('*').eq(campo,fecha)
  const porProd={}
  let totConf=0,totCanc=0,totPend=0,totOrd=0
  if(mapeos)for(const m of mapeos){
    const resolved=resolveProdName(m.producto)
    const display=resolved.nombre||'Sin producto'
    const key=_normProd(display)||'sin_producto'
    if(!porProd[key])porProd[key]={display,ord:0,conf:0,canc:0,pend:0,byQtyConf:{},byQtyCanc:{},byQtyPend:{},byFechaDropi:{}}
    porProd[key].ord++;totOrd++
    const q=m.cantidad||1
    if(m.estado_final==='CANCELADO'){porProd[key].canc++;totCanc++;porProd[key].byQtyCanc[q]=(porProd[key].byQtyCanc[q]||0)+1}
    else if(m.estado_final==='PENDIENTE CONFIRMACION'){porProd[key].pend++;totPend++;porProd[key].byQtyPend[q]=(porProd[key].byQtyPend[q]||0)+1}
    else if(m.estado_final){porProd[key].conf++;totConf++;porProd[key].byQtyConf[q]=(porProd[key].byQtyConf[q]||0)+1}
    else {porProd[key].pend++;totPend++;porProd[key].byQtyPend[q]=(porProd[key].byQtyPend[q]||0)+1}
    // Desglose por fecha_dropi (solo cuando filtramos por fecha de compra)
    if(!usandoDropi){
      const fd=m.fecha_dropi||'Sin subir'
      porProd[key].byFechaDropi[fd]=(porProd[key].byFechaDropi[fd]||0)+1
    }
  }

  // 2. Manual: reportes_diarios existentes (indexados por nombre normalizado)
  const{data:reportes}=await sb.from('reportes_diarios').select('*').eq('fecha',fecha).eq('usuario_id',me?.id)
  const repByProd={}
  if(reportes)for(const r of reportes)repByProd[_normProd(r.producto_nombre)||'']=r

  // 2b. Último valor de conversaciones por fecha+producto (de cualquier usuario, gana el más reciente)
  const{data:convLatest}=await sb.from('reportes_diarios').select('producto_nombre,conversaciones,updated_at').eq('fecha',fecha).order('updated_at',{ascending:false})
  const convByProdLatest={}
  if(convLatest)for(const r of convLatest){
    const k=_normProd(r.producto_nombre)||''
    if(convByProdLatest[k]===undefined)convByProdLatest[k]=r.conversaciones||0
  }

  const prods=Object.keys(porProd)

  // Auto section HTML
  let autoHtml=''
  if(prods.length===0){
    autoHtml='<div class="alert alert-blue">Sin datos para esta(s) fecha(s)</div>'
  }else{
    autoHtml=prods.map(key=>{
      const d=porProd[key],rep=repByProd[key]
      const p=d.display
      const pid=key.replace(/\s+/g,'_')
      // Desglose por unidades, separado por estado
      const allQtys=new Set([...Object.keys(d.byQtyConf),...Object.keys(d.byQtyCanc),...Object.keys(d.byQtyPend)].map(Number))
      const qtyKeys=[...allQtys].sort((a,b)=>a-b)
      const renderQtyRow=(label,emoji,color,byQ)=>{
        if(!qtyKeys.length)return ''
        const cells=qtyKeys.map(q=>`<div style="flex:1;min-width:60px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center"><div style="font-size:10px;color:var(--muted)">${q}u</div><div style="font-size:14px;font-weight:600;color:${color}">${byQ[q]||0}</div></div>`).join('')
        return`<div style="margin-bottom:6px"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">${emoji} ${label}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${cells}</div></div>`
      }
      const qtyHtml=`${renderQtyRow('Confirmadas','✅','var(--green)',d.byQtyConf)}${renderQtyRow('Canceladas','❌','var(--red)',d.byQtyCanc)}${renderQtyRow('Pendientes','⏳','var(--amber)',d.byQtyPend)}`
      // Desglose por fecha_dropi (solo si tipo='compra')
      let fechaDropiHtml=''
      if(!usandoDropi){
        const fds=Object.keys(d.byFechaDropi).sort((a,b)=>{
          if(a==='Sin subir')return 1
          if(b==='Sin subir')return -1
          return a.localeCompare(b)
        })
        if(fds.length){
          const items=fds.map(fd=>{
            const n=d.byFechaDropi[fd]
            const isToday=fd===today()
            const lbl=fd==='Sin subir'?'⚠️ Sin subir':(isToday?`📍 ${fd}`:fd)
            const color=fd==='Sin subir'?'var(--amber)':(isToday?'var(--blue)':'var(--text)')
            return`<span style="display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:${color}"><strong>${n}</strong> · ${lbl}</span>`
          }).join(' ')
          fechaDropiHtml=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">📅 Subidas a Dropi por fecha</div><div style="display:flex;gap:6px;flex-wrap:wrap">${items}</div></div>`
        }
      }
      return`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--green)">
        <div style="font-weight:600;margin-bottom:8px">${p} <span style="font-size:12px;color:var(--muted);font-weight:400">· Total: ${d.ord}</span></div>
        ${qtyHtml}
        <div class="form-grid g3" style="margin-top:8px">
          <div class="fld"><label>✅ Confirm.</label><input type="number" value="${d.conf}" disabled style="${_autoStyle}"></div>
          <div class="fld"><label>❌ Cancel.</label><input type="number" value="${d.canc}" disabled style="${_autoStyle}"></div>
          <div class="fld"><label>⏳ Pend.</label><input type="number" value="${d.pend}" disabled style="${_autoStyle}"></div>
        </div>
        ${!usandoDropi?`<div class="form-grid g2" style="margin-top:8px">
          <div class="fld"><label>Conversaciones (manual)</label>
            <input type="number" id="rc-${pid}" value="${convByProdLatest[key]??(rep?.conversaciones||0)}" min="0" class="rep-conv" data-prod="${p}" ${!esHoy?'disabled style="'+_autoStyle+'"':''}></div>
        </div>`:''}
        ${fechaDropiHtml}
      </div>`
    }).join('')
    autoHtml+=`<div class="cards-row c4" style="margin-top:14px">
      <div class="card c-blue"><div class="card-label">Total órdenes</div><div class="card-val">${totOrd}</div></div>
      <div class="card c-green"><div class="card-label">Confirmados</div><div class="card-val">${totConf}</div></div>
      <div class="card c-red"><div class="card-label">Cancelados</div><div class="card-val">${totCanc}</div></div>
      <div class="card c-amber"><div class="card-label">Pendientes</div><div class="card-val">${totPend}</div></div>
    </div>`
  }

  // Motivo for historical edit
  let motivoHtml=''
  if(!esHoy&&prods.length>0&&!usandoDropi){
    motivoHtml=`<div class="alert alert-blue" style="margin-bottom:14px">📅 Fecha anterior — solo lectura. Para modificar conversaciones, activa edición.</div>
    <div style="margin-bottom:14px">
      <button class="btn-sm btn-amber" onclick="habilitarEdicionHist()">🔓 Habilitar edición</button>
      <div id="rep-motivo-wrap" style="display:none;margin-top:8px">
        <div class="fld"><label>Motivo de edición (obligatorio)</label>
        <input type="text" id="rep-motivo" placeholder="Ej: Corrección de conversaciones reales"></div>
      </div>
    </div>`
  }

  // Ventas de hoy (solo si es hoy)
  let ventasHtml=''
  if(esHoy){
    ventasHtml=`<div class="divider"></div>
    <div class="section-title">📝 Ventas de hoy (manual)</div>
    <div class="page-sub" style="margin-bottom:14px">Selecciona producto, pega IDs de anuncio y conversaciones aproximadas</div>
    <div id="ventas-rows"></div>
    <button class="btn-sm btn-blue" onclick="addVentaRow()" style="margin-bottom:14px">+ Agregar producto</button>
    <div class="fld" style="margin-bottom:14px"><label>Nota (opcional)</label>
      <textarea id="rep-nota" rows="2" style="resize:vertical">${reportes?.[0]?.nota||''}</textarea></div>`
  }

  const labelFecha=usandoDropi?'Dropi '+fecha:esHoy?'de ayer':fecha
  el.innerHTML=`
    <div class="section-title" style="color:var(--green)">📊 Datos ${labelFecha} (auto desde Dropi)</div>
    ${motivoHtml}${autoHtml}${ventasHtml}
    <div style="margin-top:16px">
      <button class="btn-full btn-primary" onclick="saveReporteV2('${fecha}')">💾 Guardar reporte</button>
    </div>
    <div id="rep-msg" style="margin-top:10px"></div>`

  // Cargar ventas existentes o crear primera fila
  if(esHoy){
    const ventasExist=reportes?.filter(r=>r.ad_ids)||[]
    if(ventasExist.length>0)for(const v of ventasExist)addVentaRow(v.producto_nombre||'',v.ad_ids||'',v.conversaciones_aprox||0)
    else addVentaRow()
  }
  }catch(e){el.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`}
}

window.saveReporteV2=async(fecha)=>{
  const esHoy=fecha===today()
  const msg=document.getElementById('rep-msg')

  if(!esHoy){
    const motivo=document.getElementById('rep-motivo')?.value?.trim()
    if(!motivo){msg.innerHTML='<div class="alert alert-red">Ingresa un motivo para editar el histórico</div>';return}
    // Save conversaciones per product
    const convEls=document.querySelectorAll('.rep-conv')
    let saved=0,errMsg=''
    for(const cel of convEls){
      const prodName=cel.dataset.prod
      const conv=parseInt(cel.value)||0
      const prodObj=productos.find(p=>_normProd(p.nombre)===_normProd(prodName))
      if(!prodObj){errMsg+=`Producto "${prodName}" no existe en config. `;continue}
      const{error}=await sb.from('reportes_diarios').upsert({
        fecha,producto_id:prodObj.id,producto_nombre:prodObj.nombre,
        conversaciones:conv,nota:`[EDITADO] ${motivo}`,
        usuario_id:me.id,updated_at:new Date().toISOString()
      },{onConflict:'fecha,producto_id,usuario_id'})
      if(error)errMsg+=error.message+' '
      else saved++
    }
    if(errMsg)msg.innerHTML=`<div class="alert alert-red">Error: ${errMsg}</div><div class="alert alert-blue" style="margin-top:4px">Debug: ${convEls.length} campos .rep-conv encontrados</div>`
    else msg.innerHTML=`<div class="alert alert-green">✅ Actualizado (${saved} productos) — Motivo: "${motivo}"</div>`
    logAction('reporte_editado_historico',{fecha,motivo,productos:saved}).catch(()=>{})
    return
  }

  // Save ventas de hoy
  const rows=document.getElementById('ventas-rows')?.children||[]
  let saved=0
  for(const row of rows){
    const idx=row.id.replace('vrow-','')
    const prodNom=document.getElementById(`vp-${idx}`)?.value
    if(!prodNom)continue
    const adIds=document.getElementById(`vi-${idx}`)?.value?.trim()||''
    const convAp=parseInt(document.getElementById(`vc-${idx}`)?.value)||0
    const prodObj=productos.find(p=>_normProd(p.nombre)===_normProd(prodNom))
    if(!prodObj){msg.innerHTML=`<div class="alert alert-red">Producto "${prodNom}" no existe en config</div>`;return}
    // Also get conversaciones from auto section if exists
    const pid=_normProd(prodNom).replace(/\s+/g,'_')
    const convReal=parseInt(document.getElementById(`rc-${pid}`)?.value)||0
    const{error}=await sb.from('reportes_diarios').upsert({
      fecha,producto_id:prodObj.id,producto_nombre:prodObj.nombre,
      conversaciones:convReal,conversaciones_aprox:convAp,ad_ids:adIds,
      nota:document.getElementById('rep-nota')?.value||'',
      usuario_id:me.id,updated_at:new Date().toISOString()
    },{onConflict:'fecha,producto_id,usuario_id'})
    if(error){msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
    saved++
  }
  // Also save conv for products in auto section that aren't in ventas rows
  const convEls=document.querySelectorAll('.rep-conv')
  for(const cel of convEls){
    const prodName=cel.dataset.prod
    const alreadySaved=[...rows].some(r=>{const i=r.id.replace('vrow-','');return _normProd(document.getElementById(`vp-${i}`)?.value||'')===_normProd(prodName)})
    if(alreadySaved)continue
    const conv=parseInt(cel.value)||0
    const prodObj=productos.find(p=>_normProd(p.nombre)===_normProd(prodName))
    if(!prodObj)continue
    await sb.from('reportes_diarios').upsert({
      fecha,producto_id:prodObj.id,producto_nombre:prodObj.nombre,
      conversaciones:conv,usuario_id:me.id,updated_at:new Date().toISOString()
    },{onConflict:'fecha,producto_id,usuario_id'}).catch(()=>{})
  }
  msg.innerHTML=`<div class="alert alert-green">✅ ${saved} producto(s) guardado(s)</div>`
  logAction('reporte_guardado',{fecha,productos:saved}).catch(()=>{})
}

// ── AUXILIAR: CONFIRMAR RESERVADO ──────────────────────────
async function pageAuxReservado(c){
  c.innerHTML=`<div class="page-title">🔍 Reservados y Cancelados</div>
    <div class="page-sub">Busca una orden por teléfono y cambia su estado</div>
    <div class="card" style="max-width:600px">
      <div class="fld" style="margin-bottom:12px">
        <label>Número de teléfono</label>
        <input type="tel" id="res-tel" placeholder="3018022314"
          onkeydown="if(event.key==='Enter')buscarOrden()">
      </div>
      <button class="btn-full btn-primary" onclick="buscarOrden()">Buscar</button>
      <div id="res-result" style="margin-top:16px"></div>
    </div>

    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="font-size:20px">📅</span>
        <div style="font-size:18px;font-weight:700">Pedidos pendientes de confirmación</div>
      </div>
      <div class="page-sub" style="margin-bottom:14px">Pedidos programados que necesitan confirmación del cliente antes del envío</div>
      <div class="card" style="margin-bottom:16px;padding:12px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div class="fld" style="margin:0;flex:1;min-width:180px">
            <label style="font-size:11px">Filtrar por fecha de envío</label>
            <select id="conf-filtro" style="font-size:12px;padding:6px 8px" onchange="cargarPendientesConfirmacion()">
              <option value="proximos">Próximos 2 días (default)</option>
              <option value="hoy">Solo hoy</option>
              <option value="manana">Solo mañana</option>
              <option value="todos">Todos los programados</option>
              <option value="vencidos">Vencidos (fecha pasada sin confirmar)</option>
            </select>
          </div>
          <button class="btn-sm btn-outline" onclick="cargarPendientesConfirmacion()">🔄 Recargar</button>
        </div>
      </div>
      <div id="conf-content"><div style="padding:20px;text-align:center;color:var(--muted)">Cargando...</div></div>
    </div>

    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="font-size:20px">⏳</span>
        <div style="font-size:18px;font-weight:700">Pendientes sin fecha de envío</div>
      </div>
      <div class="page-sub" style="margin-bottom:14px">Pedidos en estado pendiente (desde el cruce Dropi) que aún no tienen fecha programada. Búscalos por teléfono arriba para asignarles una.</div>
      <div id="psf-content"><div style="padding:20px;text-align:center;color:var(--muted)">Cargando...</div></div>
    </div>`

  // Cargar lista de pendientes de confirmación al entrar
  if(typeof cargarPendientesConfirmacion==='function'){
    setTimeout(()=>cargarPendientesConfirmacion(),50)
  }
  // Cargar lista de pendientes sin fecha al entrar
  if(typeof cargarPendientesSinFecha==='function'){
    setTimeout(()=>cargarPendientesSinFecha(),80)
  }

  // Estados reconocidos para clasificar la orden
  function _clasificarEstado(m){
    if(!m)return'desconocido'
    if(m.estado_final==='CANCELADO')return'cancelado'
    if(m.estado_final==='CONFIRMADO')return'confirmado'
    if(m.estado_final==='PENDIENTE CONFIRMACION'||m.estado_final==='PENDIENTE'||!m.estado_final){
      if(m.estado_inicial==='PENDIENTE CONFIRMACION')return'pendiente'
      return'pendiente'
    }
    // Otros estados de Dropi (entregado, en tránsito, etc.) → tratamos como confirmado en flujo
    return'confirmado'
  }

  function _normalizarTel(t){
    return(t||'').replace(/\D/g,'')
  }

  window.buscarOrden=async()=>{
    const telRaw=document.getElementById('res-tel').value.trim()
    const tel=_normalizarTel(telRaw)
    const el=document.getElementById('res-result')
    if(!tel||tel.length<7){el.innerHTML='<div class="alert alert-red">Ingresa un número válido</div>';return}
    el.innerHTML='<div class="loading">Buscando...</div>'

    // Buscar por teléfono normalizado — sin filtrar por estado para encontrar cualquier orden
    const{data,error}=await sb.from('mapeos').select('*').eq('telefono',tel).order('created_at',{ascending:false}).limit(5)
    if(error){el.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
    if(!data||!data.length){
      el.innerHTML='<div class="alert alert-red">No se encontró ninguna orden con ese número</div>';return
    }

    // Si hay varias, usar la más reciente
    const m=data[0]
    const estado=_clasificarEstado(m)
    window._resOrden=m

    // Cargar última acción si existe (de log)
    let ultimaAccion=''
    try{
      const{data:logs}=await sb.from('audit_log').select('accion,detalles,created_at,usuarios(nombre)').contains('detalles',{mapeo_id:m.id}).order('created_at',{ascending:false}).limit(1)
      if(logs?.length){
        const l=logs[0]
        const fecha=new Date(l.created_at).toLocaleString('es-CO')
        const motivo=l.detalles?.motivo||''
        ultimaAccion=`<div style="font-size:11px;color:var(--muted);margin-top:6px">Última acción: <strong>${l.accion}</strong> por ${l.usuarios?.nombre||'—'} · ${fecha}${motivo?`<br>📝 Motivo: <em>"${motivo}"</em>`:''}</div>`
      }
    }catch(_){}

    const estadoConfig={
      pendiente:{label:'⏳ Pendiente',color:'var(--amber)',bg:'var(--amber-bg)'},
      confirmado:{label:'✅ Confirmado',color:'var(--green)',bg:'var(--green-bg)'},
      cancelado:{label:'❌ Cancelado',color:'var(--red)',bg:'var(--red-bg)'},
      desconocido:{label:'❓ Desconocido',color:'var(--muted)',bg:'var(--card2)'}
    }
    const cfg=estadoConfig[estado]||estadoConfig.desconocido

    // Botones según el estado actual
    let botones=''
    const btnProgramar=`<button class="btn-sm btn-outline" onclick="abrirModalProgramarEnvio()" style="flex:1;padding:10px;border-color:#a78bfa;color:#a78bfa">📅 Programar fecha de envío</button>`
    if(estado==='pendiente'){
      botones=`
        <button class="btn-sm btn-green" onclick="cambiarEstadoOrden('confirmar',false)" style="flex:1;padding:10px">✅ Confirmar</button>
        <button class="btn-sm btn-red" onclick="cambiarEstadoOrden('cancelar',true)" style="flex:1;padding:10px">❌ Cancelar</button>
        ${btnProgramar}`
    }else if(estado==='confirmado'){
      botones=`<button class="btn-sm btn-red" onclick="cambiarEstadoOrden('cancelar',true)" style="flex:1;padding:10px">❌ Cancelar</button>
        ${btnProgramar}`
    }else if(estado==='cancelado'){
      botones=`<button class="btn-sm btn-green" onclick="cambiarEstadoOrden('reactivar',true)" style="flex:1;padding:10px">✅ Reactivar (confirmar)</button>`
    }else{
      botones=`<div class="alert alert-blue">Estado no editable desde aquí</div>`
    }

    el.innerHTML=`
      <div class="card" style="border:1px solid ${cfg.color};background:${cfg.bg}">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Orden encontrada</div>
            <div style="font-size:16px;font-weight:600;font-family:monospace">${m.telefono}</div>
          </div>
          <span class="pill" style="background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.color}">${cfg.label}</span>
        </div>
        <div style="font-size:13px;line-height:1.7;margin-bottom:10px">
          <div><strong>Cliente:</strong> ${m.nombre_cliente||'—'}</div>
          <div><strong>Producto:</strong> ${m.producto||'—'} · ${m.cantidad||1}u</div>
          <div><strong>Ciudad:</strong> ${m.ciudad||'—'}</div>
          <div><strong>Fecha compra:</strong> ${m.fecha||'—'}</div>
        </div>
        ${ultimaAccion}
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${botones}</div>
      </div>`
  }

  // Pide motivo si pideMotivo=true, luego ejecuta el cambio
  window.cambiarEstadoOrden=(accion,pideMotivo)=>{
    const m=window._resOrden
    if(!m)return
    if(pideMotivo){
      const titulo={confirmar:'✅ Confirmar orden',cancelar:'❌ Cancelar orden',reactivar:'✅ Reactivar orden'}[accion]
      const sugerencias={
        cancelar:['Cliente se arrepintió','Cliente no responde','Precio muy alto','Ya tiene otro proveedor','Error en pedido'],
        reactivar:['Se canceló por error','Cliente volvió a confirmar','Error del operador'],
        confirmar:['Cliente confirmó por teléfono','Recuperación de pendiente']
      }[accion]||[]
      closeModal()
      const div=document.createElement('div')
      div.id='user-modal';div.className='modal-bg'
      div.innerHTML=`<div class="modal-box" onclick="event.stopPropagation()" style="max-width:480px">
        <div class="modal-title">${titulo}</div>
        <div class="modal-sub">${m.nombre_cliente||m.telefono} · ${m.producto||'—'}</div>
        <div class="fld" style="margin-top:14px">
          <label>Motivo (obligatorio)</label>
          <textarea id="res-motivo" rows="3" placeholder="Escribe el motivo del cambio..." style="resize:vertical"></textarea>
          ${sugerencias.length?`<div style="font-size:11px;color:var(--muted);margin-top:6px">Sugerencias:</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
            ${sugerencias.map(s=>`<button class="btn-sm btn-outline" onclick="document.getElementById('res-motivo').value='${s.replace(/'/g,"\\'")}'" style="padding:3px 8px;font-size:11px">${s}</button>`).join('')}
          </div>`:''}
        </div>
        <div id="res-modal-msg" style="margin-top:10px"></div>
        <div class="modal-actions">
          <button class="btn-sm btn-outline" onclick="closeModal()">Cancelar</button>
          <button class="btn-sm btn-primary" onclick="aplicarCambioOrden('${accion}')">Confirmar cambio</button>
        </div>
      </div>`
      div.onclick=closeModal
      document.body.appendChild(div)
    }else{
      // Confirmar sin motivo (Pendiente → Confirmado flujo normal)
      aplicarCambioOrden(accion)
    }
  }

  window.aplicarCambioOrden=async(accion)=>{
    const m=window._resOrden
    if(!m)return
    const motivo=document.getElementById('res-motivo')?.value?.trim()||''
    const pideMotivo=accion!=='confirmar'||document.getElementById('res-motivo')
    if(pideMotivo&&document.getElementById('res-motivo')&&!motivo){
      document.getElementById('res-modal-msg').innerHTML='<div class="alert alert-red">El motivo es obligatorio</div>'
      return
    }
    const nuevoEstado={confirmar:'CONFIRMADO',cancelar:'CANCELADO',reactivar:'CONFIRMADO'}[accion]
    const estadoAnterior=m.estado_final||m.estado_inicial||'PENDIENTE CONFIRMACION'
    const msgEl=document.getElementById('res-modal-msg')||document.getElementById('res-result')
    if(msgEl)msgEl.innerHTML='<div class="loading">Aplicando cambio...</div>'

    const{error}=await sb.from('mapeos').update({estado_final:nuevoEstado}).eq('id',m.id)
    if(error){
      if(msgEl)msgEl.innerHTML=`<div class="alert alert-red">${error.message}</div>`
      return
    }
    // Guardar en audit_log con motivo y estado anterior/nuevo
    const accionLog={confirmar:'orden_confirmada',cancelar:'orden_cancelada',reactivar:'orden_reactivada'}[accion]
    logAction(accionLog,{mapeo_id:m.id,telefono:m.telefono,producto:m.producto,estado_anterior:estadoAnterior,estado_nuevo:nuevoEstado,motivo:motivo||null}).catch(()=>{})

    closeModal()
    // Refrescar la búsqueda para mostrar el nuevo estado
    setTimeout(()=>{
      const tel=document.getElementById('res-tel')
      if(tel){buscarOrden()}
    },200)
  }

  // ── PROGRAMAR FECHA DE ENVÍO (desde Reservados y Cancelados) ──
  window.abrirModalProgramarEnvio=()=>{
    const m=window._resOrden
    if(!m){alert('Primero busca un pedido');return}
    closeModal()
    const hoy=new Date()
    const manana=new Date(hoy.getTime()+24*60*60*1000)
    const minDate=manana.toISOString().split('T')[0]
    const sugerida=new Date(hoy.getTime()+3*24*60*60*1000).toISOString().split('T')[0]
    const div=document.createElement('div')
    div.id='user-modal';div.className='modal-bg'
    div.innerHTML=`<div class="modal-box" onclick="event.stopPropagation()" style="max-width:480px">
      <div class="modal-title">📅 Programar fecha de envío</div>
      <div class="modal-sub">${m.nombre_cliente||m.telefono} · ${m.producto||'—'}</div>
      <div class="alert alert-blue" style="margin-top:12px;font-size:12px">
        El pedido aparecerá en <strong>Pendiente de confirmación</strong> desde 2 días antes de la fecha programada.
        Tendrás cupo de 2 mensajes por día para contactar al cliente.
      </div>
      <div class="fld" style="margin-top:14px">
        <label>Fecha de envío programada</label>
        <input type="date" id="prog-fecha" value="${sugerida}" min="${minDate}" style="font-size:14px;padding:10px">
      </div>
      <div class="fld" style="margin-top:10px">
        <label>Nota (opcional)</label>
        <textarea id="prog-nota" rows="2" placeholder="Ej: cliente cobra el viernes" style="resize:vertical"></textarea>
      </div>
      <div id="prog-modal-msg" style="margin-top:10px"></div>
      <div class="modal-actions">
        <button class="btn-sm btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn-sm btn-primary" onclick="guardarFechaEnvio()">📅 Programar</button>
      </div>
    </div>`
    div.onclick=closeModal
    document.body.appendChild(div)
  }

  window.guardarFechaEnvio=async()=>{
    const m=window._resOrden
    if(!m)return
    const fecha=document.getElementById('prog-fecha')?.value
    const nota=document.getElementById('prog-nota')?.value?.trim()||''
    const msgEl=document.getElementById('prog-modal-msg')
    if(!fecha){msgEl.innerHTML='<div class="alert alert-red">Selecciona una fecha</div>';return}
    const hoy=new Date();hoy.setHours(0,0,0,0)
    const fSel=new Date(fecha+'T00:00:00')
    if(fSel<=hoy){msgEl.innerHTML='<div class="alert alert-red">La fecha debe ser futura</div>';return}
    msgEl.innerHTML='<div class="loading">Guardando...</div>'
    // Cerrar cualquier programación activa anterior del mismo mapeo
    try{
      await sb.from('programaciones_envio').update({estado:'cancelado',motivo:'Reemplazada por nueva programación'})
        .eq('mapeo_id',m.id).eq('estado','programado')
    }catch(_){}
    const{data,error}=await sb.from('programaciones_envio').insert({
      mapeo_id:m.id,
      telefono:m.telefono,
      fecha_envio_programada:fecha,
      estado:'programado',
      motivo:nota||null,
      usuario_id:me?.id||null,
      usuario_nombre:me?.nombre||null
    }).select().maybeSingle()
    if(error){msgEl.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
    logAction('envio_programado',{mapeo_id:m.id,telefono:m.telefono,fecha_envio:fecha,programacion_id:data?.id,nota:nota||null}).catch(()=>{})
    closeModal()
    setTimeout(()=>{
      const tel=document.getElementById('res-tel')
      if(tel){buscarOrden()}
      // Refrescar lista de pendientes en la misma página
      if(typeof cargarPendientesConfirmacion==='function'){cargarPendientesConfirmacion()}
      // Refrescar pendientes sin fecha — el pedido recién programado debe desaparecer de ahí
      if(typeof cargarPendientesSinFecha==='function'){cargarPendientesSinFecha()}
      const toast=document.createElement('div')
      toast.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3)'
      toast.textContent='✅ Pedido programado para '+fecha
      document.body.appendChild(toast)
      setTimeout(()=>toast.remove(),3000)
    },200)
  }
}


// ── PENDIENTES DE CONFIRMACIÓN (queue diaria) ─────────────
const CONF_MSGS=[
  // NIVEL 1 — Día 2 antes, 1er mensaje (cordial / informativo)
  `Hola [NOMBRE] ✨\n\nTe escribimos para avisarte que tu pedido de *[PRODUCTO]* ([CANTIDAD]) está apartado y listo.\n\n📦 Despacho programado: *[FECHA_ENVIO]* a [CIUDAD]\n💵 Pago contra entrega — recibes y pagas al transportador\n\n¿Confirmas que sigues interesado? Así alistamos todo para enviártelo 🙏`,
  // NIVEL 2 — Día 2 antes, 2do mensaje (recordatorio amable)

  `Hola [NOMBRE], última oportunidad antes del envío de mañana 🙏\n\nTu *[PRODUCTO]* ([CANTIDAD]) sigue apartado, pero si no recibimos tu confirmación *hoy*, debemos liberar el cupo para otro cliente que también lo está esperando.\n\n¿Lo despachamos mañana a [CIUDAD]?\n\n✅ *SI*  o  ❌ *NO*  — con eso basta.\n\n💵 Pago contra entrega (no pagas nada ahora).`,
]

function _confDiasFalta(fechaEnvio){
  if(!fechaEnvio)return null
  const hoy=new Date();hoy.setHours(0,0,0,0)
  const f=new Date(fechaEnvio+'T00:00:00')
  return Math.round((f-hoy)/(24*60*60*1000))
}

function getNivelMensajeConfirmacion(diasFalta,enviosHoy){
  if(diasFalta===2){
    if(enviosHoy===0)return{idxTpl:0,etiqueta:'1er mensaje (2 días antes)',nivel:1}
    return{idxTpl:1,etiqueta:'2do mensaje (2 días antes)',nivel:2}
  }
  if(diasFalta===1){
    if(enviosHoy===0)return{idxTpl:2,etiqueta:'1er mensaje (1 día antes)',nivel:1}
    return{idxTpl:3,etiqueta:'2do mensaje (1 día antes)',nivel:2}
  }
  if(diasFalta<=0){
    if(enviosHoy===0)return{idxTpl:3,etiqueta:'Día del envío — confirmar urgente',nivel:1}
    return{idxTpl:3,etiqueta:'Día del envío — 2do mensaje',nivel:2}
  }
  return{idxTpl:0,etiqueta:'Recordatorio',nivel:1}
}

function armarMensajeConfirmacion(item,idxTpl){
  const tpl=CONF_MSGS[idxTpl]||CONF_MSGS[0]
  const prodNom=(typeof resolveProdName==='function'?(resolveProdName(item.producto)||{}).nombre:null)||item.producto||'[PRODUCTO]'
  const cantTxt=item.cantidad?`${item.cantidad} unidad${item.cantidad>1?'es':''}`:'[CANTIDAD]'
  const fechaFmt=item.fecha_envio_programada?new Date(item.fecha_envio_programada+'T00:00:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}):'[FECHA_ENVIO]'
  return tpl
    .replace(/\[NOMBRE\]/g,item.nombre_cliente||'[NOMBRE]')
    .replace(/\[PRODUCTO\]/g,prodNom)
    .replace(/\[CANTIDAD\]/g,cantTxt)
    .replace(/\[CIUDAD\]/g,item.ciudad||'[CIUDAD]')
    .replace(/\[FECHA_ENVIO\]/g,fechaFmt)
}

async function cargarPendientesConfirmacion(){
  const el=document.getElementById('conf-content')
  if(!el)return
  const filtro=document.getElementById('conf-filtro')?.value||'proximos'
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Cargando...</div>'
  try{
    const{data:progs,error}=await sb.from('programaciones_envio')
      .select('*').eq('estado','programado')
      .order('fecha_envio_programada',{ascending:true}).limit(500)
    if(error)throw error
    if(!progs||!progs.length){
      el.innerHTML='<div class="alert alert-blue">No hay pedidos programados para confirmación. Programa fechas desde <strong>Reservados y Cancelados</strong>.</div>'
      window._confCache={items:[],fechaActiva:null}
      return
    }
    const mapeoIds=[...new Set(progs.map(p=>p.mapeo_id).filter(Boolean))]
    let mapeos=[]
    for(let i=0;i<mapeoIds.length;i+=100){
      const batch=mapeoIds.slice(i,i+100)
      const{data}=await sb.from('mapeos').select('id,telefono,nombre_cliente,producto,cantidad,ciudad,fecha,carrier').in('id',batch)
      if(data)mapeos=mapeos.concat(data)
    }
    const mapById={}
    for(const m of mapeos)mapById[m.id]=m
    const progIds=progs.map(p=>p.id)
    let envios=[]
    for(let i=0;i<progIds.length;i+=100){
      const batch=progIds.slice(i,i+100)
      const{data}=await sb.from('confirmacion_envios').select('programacion_id,created_at,dia_relativo,nivel_mensaje,usuario_nombre').in('programacion_id',batch).order('created_at',{ascending:false}).limit(5000)
      if(data)envios=envios.concat(data)
    }
    const enviosByProg={}
    for(const e of envios){
      if(!enviosByProg[e.programacion_id])enviosByProg[e.programacion_id]=[]
      enviosByProg[e.programacion_id].push(e)
    }
    const hoyStr=today()
    const enriched=progs.map(p=>{
      const m=mapById[p.mapeo_id]||{}
      const diasFalta=_confDiasFalta(p.fecha_envio_programada)
      const todosEnvios=enviosByProg[p.id]||[]
      const enviosHoy=todosEnvios.filter(e=>{
        const fEnv=(e.created_at||'').split('T')[0]
        return fEnv===hoyStr
      }).length
      const ultimoEnvio=todosEnvios[0]||null
      return{
        prog_id:p.id,
        mapeo_id:p.mapeo_id,
        telefono:p.telefono||m.telefono,
        nombre_cliente:m.nombre_cliente,
        producto:m.producto,
        cantidad:m.cantidad,
        ciudad:m.ciudad,
        carrier:m.carrier,
        fecha_compra:m.fecha,
        fecha_envio_programada:p.fecha_envio_programada,
        nota:p.motivo,
        dias_falta:diasFalta,
        envios_total:todosEnvios.length,
        envios_hoy:enviosHoy,
        ultimo_envio:ultimoEnvio
      }
    })
    let filtrados=enriched
    if(filtro==='proximos')filtrados=enriched.filter(i=>i.dias_falta!=null&&i.dias_falta>=0&&i.dias_falta<=2)
    else if(filtro==='hoy')filtrados=enriched.filter(i=>i.dias_falta===0)
    else if(filtro==='manana')filtrados=enriched.filter(i=>i.dias_falta===1)
    else if(filtro==='vencidos')filtrados=enriched.filter(i=>i.dias_falta!=null&&i.dias_falta<0)
    filtrados.sort((a,b)=>(a.dias_falta-b.dias_falta)||(a.envios_hoy-b.envios_hoy))
    window._confCache={items:filtrados,fechaActiva:hoyStr}
    renderPendientesConfirmacion(filtrados,filtro)
  }catch(e){
    el.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`
  }
}
window.cargarPendientesConfirmacion=cargarPendientesConfirmacion

async function cargarPendientesSinFecha(){
  const el=document.getElementById('psf-content')
  if(!el)return
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">Cargando pendientes...</div>'
  try{
    // 1) Traer mapeos con estado pendiente
    // Cualquiera de: estado_final IN ('PENDIENTE','PENDIENTE CONFIRMACION') OR estado_inicial='PENDIENTE CONFIRMACION'
    // Limitamos a últimos 90 días para no traer historia infinita
    const hace90=new Date(Date.now()-90*24*60*60*1000).toISOString().split('T')[0]
    const{data:pendA,error:e1}=await sb.from('mapeos')
      .select('id,telefono,nombre_cliente,producto,cantidad,ciudad,fecha,fecha_dropi,estado_inicial,estado_final,created_at')
      .in('estado_final',['PENDIENTE','PENDIENTE CONFIRMACION'])
      .gte('fecha',hace90)
      .order('fecha',{ascending:false}).limit(1000)
    if(e1)throw e1
    const{data:pendB,error:e2}=await sb.from('mapeos')
      .select('id,telefono,nombre_cliente,producto,cantidad,ciudad,fecha,fecha_dropi,estado_inicial,estado_final,created_at')
      .eq('estado_inicial','PENDIENTE CONFIRMACION')
      .is('estado_final',null)
      .gte('fecha',hace90)
      .order('fecha',{ascending:false}).limit(1000)
    if(e2)throw e2
    // Deduplicar por id
    const byId={}
    for(const m of (pendA||[]))byId[m.id]=m
    for(const m of (pendB||[]))if(!byId[m.id])byId[m.id]=m
    let pend=Object.values(byId)
    if(!pend.length){
      el.innerHTML='<div class="alert alert-blue">No hay pedidos pendientes sin fecha de envío.</div>'
      window._psfCache={items:[],limit:20}
      return
    }
    // 2) Excluir los que ya tengan programación activa
    const ids=pend.map(p=>p.id)
    let progs=[]
    for(let i=0;i<ids.length;i+=100){
      const batch=ids.slice(i,i+100)
      const{data}=await sb.from('programaciones_envio')
        .select('mapeo_id').in('mapeo_id',batch).eq('estado','programado')
      if(data)progs=progs.concat(data)
    }
    const conProg=new Set(progs.map(p=>p.mapeo_id))
    const sinFecha=pend.filter(m=>!conProg.has(m.id))
    // Orden: más recientes primero
    sinFecha.sort((a,b)=>{
      const fa=a.fecha||a.created_at||''
      const fb=b.fecha||b.created_at||''
      return fb.localeCompare(fa)
    })
    window._psfCache={items:sinFecha,limit:window._psfCache?.limit||20}
    renderPendientesSinFecha()
  }catch(e){
    el.innerHTML=`<div class="alert alert-red">Error: ${e.message}</div>`
  }
}
window.cargarPendientesSinFecha=cargarPendientesSinFecha

window.enviarMensajeConfirmacion=async(progId)=>{
  const cache=window._confCache||{}
  const item=(cache.items||[]).find(i=>i.prog_id===progId)
  if(!item){alert('No se encontró el pedido');return}
  if(item.envios_hoy>=2){alert('Ya enviaste los 2 mensajes de hoy para este pedido.');return}
  const nivelInfo=getNivelMensajeConfirmacion(item.dias_falta,item.envios_hoy)
  const mensaje=armarMensajeConfirmacion(item,nivelInfo.idxTpl)
  const telLimpio=String(item.telefono||'').replace(/\D/g,'')
  if(telLimpio.length<7){alert('Teléfono inválido');return}
  const telConPrefijo=telLimpio.startsWith('57')?telLimpio:('57'+telLimpio)
  const url=`https://wa.me/${telConPrefijo}?text=${encodeURIComponent(mensaje)}`
  window.open(url,'_blank','noopener')
  try{
    await sb.from('confirmacion_envios').insert({
      programacion_id:progId,
      telefono:item.telefono,
      dia_relativo:item.dias_falta,
      nivel_mensaje:nivelInfo.nivel,
      usuario_id:me?.id||null,
      usuario_nombre:me?.nombre||null
    })
    logAction('confirmacion_mensaje_enviado',{prog_id:progId,telefono:item.telefono,dias_falta:item.dias_falta,nivel:nivelInfo.nivel}).catch(()=>{})
  }catch(e){console.warn('No se pudo registrar envío de confirmación:',e)}
  setTimeout(()=>cargarPendientesConfirmacion(),800)
}

      <button class="btn-sm btn-green" onclick="aplicarResolucionPendiente(${progId},'confirmado')">✅ Confirmar</button>
    </div>
  </div>`
  div.onclick=closeModal
  document.body.appendChild(div)
}

window.cancelarPendiente=(progId)=>{
  const cache=window._confCache||{}
  const item=(cache.items||[]).find(i=>i.prog_id===progId)
  if(!item)return
  closeModal()
  const sugerencias=['Cliente no responde','Cliente canceló','Cliente se arrepintió','Cliente no tiene plata aún']
  const div=document.createElement('div')
  div.id='user-modal';div.className='modal-bg'
  div.innerHTML=`<div class="modal-box" onclick="event.stopPropagation()" style="max-width:480px">
    <div class="modal-title">❌ Cancelar pedido</div>
    <div class="modal-sub">${item.nombre_cliente||item.telefono} · ${item.producto||'—'}</div>
    <div class="fld" style="margin-top:12px">
      <label>Motivo (obligatorio)</label>
      <textarea id="conf-motivo" rows="3" placeholder="Escribe el motivo de la cancelación..." style="resize:vertical"></textarea>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Sugerencias:</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
        ${sugerencias.map(s=>`<button class="btn-sm btn-outline" onclick="document.getElementById('conf-motivo').value='${s.replace(/'/g,"\\'")}'" style="padding:3px 8px;font-size:11px">${s}</button>`).join('')}
      </div>
    </div>
    <div id="conf-modal-msg" style="margin-top:10px"></div>
    <div class="modal-actions">
      <button class="btn-sm btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn-sm btn-red" onclick="aplicarResolucionPendiente(${progId},'cancelado')">❌ Cancelar pedido</button>
    </div>
  </div>`
  div.onclick=closeModal
  document.body.appendChild(div)
}

window.aplicarResolucionPendiente=async(progId,nuevoEstado)=>{
  const cache=window._confCache||{}
  const item=(cache.items||[]).find(i=>i.prog_id===progId)
  if(!item)return
  const motivo=document.getElementById('conf-motivo')?.value?.trim()||''
  const msgEl=document.getElementById('conf-modal-msg')
  if(nuevoEstado==='cancelado'&&!motivo){
    if(msgEl)msgEl.innerHTML='<div class="alert alert-red">El motivo es obligatorio para cancelar</div>'
    return
  }
  if(msgEl)msgEl.innerHTML='<div class="loading">Aplicando...</div>'
  const{error:e1}=await sb.from('programaciones_envio').update({
    estado:nuevoEstado,
    motivo:motivo||null,
    updated_at:new Date().toISOString()
  }).eq('id',progId)
  if(e1){if(msgEl)msgEl.innerHTML=`<div class="alert alert-red">${e1.message}</div>`;return}
  const estadoMapeo=nuevoEstado==='confirmado'?'CONFIRMADO':'CANCELADO'
  try{
    await sb.from('mapeos').update({estado_final:estadoMapeo}).eq('id',item.mapeo_id)
  }catch(_){}
  const accionLog=nuevoEstado==='confirmado'?'pendiente_confirmado':'pendiente_cancelado'
  logAction(accionLog,{prog_id:progId,mapeo_id:item.mapeo_id,telefono:item.telefono,producto:item.producto,motivo:motivo||null}).catch(()=>{})
  closeModal()
  setTimeout(()=>cargarPendientesConfirmacion(),200)
}

const NOV_RULES=[
  {pri:'URGENTE',tipo:'Se rehúsa / No pagará',keys:['rehusa','no pagara','no paga','rechaza','se niega','no quiere recibir','no recibe','devolver al remitente'],color:'var(--red)',bg:'var(--red-bg)',border:'#7f1d1d',idx:1},

  {pri:'NORMAL',tipo:'Dirección no existe',keys:['direccion no existe','no existe la direccion','direccion errada','direccion destinatario no existe','no se localiza direccion','no localiza la direccion','no se ubica la direccion'],color:'var(--blue)',bg:'var(--blue-bg)',border:'#1e3a5f',idx:6},
  {pri:'NORMAL',tipo:'Dirección incompleta',keys:['direccion incompleta','datos incompletos','falta direccion','falta informacion','sin numero','direccion destinatario incompleta'],color:'var(--blue)',bg:'var(--blue-bg)',border:'#1e3a5f',idx:7},
  {pri:'NORMAL',tipo:'Sin comunicación',keys:['sin comunicacion','no responde','imposible comunicar','telefono apagado','fuera de servicio','buzon'],color:'var(--blue)',bg:'var(--blue-bg)',border:'#1e3a5f',idx:8},
]
function clasificarNovedad(texto){
  if(!texto)return{pri:'NORMAL',tipo:'Otra novedad',color:'var(--muted)',bg:'var(--card2)',border:'var(--border)',idx:99}
  const t=texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  for(const r of NOV_RULES){
    for(const k of r.keys){if(t.includes(k))return r}
  }
  return{pri:'NORMAL',tipo:'Otra novedad',color:'var(--muted)',bg:'var(--card2)',border:'var(--border)',idx:99}
}
