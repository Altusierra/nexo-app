<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--card:#1A1D27;--card2:#222537;--border:#2A2D3E;
  --text:#E8E9F0;--muted:#8B8FA8;--subtle:#4A4D60;
  --green:#22C55E;--green-bg:#0D2818;
  --red:#EF4444;--red-bg:#2D1010;
  --amber:#F59E0B;--amber-bg:#2D2010;
  --blue:#3B82F6;--blue-bg:#0D1A2D;
  --purple:#A78BFA;--purple-bg:#1A1030;
  --accent:#6366F1;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px}
.login-logo{font-size:28px;font-weight:700;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:10px;text-align:center}

/* APP SHELL */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.sb-logo{padding:20px;font-size:18px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border)}
.sb-logo span{font-size:11px;color:var(--muted);font-weight:400;display:block}
.sb-nav{padding:12px 8px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:2px}
.sb-item:hover{background:var(--card2);color:var(--text)}
.sb-item.active{background:var(--blue-bg);color:var(--blue)}
.sb-item .icon{width:18px;text-align:center;font-size:15px}
.sb-section{font-size:10px;color:var(--subtle);font-weight:600;letter-spacing:.1em;padding:12px 12px 4px;text-transform:uppercase}
.sb-user{padding:16px;border-top:1px solid var(--border);font-size:12px}
.sb-user-name{color:var(--text);font-weight:500}
.sb-user-role{color:var(--muted);font-size:11px;text-transform:capitalize}
.sb-logout{font-size:11px;color:var(--subtle);cursor:pointer;margin-top:4px}
.sb-logout:hover{color:var(--red)}

/* CONTENT */
.content{padding:28px;overflow-y:auto}
.page-title{font-size:20px;font-weight:600;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px}

/* CARDS */
.cards-row{display:grid;gap:12px;margin-bottom:20px}
.cards-row.c2{grid-template-columns:1fr 1fr}
.cards-row.c3{grid-template-columns:1fr 1fr 1fr}
.cards-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.card-val{font-size:24px;font-weight:600;font-family:monospace}
.card-sub{font-size:11px;color:var(--muted);margin-top:4px}
.c-green .card-val{color:var(--green)}
.c-red .card-val{color:var(--red)}
.c-amber .card-val{color:var(--amber)}
.c-blue .card-val{color:var(--blue)}
.c-purple .card-val{color:var(--purple)}

/* FORMS */
.form-grid{display:grid;gap:14px}
.form-grid.g2{grid-template-columns:1fr 1fr}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld select option{background:var(--card2)}

/* BUTTONS */
.btn-sm{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-sm:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-full{width:100%;padding:11px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-full:hover{opacity:.85}

/* SECTION */
.section{margin-bottom:24px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

/* PILLS */
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-red{background:var(--red-bg);color:var(--red)}
.pill-amber{background:var(--amber-bg);color:var(--amber)}
.pill-blue{background:var(--blue-bg);color:var(--blue)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:var(--card2)}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.check-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.check-item.checked{border-color:var(--green);background:var(--green-bg)}
.check-item.checked .check-label{color:var(--green)}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.check-item.checked .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-label{font-size:13px;color:var(--muted)}

/* SEMAFORO */
.semaforo{border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;border:1px solid transparent}
.sem-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.sem-title{font-size:13px;font-weight:600}
.sem-msg{font-size:12px;margin-top:2px}
.sem-verde{background:var(--green-bg);border-color:#16532a}
.sem-verde .sem-dot{background:var(--green)}
.sem-verde .sem-title{color:var(--green)}
.sem-verde .sem-msg{color:#4ade80}
.sem-rojo{background:var(--red-bg);border-color:#7f1d1d}
.sem-rojo .sem-dot{background:var(--red)}
.sem-rojo .sem-title{color:var(--red)}
.sem-rojo .sem-msg{color:#fca5a5}
.sem-amarillo{background:var(--amber-bg);border-color:#78350f}
.sem-amarillo .sem-dot{background:var(--amber)}
.sem-amarillo .sem-title{color:var(--amber)}
.sem-amarillo .sem-msg{color:#fcd34d}

/* ALERT */
.alert{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:16px}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid #16532a}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid #7f1d1d}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #1e3a5f}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 0}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.tag-rol{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;background:var(--card2);color:var(--text);text-transform:uppercase;letter-spacing:.05em}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .cards-row.c4,.cards-row.c3,.cards-row.c2{grid-template-columns:1fr 1fr}
  .form-grid.g4,.form-grid.g3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-box">
    <div class="login-logo">Nexo</div>
    <div class="login-sub">COD Operations — Altusierra</div>
    <div class="field">
      <label>Usuario o correo</label>
      <input type="text" id="l-user" placeholder="usuario o tu@correo.com" autocomplete="username" autocapitalize="off" autocorrect="off" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="l-pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" id="l-btn" onclick="login()">Ingresar</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
<div class="shell">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sb-logo">Nexo <span>COD Operations</span></div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-user">
      <div class="sb-user-name" id="sb-name">—</div>
      <div class="sb-user-role" id="sb-role">—</div>
      <div class="sb-logout" onclick="logout()">Cerrar sesión</div>
    </div>
  </nav>
  <!-- CONTENT -->
  <main class="content" id="content">
    <div class="loading">Cargando...</div>
  </main>
</div>
</div>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2'

const SURL='https://adpfxwnsnltpcgudbkhc.supabase.co'
const SKEY='sb_publishable_Qq0ZdsQokOiJqAAOoOTSmg_TdLkKDFm'
const sb=createClient(SURL,SKEY)

let me=null,productos=[]

// ── AUTH ──────────────────────────────────────────────────
window.login=async()=>{
  const input=document.getElementById('l-user').value.trim()
  const pwd=document.getElementById('l-pwd').value
  const btn=document.getElementById('l-btn')
  const err=document.getElementById('l-err')
  err.textContent=''
  if(!input||!pwd){err.textContent='Completa los campos';return}
  btn.disabled=true;btn.textContent='Ingresando...'
  const reset=()=>{btn.disabled=false;btn.textContent='Ingresar'}

  let email=input
  if(!input.includes('@')){
    try{
      const{data,error}=await sb.rpc('get_email_by_username',{p_username:input})
      if(error||!data){err.textContent='Credenciales inválidas';reset();return}
      email=data
    }catch(e){err.textContent='Credenciales inválidas';reset();return}
  }
  const{error}=await sb.auth.signInWithPassword({email,password:pwd})
  if(error){err.textContent='Credenciales inválidas';reset();return}
  // Login exitoso — cargar app directamente sin depender de onAuthStateChange
  const ok=await loadMe()
  if(!ok){err.textContent='Error cargando perfil';await sb.auth.signOut().catch(()=>{});reset();return}
  await loadProductos()
  reset()
  logAction('login',{metodo:input.includes('@')?'email':'username'}).catch(()=>{})
  showApp()
}

window.logout=async()=>{await logAction('logout',{}).catch(()=>{});await sb.auth.signOut()}

async function loadMe(uid){
  try{
    const{data,error}=await sb.rpc('get_my_profile')
    if(error){console.error('loadMe error:',error);return false}
    if(!data){console.warn('loadMe: sin perfil');return false}
    const{data:bData}=await sb.from('usuarios').select('bloqueado,rol,hora_inicio,hora_fin').eq('id',data.id).maybeSingle()
    if(bData?.bloqueado){console.warn('Usuario bloqueado');return false}
    if(!dentroDeHorario(bData?.rol,bData?.hora_inicio,bData?.hora_fin)){console.warn('Fuera de horario');return false}
    me=data
    return true
  }catch(e){console.error('loadMe exception:',e);return false}
}

async function loadProductos(){
  try{
    const{data,error}=await sb.from('productos').select('*').eq('activo',true)
    if(error)console.error('loadProductos error:',error)
    productos=data||[]
  }catch(e){console.error('loadProductos exception:',e);productos=[]}
}

sb.auth.onAuthStateChange((ev,sess)=>{
  if(!sess){
    me=null
    document.getElementById('login-wrap').style.display='flex'
    document.getElementById('app').style.display='none'
  }
})

// ── SHELL ─────────────────────────────────────────────────
function showApp(){
  document.getElementById('login-wrap').style.display='none'
  document.getElementById('app').style.display='block'
  document.getElementById('sb-name').textContent=me?.nombre||'—'
  document.getElementById('sb-role').textContent=me?.rol||'—'
  renderNav()
  navigate(me?.rol==='admin'?'admin-home':'aux-home')
}

const NAV={
  admin:[
    {id:'admin-home',icon:'📊',label:'Dashboard'},
    {id:'admin-reportes',icon:'📋',label:'Reportes'},
    {id:'admin-gasto',icon:'💰',label:'Gasto Ads'},
    {id:'admin-productos',icon:'📦',label:'Productos'},
    {id:'admin-usuarios',icon:'👥',label:'Equipo'},
    {id:'admin-actividad',icon:'🕒',label:'Actividad'},
  ],
  auxiliar:[
    {id:'aux-home',icon:'🏠',label:'Inicio'},
    {id:'aux-reporte',icon:'📝',label:'Reporte del día'},
    {id:'aux-pedidos',icon:'📦',label:'Mis pedidos'},
    {id:'aux-reservado',icon:'🔍',label:'Confirmar reservado'},
    {id:'aux-cierre',icon:'✅',label:'Cerrar jornada'},
  ]
}

function renderNav(){
  const rol=me?.rol==='admin'?'admin':'auxiliar'
  const items=NAV[rol]||[]
  document.getElementById('sb-nav').innerHTML=
    items.map(i=>`<div class="sb-item" id="nav-${i.id}" onclick="navigate('${i.id}')">
      <span class="icon">${i.icon}</span>${i.label}</div>`).join('')
}

let currentPage=''
window.navigate=async function(page){
  if(me?.id){
    const{data:bData}=await sb.from('usuarios').select('bloqueado,rol,hora_inicio,hora_fin').eq('id',me.id).maybeSingle()
    if(bData?.bloqueado){await sb.auth.signOut().catch(()=>{});return}
    if(!dentroDeHorario(bData?.rol,bData?.hora_inicio,bData?.hora_fin)){await sb.auth.signOut().catch(()=>{});return}
  }
  currentPage=page
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'))
  const nav=document.getElementById('nav-'+page)
  if(nav)nav.classList.add('active')
  render(page)
}

function render(page){
  const c=document.getElementById('content')
  const pages={
    'admin-home':pageAdminHome,
    'admin-reportes':pageAdminReportes,
    'admin-gasto':pageAdminGasto,
    'admin-productos':pageAdminProductos,
    'admin-usuarios':pageAdminUsuarios,
    'admin-actividad':pageAdminActividad,
    'aux-home':pageAuxHome,
    'aux-reporte':pageAuxReporte,
    'aux-pedidos':pageAuxPedidos,
    'aux-reservado':pageAuxReservado,
    'aux-cierre':pageAuxCierre,
  }
  const fn=pages[page]
  if(fn)fn(c)
  else c.innerHTML=`<div class="loading">Página no encontrada</div>`
}

// ── UTILS ──────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat('es-CO').format(Math.round(n||0))
const today=()=>new Date().toISOString().split('T')[0]
function dentroDeHorario(rol,hora_inicio,hora_fin){
  if(rol==='admin')return true
  if(!hora_inicio||!hora_fin)return true
  const d=new Date()
  const ahora=d.getHours()*60+d.getMinutes()
  const [hi,mi]=hora_inicio.split(':').map(Number)
  const [hf,mf]=hora_fin.split(':').map(Number)
  const inicio=hi*60+mi,fin=hf*60+mf
  return inicio<=fin
    ?(ahora>=inicio&&ahora<=fin)
    :(ahora>=inicio||ahora<=fin)
}
async function logAction(accion,detalles){
  try{
    await sb.rpc('log_action',{p_accion:accion,p_detalles:detalles||{},p_user_agent:navigator.userAgent.slice(0,200)})
  }catch(e){console.warn('logAction fail:',e)}
}

async function getReporteHoy(){
  try{
    const{data,error}=await sb.from('reportes_diarios')
      .select('*').eq('fecha',today()).eq('usuario_id',me?.id).maybeSingle()
    if(error)console.error('getReporteHoy error:',error)
    return data
  }catch(e){console.error('getReporteHoy exception:',e);return null}
}

async function getReporteAdmin(fecha){
  const{data}=await sb.from('reportes_diarios')
    .select('*,usuarios(nombre)').eq('fecha',fecha||today())
  return data||[]
}

// ── ADMIN: HOME ────────────────────────────────────────────
async function pageAdminHome(c){
  c.innerHTML=`<div class="page-title">Dashboard</div>
    <div class="page-sub" id="dash-date"></div>
    <div id="dash-content"><div class="loading">Cargando métricas...</div></div>`

  const fecha=today()
  document.getElementById('dash-date').textContent=
    new Date(fecha+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})

  const reportes=await getReporteAdmin(fecha)
  const gasto=await sb.from('gasto_ads').select('*').eq('fecha',fecha)
  const prod=productos[0]||{}

  // Agregar reportes del día
  let tot1=0,tot2=0,tot3=0,tot4=0,conv=0,conf=0,canc=0,pend=0,gastoTotal=0
  reportes.forEach(r=>{
    tot1+=r.ord_1u||0;tot2+=r.ord_2u||0;tot3+=r.ord_3u||0;tot4+=r.ord_4u||0
    conv+=r.conversaciones||0;conf+=r.confirmados||0
    canc+=r.cancelados||0;pend+=r.pendientes||0
  })
  ;(gasto.data||[]).forEach(g=>gastoTotal+=g.monto||0)

  const totalOrds=tot1+tot2+tot3+tot4
  const venta=(tot1*( prod.precio_1u||0))+(tot2*(prod.precio_2u||0))+
               (tot3*(prod.precio_3u||0))+(tot4*(prod.precio_4u||0))
  const roas_bruto=gastoTotal>0?venta/gastoTotal:0

  // Break-even
  const p2=prod.precio_2u||129900,c2=prod.costo_2u||36000
  const fo=prod.flete_outbound||21000,fd=prod.flete_devolucion||18000
  const dp=prod.dev_pct||0.19
  const ingrEf=p2*(1-dp),costoTot=c2+fo+(fd*dp)
  const margen=ingrEf-costoTot
  const be_roas=margen>0?p2/margen:0

  // Semáforo
  let semHtml=''
  if(gastoTotal===0){
    semHtml=`<div class="semaforo" style="background:var(--card2);border-color:var(--border)">
      <div class="sem-dot" style="background:var(--subtle)"></div>
      <div><div class="sem-title" style="color:var(--muted)">Sin gasto en ads registrado hoy</div>
      <div class="sem-msg" style="color:var(--subtle)">Ingresa el gasto para ver el semáforo</div></div></div>`
  } else {
    const rb=roas_bruto
    let cls,title,msg
    if(rb<be_roas){cls='sem-rojo';title='STOP — Debajo del break-even';msg=`ROAS ${rb.toFixed(2)}x vs mínimo ${be_roas.toFixed(2)}x. Revisar campañas.`}
    else if(rb<be_roas*1.4){cls='sem-amarillo';title='Precaución — Poco colchón';msg=`ROAS ${rb.toFixed(2)}x. Rentable pero ajustado. No escalar aún.`}
    else if(rb<be_roas*2.2){cls='sem-verde';title='Verde — Escalar con confianza';msg=`ROAS ${rb.toFixed(2)}x. Aumenta presupuesto 20-30%.`}
    else{cls='sem-verde';title='Campaña caliente — Escalar agresivo';msg=`ROAS ${rb.toFixed(2)}x. Muy por encima del break-even.`}
    semHtml=`<div class="semaforo ${cls}">
      <div class="sem-dot"></div>
      <div><div class="sem-title">${title}</div><div class="sem-msg">${msg}</div></div></div>`
  }

  document.getElementById('dash-content').innerHTML=`
    ${semHtml}
    <div class="cards-row c4">
      <div class="card c-blue"><div class="card-label">Órdenes hoy</div><div class="card-val">${totalOrds}</div>
        <div class="card-sub">1u:${tot1} · 2u:${tot2} · 3u:${tot3} · 4u:${tot4}</div></div>
      <div class="card c-green"><div class="card-label">Confirmados</div><div class="card-val">${conf}</div>

window.doCreateUser=async()=>{
  const get=id=>document.getElementById(id).value.trim()
  const payload={
    nombre:get('nu-nombre'),
    username:get('nu-username').toLowerCase(),
    rol:get('nu-rol'),
    email:get('nu-email')||undefined,
    password:document.getElementById('nu-pwd').value,
    password_nota:get('nu-nota')||undefined,
    hora_inicio:get('nu-hi')||undefined,
    hora_fin:get('nu-hf')||undefined

  const btn=document.getElementById('nu-save')
  if(!payload.nombre||!payload.username||!payload.password){
    msg.innerHTML='<div class="alert alert-red">Completa los campos obligatorios</div>';return
  }
  btn.disabled=true;btn.textContent='Creando...'

    msg.innerHTML=`<div class="alert alert-red">${data?.error||error.message}</div>`

  logAction('usuario_creado',{username:payload.username,rol:payload.rol}).catch(()=>{})
  closeModal();loadUsuarios()
}

  const{data,error}=await sb.functions.invoke('manage-user',{body:{action:'toggle_block',payload:{user_id,bloqueado:!actualmenteBloqueado}}})

}

  c.innerHTML=`<div class="page-title">Registro de actividad</div>

    <div class="form-grid g2" style="max-width:500px;margin-bottom:16px">

        <select id="act-accion" onchange="loadActividad()">
          <option value="">Todas</option>
          <option value="login">login</option>
          <option value="logout">logout</option>
          <option value="reporte_guardado">reporte_guardado</option>
          <option value="jornada_cerrada">jornada_cerrada</option>
          <option value="gasto_registrado">gasto_registrado</option>
          <option value="producto_editado">producto_editado</option>
          <option value="reservado_confirmado">reservado_confirmado</option>
        </select></div>
    </div>
    <div id="act-list"><div class="loading">Cargando...</div></div>`

  // Cargar lista de usuarios para el filtro
  const{data:users}=await sb.from('usuarios').select('id,nombre').order('nombre')
  const sel=document.getElementById('act-user')
  ;(users||[]).forEach(u=>{
    const o=document.createElement('option');o.value=u.id;o.textContent=u.nombre||u.id;sel.appendChild(o)
  })

  window.loadActividad=async()=>{
    const fUser=document.getElementById('act-user').value
    const fAccion=document.getElementById('act-accion').value
    let q=sb.from('audit_log').select('*,usuarios(nombre)').order('created_at',{ascending:false}).limit(200)
    if(fUser)q=q.eq('usuario_id',fUser)
    if(fAccion)q=q.eq('accion',fAccion)
    const{data,error}=await q
    const el=document.getElementById('act-list')
    if(error){el.innerHTML=`<div class="alert alert-red">${error.message}</div>`;return}
    if(!data?.length){el.innerHTML='<div class="alert alert-blue">Sin actividad</div>';return}
    el.innerHTML=`<div class="table-wrap"><table>
      <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalles</th></tr>
      ${data.map(r=>`<tr>
        <td style="white-space:nowrap;font-family:monospace;font-size:11px">${new Date(r.created_at).toLocaleString('es-CO')}</td>
        <td>${r.usuarios?.nombre||'—'}</td>
        <td><span class="pill pill-blue">${r.accion}</span></td>
        <td style="font-family:monospace;font-size:11px;color:var(--muted)">${r.detalles?JSON.stringify(r.detalles):''}</td>
      </tr>`).join('')}
    </table></div>`
  }
  loadActividad()
}

      <div class="section-title">Órdenes confirmadas (del reporte Dropi)</div>
      <div class="form-grid g4">
        <div class="fld"><label>Órdenes 1 unidad</label><input type="number" id="r-1u" value="${rep?.ord_1u||0}" min="0"></div>
        <div class="fld"><label>Órdenes 2 unidades</label><input type="number" id="r-2u" value="${rep?.ord_2u||0}" min="0"></div>
        <div class="fld"><label>Órdenes 3 unidades</label><input type="number" id="r-3u" value="${rep?.ord_3u||0}" min="0"></div>
        <div class="fld"><label>Órdenes 4 unidades</label><input type="number" id="r-4u" value="${rep?.ord_4u||0}" min="0"></div>
      </div>
      <div class="divider"></div>
      <div class="section-title">Estado de órdenes</div>
      <div class="form-grid g3">
        <div class="fld"><label>✅ Confirmados</label><input type="number" id="r-conf" value="${rep?.confirmados||0}" min="0"></div>
        <div class="fld"><label>❌ Cancelados</label><input type="number" id="r-canc" value="${rep?.cancelados||0}" min="0"></div>
        <div class="fld"><label>⏳ Pendientes</label><input type="number" id="r-pend" value="${rep?.pendientes||0}" min="0"></div>
      </div>
      <div class="divider"></div>
      <div class="section-title">Conversaciones</div>
      <div class="form-grid g2">
        <div class="fld"><label>Conversaciones ayer (real)</label><input type="number" id="r-conv" value="${rep?.conversaciones||0}" min="0"></div>
        <div class="fld"><label>Conversaciones hoy (aprox.)</label><input type="number" id="r-conv-ap" value="${rep?.conversaciones_aprox||0}" min="0"></div>
      </div>
      <div class="divider"></div>
      <div class="fld"><label>Nota (opcional)</label>
        <textarea id="r-nota" rows="2" style="resize:vertical">${rep?.nota||''}</textarea></div>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn-full btn-primary" onclick="saveReporte()">
          ${rep?'Actualizar reporte':'Guardar reporte'}
        </button>
      </div>
      <div id="r-msg" style="margin-top:10px"></div>
    </div>`

  window.saveReporte=async()=>{
    const prod_id=document.getElementById('r-prod').value
    const prod_nom=productos.find(p=>p.id===prod_id)?.nombre||''
    const payload={
      fecha:today(),producto_id:prod_id,producto_nombre:prod_nom,
      ord_1u:parseInt(document.getElementById('r-1u').value)||0,
      ord_2u:parseInt(document.getElementById('r-2u').value)||0,
      ord_3u:parseInt(document.getElementById('r-3u').value)||0,
      ord_4u:parseInt(document.getElementById('r-4u').value)||0,
      confirmados:parseInt(document.getElementById('r-conf').value)||0,
      cancelados:parseInt(document.getElementById('r-canc').value)||0,
      pendientes:parseInt(document.getElementById('r-pend').value)||0,
      conversaciones:parseInt(document.getElementById('r-conv').value)||0,
      conversaciones_aprox:parseInt(document.getElementById('r-conv-ap').value)||0,
      nota:document.getElementById('r-nota').value,
      usuario_id:me.id,
      updated_at:new Date().toISOString()
    }
    const{error}=await sb.from('reportes_diarios')
      .upsert(payload,{onConflict:'fecha,producto_id,usuario_id'})
    const msg=document.getElementById('r-msg')
    if(error)msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{msg.innerHTML='<div class="alert alert-green">✅ Reporte guardado correctamente</div>';logAction('reporte_guardado',{fecha:payload.fecha,producto_id:prod_id,total:payload.ord_1u+payload.ord_2u+payload.ord_3u+payload.ord_4u}).catch(()=>{})}
  }
}

// ── AUXILIAR: CONFIRMAR RESERVADO ──────────────────────────
async function pageAuxReservado(c){
  c.innerHTML=`<div class="page-title">Confirmar reservado</div>
    <div class="page-sub">Busca por número de teléfono y confirma</div>
    <div class="card" style="max-width:500px">
      <div class="fld" style="margin-bottom:12px">
        <label>Número de teléfono</label>
        <input type="tel" id="res-tel" placeholder="3018022314" maxlength="10"
          onkeydown="if(event.key==='Enter')buscarReservado()">
      </div>
      <button class="btn-full btn-primary" onclick="buscarReservado()">Buscar</button>
      <div id="res-result" style="margin-top:16px"></div>
    </div>`

  window.buscarReservado=async()=>{
    const tel=document.getElementById('res-tel').value.trim()
    if(!tel){return}
    const{data}=await sb.from('mapeos').select('*')
      .eq('telefono',tel).eq('estado_inicial','PENDIENTE CONFIRMACION').maybeSingle()
    const el=document.getElementById('res-result')
    if(!data){
      el.innerHTML='<div class="alert alert-red">No se encontró reservado con ese número</div>';return
    }
    el.innerHTML=`
      <div class="card" style="border:1px solid var(--amber);background:var(--amber-bg)">
        <div style="margin-bottom:12px">
          <div style="font-size:13px;color:var(--muted);margin-bottom:2px">Reservado encontrado</div>
          <div style="font-size:15px;font-weight:600;color:var(--amber)">${tel}</div>
        </div>
        <div style="font-size:13px;color:var(--text);margin-bottom:12px">
          <strong>${data.producto||'—'}</strong>
        </div>
        <button class="btn-full btn-green" onclick="confirmarReservado('${data.id}')">
          ✅ Confirmar este reservado
        </button>
      </div>`
  }

  window.confirmarReservado=async(id)=>{
    const{error}=await sb.from('mapeos').update({estado_final:'CONFIRMADO'}).eq('id',id)
    const el=document.getElementById('res-result')
    if(error)el.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{
      el.innerHTML='<div class="alert alert-green">✅ Reservado confirmado</div>'
      document.getElementById('res-tel').value=''
      logAction('reservado_confirmado',{mapeo_id:id}).catch(()=>{})
    }
  }
}

// ── AUXILIAR: CIERRE JORNADA ───────────────────────────────
async function pageAuxCierre(c){
  c.innerHTML=`<div class="page-title">Cerrar jornada</div>
    <div class="page-sub">Confirma que completaste todas las tareas</div>
    <div class="card" style="max-width:500px" id="cierre-card">
      <div class="loading">Cargando...</div>
    </div>`
  const rep=await getReporteHoy()
  const card=document.getElementById('cierre-card')
  if(!rep){
    card.innerHTML='<div class="alert alert-blue">Primero crea el reporte del día antes de cerrar jornada.</div>';return
  }
  if(rep.jornada_cerrada){
    card.innerHTML=`<div class="semaforo sem-verde">
      <div class="sem-dot"></div>
      <div><div class="sem-title">Jornada cerrada ✅</div>
      <div class="sem-msg">Cerraste tu jornada hoy. ¡Buen trabajo!</div></div></div>`;return
  }

  let checks={novedades:rep.ch_novedades||false,guias:rep.ch_guias_reclame||false,
               pendientes:rep.ch_pendientes||false,etiquetas:rep.ch_etiquetas_meta||false}

  const renderCierre=()=>{
    const all=Object.values(checks).every(Boolean)
    card.innerHTML=`
      <div class="section-title" style="margin-bottom:12px">Checklist de cierre</div>
      <div class="checklist">
        ${[
          ['novedades','¿Resolviste todas las novedades del carrier?'],
          ['guias','¿Enviaste guías de reclame en oficina?'],
          ['pendientes','¿Revisaste pendientes por confirmar para envío?'],
          ['etiquetas','¿Cambiaste conversaciones a etiqueta Meta Ads en SellerChat?']
        ].map(([k,label])=>`
          <div class="check-item ${checks[k]?'checked':''}" onclick="toggleCheck('${k}')">
            <div class="check-box">${checks[k]?'✓':''}</div>
            <div class="check-label">${label}</div>
          </div>`).join('')}
      </div>
      ${!all?'<div class="alert alert-amber" style="background:var(--amber-bg);color:var(--amber);border:1px solid #78350f">Completa todos los items para cerrar</div>':
      `<button class="btn-full btn-green" onclick="cerrarJornada()">✅ Cerrar jornada</button>`}
      <div id="cierre-msg" style="margin-top:10px"></div>`
  }

  window.toggleCheck=async(key)=>{
    checks[key]=!checks[key]
    const fieldMap={novedades:'ch_novedades',guias:'ch_guias_reclame',
                    pendientes:'ch_pendientes',etiquetas:'ch_etiquetas_meta'}
    await sb.from('reportes_diarios').update({[fieldMap[key]]:checks[key]}).eq('id',rep.id)
    renderCierre()
  }

  window.cerrarJornada=async()=>{
    const{error}=await sb.from('reportes_diarios').update({
      jornada_cerrada:true,hora_cierre:new Date().toISOString(),
      ch_novedades:true,ch_guias_reclame:true,ch_pendientes:true,ch_etiquetas_meta:true
    }).eq('id',rep.id)
    const msg=document.getElementById('cierre-msg')
    if(error)msg.innerHTML=`<div class="alert alert-red">${error.message}</div>`
    else{
      card.innerHTML=`<div class="semaforo sem-verde">
        <div class="sem-dot"></div>
        <div><div class="sem-title">¡Jornada cerrada! ✅</div>
        <div class="sem-msg">${new Date().toLocaleTimeString('es-CO')} — Buen trabajo hoy.</div></div></div>`
      logAction('jornada_cerrada',{reporte_id:rep.id}).catch(()=>{})
    }
  }

  renderCierre()
}

// ── INIT ───────────────────────────────────────────────────
function showLogin(){
  document.getElementById('login-wrap').style.display='flex'
  document.getElementById('app').style.display='none'
}
async function initApp(){
  try{
    const{data,error}=await sb.auth.getSession()
    if(error){
      console.warn('getSession error, limpiando token:',error)
      await sb.auth.signOut().catch(()=>{})
      showLogin()
      return
    }
    const session=data?.session
    if(!session){showLogin();return}
    const ok=await loadMe(session.user.id)
    if(!ok){
      console.warn('loadMe falló, forzando logout')
      await sb.auth.signOut().catch(()=>{})
      showLogin()
      return
    }
    await loadProductos()
    showApp()
  }catch(e){
    console.error('initApp exception:',e)
    await sb.auth.signOut().catch(()=>{})
    showLogin()
  }
}
initApp()
</script>
